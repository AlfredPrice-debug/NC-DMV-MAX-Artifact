d's name", "address mismatch"], "page": "T_&_R/Placards/Disability_Plate_&_Placard_FAQs.htm", "what": "This topic answers common questions about completing and processing the Disability - Deaf/Hard of Hearing Plate/Placard Application, covering missing or conflicting information and special waiver situations.", "steps": ["{'text': 'Review guidance for when the medical license number is missing on the application.', 'reference': True}", "{'text': \"Review what to do when the driver's license number or the date on the Medical Certificate is missing.\", 'reference': True}", "{'text': 'Review what to do when the Permanent or Temporary boxes are not checked or both are checked.', 'reference': True}", "{'text': 'Review how to handle a customer waiving Medical Certification due to a placard/plate issued by another state, or a Veterans Affairs letter to waive certification.', 'reference': True}", "{'text': 'Review what to do when the application address differs from the one in MAX.', 'reference': True}", "{'text': \"Review handling when Medical Certification is complete but the customer already has a permanent placard issued in MAX, when the application is in a child's name with no record, when a replacement is requested but no placard is on file, or when a check is presented for a disabled plate but the vehicle is not in the customer's name.\", 'reference': True}"], "tips": []}, {"id": "permanent-disability-placard", "title": "Issue a Permanent Disability Placard", "cat": "Title & Registration", "intent": ["permanent disability placard", "permanent physical disability", "organization placard", "up to three placards", "blue white placard", "disability application form 96-0104", "no fee placard"], "page": "T_&_R/Placards/Permanent_Disability_Placard.htm", "what": "The Permanent Disability Placard is issued to an individual with a permanent physical disability or to an organization that owns or leases a vehicle primarily transporting persons with physical disabilities. It is valid as long as the person qualifies and is two-sided blue/white.", "steps": ["{'text': 'Confirm eligibility for an individual with a permanent physical disability or a qualifying organization (trusts do not qualify).'}", "{'text': 'Understand that for individuals up to three Permanent Disability Placards may be issued if the Division determines the request demonstrates why the placards are required.'}", "{'text': 'For nonprofit organizations assisting senior citizens, up to three Permanent Disability Placards may be issued, and the organization must maintain a record on each volunteer who used placards.'}", "{'text': 'Collect the completed Disability-Deaf/Hard of Hearing Plate/Placard Application (Individual form #96-0104 or Organization form #96-0104B).'}", "{'text': 'Issue the Permanent Disability Placard in MAX (two-sided, blue/white).', 'reference': True}", "{'text': 'Note there is no charge for a permanent placard (initial, renewal, or replacement).'}"], "tips": ["Valid for as long as the person qualifies for issuance.", "See policy 8.16.6."]}, {"id": "placards-overview", "title": "Disability & Deaf/Hard of Hearing Placards Overview", "cat": "Title & Registration", "intent": ["placards overview", "disability placard", "deaf hard of hearing placard", "medical certification", "form 96-0104", "look up license number", "organization placard", "no fee placard"], "page": "T_&_R/Placards/Placards_Overview.htm", "what": "A Disability placard can be issued to an individual with a permanent or temporary physical disability or who is deaf/hard of hearing, or to a qualifying organization, based on a completed application determined eligible by a healthcare professional. There is no charge for a permanent or temporary placard.", "steps": ["{'text': 'Collect the completed Disability-Deaf/Hard of Hearing Plate/Placard Application (Individual form #96-0104, or Organization form #96-0104B; trusts do not qualify).'}", "{'text': 'If an MD or PA license number is missing, look it up on the Arizona Medical Board website; for a Physical Therapist (PT), use the Arizona State Board of Physical Therapy website.'}", "{'text': 'Determine from the application whether a permanent or temporary placard applies; Disability or Deaf/Hard of Hearing plates may also be issued for eligible individuals or organizations.'}", "{'text': 'Issue and record the Permanent or Temporary Disability Placard in MAX on the customer record (no fee for initial, renewal, or replacement).'}", "{'text': 'Scan and upload the application into MAX, then file it with your data processing paperwork.'}", "{'text': 'For a Deaf/Hard of Hearing placard, note it has no identifying numbers, is not processed in MAX, is an 8 1/2\" x 5 1/2\" white/blue card ordered through OIMS (form #46-4315) and kept in office stock, with no fee.'}", "{'text': 'For issuing, replacing, or canceling, use the specific Temporary/Permanent Disability Placard, Replace, Cancel, and Placard History topics.', 'reference': True}"], "tips": ["The placard must be displayed in any vehicle (upon parking) in which the customer is the driver or passenger.", "See the Disability Plate & Placard FAQs topic for additional guidance.", "See policy 8.16.6."]}, {"id": "replace-disability-placard", "title": "Replace a Disability Placard (Permanent or Temporary)", "cat": "Title & Registration", "intent": ["replace disability placard", "lost placard replacement", "no fee replacement", "same issue and expiration date", "no medical certification needed", "one time mailing address", "reprint placard"], "page": "T_&_R/Placards/Replace_Disability_Placard_(Permanent_or_Temporary).htm", "what": "The Replace Disability Placard service replaces an existing Permanent or Temporary Disability Placard without changing the issue or expiration date. There is no fee, no forms are required when the customer is in office, and no Medical Certification is required.", "steps": ["{'text': 'From the Services menu, select Replace Permanent Placard or Replace Temporary Placard depending on the type to replace.'}", "{'text': 'Search for the Customer related to this service.'}", "{'text': 'Identify the placard to replace under Placard Results and click the Select icon (if no placards are found, you cannot complete this service).'}", "{'text': 'Click Add.'}", "{'text': 'If needed, click Add One Time Mailing Address to use a one-time mailing address, or click Edit Customer to edit address, AKAs, characteristics, or contact information.'}", "{'text': 'Click Confirm.'}", "{'text': 'Note the Placard Issue Date (and, for Temporary, the Expiration Date) is the original and cannot be changed, then click Continue.'}", "{'text': 'This is a no-fee service; click Pay Now to finalize, or Add to Cart for additional services.'}", "{'text': 'Download and print the service document(s), click the printer icon, click Print, and provide documents to the customer; the replacement placard is mailed within 5-7 days.'}"], "tips": ["No fee for a replacement or a reprint while waiting for the official placard.", "For mail-in requests, form #96-0104 or #96-0104B may be used; Medical Certification is not required for replacements.", "See policy 8.16.6."]}, {"id": "temporary-disability-placard", "title": "Issue a Temporary Disability Placard", "cat": "Title & Registration", "intent": ["temporary disability placard", "temporary physical disability", "six month validity", "medical certification", "red white placard", "wet signature", "up to three placards", "no renewal"], "page": "T_&_R/Placards/Temporary_Disability_Placard.htm", "what": "The Temporary Disability Placard is issued to an individual with a temporary physical disability or to a qualifying organization, valid for six months, and is two-sided red/white. A completed application with medical certification is required.", "steps": ["{'text': 'Confirm eligibility for an individual with a temporary physical disability or a qualifying organization (trusts do not qualify).'}", "{'text': 'Collect the completed Disability-Deaf/Hard of Hearing Plate/Placard Application (form #96-0104, or #96-0104B for organizations).'}", "{'text': 'Verify the Medical Certification section is completed by an authorized Physician, Registered Nurse Practitioner, Audiologist, or Hospital Administrator with an original wet signature (stamp signatures are not acceptable).'}", "{'text': 'Understand up to three Temporary Disability Placards may be issued for an individual if the Division determines the request demonstrates why they are required, and all placards must be issued the same day.'}", "{'text': 'Issue the Temporary Disability Placard in MAX (two-sided, red/white), valid for six months.', 'reference': True}", "{'text': 'For a subsequent placard, note there is no renewal option; a new placard with a full six-month period may be issued only upon a new application and appropriate medical certification.'}"], "tips": ["If the customer returns another day for an additional placard, they must have a new Disability Application with a new medical certification.", "See policy 8.16.6."]}, {"id": "cancel-re-establish-registration", "title": "Cancel and Re-Establish Registration", "cat": "Title & Registration", "intent": ["cancel and re-establish registration", "renewed in error", "wrong registration term", "ARO entered in error", "credit fees back", "re-register correctly", "supervisor instruction", "renewal correction"], "page": "T_&_R/Title_&_Registration/Cancel_ and_Re-establish_Registration.htm", "what": "This service cancels a registration done in error and re-establishes the original registration, crediting fees back to the paying customer's (agent's) account so you can register the vehicle correctly. Do not use it until instructed by a Supervisor or Level 2 MAX Support.", "steps": ["{'text': 'Confirm a Supervisor or Level 2 MAX Support has instructed you to use this service, and that no other services were completed after the incorrect one (otherwise there will be no fees to credit).'}", "{'text': 'From the Services menu, select Cancel Registration.'}", "{'text': 'Search for the Customer and Vehicle related to this service, using the customer to whom the registration was mistakenly transferred, and select the registration to cancel.'}", "{'text': 'Click Add.'}", "{'text': \"Select 'Renewed in Error - Re-Establish' from the Cancel Registration Reason drop down (Scenarios 1-4), OR select 'ARO Entered in Error' (Scenario 5, available only on an ARO record).\"}", "{'text': 'Click Confirm, then review the information on how the registration will be re-established and click Continue if correct.'}", "{'text': 'On the Taxes and Fees screen, review the fees that will be credited back to the paying customer (agent) and click Pay Now.'}", "{'text': \"The service finalizes; download and provide a receipt if desired. Confirm the reversal by viewing the customer's vehicles, and confirm credited fees via the Account (briefcase) icon.\"}", "{'text': 'Complete the Renew Registration again correctly for the customer, applying the credited fees.'}"], "tips": ["If you selected Replace or Issue New Plate during the incorrect renewal, email the Special Plates Unit at specialplates2@azdot.gov to cancel the queued plate (find the plate number in the customer's Temporary Plate document).", "Selecting 'Renewed in Error - Re-Establish' is what re-establishes the prior registration and credits the fees back."]}, {"id": "cancel-re-establish-title", "title": "Cancel and Re-Establish Title", "cat": "Title & Registration", "intent": ["cancel and re-establish title", "titled to wrong customer", "entered in error re-establish", "credit fees back", "revert title to original owner", "supervisor instruction", "correct title transfer"], "page": "T_&_R/Title_&_Registration/Cancel_ and_Re-establish_Title.htm", "what": "This service cancels a title transferred to the wrong customer and re-establishes it back to the original owner, crediting fees to the agent that paid them (also reverting the registration if it was part of the original service). Do not use it until instructed by a Supervisor or Level 2 MAX Support.", "steps": ["{'text': 'Confirm a Supervisor or Level 2 MAX Support has instructed you to use this service; note an Alert displays if fees were collected for additional services after the title service being corrected.'}", "{'text': 'From the Services menu, select Cancel Title.'}", "{'text': 'Search for the Customer and Vehicle related to this service, using the customer to whom the title was mistakenly transferred.'}", "{'text': 'Click Add.'}", "{'text': \"Select 'Entered in Error - Re-Establish' from the Cancel Title Reason drop down (this option re-establishes the prior title and credits the fees back).\"}", "{'text': 'Click Confirm, then click Yes to review who the title will be re-established to and from.'}", "{'text': 'Review the information for accuracy, and if correct click Entered in Error - Re-Establish.'}", "{'text': \"The title (and registration, if part of the original transaction) is transferred back to the original owner and any paid fees are credited back to the paying customer's (agent's) account.\"}", "{'text': \"Transfer the title into the correct customer's name.\"}"], "tips": ["If a registration was part of the erroneous service, cancel the printing of the generated plate by emailing the Special Plates Unit at specialplates2@azdot.gov (find the plate number in the customer's Temporary Plate document).", "If any other services were completed after the incorrect T&R service, there will be no fees to credit."]}, {"id": "cancel-registration", "title": "Cancel Registration", "cat": "Title & Registration", "intent": ["cancel registration", "fraud", "cancel from another state", "customer request", "no fee service", "supervisor instruction"], "page": "T_&_R/Title_&_Registration/Cancel_Registration.htm", "what": "An active registration may be canceled for various reasons, including fraud, a request to cancel from another state, or at the customer's request. This is a no-fee service. Do not use it until instructed by a Supervisor or Level 2 MAX Support.", "steps": ["{'text': 'Confirm a Supervisor or Level 2 MAX Support has instructed you to use this service.'}", "{'text': 'Identify the reason for cancellation (e.g., fraud, request to cancel from another state, or customer request).'}", "{'text': 'Note that this is a no-fee service.'}", "{'text': 'Complete the Cancel Registration service in MAX following the standard cancel steps.', 'reference': True}"], "tips": ["DO NOT use this service until instructed to do so by a Supervisor or Level 2 MAX Support."]}, {"id": "cancel-title", "title": "Cancel Title", "cat": "Title & Registration", "intent": ["cancel title", "title issued in error", "transferred to another state", "fraudulent title", "NSF returned payment", "refund to customer account", "supervisor instruction"], "page": "T_&_R/Title_&_Registration/Cancel_Title.htm", "what": "A title can be canceled when it was issued in error, the vehicle and title were transferred to another state, the title was issued fraudulently, or the original payment was returned NSF. Payment refunds are issued to the customer account. Do not use it until instructed by a Supervisor or Level 2 MAX Support.", "steps": ["{'text': 'Confirm a Supervisor or Level 2 MAX Support has instructed you to use this service.'}", "{'text': 'Confirm a valid reason: title issued in error, vehicle/title transferred to another state, title issued fraudulently, or payment returned non-sufficient.'}", "{'text': 'Do NOT use this service to cancel a Print Title you may have requested; this service cancels the Arizona Title and any associated registration.'}", "{'text': 'Complete the Cancel Title process in MAX following the standard steps; payment refunds are issued to the customer account.', 'reference': True}"], "tips": ["DO NOT use this service until instructed to do so by a Supervisor or Level 2 MAX Support."]}, {"id": "credit-estimate", "title": "Credit Estimate (Registration Credit Inquiry)", "cat": "Title & Registration", "intent": ["credit estimate", "formerly plate credit", "registration credit eligibility", "potential refund", "canceled registration", "sold vehicle", "inquiry only", "request registration credit"], "page": "T_&_R/Title_&_Registration/Credit_Estimate.htm", "what": "The Credit Estimate service (formerly Plate Credit) is a simple inquiry that determines whether a customer's vehicle is eligible for a Registration Credit and displays the potential credit/refund when a registration is canceled or a registered vehicle is sold.", "steps": ["{'text': 'Confirm the vehicle is currently registered to the customer; you cannot run a Credit Estimate for a vehicle not currently registered to them.'}", "{'text': 'Understand this is an inquiry only; the customer must specifically request a Registration Credit on AZ MVD Now or with a CSR in an MVD Office.'}", "{'text': 'Advise the customer that if they do not request the Registration Credit, the credit balance decreases monthly until it reaches zero.'}", "{'text': 'Review which fees are eligible for and calculated into a Credit Estimate.', 'reference': True}", "{'text': 'Calculate the Credit Estimate in MAX to display the potential credit/refund.', 'reference': True}", "{'text': 'Note the Request Registration Credit service (separate) processes the actual refund of paid fees and taxes to the customer.'}"], "tips": ["This was formerly referred to as a Plate Credit."]}, {"id": "duplicate-registration", "title": "Duplicate Registration", "cat": "Title & Registration", "intent": ["duplicate registration", "lost stolen destroyed registration", "tab replacement", "pre go live vs post go live", "AZ MVD Now reprint", "$5 fee"], "page": "T_&_R/Title_&_Registration/Duplicate_Registration.htm", "what": "Customers can print a duplicate registration free through AZ MVD Now; if they come into the office because theirs was lost, stolen, or destroyed, a CSR processes a Tab Replacement for $5.00 (regardless of whether they need a tab).", "steps": ["{'text': 'Determine whether the registration was renewed pre-go-live or post-go-live to MAX.'}", "{'text': 'If pre-go-live, direct the customer to contact the field office for a Tab Replacement (see the Tab Replacement topic for requirements).'}", "{'text': 'If post-go-live, advise the customer they may print a duplicate registration free from their Customer Account through AZ MVD Now.'}", "{'text': 'If the customer comes into the office because their registration was lost, stolen, or destroyed, process a Tab Replacement (regardless of whether a tab is needed) and collect $5.00.'}"], "tips": ["See policies 8.9.4 and 8.14.6."]}, {"id": "fee-estimation", "title": "Fee Estimation", "cat": "Title & Registration", "intent": ["fee estimation", "registration fee estimate", "one year estimate", "outside a registration service", "factory list price", "declared gross weight", "vehicle in MAX or not"], "page": "T_&_R/Title_&_Registration/Fee_Estimation.htm", "what": "Use Fee Estimation to give a customer an estimate of registration fees when you are outside of a registration service. It provides an estimate for one year only, based on the vehicle's year, Factory List Price, and use.", "steps": ["{'text': 'Use Fee Estimation when you are outside of a registration service and the customer wants a registration fee estimate.'}", "{'text': 'Understand the service provides a fee estimation for one year only.'}", "{'text': 'Know that within a registration service (Registration Only, Registration Renewal, Title and Registration), MAX automatically estimates fees for the cycles the vehicle qualifies for (1, 2, or 5 years).'}", "{'text': 'Recognize fees are estimated based on the vehicle year, Factory List Price, and use of the vehicle or trailer (including possible commercial registration fees depending on declared gross weight).'}", "{'text': 'Calculate a Fee Estimate for a vehicle already in MAX.', 'reference': True}", "{'text': 'Calculate a Fee Estimate for a vehicle not already in MAX.', 'reference': True}"], "tips": ["The Fee Estimation service will only provide a fee estimation for one year.", "See policies 8.9.2, 8.14.3, 8.14.4, 8.14.6, 8.15.3, and 8.15.4."]}, {"id": "fleet-management", "title": "Fleet Management (Permanent Fleet Registration)", "cat": "Title & Registration", "intent": ["fleet registration", "permanent fleet account", "PERM FLT tab", "same expiration date", "two or more vehicles", "annual renewal", "AZ MVD Now login", "manage fleets in MAX"], "page": "T_&_R/Title_&_Registration/Fleet_Management.htm", "what": "Fleet Registration lets owners of two or more vehicles maintain registrations on a permanent fleet account where all vehicles share the same expiration date, with fees paid annually. Vehicles get a 'PERM FLT' tab and a one-time registration showing 'FLEET' as the expiration.", "steps": ["{'text': 'Confirm the customer qualifies: two or more vehicles owned by the same individual or organization in Arizona (organization must be level 3 or above).'}", "{'text': 'Verify fleet constraints: no limit on number of vehicles, at least 2 vehicles, a maximum of 12 fleets per customer (no more than one fleet expiring each month), and 1-year renewals only.'}", "{'text': \"Ensure the fleet owner has an AZ MVD Now login (unless renewing with an Authorized Third Party), and that fees are paid via the customer's account (no cash, check, or credit card unless renewing with an ATP).\"}", "{'text': 'Apply the timing rules: a vehicle cannot be added until within 3 months of its current expiration (when not already in a fleet) and cannot be added within 2 months of the fleet expiration; expiration is always the last day of the month.'}", "{'text': 'Assess the one-time $2 fee for each vehicle added or converted to a perm fleet account, prorating VLT, weight fee (WGT), and motor carrier fee (CRF) for a partial year.'}", "{'text': 'Use the Managing Fleets in MAX procedures to create a fleet, add or remove vehicles, suspend, cancel, renew registration, and process bulk registration credit requests.', 'reference': True}"], "tips": ["Vehicles receive a PERM FLT tab and a registration showing FLEET as the expiration, so there is no need to match a specific tab to a specific vehicle.", "See policy 8.10.6 and forms #40-0402, #48-0605, #96-0457, and #96-0575."]}, {"id": "government-registration-only-gro", "title": "Government Registration Only (GRO)", "cat": "Title & Registration", "intent": ["government registration only", "GRO", "no certificate of title", "government agency vehicle", "reassigned between agencies", "out of state government vehicle", "government use dropdown"], "page": "T_&_R/Title_&_Registration/Government_Registration_Only.htm", "what": "The Division may issue a Government Registration Only (GRO), without a Certificate of Title, to a vehicle being reassigned between federal and/or state government agencies, or to a government vehicle from another state doing business in Arizona.", "steps": ["{'text': 'Confirm the vehicle meets all applicable Arizona registration requirements and is registered in the name of a federal or state agency or a political subdivision.'}", "{'text': 'Gather the required GRO documentation.', 'reference': True}", "{'text': 'Follow the steps in the Arizona Registration Only (ARO)/Special Interstate Registration (SPI) topic to process the service.', 'reference': True}", "{'text': 'On the Registration tab, select Government from the Use dropdown menu.'}", "{'text': 'Complete the T&R service, then (until fully paperless) print the Title Summary artifact, have the customer review and sign, and re-scan it into MAX.'}"], "tips": ["A GRO can be assigned to a government vehicle from another state doing business in Arizona (e.g., a California government vehicle).", "See policies 8.12.2, 8.10.4, 8.15.4, and 8.16.7, and the Fee Exemptions chart."]}, {"id": "license-plate-overview", "title": "License Plate Overview", "cat": "Title & Registration", "intent": ["license plate overview", "plate categories", "regular commercial motorcycle standard trailer", "plate transfer plate notice", "offensive standard plate", "digital license plate", "duplicate plate", "special plates"], "page": "T_&_R/Title_&_Registration/License_Plate_Overview.htm", "what": "License plates are assigned to the vehicle owner during a service at a Customer Service office or ATP (some via AZ MVD Now). The plate stays with the owner when a vehicle is sold and may be transferred to another vehicle they own. Plates fall into Regular, Vehicle Qualifier, Owner Qualifier, and Non-Qualifier categories.", "steps": ["{'text': 'Understand one plate is issued per vehicle, displayed on the rear with a tab indicating the month/year of expiration and attainment/non-attainment area; a duplicate plate is $10.00.'}", "{'text': 'When a plate is eligible to transfer vehicle to vehicle, complete and submit a Plate Notice, form #48-3302 (MAX refers to it as a Plate Relinquish form).'}", "{'text': \"For a lost temporary plate or registration, advise the customer they may print a duplicate free through AZ MVD Now, or re-print from the customer's documents in office for $5.00 (use Miscellaneous Purchase for the Replacement Plate Fee).\"}", "{'text': 'Identify the plate category by vehicle body style, usage, and owner: Regular (Commercial, Motorcycle, Standard/Passenger, Trailer), Vehicle Qualifier, Owner Qualifier (Special/Government), or Non-Qualifier (Special).'}", "{'text': 'If a generated temporary plate is blatantly derogatory/profane/inappropriate (Offensive Standard Plate), complete an Update Registration service and select Issue New Plate (zero out fees during the service).'}", "{'text': 'Have your upline approver submit a Service Portal ticket, select Special Plates from the Area Impacted drop down, and begin the Detailed description with the appropriate cancellation reason (Address Error, Burner Plate, Offensive Standard Plate, wrong background/Plate Type Error, Personalization Error, or Spacing Error).'}", "{'text': 'For a digital license plate, refer the customer to Reviver.com (the only approved vendor); MVD manages the plate number and background while the customer contacts the vendor to add them to the digital display device.'}"], "tips": ["If a non-owner reports an inappropriate plate, have them complete the License Plate Complaint, form #96-0577.", "If a service is completed after 4pm the same day, notify the customer they MAY receive both plates and still have the upline approver submit the ticket; ATPs can only do this Monday-Friday, same day as processing.", "Maroon plates (1980-1997) are standard plates and are transferable only to the same owner. Currently there is no way in MAX to see if a customer has a digital plate."]}, {"id": "operation-of-law-liens-overview", "title": "Understand and Handle Operation of Law Liens", "cat": "Vehicles, Liens & Inspections", "intent": ["operation of law lien", "legal injunction on vehicle", "DES DOR court lien", "non-transferable vehicle", "refer to filing agency", "petition to remove lien", "lien blocking title transfer"], "page": "T_&_R/Title_&_Registration/Liens/Operations_of_Law_Liens.htm", "what": "Operation of Law Liens are legal injunctions placed on a vehicle by the Division on behalf of a governing agency (DES, DOR, Courts, etc.) prohibiting the transfer of ownership, unlike lender liens added at purchase. They can be added anytime for no fee and remain indefinitely until the customer satisfies legal requirements or the agency grants removal.", "steps": ["Recognize an Operation of Law Lien affects titles being transferred OUT of the owner's name who holds the lien.", "Understand a title CAN be transferred INTO a customer's name with an Operation of Law Lien, but once done the vehicle becomes non-transferable under that lien.", "Refer any questions about the lien to the filing agency; the customer is responsible for contacting that agency.", "Provide the customer the lien information found in the Withdrawal section on the Vehicle Information Page.", "Advise the customer they may petition to remove the lien by agency permission or by satisfying legal requirements (paying court fees/fines, catching up on child support, etc.).", "If a customer at your window has an Operation of Law Lien issue you cannot resolve, have an upline approver (Lead, Supervisor, or Manager) email the Ops Lien Unit at opsliens@azdot.gov with subject 'Customer Waiting - Type of Lien'.", "Include in the email body: Customer Name & DL Number, VIN, document provided by customer, whether uploaded to customer documents (yes/no), and a brief description of the issue.", "Expect a response within 15 minutes; if none or an out-of-office reply, gather the customer's contact info to follow up once you hear back.", "When finished with the T & R service, print the Title Summary (artifact), have the customer review and sign, and re-scan it into MAX."], "tips": ["ATPs only: same-day responses occur Monday through Friday; weekend or holiday emails get a next-business-day reply.", "See related incident types: Adding, Providing Information, Removing an Operation of Law Lien, and the Single Vehicle Release Workaround."]}, {"id": "motor-carrier-inquiry", "title": "Confirm IRP Registration with Motor Carrier Inquiry", "cat": "Title & Registration", "intent": ["confirm IRP registration", "apportioned vehicle", "motor carrier inquiry", "mCarrier title and fee", "check IRP indicator", "view vehicle details"], "page": "T_&_R/Title_&_Registration/Motor_Carrier_Inquiry.htm", "what": "When a title and registration for an apportioned vehicle is processed and finalized in mCarrier, it automatically sends the title and fee information to MAX. Motor Carrier Inquiry lets you confirm a vehicle has an IRP registration and view certain details.", "steps": ["Understand that apportioned vehicle titles/registrations are processed in mCarrier by the Motor Carrier Unit (and some Authorized Third Parties).", "Know that once finalized in mCarrier, the title and fee information is automatically sent to MAX.", "To confirm a vehicle has an IRP registration, use the Motor Carrier Inquiry function to view certain details.", "Alternatively, view the Vehicle Information Page and check for an IRP indicator."], "tips": []}, {"id": "nmvtis-responses", "title": "Handle NMVTIS Responses and Possible Stolen Vehicles", "cat": "Title & Registration", "intent": ["NMVTIS data exchange", "possible stolen vehicle report", "out-of-state brands", "verify out-of-state title number", "reduce title fraud", "AAMVA vehicle helpdesk"], "page": "T_&_R/Title_&_Registration/NMVTIS_Reponses.htm", "what": "The National Motor Vehicle Title Information System (NMVTIS) is an interactive data exchange that provides participating states with motor vehicle and title record information to reduce fraud and deter titling of stolen vehicles. It flags possible stolen vehicles, out-of-state brands, and verifies out-of-state title numbers during transfer to Arizona.", "steps": ["Understand NMVTIS deals with possible stolen vehicles (including the Possible Stolen Vehicle Report), out-of-state brands transferring to Arizona titles, and verification of out-of-state title numbers.", "Know that verifying the out-of-state title number includes confirming it is the most current title number.", "Every time a Possible Stolen Vehicle Report message populates, complete the report and do not overlook it.", "Recognize the NMVTIS Help Desk tracks and monitors every possible stolen vehicle hit, so this 'paper trail' is vital for gathering statistical information for successful resolution.", "Reference the Possible Stolen Vehicle Report Message topic and its Scenarios and Examples for guidance.", "Use the AAMVA Vehicle Helpdesk to see a possible stolen vehicle when applicable."], "tips": ["Also review NMVTIS Multiple Vehicles Returned and NMVTIS Returned Non-Matching Title topics for those scenarios."]}, {"id": "nonresident-daily-commuter", "title": "Process a Non-Resident Daily Commuter Registration", "cat": "Insurance & Permits", "intent": ["nonresident daily commuter", "contiguous state resident", "35 mile corridor zone", "daily commuter decal", "miscellaneous purchase fee", "form 40-7807", "customer account level 3"], "page": "T_&_R/Title_&_Registration/NonResident_Daily_Commuter.htm", "what": "A nonresident daily commuter is a resident of a contiguous state who enters and leaves Arizona daily for employment, with their vehicle principally garaged in the contiguous state and their Arizona workplace no more than 35 air miles from the border. The application (form #40-7807) is valid for two years from the last day of the month of issuance and costs $8.00.", "steps": ["Confirm the customer qualifies: resident of a contiguous state who commutes daily for employment, vehicle principally garaged in that state, and workplace within 35 air miles of the Arizona border.", "Check the 35 Mile Corridor Zone chart for the list of qualifying cities and towns.", "Verify all conditions in policy 7.1.11 Nonresident Daily Commuter are met and complete the Nonresident Daily Commuter Application, form #40-7807.", "Ensure the customer has a Customer Account in MAX (Level 3 Customer) in order to process the payment.", "Hole punch the decal with the appropriate month and year.", "Affix the decal to the application in the appropriate space.", "Complete a Miscellaneous Purchase in MAX to collect the $8.00 Non-Resident Daily Commuter Registration fee."], "tips": ["The application is valid for two years from the last day of the month of issuance.", "Documentation is not required to be scanned and uploaded into MAX."]}, {"id": "off-highway-vehicles-routing", "title": "Route Off-Highway Vehicle (OHV) Inquiries", "cat": "Title & Registration", "intent": ["off-highway vehicle", "OHV routing", "golf cart moped NEV", "recreational vehicles topic", "non-resident OHV permit", "30-day OHV permit"], "page": "T_&_R/Title_&_Registration/OHV_LandingPg.htm", "what": "This landing page directs you to the correct topic for off-highway vehicle inquiries depending on the vehicle and customer type.", "steps": ["For golf carts, mopeds, or Neighborhood Electric Vehicles (NEVs), see the Recreational Vehicles topic.", "If the customer is a non-resident of Arizona seeking a permit for their OHV, see the 30-Day Non-Resident OHV Permit topic.", "Direct the customer to the appropriate service based on their vehicle type and residency."], "tips": []}, {"id": "plate-order-search-status", "title": "Check the Status of a Plate Order", "cat": "Title & Registration", "intent": ["plate order search", "plate not received", "plate order status", "special plates unit", "do not reorder plate", "pending ready to order in production mailed", "returned twice plate"], "page": "T_&_R/Title_&_Registration/Plate_Order_Search.htm", "what": "Plate Order Search is a MAX function where field office CSRs can view the status of plate orders and the Special Plates Unit (SPU) can update the status. Always check it first when a customer says they haven't received a plate in the mail.", "steps": ["When a customer reports they haven't received their plate in the mail, ALWAYS check Plate Order Search first to determine the status.", "Review the plate status: Pending (not yet reviewed by SPU), Ready to Order (approved and sent to vendor), In Production (being produced), or Mailed (sent to the customer's order address).", "DO NOT reorder any plate with a status of Pending, Ready to Order, In Production, or Mailed.", "For a Returned status, the plate was returned to MVD by the Post Office; for Re-Mailed, it was mailed a second time to the same address.", "If the address has changed, have the customer request a replacement plate rather than re-mailing.", "For Returned Twice, the plate will be destroyed and the customer must request a replacement plate.", "If a plate needs to be 'burned' to Transfer Plates for a customer, contact the SPU to cancel the plate order.", "For questions about a plate order status, email the Special Plates Unit at specialplates2@azdot.gov with the Subject Line: Plate Order Error."], "tips": ["Plates are mailed from and returned to the vendor; the SPU does not handle any physical plates.", "Rejected means the requested plate (e.g. a personalized plate with profanity or a body part) was rejected by the SPU."]}, {"id": "reconstructed-specially-constructed-vehicles", "title": "Identify Reconstructed and Specially Constructed Vehicles", "cat": "Vehicles, Liens & Inspections", "intent": ["reconstructed vehicle", "specially constructed vehicle", "essential parts change", "dune buggy sandrail kit vehicle", "glider kit", "vehicle inspection required", "title brands"], "page": "T_&_R/Title_&_Registration/Reconstructed_&_Specially_Constructed_Vehicles.htm", "what": "The Division requires every vehicle titled/registered to be identified by manufacturer name, description, and VIN, and the applicant must indicate whether the vehicle is reconstructed or specially constructed. A reconstructed vehicle is assembled largely from new or used essential parts of other vehicles, and there are four types of specially constructed vehicles.", "steps": ["Confirm the vehicle is identified by manufacturer name, a brief description, and the VIN.", "Have the applicant indicate whether the vehicle is reconstructed or specially constructed for a complete description.", "Classify as reconstructed if the vehicle has been assembled or constructed largely from new or used essential parts of other vehicles; a change to any essential part may require this classification.", "Review Essential Parts, Documentation Required, Inspections, and Reconstructed Brand Categories for a reconstructed vehicle.", "For specially constructed vehicles, identify which of the four types applies: Dune Buggies, Homemade Trailers, Kit Vehicles (Glider Kits) or Trailers, or Sandrails.", "See the Homemade Trailers topic for homemade trailer specifics.", "When finished with the T & R service, print the Title Summary (artifact), have the customer review and sign, and re-scan it into MAX."], "tips": ["Relevant forms include #48-4503 Level I Vehicle Inspection and #48-5108 Special Serial Number Application."]}, {"id": "reinstate-registration", "title": "Reinstate a Suspended Vehicle Registration", "cat": "Title & Registration", "intent": ["reinstate registration", "suspended registration status", "reinstatement fees", "restore vehicle registration"], "page": "T_&_R/Title_&_Registration/Reinstate_Registration.htm", "what": "The Reinstate Registration service in MAX restores a vehicle registration and requires appropriate reinstatement fees to be collected. It can only be applied to vehicles with a Suspended Registration status.", "steps": ["Confirm the vehicle has a Suspended Registration status, since Reinstate Registration can only be applied to suspended registrations.", "Use the Reinstate Registration service in MAX for the vehicle.", "Collect the appropriate reinstatement fees.", "Complete the service to restore the registration."], "tips": []}, {"id": "suspend-registration", "title": "Suspend a Vehicle Registration Manually", "cat": "Title & Registration", "intent": ["suspend registration", "manual registration suspension", "OIG request", "ongoing investigation", "no incident withdrawal", "customer notification"], "page": "T_&_R/Title_&_Registration/Suspend_Registration.htm", "what": "The Suspend Registration service lets an authorized user suspend a vehicle registration when there is no incident or withdrawal associated with the situation (e.g., an ongoing investigation or at the request of OIG). It can be applied to vehicles with an Active, Permanent, or Expired registration status.", "steps": ["Determine the suspension is warranted with no associated incident or withdrawal (e.g., ongoing investigation or OIG request).", "Confirm the vehicle has an Active, Permanent, or Expired registration status, the statuses the service can be applied to.", "Use the Suspend Registration service in MAX to suspend the registration.", "Understand that manual suspensions trigger a notification to the customer.", "Recognize manual suspensions will not necessarily include Compliance Requirements because the suspension was not triggered by an Incident Management process."], "tips": ["For most registration suspensions, an incident triggers a Withdrawal action and notifies the customer with specified criteria and timeframe."]}, {"id": "title-and-reg-recreate", "title": "Recreate a Title Record with T & R Recreate", "cat": "Title & Registration", "intent": ["T&R recreate", "legacy TPX conversion failure", "recreate title record", "title data did not populate", "accommodative data search", "purged record", "recreate in prior owner name"], "page": "T_&_R/Title_&_Registration/T_&_R_Recreate.htm", "what": "T & R Recreate lets MAX users recreate title records for an Arizona vehicle when existing data did not successfully convert from the legacy system (TPX) to MAX. Use it only for title records with inactivity where title data already exists but did not fully populate; do NOT use it to recreate the registration part of the record.", "steps": ["Confirm the situation is a title record with inactivity where title data already exists but did not fully populate MAX records; do NOT use T & R Recreate for the registration part of the title record.", "For new title and registration documents, use the Title and Reg, Registration Only, or Title Only services; for errors use T & R Corrections; for changed details use Update Registration.", "Before initiating, search for the existing title record in Accommodative Data Search - Vehicle Snapshot - Accommodative Data.", "If the original record is found, use it to add/complete any missing data in MAX.", "If ownership is being transferred and the record was purged, function tokenize(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);}
function score(t,qt,raw){
  const title=(t.title||"").toLowerCase(),intent=(t.intent||[]).join(" • ").toLowerCase(),
    what=(t.what||"").toLowerCase(),steps=(t.steps||[]).join(" ").toLowerCase(),cat=(t.cat||"").toLowerCase();
  let s=0;
  if(raw&&title.includes(raw))s+=40;if(raw&&intent.includes(raw))s+=30;
  qt.forEach(k=>{if(title.includes(k))s+=12;if(intent.includes(k))s+=9;if(cat.includes(k))s+=5;if(what.includes(k))s+=4;if(steps.includes(k))s+=1.5;});
  qt.forEach(k=>{if(new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").test(title))s+=6;});
  return s;
}
function search(raw){const q=raw.trim().toLowerCase();if(!q)return[];const qt=tokenize(q);
  return TASKS.map(t=>({t,s:score(t,qt,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,30).map(x=>x.t);}

let activeCmd=null;
function toggleCmd(cat){
  const panel=document.getElementById("suggest"),inner=document.getElementById("suggestInner");

  const rows=areas.map(([c,col],i)=>`<tr>
    <td class="n">${i+1}</td>
    <td class="area"><span class="dot" style="--c:${col}"></span>${esc(c)}</td>
    <td class="n">${counts[c]}</td>
    <td contenteditable="true"></td><td contenteditable="true"></td>
    <td contenteditable="true"></td><td contenteditable="true"></td>
  </tr>`).join("");
  vRes.innerHTML=`<button class="printbtn" type="button" onclick="window.print()">🖨 Print / Save as PDF</button>
    <div class="sheet">
      <h2>MAX Implementation — Director Kickoff Worksheet</h2>
      <p class="purpose">Overview of each Director's organization and responsibilities · initial business processes to evaluate for the MAX implementation · key SMEs · timing for upcoming process-review sessions.</p>
      <div class="meta">
        <span class="fld"><b>Date:</b> <span class="line" contenteditable="true">&nbsp;</span></span>
        <span class="fld"><b>Facilitator:</b> <span class="line" contenteditable="true">&nbsp;</span></span>
        <span class="fld"><b>Attendees:</b> <span class="line" contenteditable="true" style="min-width:300px">&nbsp;</span></span>
      </div>
      <table class="wk"><thead><tr>
        <th>#</th><th>Functional area (MAX / One Source)</th><th># Processes</th>
        <th>Owning Director</th><th>Priority (H / M / L)</th><th>Business SME(s)</th><th>Target review session</th>
      </tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td class="n"></td><td class="area">Total documented processes</td><td class="n">${TASKS.length}</td><td colspan="4"></td></tr></tfoot>
      </table>
      <p class="purpose" style="margin-top:14px">Click any cell to type notes on screen, then <b>Print / Save as PDF</b>. Process counts are the documented One Source procedures per area (a starting inventory for review scope).</p>
    </div>`;
  show("results");scrollTop();
}
function renderDetail(t){
  setCrumb(`<a href="#">Home</a> › <a href="#cat:${encodeURIComponent(t.cat)}">${esc(t.cat)}</a> › <b>${esc(t.title)}</b>`);
  markActive(t.cat);
  const steps=(t.steps||[]);
  const body=t.reference
    ?`<div class="steps-h">Key points</div><ul class="keypoints">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`
    :`<div class="steps-h">Do this in MAX</div><ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
  const tips=(t.tips||[]).filter(Boolean);
  const tipsH=tips.length?`<div class="tips"><h4>Good to know</h4><ul>${tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const rel=TASKS.filter(o=>o.id!==t.id&&o.cat===t.cat).slice(0,4);
  const relH=rel.length?`<div class="related"><h3>Related in ${esc(t.cat)}</h3><div class="results">${rel.map(taskCard).join("")}</div></div>`:"";
  vDet.innerHTML=`<div class="detail"><div class="head" style="--c:${catColor(t.cat)}">${pill(t.cat)}<h2>${esc(t.title)}</h2><p class="what">${esc(t.what||"")}</p></div>
    <div class="body">${body}${tipsH}</div>
    <div class="foot"><a class="srcbtn" href="${linkFor(t.page)}" target="_blank" rel="noopener">Open this page in One Source ↗</a><span class="srcpath">${esc(t.page)}</span></div></div>${relH}`;
  show("detail");scrollTop();
}
function renderHome(){setCrumb("<b>Home</b>");markActive(null);show("home");}
function scrollTop(){window.scrollTo({top:0,behavior:"auto"});}

// ask model — no live keyword search; an answer is composed only when the user asks
const q=document.getElementById("q"),qtop=document.getElementById("qtop"),answerEl=document.getElementById("answer");
function clearAnswer(){if(answerEl)answerEl.innerHTML="";}
function renderAnswer(v){
  const res=search(v);
  if(!res.length){
    answerEl.innerHTML=`<div class="ans"><div class="ans-h no">Not documented in One Source</div>
      <p>I couldn't find a MAX procedure for <b>“${esc(v)}”</b>. Try naming a specific action — e.g. “renew”, “transfer a title”, “reinstate”, “refund” — or open an area from the sidebar. It may also be handled outside MAX; if so, flag it for the team.</p></div>`;
    return;
  }
  const areas={};res.forEach(t=>areas[t.cat]=(areas[t.cat]||0)+1);
  const ta=Object.entries(areas).sort((a,b)=>b[1]-a[1]);
  const chips=ta.slice(0,4).map(([c,n])=>`<a class="areachip" style="--c:${catColor(c)}" href="#cat:${encodeURIComponent(c)}">${esc(c)} · ${n}</a>`).join("");
  const list=res.slice(0,8);
  answerEl.innerHTML=`<div class="ans"><div class="ans-h yes">Yes — MAX can help with this</div>
    <p>In One Source this falls under ${chips}. There ${res.length===1?"is":"are"} <b>${res.length}</b> related procedure${res.length!==1?"s":""} — pick one below for the step-by-step in MAX:</p>
    <div class="results">${list.map(taskCard).join("")}</div>
    ${res.length>list.length?`<p class="more">+${res.length-list.length} more. Narrow your question, or open an area from the sidebar to see everything.</p>`:""}</div>`;
}
function isAbout(v){
  const s=v.toLowerCase().trim().replace(/[?.!]+$/,"");
  if(["max","what is max","what's max","whats max","about max","max overview"].includes(s)) return true;
  return /^(what('?s| is| are)?\s+max\b|what\s+is\s+max|about\s+max|explain\s+max|tell me about max|overview of max|what\s+does\s+max\b|what\s+can\s+max\b|how\s+does\s+max\b|getting started)/.test(s);
}
function renderAbout(){
  const seen={};
  const orient=TASKS.filter(t=>{
    const ok=t.cat==="Getting Started"||/getting started|glossary|navigating in max|logging into max|log in to max|dashboard/i.test(t.title);
    if(ok&&!seen[t.id]){seen[t.id]=1;return true;} return false;
  }).slice(0,8);
  answerEl.innerHTML=`<div class="ans"><div class="ans-h info">About MAX</div>
    <p><b>MAX</b> is the Arizona MVD system staff use (through One Source) to serve customers — finding and creating records, issuing driver credentials, processing title &amp; registration, and taking payments. Start with these orientation topics:</p>
    <div class="results">${orient.map(taskCard).join("")}</div>
    <p class="more">Or open any area in the sidebar to see what MAX does there.</p></div>`;
}
function askQuestion(raw){
  const v=(raw||"").trim();
  if(q.value!==v)q.value=v; if(qtop.value!==v)qtop.value=v;
  renderHome();
  if(!v){clearAnswer();return;}
  if(isAbout(v)) renderAbout(); else renderAnswer(v);
  history.replaceState(null,"","#ask:"+encodeURIComponent(v));
}
q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();askQuestion(q.value);}if(e.key==="Escape"){q.value="";clearAnswer();}});
qtop.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();askQuestion(qtop.value);}});
document.getElementById("askSend").addEventListener("click",()=>askQuestion(q.value));

// routing
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h){q.value="";qtop.value="";clearAnswer();renderHome();return;}
  if(h==="meeting"){renderMeeting();return;}
  if(h.startsWith("cat:")){renderCategory(h.slice(4));return;}
  if(h.startsWith("ask:")){askQuestion(h.slice(4));return;}
  if(h.startsWith("search:")){askQuestion(h.slice(7));return;}
  if(byId[h]){renderDetail(byId[h]);return;}
  renderHome();
}
window.addEventListener("hashchange",route);

// sidebar mobile
const app=document.getElementById("app");
function closeSide(){if(window.innerWidth<=860)app.removeAttribute("data-side");}
document.getElementById("ham").addEventListener("click",()=>{app.getAttribute("data-side")==="open"?app.removeAttribute("data-side"):app.setAttribute("data-side","open");});
document.getElementById("scrim").addEventListener("click",()=>app.removeAttribute("data-side"));
if(window.innerWidth>860)app.setAttribute("data-side","open");

// theme (icon-only, persisted)
const root=document.documentElement,tb=document.getElementById("themeBtn"),ti=document.getElementById("themeIcon"),TKEY="mvdmax-theme";
function applySaved(){try{const s=localStorage.getItem(TKEY);if(s==="dark"||s==="light")root.setAttribute("data-theme",s);}catch(e){}}
function isDark(){const c=root.getAttribute("data-theme");return c==="dark"||(!c&&matchMedia("(prefers-color-scheme:dark)").matches);}
function setIcon(){ti.textContent=isDark()?"☀":"☾";}
applySaved();
tb.addEventListener("click",()=>{const n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem(TKEY,n);}catch(e){}setIcon();});
window.addEventListener("pageshow",applySaved);
setIcon();

buildSidebar();route();
</script>
