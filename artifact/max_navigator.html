 an Incident Report (form #46-4411) per the Incident Reports topic in Office Standard Work.', 'reference': True}", "{'text': 'Email the completed report to OIG at fraud@azdot.gov with all copies from Step 1; only mail the report to OIG if you have original documentation.', 'reference': True}", "{'text': \"If fraud is suspected, add a note to the customer record ('Do not issue anything - refer to OIG') via Notes Management, and file a copy of the report and supporting documents in the designated file.\", 'reference': True}", "{'text': 'Use the service-type matrix: T&R (documents or identity) issue nothing; Credential documents issue nothing; Credential identity issue a temporary credential but do NOT give to customer, collect fees, forward to OIG, and complete the fraudulent-situation steps including Cancel Print (Folio).', 'reference': True}", "{'text': 'OIG contact: fraud@azdot.gov, (602) 712-6291; mail originals only to ADOT Office of the Inspector General, Attn: Duty Office, Mail Drop 514M, Phoenix, AZ 85014. ATPs must forward documentation to the Third Party Administration (TPA).', 'reference': True}"], "tips": ["Do not disclose a 'deceased' or 'reported deceased' status to the customer; photocopy documentation, forward to OIG, and see the Deceased or Reported Deceased section."], "reference": true}, {"id": "non-sufficient-funds-nsf", "title": "Handle Non-Sufficient Funds (NSF) Stops", "cat": "Reference", "intent": ["non-sufficient funds", "NSF stop on record", "returned payment", "chargeback JUD", "online payment return", "port of entry return", "NSF fee", "reinstate registration NSF", "issue ID with NSF"], "page": "Misc._Business_Topics/Non-Sufficient_Funds.htm", "what": "Explains how NSF and returned-payment withdrawals add a stop that blocks services (except ID cards) until paid in full, and the fees, timeframes, and reinstatement rules involved.", "steps": ["{'text': 'Know an NSF adds a stop that prevents all services (except an ID card) until full payment resolves the returned payment; the four related withdrawals are NSF Penalty Due, Online Payment Return, Chargeback JUD, and Port of Entry Return Payment.', 'reference': True}", "{'text': 'MAX allows issuing an ID even with an NSF, Online Payment Returned, or Chargeback (JUD) stop.', 'reference': True}", "{'text': 'If the NSF was for an ID card transaction, issue a new ID without collecting the NSF fee first.', 'reference': True}", "{'text': 'If the NSF was not for a driver license transaction (e.g., registration renewal) and the DL is active, have the customer complete a Driver License/ID Cancellation Request (form #96-0384) before issuing an ID; MAX alerts that the current credential will be canceled prior to issuance.', 'reference': True}", "{'text': 'Explain full payment is required within 45 days; if unpaid, MAX creates an incident/withdrawal action.', 'reference': True}", "{'text': 'Know the outcome by type: a credential NSF cancels the credential and stops services; a T&R/registration NSF suspends the registration and stops services; other services (MVR, Aircraft or Port of Entry returned payment) stop services until satisfied.', 'reference': True}", "{'text': 'Understand ineligible services until paid in full include credential issuance/renewal/duplicate, print/title only, registration only/duplicate/update/renew/reinstate, title and registration, issue/reprint permit, tab replacement, and temporary registration plate.', 'reference': True}", "{'text': 'Always resolve the outstanding returned payment amount on the customer record before completing any T&R service; follow Reinstatement Scenarios > Reinstating a Vehicle Registration with a NSF/Chargeback Withdrawal to collect and reinstate.', 'reference': True}"], "tips": [], "reference": true}, {"id": "reported-deceased-status", "title": "Resolve a Reported Deceased Status", "cat": "Reference", "intent": ["reported deceased", "deceased status on record", "remove deceased status", "reported deceased in error form", "SSA letter", "vital records", "tech support deceased", "clear deceased"], "page": "Misc._Business_Topics/Reported_Deceased.htm", "what": "Steps a CSR takes when a credential or vehicle service returns a 'Deceased' or 'Reported Deceased' response, helping the customer obtain documentation and having Tech Support remove the status.", "steps": ["{'text': 'Ask the customer if they have documentation on official letterhead from the Social Security Administration (SSA) or Vital Records dated within 30 days; if not born in AZ, they must contact vital records in their birth state.', 'reference': True}", "{'text': 'If they have no documentation, provide the Reported Deceased in Error form (#96-1003), which lists SSA and Arizona Vital Records phone numbers/websites and what the Division requires to remove the status (SSA 800-772-1213; AZ Vital Records 602-364-1300).', 'reference': True}", "{'text': 'Have the customer contact one or both agencies to request a letter stating the deceased status was reported in error.', 'reference': True}", "{'text': 'The customer returns with the document as quickly as possible and provides it to a CSR.', 'reference': True}", "{'text': 'Contact Tech Support (602-712-4900) and either upload the document to customer documents or scan a copy to the assisting agent.', 'reference': True}", "{'text': 'Tech Support reviews the documentation and, if validated, removes the Deceased status from the customer record.', 'reference': True}", "{'text': 'Try to complete the service while on the phone with Tech Support; if unsuccessful, have an upline approver submit a Service Portal ticket to resolve issuance.', 'reference': True}"], "tips": ["If there is any suspicion of fraud, follow Fraudulent Documents or Identity > Deceased or Reported Deceased to involve OIG."], "reference": true}, {"id": "residency-requirements", "title": "Determine Arizona Residency Requirements", "cat": "Reference", "intent": ["residency requirements", "who is an Arizona resident", "seven months rule", "resident driver license", "resident vehicle registration", "nonresident", "out-of-state student", "residency exemption"], "page": "Misc._Business_Topics/Residency_Requirements.htm", "what": "Defines who is considered an Arizona resident and therefore required to have an Arizona Driver License and/or Vehicle Registration, and who is not.", "steps": ["{'text': 'Treat as a resident any person who, regardless of domicile, remains in the state for a cumulative seven months or more per calendar year.', 'reference': True}", "{'text': 'Treat as a resident anyone engaging in a trade, profession, or occupation or accepting employment, except seasonal agricultural work or temporary seasonal work of not more than three months where permanently domiciled.', 'reference': True}", "{'text': 'Include anyone placing children in an Arizona public school without paying non-resident tuition fees.', 'reference': True}", "{'text': 'Include anyone declaring residency to obtain resident-rate state licenses or tuition at publicly funded institutions (e.g., ASU, U of A, NAU).', 'reference': True}", "{'text': 'Include anyone operating a vehicle for an employer that bases and operates motor vehicles in Arizona for intrastate operation (other than seasonal agricultural work), and anyone registered to vote in Arizona.', 'reference': True}", "{'text': 'Do NOT count as a resident a nonresident owner whose vehicle is registered in an adjoining state and used for transporting passengers/property for compensation, when owner and vehicle remain domiciled in that adjoining state.', 'reference': True}", "{'text': 'Do NOT count as a resident an out-of-state student enrolled in seven or more semester hours who is not classified as an in-state student (at public or private institutions).', 'reference': True}"], "tips": [], "reference": true}, {"id": "verification-of-signatures", "title": "Verify and Acknowledge Signatures", "cat": "Reference", "intent": ["verification of signatures", "notary acknowledgment", "CSR acknowledge signature", "good standing notary", "foreign country notary", "commissioned officer notary", "witness signature", "notary search"], "page": "Misc._Business_Topics/Verification_of_Signatures.htm", "what": "Explains the state requirements for verifying or witnessing signatures by notaries, CSRs, dealerships, or title service companies on Division forms.", "steps": ["{'text': 'Ensure any signature verification or witnessing meets minimum state requirements, rules, and regulations.', 'reference': True}", "{'text': \"A notary public may acknowledge signatures on Division forms only when the notary's commission is in effect at the time of notarization.\", 'reference': True}", "{'text': \"A CSR may acknowledge an individual's signature in person for no fee, but that acknowledgment may not be valid in another state or country.\", 'reference': True}", "{'text': \"Reference the sections for customer signatures, documentation customers sign, and CSR, dealership representative, and notary acknowledgment of the customer's signature as needed.\", 'reference': True}", "{'text': \"Verify a notary's 'Good Standing' when required, using the Arizona Secretary of State notary search at https://apps.azsos.gov/apps/notary/search/Default.aspx.\", 'reference': True}", "{'text': 'Follow the specific rules for Foreign Country Notary and Commissioned Officer Notary acknowledgments.', 'reference': True}", "{'text': 'Consult the Signature Requirements for T&R Services chart and the One and the Same Certificate (form #38-4306) when applicable.', 'reference': True}"], "tips": [], "reference": true}, {"id": "window-tinting-medical-exemption", "title": "Process a Window Tint Medical Exemption", "cat": "Reference", "intent": ["window tinting exemption", "medical window tint", "light sensitivity", "certificate of exemption", "form 40-1511", "medical review tint", "windshield tint request", "tint light transmission"], "page": "Misc._Business_Topics/Window_Tinting.htm", "what": "Explains the medical exemption from window tinting requirements, the application certified by a physician, and Medical Review's approval process.", "steps": ["{'text': 'Understand a person required for medical reasons to be shielded from direct sun rays may receive an exemption from window tinting requirements, granted to a vehicle owner or a habitual passenger.', 'reference': True}", "{'text': 'Note that per A.R.S. § 28-959.01, tint with a light transmission of 33% (+/- 3%) and luminous reflectance of 35% (+/- 3%) may be applied to front side wing vents and rear windows.', 'reference': True}", "{'text': 'Have the applicant submit the Application For Window Tint Medical Exemption (form #40-1511), certified by an MD, DO, NMD, or Ophthalmologist.', 'reference': True}", "{'text': 'Send the application to Medical Review, which examines it and approves or denies the request (can take 4 to 6 weeks).', 'reference': True}", "{'text': \"If approved, Medical Review adds the Light Sensitivity Window Tint characteristic on the customer's record, scans the Certificate of Exemption to customer documents, and mails the certificate to the driver to keep in the vehicle.\", 'reference': True}", "{'text': 'Advise that the letter and characteristic do not prevent being pulled over; they are only to show the officer.', 'reference': True}", "{'text': 'For a windshield tint request, the driver must obtain a letter from a physician specifically stating windshield tint is requested; Medical Review sends a separate notice for the windshield tint (form #40-1511 covers front side and rear windows only).', 'reference': True}"], "tips": [], "reference": true}, {"id": "affixing-unaffixing-mobile-home", "title": "Affix and Un-Affix a Mobile Home", "cat": "Title & Registration", "intent": ["affix mobile home", "un-affix mobile home", "affidavit of affixture", "mobile home to property", "mobile home title canceled affixed", "mobile home real property"], "page": "Mobile Homes/Affixing_and_Un-Affixing_a_Mobile_Home.htm", "what": "Overview of the procedures for affixing a mobile home to property and un-affixing it, including related resources.", "steps": ["{'text': 'Follow the Affixing a Mobile Home to Property section when a mobile home is being attached to real property.', 'reference': True}", "{'text': 'Follow the Un-Affixing a Mobile Home section when a mobile home needs to be removed from real property status.', 'reference': True}", "{'text': 'Reference Policy 8.13.2 Mobile Home for the governing requirements.', 'reference': True}", "{'text': 'Use the ADOT mobile home information page (https://azdot.gov/mvd/services/vehicle-services/mobile-home-information) for guidance.', 'reference': True}", "{'text': 'Use the Arizona Department of Revenue Affidavit of Affixture (https://azdor.gov/forms/property-tax-forms/affidavit-affixture) as needed.', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-home-delinquent-taxes", "title": "Clear Delinquent Taxes on a Mobile Home", "cat": "Title & Registration", "intent": ["mobile home delinquent taxes", "tax clearance receipt", "county assessor tax", "county tax due stop", "mobile home tax", "clear delinquent taxes in MAX"], "page": "Mobile Homes/Delinquent_Taxes.htm", "what": "Explains that a Tax Clearance Receipt is required before any mobile home transaction when delinquent taxes are due, and what the receipt must contain.", "steps": ["{'text': 'When delinquent taxes are due, require a Tax Clearance Receipt BEFORE any transaction can be completed.', 'reference': True}", "{'text': \"Have the customer obtain the Tax Clearance Receipt from the County Assessor (and in some cases the Sheriff's Department) in the county where the personal property taxes are delinquent.\", 'reference': True}", "{'text': 'Confirm the Tax Clearance Receipt contains: issuing county name, mobile home year, make, VIN, tax roll number, and year of delinquency.', 'reference': True}", "{'text': \"If the information does not match MAX, have the customer contact the County Assessor or Treasurer's office to fix it in MAX through the AZ MVD Now Business portal.\", 'reference': True}", "{'text': \"Accept a Tax Clearance receipt with a different owner's name than the record, as long as the rest of the required information matches.\", 'reference': True}", "{'text': 'Expect MAX to display an Alert when processing a mobile home title service while a County tax due Stop is on the record.', 'reference': True}", "{'text': 'Follow the Clearing Delinquent Taxes in MAX section to remove the stop and proceed.', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-home-bonded-title", "title": "Process a Mobile Home Bonded Title", "cat": "Title & Registration", "intent": ["mobile home bonded title", "surety bond mobile home", "cannot prove ownership", "bond title application mobile home", "form 40-1003", "mobile home inspection appointment", "unpaid lien mobile home"], "page": "Mobile Homes/MH_Bonded_Title.htm", "what": "Explains when a bonded title is required for a mobile home, the surety bond process, and the documentation and steps to process it.", "steps": ["{'text': 'Require bond title procedures when the applicant cannot prove ownership OR the Division is not satisfied there are no unpaid liens.', 'reference': True}", "{'text': 'Require the customer to file a surety bond at the time of final application; the bond protects prior/future owners and lienholders.', 'reference': True}", "{'text': 'Complete a Bond Title Application - Mobile Home (form #40-1003) for the customer to clarify exactly what is required.', 'reference': True}", "{'text': 'For mobile home inspection appointments, have the customer email InspectionProgram@azdot.gov.', 'reference': True}", "{'text': 'Review the Reasons to Complete a Bond Title, When a Bond Title Cannot be Processed, and Documentation Required sections before starting.', 'reference': True}", "{'text': 'Follow Step One: Bond Process & Documentation Required, then work through Breaking Down the Bond Process and Breaking Down the Bond Title Application.', 'reference': True}", "{'text': 'Complete the Processing a Mobile Home Bonded Title steps; reference Policy 8.7.1 Bonded Title.', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-home-motor-vehicle-record", "title": "Process a Mobile Home Motor Vehicle Record (MVR)", "cat": "Title & Registration", "intent": ["mobile home MVR", "motor vehicle record mobile home", "MVR fee per section", "mobile home record request", "MVR permissible uses"], "page": "Mobile Homes/MH_Motor_Vehicle_Record.htm", "what": "Explains that a mobile home MVR is processed like a vehicle MVR, with an MVR fee charged for each section of the mobile home.", "steps": ["{'text': 'Process a mobile home Motor Vehicle Record (MVR) in MAX the same way as a Vehicle MVR.', 'reference': True}", "{'text': 'Charge an MVR fee for each section of the mobile home.', 'reference': True}", "{'text': 'See the Vehicle MVR topic for additional information on the MVR, documentation, and fees required.', 'reference': True}", "{'text': 'Collect the required forms: Motor Vehicle Record Request (form #46-4416) and Consent to Release Motor Vehicle Record - One Time (form #96-0463).', 'reference': True}", "{'text': 'Reference the Motor Vehicle Record Permissible Uses chart and Policy 4.2.2 Motor Vehicle Record (MVR).', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-home-brands", "title": "Understand and Apply Mobile Home Title Brands", "cat": "Title & Registration", "intent": ["mobile home brands", "salvage brand", "restored salvage", "non-repairable", "dismantle brand", "flood damage brand", "crushed status", "brand added in error", "mobile home title brand"], "page": "Mobile Homes/Mobile_Home_Brands.htm", "what": "Explains the title brands that can be applied to a mobile home (salvage, restored salvage, non-repairable, dismantle, flood damage) plus the crushed status and how each is added.", "steps": ["{'text': \"Understand a brand is a descriptive label about the status of a mobile home (e.g., 'salvage', 'restored salvage') that helps the next purchaser know what happened to it; brands display on the title.\", 'reference': True}", "{'text': 'If a brand was added in error, require a Level I Inspection (a mobile home has no confidential VIN).', 'reference': True}", "{'text': 'For a Crushed status (not a brand): no fee, will not apply when a valid lien displays, and the inspection must confirm the mobile home was not crushed.', 'reference': True}", "{'text': 'For a Dismantle brand, require the owner to apply before taking parts; only the section being dismantled receives the brand; submit title of record, lien release if applicable, and Tax Clearance Receipt if applicable.', 'reference': True}", "{'text': \"For Flood Damage, carry forward an out-of-state flood/water brand to the Arizona title's Previous Brands section as 'Flood Damaged'; an AZ-titled owner is not required to apply but may request the brand.\", 'reference': True}", "{'text': 'For Non-Repairable, only the owner or insurer can designate it; surrender the title of record; brand may be reassigned no more than two times; permitted actions afterward are sale of parts via bill of sale, scrapping, or duplicate title by the registered owner.', 'reference': True}", "{'text': \"For Salvage, the owner of a total-loss/un-recovered-theft/non-repairable mobile home applies for a Salvage or Non-repairable brand; submit title of record, lien release if applicable, Tax Clearance Receipt if applicable; use only the total-loss section's VIN.\", 'reference': True}", "{'text': 'For Restored Salvage, require a Level I Inspection and follow the surrender rules for the Salvage branded title of record when going from Salvage to Restored Salvage (same owner or new owner, AZ or out-of-state).', 'reference': True}", "{'text': 'Reference Policies 8.5.1 Title Brands and 8.5.2 Crushed Brand and forms Insurance Settlement Certificate (#96-0567) and T&R Application (Single) (#96-0236).', 'reference': True}"], "tips": ["The Division will not issue a title to a vehicle when an out-of-state non-repairable branded title has been issued."], "reference": true}, {"id": "mobile-home-permits", "title": "Issue Mobile Home Relocation Permits", "cat": "Title & Registration", "intent": ["mobile home permit", "30-day general use permit", "class c mobile home permit", "ADOT ePRO", "relocate mobile home", "oversize mobile home permit", "mobile home move"], "page": "Mobile Homes/Mobile_Home_Permits.htm", "what": "Explains which permits are required to relocate a mobile home, based on its width and length.", "steps": ["{'text': 'Determine the size of the mobile home to identify the correct relocation permit.', 'reference': True}", "{'text': 'Issue a 30-Day General Use Permit for mobile homes that do not exceed eight feet in width or 40 feet in length; see the 30-Day General Use Permit topic for how to issue it.', 'reference': True}", "{'text': \"For mobile homes wider than eight feet and/or longer than 40 feet, use ADOT ePRO through ADOT Maintenance Permits Services to issue an 'Easy' C Mobile Home Permit.\", 'reference': True}", "{'text': 'Visit https://azdot.gov/business/permits/class-c-permits for more information on Class C Permits.', 'reference': True}", "{'text': 'Reference Policies 8.11.1 (Restricted Use 3-Day, 30-Day General Use, 90-Day Resident Registration) and 8.13.2 Mobile Home, plus the Basic Permit Requirements and Fees chart.', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-homes-travel-trailers", "title": "Convert Between Mobile Home and Travel Trailer Records", "cat": "Title & Registration", "intent": ["mobile home to travel trailer", "travel trailer to mobile home", "change MH to TV record", "title and registration service", "title only service", "un-affix before conversion"], "page": "Mobile Homes/Mobile_Homes_&_Travel_Trailers.htm", "what": "Explains how to change a travel trailer record to a mobile home record or vice versa, and which MAX service to use for each direction.", "steps": ["{'text': 'Confirm the mobile home title has not been canceled due to being affixed before changing a mobile home to a travel trailer; if affixed, un-affix it first (see Affixing and Un-Affixing a Mobile Home).', 'reference': True}", "{'text': 'To change a mobile home to a travel trailer, use the Title and Registration service in MAX (see the Travel and Tent Trailers topic).', 'reference': True}", "{'text': 'To change a travel trailer to a mobile home, use the Title Only service in MAX (see the Mobile Home Title Transfers topic).', 'reference': True}", "{'text': 'Reference Policies 8.10.10 Trailer Title and Registration and 8.13.2 Mobile Home.', 'reference': True}"], "tips": [], "reference": true}, {"id": "mobile-home-overview", "title": "Mobile Home Overview and Background", "cat": "Title & Registration", "intent": ["mobile home overview", "mobile home background", "mobile home definition", "domicile address mobile home", "mobile home fees", "mobile home unit backlog", "mobile home as travel trailer"], "page": "Mobile Homes/Mobile_Homes_Overview.htm", "what": "Provides background on mobile homes, including their definition, physical/domicile address, fees, and note about the Mobile Home Unit backlog.", "steps": ["{'text': 'Understand a mobile home (MH) may be a single-family dwelling or used commercially, with or without a permanent foundation, consisting of one or more transportable sections including plumbing, heating, air conditioning, and electrical systems.', 'reference': True}", "{'text': 'Know that when assembled on site a mobile home must be greater than eight feet wide and at least 32 feet (8x32) in length and built on a permanent chassis.', 'reference': True}", "{'text': 'Note a mobile home may be titled as a travel trailer when used for recreational, camping, or travel use; see the Mobile Home Miscellaneous topic or Policy 8.10.10.', 'reference': True}", "{'text': 'Use the Physical Address for Mobile Home (Domicile Address) section to record the address correctly.', 'reference': True}", "{'text': 'Reference the Fees for a Mobile Home section for applicable fees.', 'reference': True}", "{'text': 'Be aware the Mobile Home Unit is working a backlog of titles missing documentation and may contact the CSR about those records.', 'reference': True}"], "tips": [], "reference": true}, {"id": "motor-carrier-account-overview", "title": "Navigate the Motor Carrier Account Overview", "cat": "Motor Carrier", "intent": ["motor carrier account overview", "account details section", "IRP tab", "IFTA tab", "supplements tab", "correspondence tab", "audit tab", "notes tab"], "page": "MotorCarrier/Account Overview.htm", "what": "Overview of the sections and tabs available within a Motor Carrier account.", "steps": ["{'text': \"Review the Account Details Section for the carrier's core account information.\", 'reference': True}", "{'text': 'Use the Account tab and Notes tab to view account details and record notes.', 'reference': True}", "{'text': 'Use the IRP tab and IFTA tab to manage those registration programs.', 'reference': True}", "{'text': 'Use the Supplements tab to view and process supplements.', 'reference': True}", "{'text': 'Use the Correspondence tab to generate and send carrier correspondence.', 'reference': True}", "{'text': 'Use the Audit tab for audit-related information.', 'reference': True}"], "tips": [], "reference": true}, {"id": "add-vehicles-to-irp-fleet", "title": "Add Vehicle(s) to an IRP Fleet", "cat": "Motor Carrier", "intent": ["add vehicle to IRP fleet", "FRP apportioned registration application", "IRP lease agreement", "IFTA decal", "add vehicle from title", "registration only add vehicle", "proof of vehicle ownership IRP", "form 70-0502"], "page": "MotorCarrier/Add Vehicles to IRP Fleet.htm", "what": "Explains the documentation and service paths for adding nt, including IFTA-qualified vehicle criteria and the IRP-before-IFTA rule.", "steps": ["{'text': 'Confirm the customer wants an IFTA account and has submitted proper documentation; if not applying for IFTA but the vehicle is IFTA qualified, require proof of IFTA such as an IFTA Lease Agreement Certificate (form #70-0901).', 'reference': True}", "{'text': 'Identify IFTA-qualifying vehicles: two axles with a registered GVWR of 26,001 lbs. or more; OR three or more axles regardless of weight; OR used in combination when the combination exceeds 26,001 lbs. GVWR.', 'reference': True}", "{'text': 'Collect the IFTA/IRP Application (form #70-0508), an IFTA Bond (form #96-0224 plus POA) or IFTA Cash Bond (form #96-046) if a bond is required, and proof of Established Place of Business.', 'reference': True}", "{'text': \"Collect the $10.00 filing fee (regardless of number of vehicles) and proof of current registration for IFTA qualified vehicles not on the carrier's apportioned IRP fleet.\", 'reference': True}", "{'text': 'If obtaining IRP apportioned registration at the same time, the carrier does not need to provide proof of registration (the cab card will serve as proof).', 'reference': True}", "{'text': 'If opening both IRP and IFTA, open the IRP account first; most information comes from the IFTA/IRP Application, FRP Apportioned Registration Application, or vehicle documentation.', 'reference': True}", "{'text': 'Follow the Create IFTA Account steps, then Add Bond and handle Quarterly Fuel Tax as needed.', 'reference': True}"], "tips": [], "reference": true}, {"id": "create-irp-fleet", "title": "Create an IRP Fleet", "cat": "Motor Carrier", "intent": ["create IRP fleet", "IRP account", "new carrier checklist", "FRP apportioned registration application", "record keeping agreement", "proof of vehicle ownership IRP", "established place of business", "IRP forms"], "page": "MotorCarrier/Create IRP Account.htm", "what": "Explains the forms and ownership proof required to creat  Overview topic > Causes for Disqualification or Automatic Failure section.", "If you are the only witness to the accident, limit your statements to factual information and observation only, and do not voice statements that establish blame.", "For an accident with no injuries and only minor damage, let the vehicle operator decide whether to call local police or exchange insurance information.", "If a vehicle operator calls local police and they do not respond, MVD does not have to take further action such as incident reports.", "If local police are called, try to obtain at least a police report number to include in the MVD Incident Report, form #46-4411, being sent to Risk Management.", "If the report number cannot be obtained, note that Risk Management can contact the police department if they need a copy of the report."], "tips": ["Keep all statements factual and observational; never assign blame."]}, {"id": "accounting-topics-overview", "title": "Locate Accounting Topics", "cat": "Office & Admin", "intent": ["accounting information", "cash management process", "audits", "accounting resources", "office accounting"], "page": "Office_SW/Management/Accounting.htm", "what": "This landing page groups the office Accounting resources: the Cash Management Process, Audits, and Miscellaneous Accounting Information.", "steps": ["Open the Accounting landing page from Office Standard Work > Management.", "Select Cash Management Process for cash handling procedures.", "Select Audits for audit-related guidance.", "Select Miscellaneous Accounting Information for other accounting topics.", "Use the HELPFUL LINKS section to reach the MVD/DMV Public Website or Customer Portal if needed."], "tips": []}, {"id": "contact-information-directory", "title": "Find MVD Contact Information and Directories", "cat": "Office & Admin", "intent": ["phone directory", "contact center info", "facility listing", "public records number", "photo removal email", "org charts", "who to call"], "page": "Off ting transactions", "quality assistance process", "business unit QC role"], "page": "QC_Mgmt/1-QC_Mgmt_Landingpage.htm", "what": "This landing page introduces Quality Check Management, where business units assigned to the Quality Assistance process carry out their role in auditing transactions.", "steps": ["Open the Quality Check Management landing page.", "Understand that this is where business units assigned to the Quality Assistance process carry out their role in auditing transactions.", "Navigate into the appropriate sub-folder (for example, MVD Field Office) for your role's specific procedures."], "tips": []}, {"id": "mvd-error-resolution-queue", "title": "Work the MVD Error Resolution Queue", "cat": "Quality Check", "intent": ["error resolution queue", "error queue", "disputes tab", "QC errors", "dispute an error", "quality check errors", "review QA errors"], "page": "QC_Mgmt/Field/Error_Resolution_Q.htm", "what": "This topic explains the Error Resolution Queue, made up of the Error Queue and the Disputes tab, which MVD offices use to review errors issued by the Quality Assistance (QA) unit.", "steps": ["Open the MVD: Error Resolution Queue from Quality Check Management > Field Offices.", "Use the Error Queue to review errors issued by the Quality Assistance (QA) unit during their Quality Check (QC) process; MVD offices are required to QC their errors.", "Use the Disputes tab for errors the MVD office believes are not valid and for which a formal Dispute was initiated, to review the QA unit's response.", "Understand MVD Offices include regional office field offices, Contact Center, Equipment Services, and Title Production.", "Follow the Reviewing Error Queue section to review and QC each error.", "Follow the Reviewing Dispute Response section to review the QA unit's response to a dispute."], "tips": []}, {"id": "mvd-offices-quality-check-status-flow", "title": "Read the Quality Check Status Flow", "cat": "Quality Check", "intent": ["QC status chart", "status flow", "new QA in progress", "QA complete errors", "MVD review status", "dispute status", "done status", "quality check queue"], "page": "QC_Mgmt/Field/Field_LangingPg.htm", "what": "This page shows the Status flow of transactions being Quality Checked within the Quality Check Queue and the Error Resolution Queue (Disputes tab) between the QA unit and MVD offices.", "steps": ["Understand 'New': the system automatically places this status on randomly selected transactions in the Quality Check Queue, indicating a transaction needs to be quality checked.", "Understand 'QA In Progress': a QA CSR selects a New transaction from the queue, indicating it is being quality checked by the QA unit.", "Understand 'QA Complete - Errors': the QA CSR submitted the Quality Check Form with at least one error, so the transaction displays in the Error Queue for the MVD office to review.", "Understand 'MVD Review': the MVD CSR selected a 'QA Complete - Errors' transaction, indicating the MVD CSR is reviewing the error.", "Understand 'Ready for QA Review': the MVD CSR reviewed the error and wants to dispute it with the QA unit.", "Understand '2nd Review In Process': the QA CSR selected a 'Ready for QA Review' transaction to review the dispute.", "Understand 'Done': the error was voided or deemed valid by the QA unit (no errors found, all errors acknowledged with no disputes, or the dispute was voided or determined valid)."], "tips": []}, {"id": "customer-details-accommodative-data-report", "title": "Find Customer Details in Accommodative Data", "cat": "Reports", "intent": ["legacy TPX data", "customer details report", "accommodative data", "driver data export", "status code references", "find TPX driver data"], "page": "Reports/Customer_Details-Accommodative_Data.htm", "what": "This report holds driver data exported from MVD's legacy system (TPX) so it can still be accessed from the Reports Dashboard after TPX becomes unavailable.", "steps": ["Understand that TPX will be unavailable soon, so its driver data was exported into the Customer Details report available from the Reports Dashboard.", "Follow the Finding a Customer Details Report for a Customer section to locate the report for a specific customer.", "Review the Customer Details Report Overview section to understand the data displayed.", "Use the Status Code References section to interpret status codes in the report."], "tips": []}, {"id": "customer-knowledge-exam-attempt-details-report", "title": "Run the Customer Knowledge Exam Attempt Details Report", "cat": "Reports", "intent": ["knowledge exam attempts", "exam scores report", "investigate exam candidate", "test attempt details", "knowledge test report", "exam answers report"], "page": "Reports/Customer_Knowledge_Exam_Attempt_Details.htm", "what": "This report lets MVD staff review or investigate an individual exam candidate's attempts, scores, and answers, queried directly as needed.", "steps": ["From the Management menu, select Report Dashboard.", "In the Driver - Credential Issuance section, click Customer Knowledge Exam Attempt Details.", "Type the Start Date, End Date, and Customer Number.", "Click View Report.", "Review the results, which show Start Date, End Date, Location, Exam Type, Delivery Source, Results, Questions Answered, Correct, Incorrect, Answered Score, and Answered Questions."], "tips": []}, {"id": "fee-adjustment-report", "title": "Review the Fee Adjustment Report", "cat": "Reports", "intent": ["fees waived report", "fee adjustment", "waived registration fees", "monitor waived fees", "trends in waived fees", "internal fee report"], "page": "Reports/Fee_Adjustment_Report.htm", "what": "This internal-use report displays a detailed history of fees waived in MAX, whether due to customer characteristics or manually waived by the CSR, for monitoring trends.", "steps": ["Open the Fee Adjustment Report, which is for MVD INTERNAL USE ONLY; do not give it to customers.", "Follow the Accessing the Report section to open it, then Saving the Report to Google Drive to store it.", "Review the report monthly looking for trends, and document process errors on the employee scorecard.", "Escalate to your Senior Manager any transaction or trend that appears outside of normal business practices for additional investigation.", "Double-check the key points: waived registration fees, late fees waived in excess of $100, whether one CSR waives more 'normal business reason' fees than others, and whether documentation supports waiving fees.", "In the transaction column, look for transactions without a normal business reason to waive fees, such as MVRs (vehicle or driver), Credential Issuance with other than standard fees, and Compliance payments.", "See the Service History topic in One Source for instructions on how to view the service documentation."], "tips": ["Confirm documentation exists to support any waived fees."]}, {"id": "history-reports-no-fee-mvr", "title": "Generate a No-Fee MVR from History Reports", "cat": "Reports", "intent": ["no fee MVR", "internal MVR", "history reports", "print MVR no charge", "change state of record", "MVR for law enforcement"], "page": "Reports/History_Reports.htm", "what": "History Reports includes the option to print no-fee MVRs for internal MVD use only, plus the Change State of Record option.", "steps": ["Open History Reports from Driver & Event Management > Event Management.", "Understand that MVRs generated using History Reports are for internal MVD use only.", "Follow the Generate No Fee MVR (Internal Use Only) section to produce the internal MVR.", "For situations when an MVR is required for law enforcement or another agency that would normally get them at no cost, use the Vehicle MVR or Driver MVR service and adjust the fees to $0.00.", "Use the Change State of Record (CSOR) section when you need to change the state of record."], "tips": []}, {"id": "mvd-compliance-required-report", "title": "Generate the MVD Compliance Required Report", "cat": "Reports", "intent": ["reinstatement requirements report", "compliance required report", "customer compliance summary", "what customer needs to reinstate", "compliance items report"], "page": "Reports/MVD_Compliance_Required_Report.htm", "what": "This report prints a summary of all open and future compliance items a customer must satisfy, and is given directly to that customer only.", "steps": ["In the Driver Record service, search for the customer who is requesting this information.", "Click Timeline.", "Click View MVD Compliance Required Report.", "Click Create Document.", "When the report generates and displays as a download, click to open and then print it.", "Review the report sections with the customer: Eligible for Immediate Action (what can be handled today), Eligible for Future Action (after any required hard time), and Actions Required at Next Driver Licensing Service (final compliances before reinstatement)."], "tips": ["Only create one report per day; generating more than one adds all copies to the customer's documents.", "Give this report only to the customer named on it; no other party should ever receive this information."]}, {"id": "max-reports-listing", "title": "Search the MAX Reports Listing", "cat": "Reports", "intent": ["list of available reports", "find an existing report", "report request form", "report keywords", "report dashboard menu", "does a report exist"], "page": "Reports/MVM_Reports.htm", "what": "This listing catalogs existing MAX reports with keywords, descriptions, menu location, report type, and export type, so you can check for an existing report before requesting a new one.", "steps": ["Before requesting a new report, check the MAX Reports Listing to see if an existing report provides the information you need.", "Scan the listing by Report Name and Keywords to find a matching report (for example, Insurance Companies' Last Reported Activity, Account Balance Activity, Active Issued Driver Credentials, or AZ MVD Now Account Usage).", "Use the Report Description column to confirm the report contains the data and filters you need.", "Note the Report Menu Item column for where to find the report (for example, Report Dashboard > Misc, Revenue Accounting, Driver, or TnR).", "Note the Report Type (such as MAX-PBI, MAX-Call, or SSRS) and Export Type (such as PDF or Excel/CSV).", "If the report you need doesn't exist, or you need a change to an existing report, complete a Report Request Form following the directions on the Instruction tab."], "tips": []}, {"id": "tnr-transactions-no-scanned-documents-report", "title": "Run TnR Transactions with No Scanned Documents Reports", "cat": "Reports", "intent": ["missing scanned documents", "TnR no scanned documents", "transactions without scans", "historical no scan report", "find unscanned transactions"], "page": "Reports/TnR_Transactions_with_No_Scanned_Documents.htm", "what": "Under TNR on the Report Dashboard, two reports identify TnR transactions with no scanned documents: a recent report covering the last 90 days and a historical report covering 3 months back and older.", "steps": ["Open the Report Dashboard and go to the TNR section.", "Choose TnR Transactions with No Scanned Documents for data covering only the last 90 days.", "Choose TnR Transactions with No Scanned Documents (Hist.) for data from 3 months back and older.", "Follow the Accessing TnR Transactions with No Scanned Documents section for the 90-day report steps.", "Follow the Accessing TnR Transactions with No Scanned Documents (Hist.) section for the historical report steps."], "tips": []}, {"id": "vehicle-history-detail-report", "title": "Run the Vehicle History Detail Report", "cat": "Reports", "intent": ["vehicle title history", "vehicle history detail", "services completed on vehicle", "internal vehicle history", "title history report"], "page": "Reports/Vehicle_History_Detail_Report.htm", "what": "This internal-use report displays a detailed history of the title for a specific vehicle, containing services completed in MAX or within Arizona.", "steps": ["Open the Vehicle History Detail Report, which is for MVD INTERNAL USE ONLY; do not give it to customers.", "Follow the Accessing the Report section to open it.", "Review the Report Overview section to understand the title history and services shown.", "Understand this report does NOT include the complete title history for vehicles across all states.", "For complete cross-state title history, see AAMVA Helpdesk - Vehicle for more information."], "tips": []}, {"id": "vehicle-snapshot-accommodative-data", "title": "Use Vehicle Snapshot Accommodative Data", "cat": "Reports", "intent": ["legacy vehicle data", "vehicle snapshot", "accommodative data resources", "mobile home snapshot", "plate credit", "TPX vehicle data", "April 2020 snapshot"], "page": "Reports/Vehicle_Snapshot.htm", "what": "Legacy TPX vehicle data was uploaded into Accommodative Data services in MAX for reference, including four resources; Vehicle Snapshot is one of them.", "steps": ["Open the Accommodative Data services in MAX for reference of legacy TPX data.", "Choose from the four data resources: Mobile Home Snapshot, Plate Credit, Vehicle Snapshot, and Customer Details.", "For customer information, see Customer Details - Accommodative Data for more specific details on that resource.", "Select Vehicle Snapshot to view the vehicle data snapshot.", "Use the Status Code References section to interpret status codes.", "Remember that all data is a snapshot of the customer or vehicle as of April 20, 2020, when MAX went live."], "tips": ["Each historical data resource works similarly."]}, {"id": "common-issues-in-max", "title": "Look Up Common Issues in MAX", "cat": "Office & Admin", "intent": ["common error messages", "MAX froze", "MAX unexpected behavior", "troubleshooting MAX", "known issues", "MAX problems"], "page": "Support/MAX/Common_Issues_In_MAX.htm", "what": "This page provides details about common error messages and other issues in MAX, and points to the daily-updated Known Issues topic for the complete listing.", "steps": ["Open the Common Issues In MAX page from Cross Functional.", "Review the Common Errors Messages or Issues section for details on frequently seen problems.", "If MAX just froze or is doing unexpected things, follow that section's guidance.", "For a complete listing of Known Issues in MAX, updated daily, review the Known Issues topic."], "tips": []}, {"id": "max-known-issues-workarounds", "title": "Apply MAX Known Issues Workarounds", "cat": "Office & Admin", "intent": ["MAX known issues", "temporary workaround", "credential requirements bug", "vision exam save issue", "OHV VLT not adding", "customer account required error", "PDPS not satisfying"], "page": "Support/MAX/MAX Known Issues.htm", "what": "This reference lists known MAX issues and errors with descriptions and the temporary workaround a CSR should apply for each.", "steps": ["Look up the issue by Keyword(s), Issue/Error, and Description in the Known Issues table.", "For the Vision Exam Report requiring all Visual Fields, enter 0 in each empty field to activate the Save button.", "For a limited term (Foreign) credential adding a Vision Requirement in error, waive the vision requirement and add the Limited Term fee for $10 on the taxes and fees screen.", "For the 'Customer Account is required' error at checkout, review Customer Account Requirements and confirm the agent meets all 4 requirements (3 for Organizations) as a Level 3 customer.", "For OHV not adding the $3.00 VLT, complete the OHV Decal Application if applicable, then on the Taxes and Fees screen select Add Fee and add the reduced VLT of $3.00.", "For PDPS not satisfying when the customer is verified and Status shows Eligible, waive the PDPS requirement with Reason: Document and comment 'PDPS ELG: MAX not receiving results'.", "Follow the specific 'What You Should Do' guidance for any other listed issue rather than improvising."], "tips": ["When a name change isn't prompting for documentation on customers over 18, continue to upload the Name Change documentation anyway.", "For an out-of-country to US address update, enter United States as the country FIRST, then update the state and county fields."]}, {"id": "add-insurance-overview", "title": "Add Insurance to a Vehicle or Customer", "cat": "Insurance & Permits", "intent": ["add insurance", "manual insurance entry", "AZIVS", "collectible insurance", "military vehicle insurance", "SR22 to customer", "verify electronic insurance", "insurance associated to vehicle"], "page": "T_&_R/Mandatory_Insurance/Add_Insurance.htm", "what": "This topic explains how insurance is confirmed through AZIVS and when and how a CSR may manually add certain insurance policies to a vehicle or customer in MAX.", "steps": ["Understand that insurance companies electronically submit coverage to the Arizona Insurance Verification System (AZIVS) at arizonaivs.com, and MAX interfaces to confirm coverage.", "Determine where the insurance is associated: to a vehicle (Vehicle Information page) or to a customer (Customer Record), and view or add it in that respective area.", "Remember MAX will only allow a CSR to add military, collectible, and commercial insurance manually.", "When adding insurance manually, do NOT enter an expiration date or an error will populate (this does not apply to Military Vehicle Insurance).", "Use Add Insurance to Vehicle, Adding a SR22 Insurance to Customer, or Add Military Vehicle Insurance for the specific procedure.", "Use Search Insurance - Vehicle or Search Insurance - Customer to verify insurance that was submitted electronically.", "Know that insurance can also be added within Registration Only, Title & Reg, Update Registration, and Renew Registration services."], "tips": ["If manually added insurance is not confirmed with AZIVS within 30 days, an incident is created and the customer is notified; failure to provide proof can lead to a withdrawal and suspended registration.", "For vehicles with a 'Financial responsibility - no insurance' withdrawal, the insurance company MUST submit the insurance electronically."]}, {"id": "commercial-vehicle-insurance-requirements", "title": "Apply Commercial Vehicle Insurance Requirements", "cat": "Insurance & Permits", "intent": ["commercial vehicle insurance", "financial responsibility", "GVWR over 20000", "hazardous materials carrier", "bus for hire", "taxi livery limousine", "motor carrier insurance"], "page": "T_&_R/Mandatory_Insurance/Commercial_Vehicle_Insurance_ Requirements.htm", "what": "This topic outlines when a commercial motor vehicle must comply with Arizona's financial responsibility requirements and how voluntarily submitted proof of insurance is handled.", "steps": ["Determine whether the motor vehicle is used in a commercial enterprise and meets any of the criteria requiring financial responsibility compliance.", "Check if the vehicle has a declared gross vehicle weight rating (GVWR) of more than 20,000 lbs.", "Check if the vehicle transports hazardous materials, hazardous substances, or hazardous wastes.", "Check if it operates as a bus to transport passengers for hire (other than a car pool operator).", "Check if it is listed on the Division's records as a taxi, livery vehicle, or limousine used to transport passengers for hire.", "If the motor carrier voluntarily submits proof of current insurance, add the pertinent insurance information to the Vehicle Information Page (proof is not required at time of registration).", "Direct questions about motor carrier or commercial vehicle insurance or data entry to the Mandatory Insurance Unit by opening a Service Portal ticket."], "tips": ["The blue Self-Certification Affidavits are no longer acceptable as proof of insurance.", "Relevant forms: #26-0501 Certificate of Self-Insurance Application and #46-0602 De-Insured Certificate (also available on AZ MVD Now)."]}, {"id": "mandatory-insurance-actions", "title": "Handle Mandatory Insurance Actions and Withdrawals", "cat": "Insurance & Permits", "intent": ["mandatory insurance withdrawal", "MI withdrawal", "financial responsibility no insurance", "suspend registration insurance", "reinstate registration insurance", "insurance cancellation", "vehicle sold with MI withdrawal"], "page": "T_&_R/Mandatory_Insurance/Mandatory_Insurance_Actions.htm", "what": "This topic covers how insurer notifications become Mandatory Insurance actions leading to an MI Withdrawal, and how registration is suspended, reinstated, and handled in sales and accident cases.", "steps": ["Understand that when an insurer notifies the Division of a cancelled, non-renewed, or unrenewed liability policy, it becomes a Mandatory Insurance action that can lead to an MI Withdrawal shown as 'Financial responsibility - no insurance' on the Vehicle Information Page.", "Know that proof of insurance must be submitted electronically by the insurance company before the registration is eligible to be reinstated.", "Recognize an MI Withdrawal must be cleared before performing duplicate registration, registration renewal, lost plate or tab, or use of registration credit on the vehicle.", "Follow Cancellation, Non-Renewal or Failure to Renew an Insurance Policy, then Suspending the Registration and License Plates.", "Follow Reinstating the Registration and License Plates once the insurance company submits proof electronically.", "Use the Vehicle is Sold with MI Withdrawal section, noting a valid MI Withdrawal does not prevent selling the vehicle or the transferee registering it.", "Refer to the Accident Cases section for accident-related handling."], "tips": ["A 3-Day Restricted Use Permit may be issued when there is an MI Withdrawal.", "Relevant forms include Mandatory Insurance Suspension Clearance #96-0229 and Insurance Information Request #40-5901."]}, {"id": "mandatory-insurance-faqs", "title": "Answer Mandatory Insurance FAQs", "cat": "Insurance & Permits", "intent": ["mandatory insurance questions", "insurance scenarios", "no insurance scenarios", "customer insurance inquiries", "insurance FAQ"], "page": "T_&_R/Mandatory_Insurance/Mandatory_Insurance_FAQs.htm", "what": "This page organizes frequently asked mandatory insurance questions into scenario groups to help answer customer inquiries.", "steps": ["Open the Mandatory Insurance FAQs page.", "Use the Different Types of Insurance Scenarios section for questions about various insurance types.", "Use the No Insurance Scenarios section for situations where the customer has no insurance.", "Use the Other Customer Inquiries section for remaining mandatory insurance questions."], "tips": []}, {"id": "search-insurance-company", "title": "Search for an Insurance Company", "cat": "Insurance & Permits", "intent": ["look up insurance company", "ADOT code", "NAIC code", "find insurer by name", "insurance company code lookup"], "page": "T_&_R/Mandatory_Insurance/Search_Insurance_Company.htm", "what": "The Search Insurance Company service in MAX lets you look up an insurance company's ADOT Code or NAIC Code, or find a company's name from one of those codes.", "steps": ["Open the Search Insurance Company service in MAX.", "Use the service to look up an insurance company's ADOT Code or NAIC Code.", "Alternatively, enter an ADOT Code or NAIC Code you have to look up the insurance company's name.", "Follow the Search by Name section to search by the company's name."], "tips": []}, {"id": "self-insurance-certificate", "title": "Process a Self-Insurance or Partial Self-Insurance Application", "cat": "Insurance & Permits", "intent": ["self insurance", "partial self insurance", "certificate of self-insurance", "ten or more vehicles", "motor carrier self insurance", "form 26-0501"], "page": "T_&_R/Mandatory_Insurance/Self_Insurance.htm", "what": "This topic covers eligibility and required submissions for a Certificate of Self-Insurance or Partial Self-Insurance for owners with ten or more registered vehicles or qualifying motor carriers.", "steps": ["Confirm eligibility: the owner has at least ten motor vehicles registered in their name, or is a motor carrier required to comply with Arizona financial responsibility requirements.", "Collect the Certificate of Self-Insurance Application, form #26-0501.", "Obtain evidence that the owner or motor carrier is financially able, and will continue to be able, to pay the entire amount allowed by the Division for judgments arising from ownership, maintenance, or use of a motor vehicle.", "Obtain evidence of a valid insurance policy issued by a captive insurer domiciled and authorized by the Department of Insurance and Financial Institutions to transact business in this state, providing minimum coverage.", "Collect any other information required by the Division.", "See the Add Insurance topic > Search Insurance - Customer section for how to add self-insurance.", "Direct questions about Self-Insurance or data entry to the Mandatory Insurance Unit by opening a Service Portal ticket."], "tips": []}, {"id": "sr22-proof-of-financial-responsibility", "title": "Handle SR22 Proof of Future Financial Responsibility", "cat": "Insurance & Permits", "intent": ["SR22 insurance", "proof of future financial responsibility", "how long SR22 required", "DUI SR22", "financial responsibility withdrawal", "judgment SR22", "add SR22 to MAX", "failure to maintain SR22"], "page": "T_&_R/Mandatory_Insurance/SR22.htm", "what": "This topic explains SR22 insurance as proof of future financial responsibility, when it is required, how long it must be carried, and how to add and verify it in MAX.", "steps": ["Understand an SR22 is required proof of future financial responsibility after a qualifying traffic conviction or failure to maintain liability coverage.", "Identify who needs an SR22: a person cited for driving without insurance, a driver guilty of DUI, a driver who refused testing, or a person who defaults or cancels the initial SR22 requirement.", "Determine the required duration: DUI (including Implied Consent) requires 3 years from the Withdrawal End Date; a Financial Responsibility Withdrawal requires 3 years from the Withdrawal Start Date; Judgments require the term of the judgment plus a full 2 years after satisfaction.", "Use Determining if a SR22 is Required and Determining if SR22 Requirement is Satisfied to assess the customer's status.", "Follow Adding an SR22 into MAX to record the policy (an SR22 is associated to the customer, added in the Customer Record).", "Use the Verifying How Long a SR22 Is Required sections for DUI, FR Withdrawal, or Judgment as applicable.", "Apply the Financial Responsibility SR22 Waiver or Out-of-State SR22 Waiver sections when a waiver applies."], "tips": ["Once submitted, the SR22 becomes a requirement; failure to maintain it results in a 'Failure to maintain SR22' Withdrawal of the driving privilege.", "The Central Issuance Mailing Dashboard > Processing Dates tab shows the current date a mailed SR22 is being worked."]}, {"id": "irp-apportioned-registration", "title": "IRP Apportioned Registration and Title Scenarios", "cat": "Motor Carrier", "intent": ["apportioned registration", "IRP", "International Registration Plan", "interstate commercial vehicle", "cab card", "fleet miles", "motor carrier unit", "title with apportioned reg"], "page": "T_&_R/Motor_Carrier/Apportioned_Registration.htm", "what": "Apportioned registration lets commercial vehicles operate interstate across two or more IRP member jurisdictions, with fees collected based on the percentage of fleet miles in each jurisdiction. Refer applicants for the registration itself to the Motor Carrier Unit.", "steps": ["{'text': 'Understand that under the IRP agreement the Division collects registration fees based on the percentage of fleet miles operated in the member jurisdictions the applicant requests, and transmits those fees to those jurisdictions.', 'reference': True}", "{'text': 'Know that the Division issues a license plate and registration card (cab card) per vehicle covering fees based on total mileage across all apportioned jurisdictions.'}", "{'text': 'For the apportioned registration itself, refer the applicant to the Motor Carrier Unit at mvdmcs@azdot.gov or 602-712-6775.'}", "{'text': 'For the title/registration work you process in MAX, apply the same documentation rules as a regular non-apportioned title and/or registration service.'}", "{'text': 'Scenario 1: customer has an IRP apportioned registration in another state but needs the vehicle titled in Arizona.', 'reference': True}", "{'text': \"Scenario 2: customer has an Arizona apportioned registration (ARO) and wants to transfer the vehicle's title to Arizona from another state.\", 'reference': True}", "{'text': 'Scenario 3: customer currently has an Arizona IRP Apportioned Registration Only (ARO) but wants to move the title to Arizona.', 'reference': True}", "{'text': 'Scenario 4: customer has an apportioned registration but wants to convert it to a regular registration and get unused fees refunded.', 'reference': True}"], "tips": ["The rules regarding documentation for each scenario are the same as a regular non-apportioned title and/or registration service."]}, {"id": "interstate-registration-non-resident", "title": "Interstate Registration (Non-Resident)", "cat": "Motor Carrier", "intent": ["non-resident interstate registration", "interstate border permit", "commercial motor vehicle", "declared gross weight", "not IRP", "foreign motor vehicle", "ARS 28-2321", "motor carrier program"], "page": "T_&_R/Motor_Carrier/Interstate_Registration_(Non-Resident).htm", "what": "A Nonresident Interstate Registration is available to owners of commercially operated motor vehicles registered in another jurisdiction who conduct interstate operations and do not qualify or do not wish to register under IRP. Refer applicants to the Motor Carrier Program.", "steps": ["{'text': 'Confirm the vehicle is a foreign motor vehicle owned by a nonresident that is operated in Arizona for transportation of passengers or property for compensation.'}", "{'text': 'Confirm the operation is to conduct business, to be registered and licensed in Arizona in accordance with ARS 28-2321.A.'}", "{'text': \"Know the Division collects registration fees based on the vehicle's declared gross weight.\"}", "{'text': 'Know the Division issues an Interstate Border Permit and registration.'}", "{'text': 'Note that vehicles owned by a nonresident that would be exempt from weight fees under ARS 28-5432 if owned by an Arizona resident are exempt from these registration requirements.', 'reference': True}", "{'text': 'Refer the applicant to the Motor Carrier Program at IRegistration@azdot.gov or 602-712-6775.'}"], "tips": []}, {"id": "3-day-restricted-use-permit", "title": "3-Day Restricted Use Permit", "cat": "Insurance & Permits", "intent": ["3-day permit", "restricted use permit", "unregistered vehicle", "emissions testing", "vehicle inspection", "move vehicle legally", "duplicate 3-day permit", "NSF withdrawal"], "page": "T_&_R/Permits/3-Day_ Restricted_Use_Permit.htm", "what": "A 3-Day Restricted Use Permit lets a person legally operate an unregistered vehicle from its present location to a specified destination for limited purposes only. It will not be issued if an NSF Withdrawal is on the Vehicle Information page.", "steps": ["{'text': 'Confirm the purpose qualifies: emissions testing, vehicle inspection, application for title or registration, or vehicle repair to comply with emissions or inspection.'}", "{'text': 'Check the Vehicle Information page and do not issue the permit if an NSF Withdrawal is present.'}", "{'text': 'Review the More Information and Basic Permit Requirements and Fees chart for requirements before issuing.', 'reference': True}", "{'text': 'Issue the 3-Day Restricted Use Permit in MAX following the Issue Permit steps.', 'reference': True}", "{'text': 'For a lost, stolen, or mutilated permit, process a Duplicate 3-Day Restricted Use Permit with the Division for $4.00, or advise the customer they may reprint at home through AZ MVD Now or an in-office kiosk for no fee.'}", "{'text': 'See the Duplicate Permit topic for more information on duplicate handling.', 'reference': True}"], "tips": ["Vehicle permits will not be issued if an NSF Withdrawal is on the Vehicle Information page.", "See policies 8.11.1 and 8.11.3 for permit rules."]}, {"id": "30-day-general-use-permit", "title": "30-Day General Use Permit", "cat": "Insurance & Permits", "intent": ["30-day general use permit", "unregistered vehicle", "no movement restrictions", "once per 12 months", "proof of ownership", "level I inspection", "permit conversion to T&R", "$15 permit"], "page": "T_&_R/Permits/30-Day_General_Use_Permit.htm", "what": "The 30-Day General Use Permit lets an unregistered vehicle operate for 30 days with no movement or residency restrictions and can be issued only once in a 12-month period for $15.00. Proof of ownership is required.", "steps": ["{'text': 'Confirm the owner is requesting the permit and that no prohibition is present on the vehicle record; the permit can be issued only once per 12-month period.'}", "{'text': 'Verify the vehicle is not a Commercial IRP Apportioned vehicle, which is not eligible for a 30-Day General Use Permit.'}", "{'text': 'Collect proof of ownership: Certificate of Title, vehicle registration, bill of sale, dealer invoice, copy of security agreement, or authorized possession of the vehicle.'}", "{'text': \"If no ownership document can be provided, arrange a Level I Inspection and obtain a supervisor's approval before issuing; the customer may need a bonded title (see Bonded Title topic).\", 'reference': True}", "{'text': 'Issue the permit in MAX (or note the customer may purchase through AZ MVD Now) for $15.00.', 'reference': True}", "{'text': 'Be aware MAX will display an alert that permit data will convert to a title and registration record when the customer later completes a Title and Registration service.'}", "{'text': 'For a lost, stolen, or mutilated permit, process a Duplicate 30-Day Permit for $4.00, or advise reprint at home via AZ MVD Now or an in-office kiosk for no fee.'}"], "tips": ["Can be issued only once in a 12-month period.", "IRP apportioned vehicles are not eligible; motor carriers may use temporary proportional registrations instead.", "See policies 8.11.1 and 8.11.3."]}, {"id": "30-day-non-resident-ohv-permit", "title": "30-Day Non-Resident OHV Permit", "cat": "Insurance & Permits", "intent": ["non-resident OHV permit", "off-highway vehicle", "Game and Fish decal", "30 day OHV", "all terrain vehicle", "golf cart", "affidavit", "qualifying OHV"], "page": "T_&_R/Permits/30-Day_Non-Res_OHV.htm", "what": "The Nonresident OHV 30-day permit is issued only to nonresidents with a qualifying OHV for $15.00, valid 30 calendar days, and requires a Game & Fish Non-Resident OHV decal. Arizona residents are not eligible.", "steps": ["{'text': 'Confirm the customer is a nonresident of Arizona; Arizona residents are not eligible for this permit.'}", "{'text': 'Verify the customer has a Non-Resident OHV decal issued from the Game & Fish (G&F) Department prior to applying.'}", "{'text': \"Confirm the vehicle is listed in MAX with a Vehicle Type of 'All Terrain Vehicle' or 'Golf Cart' and meets the qualifying OHV criteria (recreational non-highway use, 80 in. or less wide, unladen weight 2,500 lbs. or less, four or more non-highway tires, steering wheel, rollover protective structure, occupant retention system).\"}", "{'text': 'Collect the $15.00 fee; the permit is valid 30 calendar days with no limit on number per 12 months, but a new one can only be issued after the current permit expires.'}", "{'text': 'Issue the permit in MAX using the appropriate procedure for a Field Office or the Contact Center.', 'reference': True}", "{'text': 'Print the Affidavit for 30 Day Non-Resident OHV Permit (generated after issuance) and have the customer sign to certify the OHV is titled in another state, has a G&F non-resident decal, and meets the qualified OHV definition.'}"], "tips": ["Permit may be purchased in field or ATP offices, or through the Contact Center.", "The permit allows operation on maintained roads including maintained forest roads; off-road operation requires a Non-Resident OHV decal."]}, {"id": "90-day-non-resident-drive-out-permit", "title": "90-Day Non-Resident (Drive-Out) Permit", "cat": "Insurance & Permits", "intent": ["90-day drive-out permit", "non-resident permit", "drive vehicle to home state", "proof of non-residency", "affidavit", "dealer sale", "tribal member reservation", "$15 permit"], "page": "T_&_R/Permits/90-Day_Non-Resident_Permit.htm", "what": "The 90-Day (Drive-Out) Permit lets a non-resident drive their vehicle back to their home state, valid 90 days from issuance or upon foreign state registration, whichever comes first, for $15.00. Proof of non-residency is required.", "steps": ["{'text': 'Confirm eligibility: a non-resident who purchased a vehicle in Arizona and will register it in their home state, or an enrolled Indian tribe member residing on a reservation who will use the vehicle exclusively on the reservation and not register it in Arizona.'}", "{'text': \"Collect proof of ownership: vehicle title, vehicle registration, bill of sale, dealer invoice, or Manufacturer's Certificate of Origin (MCO).\"}", "{'text': 'Collect proof of non-residency: an out-of-state driver license, or (for a tribal member) reservation physical address plus tribal enrollment, census number, or identification number.'}", "{'text': 'Collect the $15.00 fee and issue the permit in MAX (the Division may issue on behalf of a licensed dealer for a dealer sale).', 'reference': True}", "{'text': 'When the permit prints, an Affidavit for Arizona 90-Day Nonresident Permit prints at the same time; give the permit to the customer, have them sign the affidavit, and file it with your data processing paperwork (DPs).'}", "{'text': 'Advise that if the vehicle is registered in Arizona within 365 days of issuance, the customer is liable for any ADOR tax, penalty, and interest (ADOR collects).'}", "{'text': 'Do not issue this permit to a vehicle delivered in Arizona to an Arizona resident by an out-of-state dealer, or for a dealer-to-dealer or auction-to-dealer purchase.'}"], "tips": ["If the customer cannot leave within 90 days, a 30-Day General Use Permit may be issued; if both expire and the vehicle remains in Arizona, the owner must register it.", "Licensed dealers can issue this permit electronically through an ATP provider.", "See policies 8.11.2 and 8.11.3."]}, {"id": "90-day-resident-registration", "title": "Issue a 90-Day Resident Registration", "cat": "Insurance & Permits", "intent": ["90-day resident registration", "unregistered vehicle", "arizona resident permit", "issue permit", "temporary registration", "no movement restrictions", "$15 permit", "permit conversion to T&R"], "page": "T_&_R/Permits/90-Day_Resident_Permit.htm", "what": "The 90-Day Resident Registration lets Arizona residents operate an unregistered vehicle on the roadway for 90 calendar days while resolving issues preventing title or registration, for $15.00. It is valid in and out of state with no movement restrictions.", "steps": ["{'text': 'From the Services menu, select Issue Permit.'}", "{'text': 'Search for the Customer and Vehicle related to this service.'}", "{'text': 'Once the Customer and Vehicle are located and selected, click Add. If the vehicle is not in the system, add it first before completing the service.'}", "{'text': 'Click 90 Day Resident (hover over the Customer and Vehicle tabs to confirm the correct information).'}", "{'text': 'Click Confirm.'}", "{'text': 'In Service Summary, review information for accuracy and click Continue to calculate taxes and fees.'}", "{'text': 'On the Taxes and Fees screen, review for accuracy and click Pay Now if the customer is ready, or click Add to Cart to collect payment after completing other services.'}", "{'text': 'Enter the payment amount, then in Checkout process the payment and click Complete Checkout.'}", "{'text': 'Download and print the service document(s) and provide them to the customer; click the printer icon and click Print in the dialogue box.'}"], "tips": ["May be purchased with the Division or by an authorized financial institution for $15.00.", "MAX displays an alert when permit data will convert to a title and registration record.", "Documents can later be retrieved from the customer record's Documents or by the customer in AZ MVD Now."]}, {"id": "cancel-permit", "title": "Cancel a Permit Issued in Error", "cat": "Insurance & Permits", "intent": ["cancel permit", "permit issued in error", "wrong permit type", "3-day 30-day 90-day", "not for TRP", "cancel permit service"], "page": "T_&_R/Permits/Cancel_Permit.htm", "what": "When a permit was issued in error (e.g., a 3-Day was issued when the customer needs a 30-Day), use the Cancel Permit service. This is not used to cancel a Temporary Registration Plate/Permit (TRP).", "steps": ["{'text': 'Confirm the permit type can be canceled with this service: 3-Day Restricted Use Permit, 30-Day General Use Permit, 90-Day Resident Registration, or 90-Day Non-Resident (Drive-Out) Permit.'}", "{'text': 'Do NOT use the Cancel Permit service to cancel a TRP; dealers cancel a TRP in the Dealer Suite of Service Arizona.'}", "{'text': 'If a TRP must be canceled by MVD in a rare instance, have an upline approver submit a Service Portal ticket including the customer #, VIN, and TRP #, requesting a Cancel TRP service.'}", "{'text': 'Note that when a supervisor approves additional permits beyond statute, it is handled as an override during issuance, not with the Cancel Permit service.'}", "{'text': 'Start the Cancel Permit service from the Menu and continue with the service to cancel the permit.', 'reference': True}"], "tips": ["See policies 8.11.1, 8.11.2, and 8.11.3."]}, {"id": "duplicate-permit", "title": "Issue a Duplicate Permit", "cat": "Insurance & Permits", "intent": ["duplicate permit", "lost stolen mutilated permit", "miscellaneous purchase fee", "reprint permit", "AZ MVD Now kiosk", "same expiration date"], "page": "T_&_R/Permits/Duplicate_Permit.htm", "what": "A customer can request a duplicate permit that was lost, stolen, or mutilated with the Division for $4.00 (collected via the Miscellaneous Purchase service). The duplicate keeps the same expiration date.", "steps": ["{'text': \"Confirm the customer's permit was lost, stolen, or mutilated and obtain their identification.\"}", "{'text': 'Advise the customer they may instead reprint at home through AZ MVD Now or use an in-office kiosk to print a duplicate for no fee.'}", "{'text': 'If issuing through the Division, use the Miscellaneous Purchase service to collect the $4.00 fee.'}", "{'text': 'Issue the duplicate permit in MAX; it will keep the same expiration date.', 'reference': True}", "{'text': 'Note you can view issued permits on the Vehicle Information page, but the permit Documents are only available from the Customer Record.'}"], "tips": ["Identification must be provided.", "All documents and service artifacts are available from the Customer Record.", "See policies 8.11.1, 8.11.2, and 8.11.3."]}, {"id": "homemade-vehicle-permit", "title": "Issue a Homemade Vehicle Permit", "cat": "Insurance & Permits", "intent": ["homemade vehicle permit", "homemade trailer", "no proper VIN", "homemade permit process", "MAX permit"], "page": "T_&_R/Permits/Homemade_Vehicle_Permit.htm", "what": "When a vehicle or trailer is homemade and there is no proper VIN associated with it, a Homemade Vehicle Permit may be issued.", "steps": ["{'text': 'Confirm the vehicle or trailer is homemade and has no proper VIN associated with it.'}", "{'text': 'Follow the process to issue a Homemade Vehicle Permit in MAX.', 'reference': True}", "{'text': 'Reference the Homemade Permit Example for how the issued permit should appear.', 'reference': True}", "{'text': 'Consult the Basic Permit Requirements and Fees chart for applicable requirements and fees.', 'reference': True}"], "tips": []}, {"id": "oversize-overweight-permits", "title": "Oversize and Overweight (Class A) Permits", "cat": "Insurance & Permits", "intent": ["oversize permit", "overweight permit", "class A permit", "non-reducible load", "single trip or 30 day", "state routes", "size and weight limits", "permit fees"], "page": "T_&_R/Permits/Oversize_&_Overweight_Permits.htm", "what": "Class A oversize or overweight permits are issued for vehicle and load combinations within specific size and weight limits, for a single trip or 30 days, and only for travel on state routes. The load must be non-reducible.", "steps": ["{'text': 'Confirm the load is non-reducible and has a specifically described load.'}", "{'text': 'Verify the combination meets the size limits: width and/or load 14 feet or fewer, height and/or load 16 feet or fewer, length and/or load 120 feet or fewer.'}", "{'text': 'Verify the combined weight of the vehicle and/or vehicle combination is 250,000 lbs. or fewer, and that the vehicle is currently registered for 80,000 lbs.'}", "{'text': 'Determine the fee: Oversize single-trip $15, Oversize 30-day $30, Oversize or overweight single-trip $75, Oversize or overweight 30-day $75.'}", "{'text': 'Do not use this permit to routinely transport legal loads on over-width trailers; Class A permits are issued only for travel on state routes.'}", "{'text': 'Visit the Oversize/Overweight Permits resource for more information on these permit types, including how and where to purchase.', 'reference': True}"], "tips": ["The Class A permit is issued for a single trip or 30 days."]}, {"id": "temporary-registration-plate-trp", "title": "Temporary Registration Plate (TRP)", "cat": "Title & Registration", "intent": ["temporary registration plate", "TRP", "45-day paper plate", "dealer issued plate", "convert TRP to title and registration", "registration credit", "expired TRP", "plate credit"], "page": "T_&_R/Permits/Temporary_Registration_Plate_(TRP).htm", "what": "A 45-Day Temporary Registration Plate (TRP) is a paper plate issued by an Arizona licensed dealer so a purchased vehicle can be driven legally while paperwork is processed. Only one TRP is issued per vehicle, and it converts to a title and registration record when proper paperwork is submitted.", "steps": ["{'text': 'Understand the dealership issues one TRP per vehicle and has 30 days to submit the transaction before a late title transfer penalty fee is assessed.'}", "{'text': 'Locate the TRP in the Permits section on the Vehicle Information page, which shows who it was issued to (no FLP or issuing dealership displays).'}", "{'text': 'Note that a TRP or Sales Contract/Invoice is NOT acceptable to issue an ARO/SPI; with a valid TRP in place a customer cannot obtain an ARO until the vehicle is fully registered in the TRP-issuing state.'}", "{'text': 'When completing the Title and Registration service, watch for the MAX message/alert that the permit will be converted into a T&R record; full-period fees are assessed based on the TRP issue date.'}", "{'text': 'If the TRP was voided or expired before the T&R transaction completes, the dealership may issue an online 30-Day General Use Permit.'}", "{'text': 'To confirm registration credit from another plate, view the Permit section under TRP Credit Description, or search the customer record, click the Suitcase icon, find the Credit Account named for the plate number, and click View for Account Details.'}", "{'text': 'When the T&R service completes, the credit amount is sent to the dealer that created the TRP; any additional funds are credited back to the customer account for a possible disbursement request.'}"], "tips": ["The dealership may only issue one TRP per vehicle.", "See policies 8.11.1, 8.11.2, and 8.11.3.", "See the Lost TRP topic for a lost plate."]}, {"id": "cancel-disability-placard", "title": "Cancel a Disability Placard (Permanent or Temporary)", "cat": "Title & Registration", "intent": ["cancel disability placard", "placard issued in error", "destroy placard", "no fee service", "cancel temporary placard", "cancel permanent placard", "deceased customer"], "page": "T_&_R/Placards/Cancel_Disability_Placard_(Permanent_or_Temporary).htm", "what": "When a placard was issued in error (e.g., a Temporary was issued when it should have been Permanent), use the Cancel Disability Placard service. The steps work for either placard type. This is a no-fee service.", "steps": ["{'text': 'From the Services menu, select Cancel Temporary Placard or Cancel Permanent Placard depending on the type to cancel.'}", "{'text': 'Search for the Customer related to this service.'}", "{'text': 'Identify the placard to cancel under Placard Results and click the Select icon.'}", "{'text': 'Click Add.'}", "{'text': 'Click Continue.'}", "{'text': 'This is a no-fee service; click Pay Now to finalize, or click Add to Cart if completing additional services.'}", "{'text': 'The service is final; a Payment Receipt can be downloaded and printed if requested (customer can also access documents in AZ MVD Now).'}", "{'text': 'To verify, review the Placards section of the Customer Record under View History; the Status will show Canceled.'}", "{'text': 'If a customer brings in a placard that needs to be canceled, destroy the placard (the placard record in MAX remains).'}"], "tips": ["When a customer is deceased, MAX automatically updates from ADHS and cancels the placard automatically."]}, {"id": "disability-placard-faqs", "title": "Disability / Deaf-Hard of Hearing Plate & Placard FAQs", "cat": "Title & Registration", "intent": ["disability placard FAQ", "deaf hard of hearing application", "missing medical license number", "medical certificate date missing", "waive medical certification", "veterans affairs letter", "application in chil
