 to move through MAX, enter data, run Quick Search, and adjust the display theme and width. Use it when learning the interface or tailoring your view.", "steps": ["Use the Navigation Bar at the top to move through MAX.", "To change theme, click your Profile then Dark Theme or Default Theme.", "To adjust layout, click your Profile then Wide Mode or Standard Width.", "For Quick Search, toggle Customer or Vehicle, type keywords (Name, DL #, EIN, VIN), and press Enter or click the Search icon.", "Press Tab to move between fields (left to right, then down).", "Complete all fields marked with a red asterisk (required).", "Click Reset to clear all fields on a page."], "tips": ["MAX ignores capitalization in search fields.", "VINs and plates auto-convert to capital letters."]}, {"id": "use-dashboard", "title": "Use Your MAX Dashboard", "cat": "Getting Started", "intent": ["dashboard", "work queues", "my assignments", "BU queue", "home screen", "return to dashboard", "escalations queue"], "page": "Customer/Dashboard.htm", "what": "The Dashboard is your starting screen after login, showing the work queues and activities for your role and Business Unit. Use it to pick up and track transactions.", "steps": ["Log into MAX; you land on your Dashboard automatically.", "From anywhere else, click the ADOT logo in the Navigation Bar to return to the Dashboard.", "Review the BU Queue for uncompleted transactions checked into your Business Unit.", "Check the Elapsed Time and Appointment Time columns for timing on each service.", "Open My Assignments to see transactions assigned to you.", "Supervisors/managers review L1 Help Queue Escalations; check My Escalations for your own escalated items."], "tips": ["Dashboard contents vary by role and permissions within the Business Unit."]}, {"id": "use-user-assistance", "title": "Get Help with User Assistance", "cat": "Getting Started", "intent": ["help", "user assistance", "help icon", "context help", "where is the help button", "find policies and forms"], "page": "Customer/User_Assistance.htm", "what": "A context-specific help panel that surfaces relevant guidance, policies, and forms for your current screen. Use it for complex services, exceptions, or infrequent tasks.", "steps": ["Locate the Help Icon on your current screen.", "Click the Help Icon to open the User Assistance panel.", "Review the help content tied to your current activity.", "Follow any helpful links provided (e.g., MVD/DMV Public Website, azmvdnow.gov)."], "tips": ["Help shown is specific to the service you are performing.", "Full-database search of help and training is planned for a future update."]}, {"id": "view-customer-record", "title": "Understand and Open a Customer Record", "cat": "Customer & Records", "intent": ["customer record", "view full record", "customer account", "quick links", "briefcase icon", "what is a customer record", "level 3 customer"], "page": "Customer/Customer_Record_Overview.htm", "what": "A Customer Record is required for anyone doing business with MVD (Individual or Organization); a Customer Account is the financial account built on it. Use this to open a record and reach its details.", "steps": ["Search for the customer.", "If one result appears, the Customer Record Summary opens automatically.", "If multiple results appear, click the Customer Name to open the record.", "Click View Full Record for certifications, characteristics, physical attributes, media alerts, and representatives.", "Use the Quick Link icons at the top of the Full Record to reach Customer info, Credential History, Vehicles, AZ MVD Now, Accounts, Affiliations, Documents, or Notes."], "tips": ["Minimum record: Individual = Last Name; Organization = Organization Name.", "A briefcase icon means the customer has a valid Customer Account; no icon means requirements are missing.", "AZ MVD Now access requires the ID to be a SSN, even if other acceptable IDs are on file.", "reference"], "reference": true}, {"id": "add-certification", "title": "Add a Certification to a Customer", "cat": "Customer & Records", "intent": ["add certification", "instructor certification", "third party processor", "examiner certification", "certify customer", "certification number"], "page": "Customer/Certifications.htm", "what": "Certifications record a person's authorization to interact with MVD (e.g., driving/TSS instructor, third-party processor, examiner). Add one when a qualified customer is authorized.", "steps": ["Open the Customer Record and click View Full Record.", "Navigate to the Certifications section.", "Click Add Certification.", "Select the certification type from the ID Type dropdown.", "Enter the certification number in the ID Number field.", "Type a Description if applicable.", "Select the Effective Date.", "Select the End Date, or leave blank for a permanent certification.", "Click Save."], "tips": ["Temporary certifications show an Expiration Date; permanent ones have no End Date.", "Certifications are added directly to the Customer Record."]}, {"id": "edit-remove-certification", "title": "Edit, Delete, or View History of a Certification", "cat": "Customer & Records", "intent": ["edit certification", "delete certification", "remove certification", "certification history", "update certification dates", "expire certification"], "page": "Customer/Certifications.htm", "what": "Updates a certification's dates, deletes it, or reviews past certifications. Use when a certification changes, ends, or must be reviewed.", "steps": ["Open the Customer Record and click View Full Record.", "Navigate to the Certifications section.", "To edit: click the Edit icon, update the Effective or End Date, and click Save.", "To delete: click the Edit icon, click the Delete icon, and confirm at the warning message.", "To review past records: click View History."], "tips": ["Deleting a certification automatically adds an Expiration Date (defaults to the deletion date)."]}, {"id": "add-characteristic", "title": "Add a Characteristic to a Customer", "cat": "Customer & Records", "intent": ["add characteristic", "veteran designation", "fee exemption", "emancipated minor", "special plate eligibility", "customer attribute"], "page": "Customer/Characteristics.htm", "what": "Characteristics are attributes that control eligibility for special plates, fee exemptions, credential designations, or redactions. Add one when a customer qualifies.", "steps": ["Open the Customer Record and click View Full Record.", "Navigate to the Characteristic section.", "Click Add Characteristic.", "Select the option from the Characteristic Type list.", "Select the Effective Date (usually today unless documentation says otherwise).", "Select an End Date if temporary; leave blank if permanent.", "Click Save.", "Upload supporting documentation during the service."], "tips": ["Fee-exemption characteristics are added automatically after the service completes.", "Some characteristics require supervisor or specialized-unit permissions.", "Most characteristics require specific supporting documents.", "Communication Accommodation cannot be added this way; it uses a separate MAX process."]}, {"id": "edit-remove-characteristic", "title": "Edit, Remove, or View History of a Characteristic", "cat": "Customer & Records", "intent": ["edit characteristic", "remove characteristic", "delete characteristic", "end date characteristic", "characteristic history"], "page": "Customer/Characteristics.htm", "what": "Updates a characteristic's dates, removes it, or reviews past characteristics. Use when eligibility changes or ends.", "steps": ["Open the Customer Record and click View Full Record.", "Navigate to the Characteristic section.", "To edit: click the Edit icon, update the Effective or End Date, and click Save.", "To remove: click the Edit icon, click the Delete icon, click Save, and confirm at the warning.", "To review past records: click View History."], "tips": ["MAX automatically inactivates and archives a characteristic one day after it is end-dated or removed."]}, {"id": "view-customer-vehicles", "title": "View a Customer's Vehicles", "cat": "Customer & Records", "intent": ["view customer vehicles", "vehicles quick link", "customer's cars", "titled vehicles", "registered vehicles", "vehicle indicators"], "page": "Customer/Viewing_Vehicle_Information_for_a_Customer.htm", "what": "Shows all vehicles titled and/or registered to a customer from within their record. Use it to review vehicle details, status alerts, and fleet assignments.", "steps": ["Open the Customer Record.", "Click the Vehicles Quick Link at the top of the page.", "Review the list: VIN, year/make/model/body style, title number, plate, and registration expiration.", "Check the Indicator column for alerts (emissions needed, active withdrawals, data errors, sold notices).", "Click a VIN to open the detailed Vehicle Information Page (optional).", "Click the Customer Name or Customer icon to return to the record."], "tips": ["Click any column header to sort; an up arrow marks the active sort column."]}, {"id": "find-a-customer", "title": "Find a Customer Record", "cat": "Customer & Records", "intent": ["find a customer", "search customer", "look up customer", "quick search", "advanced search", "search by SSN or DL", "locate record"], "page": "Customer/Finding_a_Customer.htm", "what": "Searches for and opens a customer record using Quick Search or Advanced Search. Use it to pull up a customer before any service.", "steps": ["For Quick Search, use the field in the navigation bar; enter a unique identifier (AZ DL, ID, or SSN) and press Enter or click Search.", "If multiple results appear, click the customer's name to open the record.", "For Advanced Search, click Advanced Search and select Customer Type (individual or organization).", "Enter a last name OR one identification type (Alien Number, AZ Credential, Customer Number, I-94, SSN, etc.).", "Check or uncheck Exact Match as needed, then click Find or press Enter.", "To narrow many results, type keywords in the Filter Results field.", "Click the customer name to open the record."], "tips": ["MAX ignores capitalization, spaces, and special characters (search 'otoole' for O'Toole).", "Do not use hyphens/dashes when searching SSNs, EINs, or DOBs.", "If you get 'too many records,' add criteria such as birth year or partial DL with last name.", "Photos show only for customers with Arizona credentials; restricted/OOP records redact sensitive data."]}, {"id": "edit-customer-record", "title": "Edit a Customer Record", "cat": "Customer & Records", "intent": ["edit customer", "update customer info", "change address", "add identification", "correct customer record", "update contact", "remove info"], "page": "Customer/Editing_a_Customer.htm", "what": "Updates, corrects, adds, or removes customer information such as names, IDs, addresses, and contacts. Use when a customer's details change or need correcting.", "steps": ["Open the customer record.", "To edit an item, click the Edit (pencil) icon next to it, make changes, and click Save.", "To add, click Add next to the area (e.g., Add Name, Add Identification), complete required fields, and click Save.", "To edit an address, click Edit, make changes, select the Address Source, and click Save.", "To edit contacts, click Edit next to contacts, make changes, and click Save.", "To remove by end date, click Edit, enter the End Date, and Save.", "To remove by delete, click Edit, click Delete, and Save (item stays in history)."], "tips": ["Names with accent marks (tildes, eñe) are not permitted per AAMVA standards.", "For non-US addresses, enter the country first so it formats correctly.", "Deleted information remains in the record's history.", "Some modifications require supervisor-level access."]}, {"id": "add-individual-customer", "title": "Add a New Individual Customer", "cat": "Customer & Records", "intent": ["add customer", "new customer", "create individual record", "no record found", "register new person", "add new customer"], "page": "Customer/Adding_a_Customer.htm", "what": "Creates a new MVD Customer Record for an individual who has no existing record. Use only after confirming the customer isn't already in MAX.", "steps": ["After no results are found, click Add New Customer.", "Select Individual from the Customer Type dropdown.", "Enter Legal First, Middle, Last Name, and Suffix if applicable.", "Enter Date of Birth and Social Security Number (or skip if using alternative ID).", "Enter Personal Email and Cell, checking Text/Email Enabled and/or Primary as appropriate.", "Click Add an Address; select Residential or Mailing.", "Enter Street, City, State, ZIP, Country, County, and select the Address Source; click Save.", "Verify the address (or re-enter), select the Emissions Area Type, and click Continue.", "Click Save to create the record."], "tips": ["Run at least two searches before adding to avoid duplicates; verify DOB, SSN, and address if a duplicate warning appears.", "Capitalize only the first letter of first/middle/last names; avoid ALL CAPS.", "Character limits: first 50, middle 50, last 70.", "If the area has no mail delivery, the customer must supply a P.O. Box as the mailing address."]}, {"id": "add-organization-customer", "title": "Add a New Organization Customer", "cat": "Customer & Records", "intent": ["add organization", "new business customer", "create organization record", "dealer record", "generate OIN", "add company"], "page": "Customer/Adding_a_Customer.htm", "what": "Creates a new MVD Customer Record for an organization (e.g., dealer, financial institution) that has no existing record. Use after confirming no duplicate exists.", "steps": ["Click Add New Customer.", "Select Organization from the Customer Type dropdown.", "Enter the Organization Name.", "Select the Organization Type.", "Enter EIN/TIN/ITIN, or click Generate OIN.", "Enter Business Email and Cell, checking the appropriate boxes.", "Click Add New Address and complete the address fields.", "Click Save."], "tips": ["Run at least two searches first to avoid duplicates.", "ALL CAPS is acceptable only where standard for organization names."]}, {"id": "add-a-trust", "title": "Add a Trust as a Customer", "cat": "Customer & Records", "intent": ["add a trust", "title vehicle in trust", "trust customer", "trustee", "create trust record", "trust organization"], "page": "Customer/Adding_A_Trust.htm", "what": "Creates a Trust record so a vehicle can be titled in the trust's name. A Trust is added as an Organization with trustees entered as individuals/DBAs.", "steps": ["Search for the trust in MAX.", "If not found, click Add New Customer.", "In the Customer dropdown, select Organization.", "Enter the Organization Name of the trust.", "In the Organization Type dropdown, select Trust.", "Enter the EIN, or click Generate OIN.", "Click Add New Address to add the trust's address.", "Click Save.", "To reflect a trustee for titling, click Add Name and enter the trustee's name as a DBA."], "tips": ["Organization Type must be set to Trust at creation; it cannot be changed afterward.", "Adding an address makes the trust a Level 3 customer.", "For AZ MVD Now business, the trust must complete an AZ MVD Now Administrator Application."]}, {"id": "add-agent-to-service", "title": "Add an Agent (Payer) to a Service", "cat": "Customer & Records", "intent": ["agent vs customer", "someone paying for another person", "add agent", "third party payer", "financial responsibility", "pay on behalf"], "page": "Customer/Agent_and_Customer.htm", "what": "Separates the person paying (Agent) from the person receiving the service (Customer) so fees and verification apply correctly. Use when someone pays on another person's behalf.", "steps": ["Add the service for the paying customer (per Check-In instructions).", "In the Add Service section, click the X to remove the first customer.", "Search for the new customer (the service recipient).", "Search for the service for that customer.", "Click Add to add the additional service(s).", "Click Begin Services to start processing, or Check-In to queue them."], "tips": ["The Agent is the person paying and accepting financial responsibility.", "The Agent appears at the top of the Check-In screen; the Customer at the bottom.", "At checkout you can search and change the Agent if the wrong one displays."]}, {"id": "add-acp-characteristic", "title": "Add the Address Confidentiality Program (ACP) Characteristic", "cat": "Customer & Records", "intent": ["ACP", "address confidentiality", "domestic violence address hiding", "confidential address", "redact address", "secretary of state ACP card"], "page": "Customer/Address_Confidentiality_Program_(ACP).htm", "what": "Adds an ACP characteristic to hide a participant's residential address (for domestic violence, sexual offense, or stalking victims). Use when a customer presents a valid ACP Authorization Card.", "steps": ["Verify ACP participation from the customer's documentation.", "Search for and open the Customer Record; click View Full Record.", "Click the Addresses quick link and click Add Mailing Address.", "Enter the ACP mailing address with the registered apartment number; click Save.", "Click the Characteristic quick link, then Add Characteristic.", "Select Address Confidentiality Program from the Characteristic Type dropdown.", "Select the Effective Date (the ACP start date the CSR wrote down); click Save.", "Refresh the browser if needed, then process the credential service ensuring the mailing address prints."], "tips": ["Applicants must enroll through the Arizona Secretary of State and hold an ACP Authorization Card.", "Enter the true residential address in the residential field and the ACP substitute (with apt #) as the mailing address.", "Home/domicile addresses, phone, email, and SSN are redacted; mailing address stays visible.", "ACP customers cannot use AZ MVD Now. For issues contact Madelene Carbajal, not the Secretary of State."]}, {"id": "lecu-redactions", "title": "Handle a Law Enforcement (LECU) Redacted Customer", "cat": "Customer & Records", "intent": ["LECU", "law enforcement redaction", "confidential officer record", "redacted customer", "lift redaction", "OIG redaction"], "page": "Customer/Law_Enforcement_(LECU)_Redactions.htm", "what": "Explains how to service a customer whose personal data is redacted by the Law Enforcement Coordination Unit. You cannot redact/unredact in MAX yourself; you coordinate with LECU.", "steps": ["Contact LECU at (602) 712-7488 or LECU@azdot.gov to temporarily lift the redaction before processing.", "Complete the customer's transaction in MAX.", "Have the customer verify all information is correct.", "Contact OIG/LECU again to restore the redaction.", "Do not attempt to view confidential data except for Division business."], "tips": ["Redacted data includes addresses, phone/fax numbers, email, SSN, DOB, physical descriptors, signatures, and photos.", "Never send customers to OIG or give out their address.", "Registration renewals and vehicle transfers don't need a lifted redaction if the address is unchanged.", "LECU-redacted customers can't activate AZ MVD Now without lifting the redaction first.", "reference"], "reference": true}, {"id": "add-oop-iah-characteristic", "title": "Handle an Order of Protection / Injunction Against Harassment (OOP-IAH)", "cat": "Customer & Records", "intent": ["order of protection", "OOP", "IAH", "injunction against harassment", "redact customer info", "court order redaction", "OOP help desk"], "page": "Customer/Orders_of_Protection_or_Injuction_Against_Harassment_(OOP-IAH).htm", "what": "Redacts personal information for customers with a court-ordered OOP/IAH. Note: only the OOP/IAH Help Desk actually adds the characteristic; the steps below show the process.", "steps": ["Verify the court-ordered restriction from documentation.", "Search for and open the Customer Record; click View Full Record.", "Click the Characteristic quick link, then Add Characteristic.", "Select OOP/IAH from the Characteristic Type dropdown.", "Select the Effective Date (the date from the court order).", "Select the End Date, or leave blank if the order specifies none.", "Click Save and refresh the browser to see changes."], "tips": ["Only the OOP/IAH Help Desk adds this characteristic - contact 602-712-6006 (phone) or 602-712-3441 (fax).", "Redacted data includes photo/signature, addresses, phone, email, and SSN.", "Do not view confidential data except for Division business.", "Customers can't activate AZ MVD Now with an active redaction but may use Express Services as guests."]}, {"id": "view-service-history", "title": "View a Customer's Service History and Artifacts", "cat": "Customer & Records", "intent": ["service history", "past services", "reprint receipt", "view artifacts", "service ID lookup", "find a permit or title copy", "business transaction number"], "page": "Customer/Service_History.htm", "what": "Displays completed services for a customer within a date range and provides their artifacts (receipts, permits, titles). Also supports looking up a single service by transaction number.", "steps": ["Search for and open the customer record.", "Click View Service History.", "Enter or select a Start Date and End Date (defaults: 90 days individuals, 7 days organizations).", "Click Find; use Filter or Sort as needed.", "Click the Select icon to view service details and artifacts.", "Click the download icon to view or print an artifact; click X to return to the list.", "To look up one service: from the Admin menu click Service History Lookup, enter the Business Transaction Number (Service ID), click Find, then the download icon."], "tips": ["Results show one page at a time; filtering/sorting only applies to pages already viewed.", "Vehicle services completed after 12/21/2021 can be filtered by VIN.", "A One Time Mailing Address appears under Service Artifacts; otherwise it shows 'No Address to Display.'"]}, {"id": "schedule-appointment-asq", "title": "Schedule an Appointment (ASQ) from a Customer Record", "cat": "Customer & Records", "intent": ["schedule appointment", "ASQ", "book appointment", "queuing", "appointment icon", "road test appointment", "print confirmation"], "page": "Customer/ASQ for CSRs.htm", "what": "ASQ manages office capacity by scheduling appointments and tracking wait times (it replaced Appointments Plus, QMatic, and ePro). Use it to book an appointment from a customer's MAX record.", "steps": ["Click the Appointment icon in the customer's MAX record; ASQ opens in a new tab.", "Select the MVD office location (defaults to your Business Unit).", "Select the appointment date on the calendar.", "Click the plus icon next to an available time slot.", "Enter phone number and email if not already populated.", "Select the appointment type and add internal notes if needed.", "Click Save.", "Click Print Confirmation and give it to the customer."], "tips": ["You cannot save without a phone number and email; if the customer has no email use NA@NoEmail.com (never a fake email).", "Left-side slots are 10 minutes (Travel ID, renewals, permits); right-side are 30 minutes (road tests).", "Customers get an immediate confirmation email plus a 24-hour reminder.", "The printout doesn't auto-save to documents; use Search to reprint."]}, {"id": "start-a-service", "title": "Start a Service", "cat": "Everyday Transactions", "intent": ["start a service", "begin helping a customer", "open a transaction", "how to initiate service in MAX", "start work for customer", "begin service"], "page": "Cross_Functional/Starting_a_Service.htm", "what": "Multiple ways to initiate a customer service request in MAX. Method depends on your role (greeter vs CSR) and workflow.", "steps": ["Check-In: click the Check-In icon in the upper right of the MAX Dashboard.", "BU Queue: expand the Business Unit Queue header and filter for 'Unassigned'.", "Click the service to open it, then click Edit Mode to assign the customer and begin.", "My Assignments: expand My Assignments and click the service to begin.", "Services Menu: click the Menu icon (upper left), then Services, then select the requested service.", "Search for the customer and/or vehicle as prompted, then click Add.", "Vehicle Info page: click Begin Service, then Add under Suggested Services (or type the service).", "Continue with the opened service to completion."], "tips": ["The BU Queue lists all customers checked in to your office.", "My Assignments only appears if customers are assigned to you.", "Service availability depends on your authorization level."]}, {"id": "check-in-customer", "title": "Check In a Customer", "cat": "Everyday Transactions", "intent": ["check in a customer", "add customer to queue", "greeter check in", "queue a customer", "start service via check-in", "assign customer to me"], "page": "Cross_Functional/Check_In.htm", "what": "Adds a customer and their requested service(s) to the Business Unit Queue (greeter) or assigns them directly to you (CSR).", "steps": ["Click the Check-In icon in the upper right of the MAX Dashboard.", "Search for the customer using Quick Search (or click Advanced for a detailed search).", "Click the Search icon or press Enter.", "If multiple results appear, click the Select icon for the correct customer.", "Type the service name in Add Service and pick from the predictive suggestions.", "If vehicle-related, search by VIN, Short VIN, or plate and press Enter.", "Click Add to add the service; repeat for additional services.", "Click Begin Services (assigns to you) or Check-In (adds unassigned to BU Queue)."], "tips": ["Do not use hyphens/dashes when searching SSNs, EINs, or DOBs.", "Watch panels for Open Services, Suggested Services, and Queued Services.", "A warning appears if a queued service is active in AZ MVD Now."]}, {"id": "scan-documents-during-service", "title": "Scan Documents (Credentials & T&R)", "cat": "Everyday Transactions", "intent": ["scan documents", "scan to upload", "scan credential source documents", "scan title summary", "scan later", "attach scanned docs"], "page": "Cross_Functional/Scanning.htm", "what": "Scans source and supporting documents into MAX as service artifacts during credential issuance or Title & Registration.", "steps": ["Credentials: click Upload on the first requirement and select 'Scan to Upload'.", "Verify scanner and set Color Mode to Grayscale, then load documents and click Scan.", "Review pages (blue view icon); delete unwanted pages with the red X, then click OK.", "Assign Document Category and Type that EXACTLY match the requirement.", "Click Add Category/Type for more documents, then click Upload and Confirm.", "T&R: download/print the Arizona Title Summary; have the customer review, check boxes, and sign.", "Click Add Documents, select 'Scan to Upload', load all docs (incl. signed summary), scan in Grayscale.", "Select 'Title Summary' category and 'Signed Arizona Title Summary' type, then Upload.", "Use Scan Later if the scanner malfunctions (T&R only, not credentials)."], "tips": ["Credential source documents have a 10-year retention (from issuance date).", "Do NOT scan credentials using the Document tab.", "Don't print the Vehicle Title Shell for customers.", "If same-day T&R and Print Title, sign the Arizona Title Summary once."]}, {"id": "document-management", "title": "Manage Customer Documents", "cat": "Customer & Records", "intent": ["view documents", "add documents", "upload files to customer record", "download document", "manage customer documents", "attach files"], "page": "Cross_Functional/Document_Management.htm", "what": "View, add, and download supplemental documents on a customer record to satisfy business rules and prove eligibility.", "steps": ["View: click the Document icon in the upper right of the Customer Record.", "Narrow with Start/End Date, Category, or Requirement fields, then click Find.", "Navigate pages using the Next Page arrow.", "Add: click Add Documents, then Upload Files or drag files into the box.", "Enter a File Description and select the Document Category matching the requirement.", "Select Document Type and Privacy Level (typically 'None' for MVD offices), then click Upload.", "Download: click the Documents icon, then the filename or Download icon.", "Double-click the downloaded file to open."], "tips": ["Original credential source documents have a 10-year retention period.", "Credit cards and bank cards are NOT imaged.", "Only one page of documents displays at a time; page through before filtering.", "Attach AZ MVD Now customer uploads to the completed credential service in Service History."]}, {"id": "esignature-request", "title": "Request an eSignature", "cat": "Everyday Transactions", "intent": ["esignature", "request electronic signature", "customer forgot to sign", "sign document electronically", "eSign MVD document", "signature required"], "page": "Cross_Functional/eSignature.htm", "what": "Requests a customer's electronic signature on an MVD document (with an MVD Agent/Notary section) instead of mailing physical papers.", "steps": ["Scan and save the document requiring a signature to your computer.", "Log into MAX and open the customer record.", "Click the Documents icon on the Customer Record Summary page.", "Click Add Documents to upload the scanned document.", "Click Upload Files or drag/drop the file into the box.", "Type a description of the file.", "Check the Signature Required checkbox and optionally add a Notification Comment.", "Select Document Category, Document Type, and Privacy Level (if applicable).", "Click Upload to send it to the customer."], "tips": ["Customer needs an activated AZ MVD Now account, an email on file, and an SSN on record.", "For documents needing two signatures, repeat the whole process for each customer.", "eSignature auto-adds a signature page at the end; you don't place the signature.", "Notary-only documents require a physical signature."]}, {"id": "work-in-progress-hold", "title": "Place or Remove a Service Hold (WIP)", "cat": "Everyday Transactions", "intent": ["work in progress", "service hold", "pause a service", "put service on hold", "resume a held service", "WIP"], "page": "Cross_Functional/Work_In_Progress.htm", "what": "A Work In Progress (Service Hold) temporarily pauses a service so the customer can return later to complete it.", "steps": ["Place from active service: click the Pause icon in the Services panel.", "Place from queue: expand the BU or My Assignments Queue, find the customer, click Pause in the Actions column.", "The service moves to Open Services and leaves the queues.", "Remove: click Check-In.", "Add the desired service from Open Services.", "Click Begin Service.", "Click the Delete icon in the Services panel to remove it from WIP."], "tips": ["WIPs older than one year have limited access; delete and restart instead.", "MAX may auto-restore an existing WIP if you start the same service/vehicle/customer combo; an alert confirms restoration."]}, {"id": "overrides-escalations", "title": "Request or Approve an Override / Escalation", "cat": "Everyday Transactions", "intent": ["override", "escalation", "supervisor approval", "request approval", "business rule exception", "approve override"], "page": "Cross_Functional/Overrides-Escalations.htm", "what": "Handles exceptions to business rules: a CSR requests supervisor approval to proceed past an alert; supervisors allow or deny it.", "steps": ["CSR: when an alert appears, click 'Request Approval' in the alert box.", "Confirm 'Override request made successfully' and return to the dashboard (do NOT put the service in WIP).", "Monitor status in My Escalations; once decided the service returns with 'Inactive' status.", "Click the service link and re-apply the change (MAX won't prompt again).", "Supervisor: expand 'L1 Help Queue Escalations' on the dashboard.", "Click the 'Reason' hyperlink to review, then Close the pop-up.", "Check the request checkbox, select Action (Allow/Deny) and Send To (CSR or Unassigned).", "Click Send."], "tips": ["Supervisors and Leads can approve their own overrides.", "Approval applies only to that specific service transaction.", "NEVER waive requirements for a Credential Issuance service."]}, {"id": "process-payment", "title": "Process a Payment at Checkout", "cat": "Payments & Cash", "intent": ["process payment", "checkout", "take payment", "apply payment", "credit card POS payment", "complete checkout", "print receipt"], "page": "Cash Management/Payment_Processing.htm", "what": "Processes customer payment for MVD services through the shopping cart checkout, including POS card, cash, check, account funds, and vouchers.", "steps": ["Verify Customer Account funds (MAX applies these first automatically).", "Select the payment method and enter the amount to apply; add more methods if needed.", "For cards: enter the POS Card Amount and click Submit Credit Card to activate the device.", "Run the card payment before other methods; process multiple cards one at a time.", "Check for Change Due (not allowed on card payments).", "When Balance Due = $0.00, select Complete Checkout.", "For multiple services, click Complete Remaining Transactions, then click each to view artifacts.", "On the Service Finalized screen, select Download to download/print the receipt."], "tips": ["Never complete a service without physically collecting payment first.", "No overpayment on POS card, Customer Account, or PrePaid Vouchers.", "Cash overpayment returns cash; check overpayment returns to Customer Account only.", "At MVD offices, change the agent via Find Agent to search the person paying."]}, {"id": "issue-cash-drawer", "title": "Issue a Cash Drawer", "cat": "Payments & Cash", "intent": ["issue cash drawer", "assign cash drawer", "accept cash drawer", "startup amount", "accountant issue drawer", "confirm drawer with POS"], "page": "Cash Management/Issue_Cash_Drawers.htm", "what": "An Accountant assigns a physical and MAX cash drawer to a CSR so they can process payments; the CSR verifies and accepts it.", "steps": ["Accountant: select Cash from the Cash menu, then Issue Cash Drawer.", "Locate the CSR in the list (or use CSR Search for external staff).", "Optionally enter a custom Startup Amount, then click Issue.", "CSR: physically count the cash and verbally acknowledge it.", "Log into MAX when prompted.", "If using a POS device, select the Point of Sale Device number from the dropdown.", "Select Confirm to begin processing services."], "tips": ["The CSR and Accountant may not be the same person.", "Single-staff offices must video conference with an accountant at another location to validate.", "Zero-dollar drawers are used for non-cash-payment offices."]}, {"id": "pos-device-management", "title": "Change / Identify POS Device", "cat": "Payments & Cash", "intent": ["POS device management", "wrong POS device", "change point of sale device", "which device do I have", "switch POS device", "card reader assignment"], "page": "Cash Management/POS_Device_Mgmt.htm", "what": "Lets a CSR switch to a different Point of Sale device if the wrong one was selected, and identify their current device number.", "steps": ["From the Cash menu, select POS Device Management.", "Review the Current Point of Sale Device displayed.", "Select a New Point of Sale Device from the dropdown.", "Click Save.", "Confirm the success message; you are now on the new device."], "tips": ["Each POS device has a unique 4-digit number for the physical device.", "Verify you are in the correct Business Unit (device numbers differ).", "Managers/Accountants can run the POS Device Assignment Report to find a device.", "Submit a Service Portal ticket if the issue persists."]}, {"id": "balance-cash-drawer", "title": "Balance a Cash Drawer", "cat": "Payments & Cash", "intent": ["balance cash drawer", "end of shift balancing", "count drawer", "submit balanced", "end of day closing", "reconcile drawer"], "page": "Cash Management/Balance_Cash_Drawer.htm", "what": "At end of shift a CSR confirms the physical drawer matches system-recorded collections; the Accountant then accepts it.", "steps": ["Count and set aside the startup amount in required denominations.", "From the Cash menu, click Balance Cash Drawer.", "Review the pre-populated Balance Summary (Startup Amount and Pickup Balance).", "Count remaining cash/coins and enter Quantity in Cash Denominations.", "Count checks and enter Quantity and Amount in Checks (calculator tape required).", "Enter credit card receipts and any Other Payment Method quantities/amounts.", "Click Verify & Submit, then Submit Balanced or Submit Unbalanced.", "Print the Balance Receipt and deliver it with the drawer to the Accountant."], "tips": ["Integrated POS devices auto-process card payments (no manual entry).", "Other Payments combines Prepaid Vouchers and Customer Account (electronic).", "The CSR can restart balancing to fix errors before the Accountant accepts.", "Accountant can balance on behalf of a CSR via End of Day Closing."]}, {"id": "cash-pick-up", "title": "Perform a Cash Pickup", "cat": "Payments & Cash", "intent": ["cash pickup", "excess cash removal", "drawer over threshold", "cash pickup confirmation", "remove cash from drawer", "accountant accept pickup"], "page": "Cash Management/Cash_Pick_Up.htm", "what": "Removes excess cash from a drawer when it hits the office threshold; the CSR submits and the Accountant accepts or rejects.", "steps": ["CSR: select Cash menu, then Cash Pickup.", "Type the quantity for each cash denomination (MAX calculates totals).", "Click Submit, then Print, and await Accountant acceptance.", "If rejected, reopen Cash Pickup, update denomination quantities, Submit, and Print.", "Accountant: go to Menu, Cash, Cash Pickup Confirmation.", "Verify the Business Date (defaults to current) and manually verify the cash amount.", "Select Accept, Reject, or Cancel."], "tips": ["Alerts continue until the pickup is completed.", "Accept deducts the amount from the CSR drawer; both parties sign the receipt.", "The pickup shows in end-of-day balance but needs no re-counting.", "Auto-cancels if the CSR begins balancing before the Accountant processes it."]}, {"id": "assisted-self-service-invitation", "title": "Send an Assisted Self-Service Invitation (ASI)", "cat": "AZ MVD Now (Online)", "intent": ["assisted self-service invitation", "ASI", "send invitation link", "add funds invite", "upload documents invite", "eSign invite", "guest invitation PIN"], "page": "AZ_MVD_Now/Assisted_Self-Service.htm", "what": "Sends a limited-time invitation link (code + PIN) that lets a customer complete a specific transaction in a guest version of AZ MVD Now without full account setup.", "steps": ["Open the Customer Record and click the Account Quick Link (briefcase) to verify Level 3 status and a Primary account.", "Click the AZ MVD Now Quick Link, then 'Add Invitation'.", "Select the Service Type and the 'Expires In (Days)' duration (max 4 days).", "Click Email or Phone Number, enter contact info, and type a message from the templates.", "Click Save.", "Provide the 4-digit PIN verbally (never via the same method as the invitation).", "For eSign: verify SSN exists, upload the document in Documents, check 'Signature Required', then click '+' next to Requires Signature.", "Return later to verify completion (funds, documents, or 'Signing Complete')."], "tips": ["Customer must be Level 3 with a Primary account; eSign also requires an SSN.", "One eSign invitation = one document only.", "Add Funds invitations can be reused; 3 failed PIN attempts expires the invite.", "The recipient may differ from the account holder (e.g., a parent funding a child)."]}, {"id": "manage-customer-account", "title": "Manage a Customer Financial Account", "cat": "Customer & Records", "intent": ["manage customer account", "customer account contact info", "edit account", "Level 3 account", "unclaimed funds", "account vs record contact"], "page": "AZ_MVD_Now/Manage_Customer_Account.htm", "what": "View and update a customer's financial account (available to Level 3 customers) used to pay for services and activate AZ MVD Now.", "steps": ["Access the Customer Account section.", "View the displayed contact information.", "Select or add a contact method.", "Click Edit Account to make changes."], "tips": ["Customer must meet Level 3 requirements.", "Account contact info drives AZ MVD Now notifications; Record contact info drives official MVD mail.", "Editing account contact info does NOT update the MVD customer record.", "Customer Account funds go to the Highway User Revenue Fund after 5 years inactivity (IFTA: 3 years)."]}, {"id": "manage-org-azmvdnow-logins", "title": "Manage AZ MVD Now Logins for Organizations", "cat": "AZ MVD Now (Online)", "intent": ["organization AZ MVD Now login", "add representatives", "org account access", "trust government nonprofit login", "dealership online access", "administrator application"], "page": "AZ_MVD_Now/Managing_AZ_MVD_Now_Logins_for_Organizations.htm", "what": "Establishes online AZ MVD Now access for organizations (trusts, governments, non-profits, sole proprietorships, dealerships) by adding Representatives to the Organization Customer Record in MAX.", "steps": ["Confirm the organization meets Level 3 Customer Account requirements.", "Complete the appropriate administrator application form.", "Add Representatives to the Organization Customer Record in MAX to create logins.", "Note that adding/editing Representatives does not create individual customer records.", "Organization Administrators can then manage Representatives directly in AZ MVD Now.", "Use Form #15-0706 (non-dealerships, Account Support Unit) or #15-0707 (dealerships, Dealer Licensing Unit)."], "tips": ["Representatives aren't subject to Level 3 requirements.", "You often can't add Representatives until the appropriate Characteristic is added.", "Changing the account administrator requires reapplying through the formal process."], "reference": true}, {"id": "fund-account-via-azmvdnow", "title": "Fund a Customer Account via AZ MVD Now", "cat": "AZ MVD Now (Online)", "intent": ["add funds online", "fund account AZ MVD Now", "add money to account", "ePayment eCheck", "load account funds", "online add funds"], "page": "AZ_MVD_Now/Fund_Customer_Acct_via_AZMVDNow.htm", "what": "Lets a customer add funds to their AZ MVD Now account online to pay for vehicle services and renewals.", "steps": ["Log into AZ MVD Now and click the My Account tab.", "Click Add Funds.", "Enter the amount and click Add to Cart.", "Verify the mailing address; update if needed.", "Select payment type (ePayment or Bank Account) and click Checkout.", "Choose Credit Card or eCheck and enter payment details (optionally Store This Payment).", "Click Submit Payment.", "Review details, click Continue Transaction, and confirm the successful payment."], "tips": ["Individuals can't self-fund except via an Assisted Self-Service Invite or the 'Individual Elevated MAX Balance' characteristic.", "The payment page allows 5 minutes to enter payment info.", "Charges appear as 'AZ MVD WEB 602-255-0072 AZ'.", "Organizations need the 'Limited Trust Organizations' characteristic or must submit form #15-0714."]}, {"id": "disable-restrict-azmvdnow", "title": "Disable or Restrict an AZ MVD Now Account", "cat": "AZ MVD Now (Online)", "intent": ["disable AZ MVD Now account", "restrict services", "fraud prevention account", "re-enable account", "remove service restriction", "block online login"], "page": "AZ_MVD_Now/Disable_Restrict_AZ_MVD_Now_Acct.htm", "what": "Disables a customer's AZ MVD Now login (by request or for fraud), re-enables it, or removes service restrictions used for fraud prevention.", "steps": ["Disable: search for the Customer Record in MAX.", "Click the AZ MVD Now quick link.", "Click 'Disable AZ MVD Now Access'; the button changes to 'Enable AZ MVD Now Access'.", "Re-enable: verify identity, open the record, click the AZ MVD Now icon, then 'Enable AZ MVD Now Access'.", "Remove restrictions: verify identity and open the record.", "Go to the Characteristics section and click the Edit icon.", "Select the current date as End Date, then click Save."], "tips": ["All account history is retained; the customer just can't log in or re-register.", "Only an MVD CSR can restore access if a customer self-disables.", "Balances remain after disabling; refunds are available via a CSR.", "Restrictable services: Driver License, CDL, and ID Card Replacement."]}, {"id": "prepaid-voucher", "title": "Purchase & Manage a Prepaid Voucher (PPV)", "cat": "Payments & Cash", "intent": ["prepaid voucher", "PPV", "create voucher", "voucher claim code", "voucher balance inquiry", "gift card for MVD services"], "page": "AZ_MVD_Now/Prepaid_Voucher.htm", "what": "Organization AZ MVD Now accounts create Prepaid Vouchers (like gift cards) redeemable for any MVD service, in office or online.", "steps": ["Purchase: log into AZ MVD Now and click the My Account tab, then Prepaid Voucher.", "Enter the voucher amount and the reason for issuance (if applicable).", "Click Create Voucher, verify the amount, and click Confirm.", "Use the Voucher Claim Code (available immediately).", "View details: from My Account, click Manage Accounts, then the View History (clock) icon.", "Click View Receipt next to Purchase Prepaid Voucher, then Continue, and email/print.", "Check balance: click Prepaid Voucher Balance Inquiry, enter the Claim Code, and click Search."], "tips": ["Only AZ MVD Now Organization Accounts can purchase PPVs.", "No more than four PPVs may be used to pay for any one service.", "Not renewable, reloadable, or refundable; usable immediately.", "For refunds, transfer the PPV balance to the customer account then request disbursement."]}, {"id": "request-customer-disbursement", "title": "Request a Customer Disbursement (Refund)", "cat": "Payments & Cash", "intent": ["disbursement request", "refund customer account", "return unused funds", "refund prepaid voucher", "issue refund check", "customer refund"], "page": "AZ_MVD_Now/Request_Customer_Disbursement.htm", "what": "Returns an unused balance from a Prepaid Voucher or Customer Account to the account holder (CSR requests result in a check).", "steps": ["Search for and open the customer's record.", "Click the Accounts icon (briefcase).", "Click the View icon and confirm an account balance exists.", "Verify the mailing address in Account Details (edit if needed).", "Click Disbursement Request.", "Enter the disbursement amount and click Submit.", "Confirm the amount is accurate and click Submit again."], "tips": ["A request can only be made 7 days after the original funding (anti-fraud); registration credits/MVD refunds are exempt.", "Self-funded-only accounts are limited to one request per 30 days.", "CSR requests produce checks only (arrive in 7-10 days); online customers can choose bank deposit.", "Transfer any PPV balance to the customer account first."]}, {"id": "mobile-home-title-transfer", "title": "Transfer a Mobile Home Title", "cat": "Title & Registration", "intent": ["mobile home title transfer", "MH title", "manufactured home title", "title only mobile home", "multi-section mobile home", "mobile home ownership transfer"], "page": "Mobile Homes/MH_Title_Transfers.htm", "what": "Transfers ownership of a mobile home from an MCO/out-of-state title or Arizona-to-Arizona, including linking multi-section homes.", "steps": ["From the Services menu, select Title Only.", "Search for the customer and mobile home vehicle, then click Add.", "In the Title tab, enter received date, ownership date, ownership reason, and confirm title type 'Original'.", "In the Owners tab, add the required domicile address, add additional owners, and release any liens.", "In the Vehicle tab, verify VIN, select 'Mobile Home', and enter factory list price plus length/width.", "For multi-section homes, click Link Mobile Home, enter the opposite section VIN, and search.", "Click Confirm to validate eligibility, review the Service Summary, and click Continue.", "On Taxes & Fees, click Pay Now or Add to Cart and complete checkout.", "Print the Arizona Title Summary, have the customer sign, scan it with supporting docs, and provide service documents."], "tips": ["A domicile address is required so the County Treasurer can charge property taxes.", "Lien release is required regardless of lien age; mobile home lienholders don't need ELT enrollment.", "Collect Use Tax if bought from an out-of-state dealer and not already collected.", "Certificate of Compliance (pre-1985) or Waiver (post-1985) may be required."]}, {"id": "mobile-home-accommodative-data", "title": "Search Accommodative Data (Mobile Home Snapshot)", "cat": "Title & Registration", "intent": ["accommodative data", "mobile home snapshot", "legacy TPX data", "find mobile home record", "record recreate", "search title VIN legacy"], "page": "Mobile Homes/Accommodative Data.htm", "what": "Searches legacy TPX data in MAX's Accommodative Database to find a Mobile Home Snapshot when the record doesn't yet exist in MAX.", "steps": ["Navigate to the Management Menu.", "Select Report Dashboard.", "Select Mobile Home Snapshot from the Accommodative Data Search section.", "Enter Title Number, VIN, Customer Number, or Name.", "Click Find to display results.", "Click Select next to the applicable record.", "To print: right-click the report, select Print, choose the printer, and click Print."], "tips": ["Data includes vehicle, title, ownership, lien holder, and tax details.", "After gathering info, proceed to the 'Title and Reg Recreate' topic to rebuild the record in MAX."]}, {"id": "acceptable-methods-of-payment", "title": "Acceptable Methods of Payment", "cat": "Payments & Cash", "intent": ["acceptable payment methods", "what payments do we accept", "checks cards cash rules", "counterfeit currency", "non-acceptable payments", "money order cashier check"], "page": "Misc._Business_Topics/Acceptable_Methods_of_Payment.htm", "what": "Reference on which payment methods field office staff must accept and their verification rules.", "steps": ["Accept U.S. cash, credit/debit cards (Visa, MasterCard, Discover; AmEx in certain units), and mobile pay (Apple/Samsung/Google Pay).", "Accept traveler's checks, cashier's checks, money orders, and personal/company checks drawn on U.S. banks.", "Accept prepaid vouchers from authorized accounts.", "Ensure checks are written for the exact amount of the service; never alter check amounts.", "Give no cash back on card transactions; transfer overpayments to the customer account.", "Test currency $20+ with a detector pen (light mark = genuine; dark mark = suspect).", "Reject foreign currency, two-party checks, postdated/temporary/starter checks, and VersaCheck software checks."], "tips": ["Counterfeit protocol: retain the bill, complete Form #96-0162, forward to the Secret Service (Phoenix)."], "reference": true}, {"id": "aamva-helpdesk-vehicle-query", "title": "Create an AAMVA Helpdesk Vehicle Query (NMVTIS)", "cat": "Reference", "intent": ["AAMVA helpdesk", "NMVTIS query", "vehicle title inquiry", "check vehicle brand history", "NM04 used vehicle inquiry", "vehicle history query", "exception queue"], "page": "AAMVA_Helpdesk/AAMVA_Helpdesk_Vehicle.htm", "what": "Queries vehicle title and registration information through NMVTIS via the AAMVA Helpdesk to verify titles and research vehicle history.", "steps": ["Click the Menu icon and select AAMVA Helpdesk.", "Click Create Message under VEHICLE HELPDESK.", "Select the desired Message Type from the dropdown.", "Enter the required Vehicle Data (VIN required; NM04 also needs Title Number and State of Title).", "Click Send.", "Wait for the 'waiting for response' alert to refresh.", "Review results on the Summary tab.", "To fix errors, use the Search Messages tab, filter Errors: Yes, then create a new message with the missing data."], "tips": ["Message types: NM01 (new), NM04 (used, solicited), NM08 (brand), NM14 (vehicle inquiry).", "Best practice: use NM04 even for new vehicle inquiries.", "Priority levels 1-8; priority 1 means 'Call AAMVA Help Desk'.", "Tech support accesses the Exception Queue under Vehicle Helpdesk."]}, {"id": "credential-issuance-overview", "title": "Credential Issuance overview (the six tabs)", "cat": "Driver — Credentials", "intent": ["credential issuance overview", "six tabs", "how credential service works", "issue driver license id permit", "credential workflow", "credential tabs order"], "page": "Driver/Credential_Issuance/Credential_Issuance_Overview.htm", "what": "Explains the Credential Issuance service used for new applications, renewals, duplicates, and upgrades for driver licenses, ID cards, instruction permits, and motorcycle credentials. It walks through the six sequential tabs that structure every credential transaction.", "steps": ["Customer tab: view/edit customer photo, legal name, AKA names, date of birth, addresses, physical attributes, and authorized presence status.", "Credential tab: select the desired credential type(s) and endorsements based on customer eligibility; check 'Request New Number' if needed.", "Questionnaire tab: answer all dynamically generated questions and affirmations specific to the selected credential type.", "Requirements tab: satisfy all requirements (PDPS checks, proof documents, tests, restrictions) and collect fees as needed.", "Documents tab: upload/scan documents fulfilling requirements and view existing customer documents.", "Print & Sign: click the Print icon to generate the Credential Application, have the customer review and sign, then scan the signed application into the Documents tab."], "tips": ["Credentials and endorsements work together: if a customer gets a Class M (motorcycle only) credential first and later gets a Class D, the motorcycle credential becomes an endorsement on the Class D.", "Customers 15.5+ may apply for instruction permits; available credentials depend on age and history.", "Pre-MAX documents remain accessible through OnBase; new uploads go to MAX."]}, {"id": "credential-types-reference", "title": "Credential types, fees & eligibility (reference)", "cat": "Driver — Credentials", "intent": ["credential types", "instruction permit fees", "driver license classes", "id card fees", "travel credential", "class G class D class M eligibility"], "page": "Driver/Credential_Issuance/Credential_Types.htm", "what": "Reference for all Arizona credential types (instruction permits, driver licenses, ID cards, and travel credentials) with eligibility, validity periods, and fees. Used to determine which credential a customer qualifies for and what to charge.", "steps": ["Instruction Permits: Class G IP (15.5+, needs Legal Guardian Certificate, valid 12 months); Class D IP (18+, 12 months); Class G Restricted IP (15-18 in approved training, valid 6 months, $3.00); Class M IP (15.5+, valid 7 months, max 2 per 24 months). Original IP $7.00, duplicate $2.00. (reference)", "Driver Licenses: Class G under 18 needs 6-month IP hold, Legal Guardian Certificate, and 30 hours driving practice; Class D standard operator; Class M motorcycle (30 hours practice for minors). Fees $10-$25 by age. (reference)", "Identification Cards: Non-Travel ID $12.00, Travel ID $25.00; free for seniors 65+, DCS minors, and SSI recipients; U.S. citizen IDs never expire; sex offender IDs expire in 1 year. (reference)", "Travel Credentials: $25.00, valid up to 8 years, printed with star insignia, updated photo required every 16 years. (reference)", "To process a Class G Restricted IP: use the Credential Issuance service, on the Credential tab select 'Class G Restricted Instruction Permit' under the Non-Commercial section, then complete the service as normal."], "tips": ["No person may be licensed by more than one state at a time (Arizona allows ID cards in multiple states).", "Travel credentials can be mailed to a mailing address, but only the residential address can be printed on the credential.", "Division test results are valid for life and do not expire.", "Homeless veteran fees may be waived; proof required within 60 days."]}, {"id": "commercial-credential-cdl-clp", "title": "Commercial credential (CDL / CLP) issuance", "cat": "Driver — CDL", "intent": ["commercial driver license", "CDL issuance", "commercial learner permit", "CLP", "interstate intrastate CDL", "non-domicile CDL", "CDL age requirements"], "page": "Driver/Credential_Issuance/Credential_Commercial.htm", "what": "Covers issuance of the Commercial Driver License (CDL) and Commercial Learner's Permit (CLP), including age, authorized presence, experience, and medical certification requirements. Used when a customer applies for or upgrades to a commercial credential.", "steps": ["Confirm age eligibility: CLP 18+, intrastate CDL 18+ (restricted), interstate CDL 21+.", "Verify the customer has held a valid non-commercial driver license for at least 12 months (one-year driving experience).", "Determine authorized presence type: U.S. citizen/naturalized; Permanent Residence (displays 'Limited Term'); or Temporary INS with I-94 (displays 'Non-Domicile' and 'Limited Term'); run SAVE/USPVS verification as applicable.", "Verify medical certification: interstate applicants require FMCSA-qualified medical professional electronic submission; intrastate may submit paper documentation.", "Complete the credential questionnaire for interstate/intrastate certification.", "Upload required documents via Document Management (English originals or certified copies)."], "tips": ["CLP is valid for 12 months and must be held for 15 days prior to the CDL skills test.", "Non-Domicile CDL expiration must match the I-94/I-94A or one year, whichever is sooner.", "Fees: Class A/B CDL original $25, Class C $12.50, CLP (all classes) $15, Travel CDL $25 (valid up to 8 years)."]}, {"id": "acceptable-documentation-noncommercial", "title": "Acceptable documentation for non-commercial credentials (reference)", "cat": "Driver — Credentials", "intent": ["acceptable documents credential", "proof of identity", "SSN verification SSOLV", "residency documents travel id", "primary identification", "document retention"], "page": "Driver/Credential_Issuance/Acceptable_Documentation_for_Credential.htm", "what": "Establishes documentation requirements for issuing non-commercial credentials (DL, ID, IP) for originals, renewals, reinstatements, and duplicates. Used to determine which documents satisfy identity, SSN, and residency requirements.", "steps": ["Require one primary form of identification containing full name and date of birth. (reference)", "Collect the full social security number for verification; the last four of the SSN is acceptable for existing customers or system-generated applications. (reference)", "Confirm Social Security Online Verification (SSOLV) validates the SSN. (reference)", "For Travel DL/ID, require two Arizona residency documents (or one plus the Arizona Residency Affidavit form #40-5143). (reference)", "Scan/upload all documents to the new credential service when issuing an original or renewal; screenshots of proof of residency may be uploaded via the Assisted Self-Service Invitations (ASI) process. (reference)"], "tips": ["Original credentials have a 10-year retention period (from date of issuance) for all source documents.", "Birth certificates marked 'Foreign Born' or 'No Record' cannot establish identification.", "Documents previously scanned in MAX or OnBase may satisfy identity for new classes, except expired passports for TID credentials and foreign applicants needing originals."]}, {"id": "process-application-for-credential", "title": "Process a credential application (full walk-through)", "cat": "Driver — Credentials", "intent": ["process credential application", "start credential issuance", "complete credential service", "customer credential tab steps", "finalize credential checkout", "AZ MVD Now queued service"], "page": "Driver/Credential_Issuance/Process_Application_for_Credential.htm", "what": "The end-to-end procedure for processing a credential application in MAX, from accessing the service through checkout. Used whenever a customer finalizes a driver license, permit, ID, commercial credential, or travel ID application in the office.", "steps": ["Access the Credential Issuance service from Menu, Check-In, Business Unit Queue, or from the AZ MVD Now queued services.", "Complete the Customer tab: verify/update photo, legal name (Edit icon), AKA names (Add Name), addresses (Add Address), physical attributes, and authorized presence.", "Complete the Credential tab: select the credential type(s) the customer is eligible for; use Add Credential to enter out-of-state existing credentials.", "Complete the Questionnaire tab: capture yes/no responses; use Add Condition for vision/medical conditions and Prompt Customer Questions to display questions on the tablet.", "Print the completed application for the customer to review and sign.", "Complete the Requirements tab: satisfy all requirements (scan documents, collect fees, update restrictions and attributes).", "Click Confirm to verify all information and check eligibility.", "Review the Service Summary and click Continue.", "Process taxes and fees, then click Pay Now or Add to Cart.", "Complete checkout and download/print the service documents for the customer."], "tips": ["Imitation, homemade, or altered applications will not be accepted; the signature must be within or immediately adjacent to the signature block.", "Names with accent marks (tildes, eñe) are not permitted; capitalize only the first letter of each name and do not enter data in ALL CAPS.", "If the customer checks Yes to register to vote, enter exactly what they wrote, even with typos.", "If a seizure occurred in the last 90 days, stop the transaction and contact MRP for direction.", "MVD no longer witnesses the customer's signature; a notary is required only when the applicant is not present."]}, {"id": "satisfying-credential-requirements", "title": "Satisfy requirements on the Requirements tab", "cat": "Driver — Credentials", "intent": ["satisfy credential requirements", "requirements tab", "confirm documents meet requirement", "run check inquiry", "collect fees credential", "add restriction requirements"], "page": "Driver/Credential_Issuance/Satisfying_Credential_Requirements.htm", "what": "How to verify and satisfy every requirement on the Requirements tab before completing credential issuance, including identity/eligibility checks, proof documents, fees, and restrictions. Requirements vary by authorized presence, credential type, and questionnaire answers.", "steps": ["For identity/eligibility verifications, allow PDPS, SPEXS, out-of-state credential number, and SSOLV checks to run automatically.", "If a check does not run automatically, click the Edit icon in the Actions column, open the Send Inquiry tab, then click Run Check.", "For proof of identity documents, click Upload to scan the customer's documents.", "Click the linked document name to view it, then check the 'Confirm document(s) meet requirement' checkbox for each satisfied requirement.", "Click the blue Confirm button to lock in verification.", "To collect fees, click Collect Fees, click Pay Now, enter amounts received, then click Complete Checkout.", "To add a restriction, click Add Restriction, check the restrictions from the dropdown, enter the start date, and click Save."], "tips": ["Each credential service prompts you to review and confirm existing or newly uploaded documents.", "SSOLV corrections take 24-48 hours for name corrections and about six weeks for DOB corrections.", "Always double-check fees, particularly for credential issuance, due to system workarounds."]}, {"id": "credential-questionnaire", "title": "Complete the credential Questionnaire tab", "cat": "Driver — Credentials", "intent": ["credential questionnaire", "questionnaire tab responses", "organ donor voter registration questions", "dynamic questions MAX", "add condition medical", "DLN survey commercial"], "page": "Driver/Credential_Issuance/Credential_Questionnaire.htm", "what": "The Questionnaire tab captures applicant responses to dynamically generated questions and affirmations based on age, medical history, and the credential type(s) selected. Used within every credential issuance transaction.", "steps": ["Review the questions MAX generates (they differ from customer to customer).", "Select Yes/No responses for questions such as emancipated minor status, organ donor registration, and voter registration.", "When triggered, click Add New or Add Condition to provide supporting details (e.g., prior states licensed, medical conditions).", "Click Confirm to finalize the questionnaire responses.", "Proceed to the Requirements tab, where certain 'Yes' answers prompt for documentation."], "tips": ["If the customer is not a U.S. citizen, you must select No for voter registration.", "A CDL applicant under 21 selecting Interstate certification will trigger an error.", "The AZ credential prints with 'See Medical Card' when four or more medical alerts are entered.", "For commercial credentials, the DLN survey requires the customer to check every state where they held any driver license in the last ten years."]}, {"id": "credential-restrictions", "title": "Add, remove, or view credential restrictions", "cat": "Driver — Credentials", "intent": ["credential restrictions", "add restriction", "inactivate restriction", "corrective lens daylight only", "MRP restriction", "view restrictions credential history"], "page": "Driver/Credential_Issuance/Credential_Restrictions.htm", "what": "Restrictions limit a driver's privileges based on health, age, credential type, or legal judgments. Used to add restrictions manually during issuance, inactivate them, or view existing restrictions on a record.", "steps": ["Add via a requirement: begin Credential Issuance, go to Requirements, click the Edit icon for the requirement, complete Date/Source/Test Results/Examiner, select the restriction from the Restrictions dropdown, click Save, then process and complete checkout.", "Add via link: begin Credential Issuance, go to Requirements, click 'Add Restriction', select restrictions in the Restriction Management window, click Save (enter a description for 'Limited Other' or 'Other'), then process and complete checkout.", "Remove/inactivate: begin Credential Issuance, click the Edit icon for the requirement, complete the required fields without changing the Restrictions dropdown, and click Save (status changes to Inactive).", "Or click the Delete icon if the restriction has not yet been printed.", "View restrictions: open Credential History from the Customer or Driver Record, click the dropdown icon for credential details, and read the Restrictions section."], "tips": ["You cannot remove a restriction, but you can mark it inactive; inactive restrictions do not print.", "When MRP adds a restriction, only MRP can remove it.", "The customer must apply for a duplicate/renewal when adding or removing a restriction, and must complete all applicable testing to remove one.", "For adaptive-equipment restrictions, the customer must demonstrate functional ability during the skills test using a properly equipped vehicle."]}, {"id": "motorcycle-endorsement", "title": "Add a motorcycle (Class M) endorsement", "cat": "Driver — Credentials", "intent": ["motorcycle endorsement", "class M endorsement", "add L endorsement", "three wheel restriction", "motorcycle knowledge skills test", "MSF card 100cc"], "page": "Driver/Credential_Issuance/Credential_Endorsements.htm", "what": "Adds motorcycle operating privileges to an existing driver license class; the Class M endorsement prints as the letter 'L' on the back of the license. Used when a customer wants to operate motorcycles, motor-driven cycles, or mopeds.", "steps": ["Begin a Credential Issuance service.", "Complete/verify the Customer tab (photo first, address, physical attributes, authorized presence).", "Click the Credential tab and select the Class M Driver License checkbox to add the endorsement to the current Class D credential.", "Complete the Questionnaire tab.", "Click the Requirements tab and verify all requirements are satisfied.", "For a three-wheel restriction, on the Requirements tab click 'add restriction' under Restrictions, select 'Three Wheel Cycle', and click Save.", "Satisfy the motorcycle knowledge test: click the Set Up icon to send the test to Auto Test, use the Edit icon to add PDS/motorcycle school certificate results, or let results auto-populate from AZ MVD Now.", "Satisfy the motorcycle skills test: click the Edit icon for the Motorcycle Skill Test requirement, enter test date, source, results, any restrictions, and examiner, then click Save."], "tips": ["Customers under 18 must hold a valid Class M IP for at least six months (waived with a valid Class M DL from another state not expired more than one year).", "When a customer presents an MSF card stamped '100cc<' in red, a restriction must be added.", "The endorsement displays as 'L', not 'M', per AAMVA standards.", "The endorsement is charged only on a renewal or when reinstating from a withdrawal that requires a written test."]}, {"id": "credential-adjustments-upgrade-downgrade", "title": "Credential adjustments (upgrade / downgrade classes)", "cat": "Driver — Credentials", "intent": ["credential adjustment", "upgrade downgrade license", "add remove credential class", "remove endorsement", "consolidate licenses", "add class going forward"], "page": "Driver/Credential_Issuance/Credential_Adjustments.htm", "what": "Credential adjustments (upgrades or downgrades) add or remove driver license classes and endorsements for customers who already hold credentials. Examples include adding a motorcycle endorsement or downgrading from multiple licenses to a single class.", "steps": ["Begin a Credential Issuance service (not a renewal or duplicate).", "Verify customer information is complete on the Customer tab.", "On the Credential tab, select only the credentials the customer wishes to have going forward.", "To remove a credential/endorsement, do not check its box before proceeding to the questionnaire; to add an endorsement, check the desired credential box (e.g., Class M).", "Complete the Questionnaire tab responses.", "Satisfy requirements on the Requirements tab.", "Process payment and issue the credential normally, confirming changes in the Service Summary's Credential Details section."], "tips": ["Selecting only a specific class (like Class M) automatically adds that endorsement to an existing license rather than creating a separate credential.", "Click the Expiration Date on the Service Summary to adjust it per business rules if needed."]}, {"id": "credential-renewal", "title": "Renew a credential (IP / DL / ID)", "cat": "Driver — Credentials", "intent": ["credential renewal", "renew driver license", "renew id card", "renew instruction permit", "renewal action dropdown", "renewal fees vision"], "page": "Driver/Credential_Issuance/Credential_Renewal.htm", "what": "Renews an expired or expiring Instruction Permit, Driver License, or ID card, keeping the same class with a new expiration date and possible endorsement changes. Used when a customer's credential has expired or is about to.", "steps": ["From the Services menu, select Credential Issuance.", "Search for and click Add for the customer.", "On the Customer tab, review the photo (take a new one if needed), select residential or mailing address, and update physical attributes; update Authorized Presence for foreign holders.", "Click the Credential tab and select 'Renewal' from the Action dropdown next to the current credential.", "On the Questionnaire tab, capture the customer's responses.", "On the Requirements tab, ensure all requirements are satisfied.", "Click Confirm to validate eligibility and adjust the expiration date if needed (hardship, military, student cases).", "In the Service Summary, review and click Continue.", "Review the Taxes and Fees screen and click Pay Now.", "Process payment in Checkout, click Complete Checkout, and download the temporary credential."], "tips": ["Renewal fees: ID $12.00, Class D DL $10.00, Class G Permit $7.00, Travel DL/ID $25.00.", "A vision screening or examination report dated within three months may be required.", "For mail renewal, vision screening may be waived for customers 64+ if the photo was updated within 12 years.", "The Renewal by Mail program ended 09/20/2024 for customers 64.5+; military DL holders remain eligible."]}, {"id": "credential-duplicate", "title": "Issue a duplicate credential", "cat": "Driver — Credentials", "intent": ["duplicate credential", "replacement license", "lost stolen license", "duplicate id permit cdl", "duplicate action dropdown", "same class expiration"], "page": "Driver/Credential_Issuance/Credential_Duplicate.htm", "what": "A duplicate is a replacement for a DL, IP, ID, or CDL issued when a customer's valid license has no open withdrawal actions. Used for loss, theft, damage, address/name changes, new photos, or restriction removal.", "steps": ["From the Services menu, select Credential Issuance.", "Search for and click Add for the customer.", "Review the customer's photos and obtain a new photo if needed.", "Select the address (residential or mailing) for the credential.", "Click the Credential tab and select 'Duplicate' from the Action dropdown.", "On the Questionnaire tab, capture the customer's response updates.", "On the Requirements tab, ensure all requirements are satisfied.", "Click Confirm to check eligibility.", "In the Service Summary, review and click Continue.", "Review the Taxes and Fees screen and click Pay Now or Add to Cart.", "Process payment, click Complete Checkout, and download the temporary credential."], "tips": ["Fees: IP $2.00, ID $12.00 (free for SSI or age 65+), DL $12.00.", "A duplicate credential retains the same class and expiration date.", "Sex offenders and those needing 12-year photo updates must apply in person.", "Customers with both Non-Travel and Arizona Travel credentials must update both simultaneously."]}, {"id": "processing-dcs-credentials", "title": "Process a credential for a DCS (foster) child", "cat": "Driver — Credentials", "intent": ["DCS credential", "department of child safety license", "foster child id", "DCS uploaded documents", "notice to provider", "DCS fee reason"], "page": "Driver/Credential_Issuance/Processing_DCS_Credentials.htm", "what": "Handles credential issuance for children in Arizona Department of Child Safety (DCS) care. A DCS representative uploads documents in advance, then the child visits an MVD office to receive an ID, Instruction Permit, or Driver License.", "steps": ["Before the visit, the DCS rep searches or creates the child's record in AZ MVD Now (AMN) and uploads the child's documents.", "In MAX, click Advanced Search.", "Type the child's name and date of birth in the appropriate fields and click Find.", "In the customer record, click the Documents icon to review the uploaded documents.", "Click the link or download icon for each document to verify it, then click Close to return to the Customer Record.", "Select the credential type, take the child's photo, and process the credential as normal.", "For ID cards, on the Taxes and Fees screen click Add Reason, select 'Department of Child Safety', enter the fee amount, and click Add.", "Continue with the normal process."], "tips": ["Do NOT print or provide the documents to either the caregiver or the child.", "Fees: ID no charge, IP $7.00, Restricted IP $3.00, DL $25.00.", "Required documents include a Birth Certificate (or Office of Vital Record DCS Data Verification form), Notice to Provider form #CSRO-1035A (listing the individual's name), and the application for ID/IP/DL.", "Consent for Restricted IP (form #96-0781) is required for ages 15-17.", "Contact: Maddie Carbajal, 602-712-6240."]}, {"id": "name-change", "title": "Change a customer's legal name", "cat": "Driver — Credentials", "intent": ["name change credential", "update legal name", "marriage divorce name change", "AKA name", "name change documents", "sealed court order name"], "page": "Driver/Credential_Issuance/Name_Change.htm", "what": "Updates a customer's legal name on their MVD credential when they have officially changed it. The customer must notify the Division within ten days after the change.", "steps": ["Access the Credential Issuance service.", "Click the Edit icon in the Name section of the Customer tab.", "In the Name Details pop-up, enter the First, Middle, and Last Name (Last Name is required).", "Click Save. The prior legal name becomes an AKA and the new name overrides it on the record."], "tips": ["The customer must first change their name with the SSA before applying (verification may take up to 48 hours).", "Require one primary ID plus a supporting document (marriage license, divorce decree, adoption decree, naturalization certificate, court order, or two permissible name-usage documents).", "For sealed court orders, a supervisor/designee must complete the change using online procedures with no links to previous records."]}, {"id": "power-of-attorney-nontravel-id", "title": "Issue a Non-Travel ID using a Power of Attorney", "cat": "Driver — Credentials", "intent": ["power of attorney id", "POA non-travel id", "military POA", "custodial care POA", "POA validity notarized", "designee signs application"], "page": "Driver/Credential_Issuance/Power of Attorney.htm", "what": "A Power of Attorney (POA) lets a designee act for a grantor. MVD accepts a valid POA to request a Non-Travel Identification Card when the customer meets prior eligibility and has an existing photo on file.", "steps": ["Verify POA validity: properly notarized, not expired, and the grantor is not deceased and has not revoked the powers.", "Have the designee sign the application (e.g., 'John Smith by Shirley Jones POA').", "If the customer has a current driver license on file, complete the Driver License/ID Cancellation Request, form #96-0384.", "Scan the POA together with the Identification Application.", "Reference the existing photo and signature on file (the 12-year photo rule does not apply)."], "tips": ["POA cannot be used for driver licenses or travel credentials (including duplicates), or for Sex Offender characteristic customers.", "Military POA is valid 1 year; custodial care POA is valid 6 months.", "Required form: #48-1001 Power of Attorney."]}, {"id": "photo-management", "title": "Capture a photo and verify signature", "cat": "Driver — Credentials", "intent": ["photo management", "take new photo credential", "photo first", "signature pad", "check portrait signature", "photo quality bypass"], "page": "Driver/Credential_Issuance/Photo_Management.htm", "what": "Handles photo capture and signature verification for driver license and ID services. MAX requires a new photo before completing any credential service for IP, DL, ID, CDL, and re-issues.", "steps": ["Find the customer in the queue and click the Service Name; click Edit Mode if the customer is unassigned.", "On the Customer tab, click the image placeholder to open the photo window.", "Select 'Take New Photo' to launch the photo software and click 'Start Live' for the live camera view.", "Click 'Capture' when the customer is ready and review results (red = unacceptable, green = acceptable); click 'Accept' if approved.", "Ask the customer to sign the signature pad; click 'Re-sign' if the signature needs correction.", "Click 'Check Portrait' and 'Check Signature'.", "Click 'Continue' to return to the credential service and verify the new photo appears on the Customer tab.", "Click 'Unassign' if you are a dedicated camera operator."], "tips": ["The Photo First photo is valid for one day, expiring at midnight the day it w
