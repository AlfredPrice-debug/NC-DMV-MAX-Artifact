 are coordinated by the Supervisor or Manager, who confirms services. (reference)"], "tips": ["The interpreter assists only outside the car at the start of the road test."]}, {"id": "advanced-search-other", "title": "Advanced Search - Other", "cat": "Everyday Transactions", "intent": ["advanced search", "search by plate", "search by VIN", "search by title", "search by registration", "search by placard", "search by permit", "find records"], "page": "Cross_Functional/Advanced_Search_Other.htm", "what": "Explains how to open Advanced Search in MAX and use its tabs to search by criteria other than customer, including Plate, Placard, Permit, VIN, Title, and Registration.", "steps": ["Click the Advanced link to the left of the Search field in the top banner of MAX.", "Note there are six tabs, each with their own search criteria: Customer, Plates, Placard, Permit, VIN, Title, and Registration.", "For customer searches, use the Finding a Customer topic > Advanced Search by Customer section. (reference)", "Select the appropriate tab and use Advanced Search by Plate to search by plate. (reference)", "Use Advanced Search by Placard or Advanced Search by Permit as needed. (reference)", "Use Advanced Search by VIN, Advanced Search by Title, or Advanced Search by Registration as needed. (reference)"], "tips": []}, {"id": "central-issuance-and-mailing", "title": "Central Issuance and Mailing", "cat": "Everyday Transactions", "intent": ["central issuance", "items mailed to customer", "controlled stock mailing", "plates credentials titles mailed", "mailing address priority", "central issuance dashboard", "wrong mail recipient"], "page": "Cross_Functional/Central_Issuance.htm", "what": "Explains Central Issuance, where controlled stock items not kept at the office are mailed to the customer from a central location, and how MAX handles mailing.", "steps": ["Understand Central Issuance refers to any controlled stock (numbered inventory) item not maintained at the office but mailed to the customer from a central location. (reference)", "Know which items are mailed centrally: Placards, Plates, Tabs and Registration, Titles (ONLY Print Title Service), Credentials, and OHV tabs. (reference)", "Know that AZ Serial Number (SNO) decals for State Assigned VINs remain in the offices. (reference)", "Identify services that will trigger a Central Issuance action. (reference)", "Confirm the Priority Order of Addresses for Mailing so items go to the correct location. (reference)", "Use the Central Issuance Mailing Dashboard to track mailed items. (reference)", "For titles, follow the Title Production Checklist for information needed from the customer. (reference)", "If a customer claims they received mail for someone who does not live at their address, follow the related guidance. (reference)"], "tips": ["Credentials and plates are mailed from different central areas."]}, {"id": "dealer-inquiry", "title": "Dealer Inquiry", "cat": "Everyday Transactions", "intent": ["dealer inquiry", "look up dealership", "validate dealer authority", "dealer license number search", "dealer name search", "dealer plate search"], "page": "Cross_Functional/Dealer_Inquiry.htm", "what": "Dealer Inquiry is a MAX search tool to look up an automotive dealership by Dealer License Number, Dealer Name, or Dealer Plate to validate their authority to sell a vehicle.", "steps": ["Open the Dealer Inquiry search tool in MAX. (reference)", "Review the About the Dealer Inquiry Search section to understand what it validates. (reference)", "Enter the dealership's Dealer License Number, Dealer Name, or Dealer Plate. (reference)", "Execute the Dealer Inquiry search. (reference)", "Review the results to validate the dealer's authority to sell a vehicle. (reference)"], "tips": []}, {"id": "fund-customer-account", "title": "Fund Customer Account", "cat": "Everyday Transactions", "intent": ["fund customer account", "add money to account", "fund account in office", "fund account AZ MVD Now", "assisted self-service invitation", "registration credits funding", "change due funding"], "page": "Cross_Functional/Fund_Account.htm", "what": "Explains the multiple ways a customer's account is funded, including MVD credits/refunds, change due, in-office payments, AZ MVD Now, and transfers from another account.", "steps": ["Understand accounts can be funded by MVD Registration Credits and other MVD Refunds, or by change due from an MVD service. (reference)", "Fund an account in an MVD Office via Cash, Check, Credit/Debit Card, or Other Payment Methods. (reference)", "Fund an account from AZ MVD Now via Credit/Debit Card or Electronic Payment (Individual customers if a CSR sends an Assisted Self-Service Invitation, or if the customer has the Individual Elevated MAX Balance Characteristic from a Fleet account). (reference)", "Transfer funds from another account; see Transfer Customer Account for more information. (reference)", "Review the Funding Amounts guidance before funding. (reference)", "Follow the Funding Account in an MVD Office steps for in-person funding. (reference)", "Follow the Funding Account Using AZ MVD Now steps for online funding. (reference)"], "tips": []}, {"id": "internal-office-notifications", "title": "Internal Office Notifications", "cat": "Everyday Transactions", "intent": ["internal office notifications", "send alert to team", "in-app messages", "notification center", "supervisor communicate to CSRs", "MAX notifications"], "page": "Cross_Functional/Internal_Office_Notifications.htm", "what": "Supervisors and managers can use MAX to send brief Alerts and In-App Messages (max 256 characters, expiring) to teams or individuals logged into MAX.", "steps": ["Understand notifications are not a replacement for email; they are a quick way to communicate to teams or individuals logged into MAX. (reference)", "Know there are two types: Alerts and In-App Messages, each limited to 256 characters and expiring after a set time. (reference)", "Use Alerts for real-time topics: they pop up on top of a logged-in CSR's activity without impacting their work and appear once, disappearing when closed. (reference)", "Use In-App Messages for information that should persist: they stay in the Notification Center until the CSR deletes it or it expires. (reference)", "Follow the Send a Notification to Team Members steps to send an Alert or In-App Message. (reference)", "Recipients follow the View Notifications steps to see messages in the Notification Center. (reference)"], "tips": ["Alerts only appear if the CSR is currently logged in to MAX."]}, {"id": "miscellaneous-purchase", "title": "Miscellaneous Purchase", "cat": "Everyday Transactions", "intent": ["miscellaneous purchase", "collect fees without service", "photocopies fee", "state assigned VIN fee", "inspection fee", "criminal records check fee", "vehicle use tax"], "page": "Cross_Functional/Miscellaneous_Purchase.htm", "what": "Use the Miscellaneous Purchase service to collect fees for items that do not have an associated service, such as photocopies, inspections, and the State Assigned VIN fee.", "steps": ["Identify that the fee has no associated service and qualifies for Miscellaneous Purchase (e.g., Non-Resident Daily Commuter Registration, Summons Subpoenas, Dealer List, Photocopies, TSS Applications, Inspections, Student AQCF Fee, State Assigned VIN, Insurance MVR, Criminal Records Check, Vehicle Use Tax). (reference)", "For a State Assigned VIN, collect the $5.00 fee only after a service is completed and a State Assigned VIN record was initially created. (reference)", "Note the State Assigned VIN fee applies ONLY for homemade vehicles/trailers, not VINs with fewer than 17 characters using the State Assigned VIN Type. (reference)", "Follow the Completing a Miscellaneous Purchase steps to collect the fees. (reference)"], "tips": []}, {"id": "notes-management", "title": "Notes Management", "cat": "Everyday Transactions", "intent": ["notes management", "add a note", "when to use notes", "service history vs notes", "note guidelines", "notes on vehicle record"], "page": "Cross_Functional/Notes_Management.htm", "what": "Explains that MAX automatically records Service History, so optional Notes should be used judiciously and only for supplemental details not already captured.", "steps": ["Use Service History as the main resource to research or review previous account activities, since MAX records what was done, when, and by whom. (reference)", "Add an optional Note only when supplemental details not already saved by MAX must be recorded and attached to the customer record. (reference)", "Keep Notes thorough but brief, within the 300-character maximum, with no acronyms, abbreviations, or codes. (reference)", "Do not state the obvious or duplicate info MAX already captures, and remember Notes are part of the record and could become part of a legal case. (reference)", "Follow the Viewing Notes steps to review existing notes. (reference)", "Follow the Adding Notes During a Service steps to add a note within a service. (reference)", "Follow the Adding Notes on Vehicle Record steps to add a note to a vehicle. (reference)"], "tips": ["Ask whether the Note adds value beyond just you; if not, don't save it.", "Notes are not formatted like a word processor - what you enter is what you get."]}, {"id": "one-time-mailing-address", "title": "One Time Mailing Address", "cat": "Everyday Transactions", "intent": ["one time mailing address", "mail document to different address", "temporary mailing address", "does not change record address", "multiple one time mailing addresses T and R"], "page": "Cross_Functional/One_Time_Mailing_Address.htm", "what": "A one time mailing address lets you mail a document to a specific address without changing the customer's record; it is saved only to the Service History for that service.", "steps": ["Understand a one time mailing address is used only to mail the document and is not saved to the customer record; it is saved to the Service History for that service. (reference)", "Know that the One-Time Mailing Address is the first address MAX checks when mailing items to a customer. (reference)", "Use the One-Time Mailing Address whenever there is doubt about which address items should go to (Domicile, Mailing, or Residential/Commercial); see Central Issuance and Mailing for details. (reference)", "Follow the Adding a One Time Mailing Address steps for a standard service. (reference)", "Follow the Adding Multiple One Time Mailing Addresses steps in a Title and Registration service when needed. (reference)", "To review, use the Viewing the One Time Mailing Address steps for a completed service. (reference)"], "tips": []}, {"id": "print-service-artifacts", "title": "Locate and Print Documents and Service Artifacts", "cat": "Everyday Transactions", "intent": ["print service artifact", "reprint receipt", "print temporary credential", "locate documents", "documents icon", "service history print", "default printer"], "page": "Cross_Functional/Printing_Service_Artifacts.htm", "what": "Explains how to locate and print artifacts (payment receipts, temporary credentials, placards, permits, and more) for a completed service from the Customer Record.", "steps": ["Confirm your default printer is set so documents print to a specific printer; if not, contact your supervisor or the help desk. (reference)", "Open the Customer Record, which retains electronic copies of payment receipts, temporary credentials, placards, permits, and more. (reference)", "Locate service artifacts using the Documents icon in the Navigation Bar. (reference)", "Alternatively, locate service artifacts by searching the Service History tab. (reference)", "Download and print the service artifacts. (reference)", "If artifacts are missing, follow the Missing Service Artifacts guidance. (reference)"], "tips": []}, {"id": "taxes-and-fees", "title": "Taxes & Fees", "cat": "Everyday Transactions", "intent": ["taxes and fees", "add a fee", "waive a fee", "adjust fees", "checkout fees", "T&R taxes and fees"], "page": "Cross_Functional/Taxes_Fees.htm", "what": "Most services include a Taxes and Fees screen before checkout where MAX calculates appropriate taxes and fees; occasionally you may need to add or waive fees.", "steps": ["Review the Taxes and Fees screen that displays before checkout; MAX analyzes the service data and shows appropriate taxes and fees based on business rules. (reference)", "Do NOT add fees that don't apply to the service, since adding a fee does not produce artifacts or update customer or vehicle data. (reference)", "If another service applies, complete that other service to charge the appropriate fees. (reference)", "For Title & Registration services, note the Taxes and Fees page displays the vehicle's VIN, year, and make when there is only one vehicle in the service. (reference)", "Follow the Adding Fees steps when a fee needs to be added. (reference)", "Consult the Fee Adjustments Chart and follow the Adjusting (Waiving) Fees steps when a fee must be waived. (reference)"], "tips": []}, {"id": "asq-for-location-administrators", "title": "Appointment Scheduling and Queuing (ASQ) for Location Administrators", "cat": "Customer & Records", "intent": ["ASQ for administrators", "manage scheduling users", "location scheduling changes", "queue dashboard", "manage open hours", "closed days", "add scheduling staff"], "page": "Customer/ASQ for Managers.htm", "what": "ASQ for Location Administrators lets certain staff make location-specific scheduling changes, manage users and security roles, and manage location hours, schedules, overrides, and queues.", "steps": ["Understand ASQ for Location Administrators has three main components: Reports, Users, and Locations. (reference)", "Use the Reports section, including the Queue Dashboard, to review location reports. (reference)", "Manage users who need ASQ access; only users already set up in MAX with an @mvm.azdot.gov username may be added. (reference)", "Assign one or more security roles when adding a user: Location Admin, Scheduling Staff, Queueing Location Supervisor, or Queueing Staff (Scheduling Role and one or more Locations required for the queueing roles). (reference)", "Search, add, edit, inactivate, and reactivate users, and review Hidden Users as needed. (reference)", "Use the Locations section to manage open hours, schedules, schedule overrides, and location queues. (reference)", "Use Modifying Closed Days to adjust the location's closed days. (reference)", "For the CSR experience, refer to Appointment Scheduling and Queuing (ASQ) for CSRs. (reference)"], "tips": []}, {"id": "financial-receipt-history", "title": "Financial Receipt History", "cat": "Customer & Records", "intent": ["financial receipt history", "account service history", "payment receipts", "receipt number lookup", "business transaction number", "account balance history", "ATP receipt search"], "page": "Customer/Financial_Receipt_History.htm", "what": "Financial Receipt History (Account Service History) is a collection of Payment Receipts that impact a customer's account, showing receipt, service, amount, and running balance details.", "steps": ["Open the Financial Receipt History (also called Account Service History) for the customer. (reference)", "Review the displayed fields: Receipt Number (click to download a PDF), Business Transaction Number (Service ID), Service Date, and Business Unit. (reference)", "Review the Customer, Service, Amount (which may or may not impact the balance), and running Balance columns. (reference)", "For ATP offices, note the ATP Customer Account includes every Payment Receipt processed by that Third Party, whether or not it impacts the balance. (reference)", "Use the Searching Financial Receipt History steps to find receipts. (reference)", "For ATP, use Searching a Specific Receipt Number for a TRP converted to Full Title and Reg. (reference)", "For ATP, use Searching a Specific Receipt Number for a Cancel Service Credit. (reference)"], "tips": []}, {"id": "request-customer-disbursement-2", "title": "Request Customer Disbursement", "cat": "Customer & Records", "intent": ["request disbursement", "return account balance", "prepaid voucher refund", "disbursement check", "digital disbursement to bank", "anti-fraud 7 day rule", "unclaimed disbursement check"], "page": "Customer/Request_Customer_Disbursement.htm", "what": "The Disbursement Request feature returns an unused Prepaid Voucher balance or Customer Account balance to the customer, either by check or by credit to their bank account (bank option only when submitted by the customer).", "steps": ["Confirm the customer has an unused Prepaid Voucher balance or a Customer Account balance to disburse. (reference)", "Confirm authorization for AZ MVD Now disbursements: Trusted Organization or Limited Trust Organization characteristic, or an active Fleet associated to the record. (reference)", "Apply the anti-fraud rule: a Disbursement Request can only be made 7 business days after the original account funding (does not apply to Registration Credits or other MVD refunds). (reference)", "Apply the frequency rule: if the customer funded their own account with no MVD refunds/credits, only one Disbursement Request per 30-day period is allowed, plus one additional request per MVD refund or credit. (reference)", "Tell the customer check disbursements are usually received within 7-10 days. (reference)", "Follow the Requesting a Customer Disbursement for the Customer in MAX steps. (reference)", "For online, follow the Customer Requests Disbursement through AZ MVD Now steps, or Refunding the Balance of a PrePaid Voucher (PPV). (reference)", "If a Disbursement Check Goes Unclaimed, follow that guidance; if the customer asks about a processed check, email ADOT_PFTO_Refunds@azdot.gov (preferred) or call 602-712-7507. (reference)"], "tips": ["Requests within 7 days of funding will produce an error."]}, {"id": "standalone-voter-registration", "title": "Voter Registration - Standalone Service", "cat": "Customer & Records", "intent": ["standalone voter registration", "register to vote", "voter registration tablet", "party affiliation", "early voting question", "FOOF business unit", "voter registration receipt"], "page": "Customer/Standalone_Voter_Registration.htm", "what": "The Standalone Voter Registration service lets a customer register to vote without processing a credential, using a tablet to answer preference questions; available only in FOOF Business Units.", "steps": ["From the Services menu, select Voter Registration under Miscellaneous.", "Search for the customer, who must have an established record with authorized presence, then click Add.", "Click Prompt Customer Questions to send the questions to the tablet.", "Have the customer select English or Spanish, click Yes to register to vote, and select Party Affiliation.", "If Other is selected, have the customer type the Other Party name on the onscreen keyboard, then answer Yes or No to the active early voting question and click Submit Questions.", "Back in MAX, if Other was selected, verify the Party Affiliation was typed in (type it per the customer's verbal request if not), then click Confirm.", "Verify the Service Summary screen with the customer (True = Yes, False = No); click Reopen and edit if incorrect, then click Continue.", "Click Pay Now (the Checkout - Service Summary screen may display briefly), then on the Service Finalized screen print the Voter Registration Receipt and provide it to the customer; print the Payment Receipt if requested."], "tips": ["This service is only available in FOOF Business Units.", "Follows the same rules for eligibility to vote; see Policy 7.1.2 Voter Registration."]}, {"id": "transfer-customer-account", "title": "Transfer Customer Account", "cat": "Customer & Records", "intent": ["transfer customer account", "move account balance", "transfer funds between accounts", "customer authorizes transfer", "verify account transfer"], "page": "Customer/Transfer_Customer_Account.htm", "what": "Transfer Customer Account moves all or part of a Customer Account balance to a different Customer Account; the account owner authorizes and initiates the transfer with MVD.", "steps": ["Confirm the customer owning the account funds authorizes and initiates the transfer. (reference)", "Confirm this is a transfer to another Customer Account (not a disbursement out of MVD); for disbursements out of MVD, see Request Customer Disbursement. (reference)", "Review the Examples to confirm the transfer scenario applies. (reference)", "Follow the Transferring Customer Account Funds steps to move all or part of the balance. (reference)", "Follow the Verifying the Account Transfer steps to confirm the funds moved correctly. (reference)"], "tips": []}, {"id": "trusted-organization", "title": "Trusted Organization", "cat": "Customer & Records", "intent": ["trusted organization", "trusted org characteristic", "no limit funding", "digital disbursement", "director approval", "account support unit", "dealer licensing unit"], "page": "Customer/Trusted_Organization.htm", "what": "The Trusted Organization Characteristic lets certain organizations fund accounts and request disbursements beyond preset limits, and request Digital Disbursements; only the Director of MVD may approve it.", "steps": ["Determine the organization needs to fund accounts or request disbursements beyond the preset limits. (reference)", "Understand the Trusted Organization Characteristic allows no limit on the amount or frequency of funds added and no limit on disbursement requests. (reference)", "Understand it also allows the ability to request Digital Disbursements from the Organization Customer Account. (reference)", "Confirm only the Director of MVD is authorized to approve the Trusted Organization Characteristic. (reference)", "Route the addition to the Account Support Unit (all organizations) or the Dealer Licensing Unit (Dealers only), the only units that can add it to Organization Records in MAX. (reference)", "See View Characteristics for details on how a characteristic is added. (reference)"], "tips": []}, {"id": "cancel-credential-voluntary", "title": "Cancel Credential - Voluntary", "cat": "Driver — Credentials", "intent": ["voluntary cancel credential", "cancel driver license", "DL ID cancellation request form 96-0384", "guardian withdraw consent", "cancel ID for non-travel DL", "notarized cancellation"], "page": "Driver/Credential_Issuance/Cancel_Credential.htm", "what": "Explains voluntary license cancellation (without prejudice), the required Driver License / ID Cancellation Request form #96-0384, and related rules including guardian consent withdrawal and ID cancellation upon Non-Travel DL issuance.", "steps": ["Confirm the cancellation is voluntary and without prejudice; the person may reapply for a new license at any time after cancellation. (reference)", "Have the customer complete the Driver License / ID Cancellation Request, form #96-0384, filling the top section (Name, DOB, Address, City, State, Zip, License Type, Number, Issue Date, Expiration Date). (reference)", "Individuals complete the Licensee Use section for themselves with a notarized signature; Agents also need Power of Attorney if not signed by the licensee; Legal Guardians complete the Legal Guardian Section notarized. (reference)", "Note an individual whose DL is suspended who requests to cancel their DL and be issued an extended ID does not need form #96-0384 (the ID application serves as written consent). (reference)", "Apply the ID cancellation rule: an individual may not hold an ID card and a Non-Travel DL; upon issuing a Non-Travel DL, cancel the Arizona ID (does not apply to IP or Travel IDs). (reference)", "For guardian consent withdrawal, require a completed form or notarized written request with the minor's Name, DOB, and License Number; the DL/IP cannot be expired. (reference)", "Do not cancel the DL if the guardian's request is submitted after the minor turns 18. (reference)", "Follow the Cancel Credential in MAX steps to process the cancellation; see Policies 3.5.8 and 3.8.1 and Form #96-0384. (reference)"], "tips": ["An applicant may hold both an Arizona ID and an IP, and may hold a Non-Travel DL and a Travel ID."]}, {"id": "cdl-duplicate", "title": "Duplicate Commercial Learner Permit or Commercial Driver License", "cat": "Driver — CDL", "intent": ["duplicate CLP", "duplicate CDL", "replacement commercial license", "lost stolen CDL", "CDL name change address change", "duplicate CDL online AZ MVD Now", "non-domicile CDL duplicate"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Duplicate.htm", "what": "A Credential Issuance service issues a replacement CLP or CDL for lost/stolen/mutilated, address or name change, or new photo; the duplicate retains the same class, endorsements, and expiration date.", "steps": ["Confirm the license is valid with no open withdrawal actions and proper identification is presented. (reference)", "Confirm the reason: lost, stolen, mutilated, change of address, name change, or new photo; the duplicate retains the same Class, Endorsement(s), and Expiration date. (reference)", "Note endorsement removal requires an in-person visit to an MVD or ATP office. (reference)", "Collect required items: Travel License/Identification Application form #40-5122, proof of identity, and a new photo per Digital Image Standards; SSN is not required unless a name change is requested; Alien Registration number is not required for a duplicate. (reference)", "For a male applicant under 26, obtain consent to register with the US Selective Service System. (reference)", "For Limited Term and Non-Domicile CDLs, require an in-person visit with documents presented; scan any new SAVE results into the customer's documents. (reference)", "If a Non-Domiciled SAVE final response does not confirm I-94/I-94A category H-2A, H-2B, or E-2, do not issue the duplicate and initiate the required downgrade for CLP/CDL privileges. (reference)", "Collect the duplicate fee (CLP $2.00; CDL Class A, B, or C $12.00) and follow the Credential Duplicate topic > Issuing a Duplicate Credential steps. (reference)"], "tips": ["CDLs only: duplicate with no changes and no One Time Mailing Address may be done online at AZ MVD Now.", "If the applicant has FMCSA Drug and Alcohol Clearinghouse (DACH) issues, refer them to DACH."]}, {"id": "cdl-renewal", "title": "Renewal Commercial Learner Permit (CLP) and Commercial Driver License (CDL)", "cat": "Driver — CDL", "intent": ["renew CLP", "renew CDL", "commercial license renewal", "8 year CDL", "CDL renewal fees", "hazmat renewal STA", "expired CDL retest", "primary document proof of citizenship"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Renewal.htm", "what": "A Credential Renewal service renews an expired or expiring CLP or CDL; Arizona issues an eight-year CDL (with exceptions), retaining the same class and endorsements with a new expiration date.", "steps": ["For a CLP (valid up to one year), have the applicant retake all segments of the knowledge tests; Vehicle Inspection and Basic Control Skills Test passing scores are valid only for the remaining CLP period. (reference)", "For a CDL, allow renewal up to six months prior to expiration; the eight-year CDL includes holders over age 65 (exceptions: Limited Term, Non-Domicile, Sex Offender). (reference)", "Require all applicable tests if the CDL has been expired or withdrawn for more than one year. (reference)", "Collect the Travel License/Identification Application (form #40-5122 or Spanish #40-5122s) and the required SSN; the customer keeps the same class and endorsements (endorsements cannot be added or removed during renewal). (reference)", "Verify the Primary document (proof of U.S. citizenship) - a scanned artifact on file in MAX/Documents or OnBase may be used; foreign customers must provide original Authorized Presence documentation. (reference)", "Require proof of address if the current credential does not reflect the current physical address, and confirm no withdrawal actions on the record. (reference)", "For Hazmat, require a valid HME Security Threat Assessment (STA) to renew the HME; for Limited Term and Non-Domicile CDLs, require an in-person visit with documents and scan any new SAVE results. (reference)", "Collect renewal fees (e.g., Class A/B Non-TID $15.00 / TID $25.00; Class C Non-TID $10.00 / TID $25.00; +$10.00 for Hazmat) and follow the Credential Renewal topic > Renewing Credential steps; provide a CDL Maintenance Card. (reference)"], "tips": ["Customers with both Travel and Non-Travel credentials must update both at renewal and pay all applicable fees.", "If presenting an expired CDL due to the 8-year extension, they may request a duplicate for $12 to reflect the extended expiration date.", "Refer FMCSA DACH issues to DACH."]}, {"id": "cdl-charts-reference", "title": "Commercial Driver License Charts", "cat": "Driver — CDL", "intent": ["CDL classes", "CDL knowledge test questions", "CDL fees chart", "CDL endorsements", "CDL restrictions", "hazmat STA every 5 years", "ELDT requirements", "GCWR GVWR"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Driver_License_Landing_Page.htm", "what": "Reference charts covering CDL classes (A, B, C), knowledge test question counts and passing thresholds, fees, endorsements, restrictions, and ELDT requirements.", "steps": ["Review CDL Classes: Class A (combination, GCWR 26,001+ lbs with towed GVWR over 10,000 lbs), Class B (single vehicle GVWR 26,001+ lbs), and Class C (16+ passengers or hazardous materials). (reference)", "Review the knowledge test chart for total questions, allowed misses, and correct answers needed (e.g., General Knowledge 50/10/40; Combination 20/4/16; Air Brakes 25/5/20). (reference)", "Review the CDL Fees chart for General Knowledge/Skills test and endorsement fees, and out-of-state to AZ renewal/reinstatement rules. (reference)", "Review restrictions (e.g., L Non Air Brake, E No Manual Transmission, K Intrastate Only, Z No Full Air Brake) and which require permit and skills test to remove. (reference)", "Review endorsements: P (Passenger), S (School Bus), T (Doubles/Triples), N (Tank), H (Hazmat), X (Tanker/Hazmat) and their test requirements. (reference)", "Note Hazmat requires a current HME Security Threat Assessment (STA) every 5 years and knowledge re-test if last taken more than 12 months prior. (reference)", "Note ELDT is required for first-time CDL, upgrade Class B to A, and first-time S, P, or H endorsements, and ELDT verification must be completed before the H knowledge test. (reference)", "When an initial or renewal CDL is issued or a new endorsement added, provide the customer a CDL Maintenance Card. (reference)"], "tips": ["Skills test fees are not collected unless MVD is conducting the skills test; some applicants use a 3rd party trucking school.", "The General Knowledge test is the same for all classes."]}, {"id": "correct-credential", "title": "Correct Credential", "cat": "Driver — Credentials", "intent": ["correct credential", "fix credential info", "division error correction", "duplicate for correction", "change class or endorsements"], "page": "Driver/Credential_Issuance/Correct_Credential.htm", "what": "Explains which service to use when correcting credential information: Credential Duplicate for most fields, or Credential Issuance when the Class or Endorsements change.", "steps": ["Identify what needs to be corrected on the credential. (reference)", "If any information other than Class or Endorsements needs updating (due to Division error or customer request), use the Credential Duplicate service to make the updates and issue the duplicate. (reference)", "If there is a change in Class or Endorsements, use the Credential Issuance service instead. (reference)", "Complete the appropriate service to issue the corrected credential. (reference)"], "tips": []}, {"id": "credential-issuance-cdl-scenarios", "title": "Credential Issuance - CDL Scenarios", "cat": "Driver — CDL", "intent": ["CDL issuance scenarios", "CDL two visit flow", "apply for CDL permit", "CDL knowledge tests", "CDL skills road test", "14 day permit hold", "out of state CDL transfer", "medical exam certificate"], "page": "Driver/Credential_Issuance/Credential_Issuance_CDL_Scenarios.htm", "what": "Summarizes the typical two-visit CDL issuance flow (permit and knowledge tests, then skills/road test and CDL issuance) and links to detailed CDL scenarios.", "steps": ["Visit 1: Verify eligibility, submit the Medical Exam Certificate (MEC) to Medical Review by creating a Work Task, and pay fees for the test(s). (reference)", "Visit 1: Take the applicable knowledge test(s), satisfy requirements, and issue the CDL Permit. (reference)", "Visit 2: Verify eligibility - the applicant must have held the CDL permit for 14 days before being road tested and issued a CDL. (reference)", "Visit 2: Ensure the MEC was reviewed and input by Medical Review so the requirement is satisfied. (reference)", "Visit 2: Take the applicable Skills/Road Test(s) and/or enter skills test results in Requirements, then pay fees for the test(s) and application. (reference)", "Visit 2: Issue the CDL and applicable endorsements. (reference)", "For detailed steps, follow the relevant scenario: Commercial Permit (No Endorsements or With Endorsements), Issue Class A/B/C, or Out of State CDL Transfer with or without Hazmat. (reference)", "When completing a Credential Issuance service, print the Credential Application from MAX (see Printing the Credential Application). (reference)"], "tips": ["To schedule a CDL skills test appointment, see the Phone Service Process > Standard Work > Scheduling Appointments > Commercial Driver Licensing Appointments section."]}, {"id": "credential-issuance-scenarios", "title": "Credential Issuance Scenarios", "cat": "Driver — Credentials", "intent": ["credential issuance scenarios", "non-travel to travel ID same day", "non-travel to travel ID different day", "correct voter registration error", "special credential situations", "what to do for each scenario"], "page": "Driver/Credential_Issuance/Credential_Issuance_Scenarios.htm", "what": "Reference page listing specific credential issuance scenarios and what a CSR needs to do for each.", "steps": ["Identify which credential issuance scenario applies to the customer.", "For a non-travel to travel ID upgrade on the same day, follow the Non-Travel to Travel ID - Same Day guidance.", "For a non-travel to travel ID upgrade on a different day, follow the Non-Travel to Travel ID - Different Day guidance (Knowledge or Skills Testers only).", "To fix a voter registration mistake, follow the Correcting Error on Voter Registration guidance.", "Complete the credential service according to the steps for the matching scenario."], "tips": ["The Different Day non-travel to travel ID scenario is limited to Knowledge or Skills Testers only."]}, {"id": "adc-released-offender-id-affidavit", "title": "Accept Department of Corrections Released Offender ID or Affidavit of Identification", "cat": "Driver — Credentials", "intent": ["ADC released offender identification card", "affidavit of identification", "proof of authorized presence", "sex offender SO indicator", "released offender authorized presence", "accept corrections ID"], "page": "Driver/Credential_Issuance/Department_of_Corrections_ID_DL.htm", "what": "Explains when a Released Offender Identification Card or Affidavit of Identification from the Arizona Department of Corrections may be accepted as proof of authorized presence and how to handle it in MAX.", "steps": ["Confirm the Released Offender Identification card contains a photo of the customer.", "Verify the card displays a digitized photo image and specific identification information.", "Check the Citizen field shows the abbreviation 'U. S.'; do not accept it if the field is blank or contains any other abbreviation.", "Watch for an 'SO' indicator, which signifies a customer required by law to register as a sex offender.", "For authorized presence in MAX, use the U.S. Birth Certificate option for now, since the Arizona Released Offender Card is not yet an option when adding Authorized Presence.", "Upon issuance of the credential, return the card or affidavit to the customer along with any documentation presented.", "Do not hole punch any portion of the card or affidavit."], "tips": ["Reference: Policy 3.8.8 Sex Offender (SO) Registration and form #40-5144 Arizona DL/ID Requirements.", "The workaround using the U.S. Birth Certificate option is temporary until MAX is programmed with the proper option."]}, {"id": "medical-screening-overview", "title": "Medical Screening Overview", "cat": "Driver — Credentials", "intent": ["medical screening", "physical and mental examinations", "vision screening", "CSR medical responsibilities", "required examinations or evaluations", "safe operation medical review"], "page": "Driver/Credential_Issuance/Medical_Screening_Overview.htm", "what": "Overview of medical screening for driver credentials, noting the Division may require physical and mental examinations beyond eyesight for safe operation of a motor vehicle.", "steps": ["Review your CSR responsibilities for medical screening.", "Determine whether the customer requires additional examinations or evaluations beyond the vision screening.", "Reference the medical terms and definitions to understand the customer's situation.", "Apply the applicable medical screening and operational restriction policies when processing the credential.", "Use the appropriate medical forms (such as Vision Examination Report or Medical Review Program Substance Abuse Evaluation) as needed."], "tips": ["Reference policies include 3.1.2 Medical Screening and Operational Restrictions, 3.1.5 CDL Medical Requirements, and 3.2.1 Vision Screening Standards and Restrictions."]}, {"id": "hearing-impaired-road-test", "title": "Conduct a Hearing Impaired Road Test", "cat": "Driver — Testing & Eligibility", "intent": ["hearing impaired road test", "non-commercial road test accommodations", "flashcards for road test", "before you take the road test form", "communicate with hearing impaired applicant", "ADA accommodation road test"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Hearing_Impaired_Road_Test.htm", "what": "Explains how to prepare for and conduct a non-commercial road test with a hearing impaired individual using written communication and flashcards.", "steps": ["Before beginning, provide the expectations of the entire examination process to the applicant.", "Allow the applicant to ask or write any questions to verify they understand the instructions.", "Print the required resources: Before You Take The Road Test form #99-0138, the Hearing Impaired Road Test Question Flashcards, the Directions flashcards, the Examiner Road Test Talk Track, and your office's Road Test Route Map; have a notepad and pen or pencil ready.", "Have the applicant read the 'Before You Take...' overview and confirm they understand the instructions.", "Have the applicant move their vehicle to the starting position for the first exercise (Vehicle Inspection and Customer Basic Safety Knowledge).", "Once in position, have the applicant read the instructions for the exercise and perform the task(s), repeating this for each of the two required exercises.", "Provide any needed clarification by writing notes between the applicant and Examiner.", "Complete the Vehicle Inspection, Customer Basic Safety Knowledge, and Road Test exercises."], "tips": ["Use your office's established route maps for non-commercial road tests.", "If the applicant needs additional accommodations, the office manager may contact Civil Rights for guidance; see the ADA Office Compliance topic."]}, {"id": "medical-re-exam-testing", "title": "Conduct Medical Re-Exam Testing", "cat": "Driver — Testing & Eligibility", "intent": ["medical re-exam testing", "45 day CAN notice date", "re-exam skills test", "vision knowledge vehicle control testing", "returning medical re-exams", "medical re-exam CSR window responsibilities"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Medical_Re-Exam_Testing.htm", "what": "Explains how to verify eligibility and conduct medical re-exam testing, which requires certification in conducting road tests.", "steps": ["For the initial visit or any return visit, verify the customer is still within 45 days of the Notice Date of the CAN before sending them out for any testing.", "If the customer failed to complete all tests within 45 days and the one-year suspension/revocation time is over, see the Medical Reasons topic > Failed Re-Exam: Suspension/Revocation Time Frame is Over section.", "Review the Medical Reasons topic > Medical Re-Exams section for background on the rules of the re-exam and failing a re-exam.", "Complete the CSR-at-window responsibilities prior to the medical re-exam.", "Begin the re-exam (or process a returning medical re-exam as applicable).", "Conduct the required testing: Vision Screening, Knowledge Testing, Vehicle Control Skills Testing, and Non-Commercial Skills Testing."], "tips": ["You must be certified in conducting road tests to conduct a Medical Re-Exam.", "Reference the Medical Re-Exam Skills Test, Instructions and Parking Maneuvers, Scoring Guidelines, and the Re-Exam Overall Process Flow Chart."]}, {"id": "motorcycle-skill-test", "title": "Administer a Motorcycle Skill Test", "cat": "Driver — Testing & Eligibility", "intent": ["motorcycle skill test", "ALMOST test", "special motorcycle skill test SMST", "protective gear motorcycle", "100cc restriction", "three wheel cycle restriction", "MSF card"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Motorcycle_Skill_Test.htm", "what": "Explains administering the Alternative Motorcycle Operator Skill Test (ALMOST) and Special Motorcycle Skill Test (SMST), which incorporate Motorcycle Safety Foundation methods, plus related restrictions.", "steps": ["Confirm you are a certified motorcycle skill test examiner (see Motorcycle Skill Test Examiner Training in the New Hire Training website).", "Verify protective gear requirements are met before starting the motorcycle skills test.", "Administer the ALMOST or the Special Motorcycle Skill Test (SMST) as applicable.", "If the customer tests on a motorcycle, motor driven cycle, or moped with a maximum piston displacement of 100cc or less (or presents an MSF card stamped '100cc<' in red), add the 100cc restriction to the customer's driving record.", "If the customer completes the test using a three-wheel motorcycle, a motorcycle with a sidecar, or an ATV, place a 'Three Wheel Cycle' restriction on the driver license and customer record.", "Enter the motorcycle skill test results and view them in Credential Issuance.", "Remove the 'Three Wheel Cycle' restriction only when the customer completes the ALMOST or SMST on a two-wheeled motorcycle or by removing the M endorsement."], "tips": ["Fees paid by the customer are valid until the original credential has been issued after testing is completed.", "Test results from the Division are valid for life and do not expire.", "Reference Policy 3.4.7 ALMOST/SMST Requirements and the Driver License Operational Restrictions Chart."]}, {"id": "photo-first-work-around", "title": "Use the Photo First Work Around", "cat": "Driver — Credentials", "intent": ["Photo First workaround", "upload portrait photo and signature", "launch simulator photo", "temporary photo workaround MAX", "no camera photo upload", "credential photo requirement"], "page": "Driver/Credential_Issuance/Photo_First_Work_Around.htm", "what": "Temporary workaround allowing you to upload a portrait photo and signature image from your local computer to satisfy the Photo First requirement while MAX is under development and cameras are unavailable.", "steps": ["Download the portrait photo and signature images to your local computer.", "Start the credential service and launch the Simulator.", "In the Launch Simulator, upload the portrait photo image and the signature image from your local computer.", "Check that the images uploaded correctly.", "Continue with the credential service now that a new photo is in place."], "tips": ["Photo First is an MVD policy requiring an updated photo for all new, duplicate, or renewal credentials.", "This workaround is only needed while MAX is under development; when MAX goes live, Photo First will be satisfied using an office camera."]}, {"id": "reactivate-credential", "title": "Reactivate a Credential Canceled in Error", "cat": "Driver — Credentials", "intent": ["reactivate credential", "canceled in error", "contact Tech Support reactivation", "out of state erroneous cancellation", "restore driver license", "credential status active"], "page": "Driver/Credential_Issuance/Reactivate Credential.htm", "what": "Explains the process for having an active credential that was canceled in error reactivated through Tech Support.", "steps": ["Confirm the credential is not expired and has no open withdrawal, otherwise it cannot be reactivated.", "Contact Tech Support at (602) 712-4900 to request re-activation of the canceled credential.", "Provide the Tech Support agent a brief description of how the credential was canceled in error.", "If the credential is not expired, Tech Support will move forward with reactivating it.", "If the credential was canceled erroneously by an out-of-state jurisdiction, contact Tech Support so they can research the out-of-state issuance."], "tips": ["A credential cannot be reactivated if its status is not active due to an open withdrawal or because it is expired."]}, {"id": "sex-offender-credential", "title": "Process a Sex Offender Credential", "cat": "Driver — Credentials", "intent": ["sex offender characteristic", "SO registration credential", "sex offenders and photos", "add sex offender characteristic", "required documentation sex offender", "process sex offender credential"], "page": "Driver/Credential_Issuance/Sex_Offender.htm", "what": "Explains how to apply for and process a credential for a customer with a sex offender characteristic, including required documentation and adding the characteristic.", "steps": ["Review the sex offender characteristic and how it applies to the customer.", "Gather the required documentation for the sex offender credential application.", "Follow the guidance for sex offenders and photos.", "Add the sex offender characteristic to the customer record.", "Process the sex offender credential."], "tips": ["Reference: Policy 3.8.8 Sex Offender (SO) Registration."]}, {"id": "skills-test-tablets", "title": "Use Skills Test Tablets", "cat": "Driver — Testing & Eligibility", "intent": ["skills test tablets", "offline skills test application", "walk in tests", "appointment tests", "commercial skills tests tablet", "motorcycle skills test tablet"], "page": "Driver/Credential_Issuance/SkillsTestTablets.htm", "what": "Explains using the tablets equipped with a downloaded Skills Test desktop application for tests when not connected to the internet.", "steps": ["Use the tablet's downloaded Skills Test desktop application for tests when there is no internet connection.", "Learn the Skills Test basic navigation on the tablet.", "Select the appropriate flow for Walk In Tests or Appointment Tests.", "Choose the correct test type: Non-Commercial Skills Test, Motorcycle Skills Test, Three Wheel Motorcycle Skills Test, or Commercial Skills Tests.", "Conduct the test and record results in the tablet application."], "tips": []}, {"id": "process-travel-id-started-on-az-mvd-now", "title": "Process a Travel ID (TID) Started on AZ MVD Now", "cat": "Driver — Credentials", "intent": ["process travel ID from AZ MVD Now", "AMN Travel ID Upgrades Queue", "TID eligibility", "customer denied come into office", "download customer provided documents", "finish TID issuance"], "page": "Driver/Credential_Issuance/Travel ID (TID) via AZ MVD Now.htm", "what": "Explains how CSRs finish the Travel ID issuance for customers who started their upgrade to an Arizona Travel ID in their AZ MVD Now account.", "steps": ["Access the AMN Travel ID Upgrades Queue.", "Confirm the customer's eligibility: photo on record is less than 8 years old, they hold a non-commercial or commercial credential without HazMat, and they have added funds to the account.", "Verify the primary document uploaded is one already in our systems (OnBase, MAX, etc.), or a new document that can be verified electronically through SAVE or USPVS.", "Confirm the TID requirements are met: primary document, SSN, and proof of address.", "Process the TID service from the queue, downloading the documents the customer provided as needed.", "Retain the existing name if the primary shows a maiden name but the name change is already supported in MAX or OnBase; do not perform initial name changes during this process.", "If the customer is not eligible, mark them Denied - Must Come Into MVD Office and follow the common scenarios guidance."], "tips": ["Require the customer to upload the front and back of an authorized presence card if the document number is not found on the front; see the Foreign Authorized Presence topic.", "We will not do initial name changes during this process."]}, {"id": "aamva-helpdesk-driver-functions", "title": "Use AAMVA Helpdesk - Driver Functions in MAX", "cat": "Driver — Records & Withdrawals", "intent": ["AAMVA Helpdesk driver functions", "out of state convictions and withdrawals", "SPEXS pointer update error file", "unlinked driver actions", "create AAMVA message", "link withdrawal to conviction"], "page": "Driver/Event_Management/AAMVAHelpdesk-Driver.htm", "what": "Reviews the AAMVA Helpdesk - Driver functions in MAX used primarily by Driver Improvement and MVD Support Services to investigate and correct driver data related to out-of-state convictions and withdrawals.", "steps": ["Review the AAMVA system interfaces and how they relate to Credential Services and the Driver Record in MAX.", "Use AAMVA Helpdesk - Create Message to send an inquiry as needed.", "Work the AAMVA Helpdesk Exception Queue and use Search Messages and Search Services to locate items.", "Review the SPEXS Pointer Update Error File for pointer update errors.", "Address AAMVA Helpdesk Unlinked Driver Actions.", "Use AAMVA Helpdesk - Link Withdrawal to Conviction to correctly associate withdrawals with convictions."], "tips": ["These functions are used primarily by the Driver Improvement and MVD Support Services units."]}, {"id": "commercial-withdrawal-incidents", "title": "Commercial Withdrawal Incidents", "cat": "Driver — CDL", "intent": ["commercial withdrawal incidents", "CDL disqualification lifetime permanent", "CDL medical suspension revocation", "failed to submit USDOT medical exam", "HME security threat assessment", "CDL voluntary downgrade", "CLP invalid on withdrawal"], "page": "Driver/Event_Management/Commercial_Withdrawal_Incidents.htm", "what": "Explains commercial withdrawal incidents affecting CDL holders, including reporting duties, disqualifications, medical suspensions/revocations, HME threat assessments, and voluntary downgrades.", "steps": ["Understand that a CDL holder must notify the Division and their employer within 30 days after a conviction relating to motor vehicle traffic (parking violations excepted).", "Do not issue a Class A, B, or C CDL to an applicant under disqualification until the privilege is properly restored; note any CLP becomes invalid when the operator license is withdrawn.", "Require the applicant to reapply, pay all reinstatement fees, and complete required tests; re-administer all knowledge and skills tests when a CDL was withdrawn or expired one year or more.", "For expired Medical Examiner's Certificates, have INTERstate applicants submit medical documentation electronically via a FMCSA-qualified professional, and accept INTRAstate paper documentation at a field/ATP office or via email.", "Recognize the two CDL disqualification types: Lifetime Disqualification (reinstatable after ten years if eligible) and Permanently Disqualified (never able to obtain a CDL).", "Handle HME issues: if TSA does not approve the STA, a CDL cancellation notice is mailed; remove the H or X endorsement and issue a no-fee duplicate if surrendered within 15 days, otherwise cancel the Arizona CDL.", "For a customer whose CDL privilege is disqualified, suspended, or revoked, process a CDL Voluntary Downgrade to a class D or M license when they choose it."], "tips": ["A CDL will expire if revoked for one year or more; the holder must complete all original-application knowledge, vision, and skills testing and submit a current MEC to obtain a new CDL.", "A customer may request a hearing with the Executive Hearing Office (EHO) within 15 days of the licensing action date of notice.", "Reference policies include 3.6.5 CDL Actions/Convictions and 3.8.2 Disqualifications."]}, {"id": "customer-pointer-management", "title": "Manually Update Customer Pointers", "cat": "Driver — Records & Withdrawals", "intent": ["customer pointer management", "manually update pointers", "batch process failed pointer", "MVD Support Services pointer fix", "pointers reflect credentials issued", "correct pointer data in MAX"], "page": "Driver/Event_Management/CustPointerMgmt.htm", "what": "Provides for manual updating of pointers in MAX in the rare event a batch process failed; used only by the MVD Support Services team.", "steps": ["From the Management menu, select Customer Pointer Management.", "Search for the customer.", "Use the dropdown(s) to select any pointer updates needed.", "Click Save."], "tips": ["Changing a pointer in this function only corrects the data in MAX and will NOT update the pointer with AAMVA.", "This function should only be used in the event a batch update failed and is used very rarely by MVD Support Services."]}, {"id": "driver-reinstatement", "title": "Handle Driver Reinstatement", "cat": "Driver — Records & Withdrawals", "intent": ["driver reinstatement", "active withdrawals compliance", "reinstatement fees", "admin per se suspension fee", "revocation application", "restore driving privilege", "SIIRDL reinstatement fees"], "page": "Driver/Event_Management/Driver_Reinstatement.htm", "what": "Explains that Driver Reinstatement is not a separate service in MAX; a customer with active withdrawals must meet all compliance requirements before their driving privilege can be restored, and applicable reinstatement fees are collected.", "steps": ["Determine whether the customer has active withdrawals (stops, cancellations, revocations, etc.) that must be satisfied.", "If the credential was not canceled or revoked, continue services on their non-expired existing credential once compliance is satisfied.", "If the credential expired while the withdrawal was in place and compliance is now satisfied, provide a Credential Issuance service.", "If the credential was canceled or revoked due to a withdrawal and the Arizona Privilege Status shows ELG (reinstated), provide a Credential Issuance service.", "Collect the required reinstatement fees based on the type and combination of withdrawal actions ($10 suspension/disqualification, $20 revocation, $50 Admin Per Se), combining certain fees where allowed.", "For a revocation, begin with a properly completed Revocation Application (form #99-0139).", "Do not accept personal checks for the payment of any reinstatement fee."], "tips": ["For Admin Per Se: reinstatement fees are required if expunged, but no fees are required if rescinded.", "For suspensions on or after August 9, 2017, the customer is no longer kept suspended until fees are paid but must pay when renewing, replacing, or updating a credential."]}, {"id": "event-history", "title": "View Event History", "cat": "Driver — Records & Withdrawals", "intent": ["event history", "incident withdrawal compliance history", "status updated by field", "view changes to record", "incident history tab", "withdrawal history tab", "compliance history tab"], "page": "Driver/Event_Management/Event_History.htm", "what": "Explains how authorized units view the history of changes made to an Incident, Withdrawal, or Compliance in MAX.", "steps": ["Access Event History either through the Driver Record Service at the bottom of the Driving History page, or from the MAX main menu under Management > Event Management.", "Select an Incident or Withdrawal; MAX opens the Incident History tab for an incident, or the Withdrawal History tab for a withdrawal.", "On the Incident History tab, review details such as description, violation code, occurrence date, status date, and 'Status Updated By' (Other, RACF, Conversion, or Post Fix).", "For Medical Incidents, use the drop-down option to see the Medical Alert Type that was added or changed.", "On the Withdrawal History tab, review withdrawals associated to the incident and note the check-mark and colored row indicate a change was made.", "On the Compliance History tab, review when a compliance was updated.", "Select Return to All Event History to view another incident or withdrawal, or Return to Driving Record to exit."], "tips": ["The Interlock unit is the only unit able to see a user name in the 'Status Updated By' / 'Updated By' field.", "There is no meaning behind the colors on each line; the colored row simply indicates a change."]}, {"id": "link-unlink-convictions-withdrawals", "title": "Link or Unlink Convictions to Withdrawals", "cat": "Driver — Records & Withdrawals", "intent": ["link convictions to withdrawals", "unlink conviction", "manage withdrawal conviction details", "AAMVA helpdesk link", "save link", "blue arrow linked withdrawal", "implied consent suspension"], "page": "Driver/Event_Management/How_to_Link_Unlink_Convictions to Withdrawals.htm", "what": "Explains how to link (or unlink) an incident/conviction to a withdrawal so the record correctly reflects which incident caused which withdrawal.", "steps": ["Click the Hamburger menu (three horizontal lines).", "Click AAMVA/Helpdesk, then click Link Withdrawals to Conviction.", "Type in the Customer Name or Number and click Search.", "When the Manage Withdrawal Conviction Details window populates, click the drop-down arrow under Withdrawals (listed chronologically, oldest at top).", "Select the withdrawal you want to update and confirm its details, since you may have multiple identical withdrawals.", "Locate the incident to link and click the box in the 'Link' column (blue checked boxes are linked; uncheck a box to unlink a conviction).", "Click Save Link, then click Yes when the confirmation box appears.", "Confirm the green success message in the upper right corner and verify the link on the customer record."], "tips": ["The lack of a little blue arrow next to an incident indicates there is no linked withdrawal.", "Linking helps correctly reflect what incident(s) caused which withdrawal(s)."]}, {"id": "interlock-reinstatement-issuance", "title": "Interlock Reinstatement and Issuance", "cat": "Driver — Records & Withdrawals", "intent": ["interlock reinstatement", "issue credential with IID", "DUI suspension ignition interlock", "IID installation compliance", "compliance monitoring IID line", "restricted credential interlock"], "page": "Driver/Event_Management/Interlock_Issuance.htm", "what": "Explains the two key steps to reinstate a customer with a DUI suspension that requires an ignition interlock device and issue a new credential with the interlock restriction.", "steps": ["Satisfy all compliance related to the DUI Incident/Withdrawal EXCEPT the IID Installation requirement (this may include Suspension Reinstatement Fees, Alcohol Screening/Education, SR22, etc.).", "Do NOT satisfy the IID Installation requirement manually.", "Wait for the overnight process: once the installer has transmitted the IID install data, MAX builds the IID monitoring line in Compliance Monitoring, which automatically satisfies the IID Installation Compliance requirement.", "Confirm all compliance requirements are satisfied and the customer no longer shows suspended.", "Issue the customer's restricted credential with the interlock restriction."], "tips": ["The IID Installation Compliance is satisfied automatically overnight from the installer's transmitted data, not manually."]}, {"id": "manage-edui-rejections-convictions", "title": "Manage Electronic DUI Rejections and Convictions", "cat": "Driver — Records & Withdrawals", "intent": ["manage eDUI rejections", "manage electronic conviction", "electronic convictions batch job", "unmatched convictions", "records team convictions", "MVD support commercial convictions", "apply conviction to driver record"], "page": "Driver/Event_Management/ManageE-RejectionsConvictions.htm", "what": "Explains the two MAX functions (Manage eDUI Rejections and Manage Electronic Conviction) used to manage electronic convictions and rejections that could not be automatically matched to a single customer.", "steps": ["Understand that convictions transmitted electronically are auto-placed on the appropriate Driver Record when possible, with corresponding Withdrawals and Compliance.", "Recognize why some convictions can't be matched: common names, missing/incorrect identifying data (DOB, DLN), duplicate court actions, or convictions for out-of-state customers with no MAX record.", "Open the Manage Electronic Conviction function to work commercial or non-matched convictions.", "Open the Manage eDUI Rejections function to work rejected electronic DUI items.", "Research the correct customer and apply the correct conviction data to the Driver Record, following your department's defined procedures."], "tips": ["These functions are primarily used by the Records team (non-commercial convictions) and MVD Support Services (commercial convictions).", "The page shows how to navigate the functions; follow your department's procedures for researching and remedying each conviction."]}, {"id": "oos-withdrawal-management", "title": "Manage Out of State (OOS) Withdrawals", "cat": "Driver — Records & Withdrawals", "intent": ["OOS withdrawal management", "add out of state withdrawal", "search update OOS withdrawal", "manually add withdrawal", "OOS withdrawal fields", "out of state suspension revocation"], "page": "Driver/Event_Management/OOS_Withdrawal_Management.htm", "what": "Explains using the OOS Withdrawal Management feature to manually add or update an out-of-state withdrawal.", "steps": ["Open the OOS Withdrawal Management feature.", "To add a new one, use Add an Out of State (OOS) Withdrawal and enter the withdrawal details.", "Reference the Definition of the OOS Withdrawal Fields to complete the entry correctly.", "To modify an existing one, use Search / Update an OOS Withdrawal.", "Save the manually added or updated out-of-state withdrawal."], "tips": ["Reference policies include 3.8.3 Suspensions, 3.8.4 Revocations, and 3.8.10 Administrative Hearing Request."]}, {"id": "reinstatement-prioritization", "title": "Follow Reinstatement Prioritization Order", "cat": "Driver — Records & Withdrawals", "intent": ["reinstatement prioritization", "order to resolve driver record issues", "PDPS check", "quote fees due", "open citations TSS", "drug alcohol screening", "SR22 interlock ready to process"], "page": "Driver/Event_Management/Reinstatement_Prioritization.htm", "what": "Defines the exact order to check and resolve issues on a customer's Driver Record for reinstatement; the customer may not have all issues, but each must be checked in order.", "steps": ["ONE: Check the Problem Driver Pointer System (PDPS).", "TWO: Quote Fees Due.", "THREE: Resolve Open Citations, then FOUR: Failure to Attend Traffic Survival School (TSS).", "FIVE: Address Drug/Alcohol Screening, then SIX: Required Hard Time.", "SEVEN: Handle the Revocation Application, then EIGHT: Obtain SR22.", "NINE: Confirm the Interlock (IL) Requirement.", "TEN: Ready to Process once all prior items are resolved."], "tips": ["Follow this order even if the customer does not have every issue; still check each one in sequence."]}, {"id": "revocation", "title": "Understand and Process Revocations", "cat": "Driver — Records & Withdrawals", "intent": ["revocation reasons", "aggravated DUI revocation", "failed re-exam vision revocation", "reinstating a revocation", "revocation application", "unlicensed driver revoked", "SIIRDL eligibility"], "page": "Driver/Event_Management/Revocation.htm", "what": "Explains reasons a license or driving privilege is revoked and how to reinstate a revocation.", "steps": ["Identify the revocation reason, such as using a vehicle to commit a crime, aggravated DUI, combinations of DUIs/reckless driving/racing within 84 months, fleeing from an officer, or a failed re-exam or vision.", "Review the Types of Revocations to understand the customer's situation.", "For an unlicensed driver who is revoked, do NOT accept a DL/ID Application (form #40-5122) while the revocation is in effect, unless the applicant is eligible for a SIIRDL.", "Follow the Reinstating a Revocation guidance, beginning with a properly completed Revocation Application (form #99-0139).", "Direct revocation questions to the Technical Support Unit at 602-712-4900, and medical revocation questions to the Medical Review Program at 602-771-2460."], "tips": ["Reference policies include 3.8.4 Revocation and 3.1.3 Medical Suspensions Revocations."]}, {"id": "minors-and-juveniles-withdrawals", "title": "Minors and Juveniles Withdrawals", "cat": "Driver — Records & Withdrawals", "intent": ["minors and juveniles suspension", "juvenile fails to appear", "underage drinking driving suspension", "juvenile admin per se", "restricted permit minor", "aggravated DUI juvenile", "graffiti theft suspension until 18"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Minors_and_Junveniles.htm", "what": "Explains how the Division suspends a minor's or juvenile's driving privilege for failures to appear/comply and for specific convictions, plus juvenile Admin Per Se restrictions.", "steps": ["When a juvenile fails to appear or comply with an order, suspend the driving privilege until they reach 18, appear in court as directed, or comply with the court's order.", "For underage drinking/DUI convictions (A.R.S. 4-244(34), 28-1381, 28-1382), suspend for two years; for aggravated DUI (28-1383), suspend for three years.", "For criminal/aggravated criminal damage, graffiti-material violations, Title 13 Chapter 34 violations, or specified theft/means-of-transportation offenses, suspend until the person is 18 years of age.", "For a second or subsequent violation of A.R.S. 4-244(9) Unlawful acts, suspend for two years if ordered by the court.", "Note the minor may be eligible for a restricted permit.", "Keep the suspension in effect until the person submits the applicable reinstatement fee and any other applicable fees.", "For a juvenile Admin Per Se, apply the court-directed restriction (until 18th birthday, two to three years, or up to 180 days for a first-time conviction), limited to travel between residence and school per the educational schedule and not to a treatment facility."], "tips": ["Reference policies include 3.8.3 Suspensions and 3.8.6 Restricted Driver License/Permit."]}, {"id": "withdrawals-impacting-tr-services", "title": "Withdrawals Impacting T&R Services", "cat": "Driver — Records & Withdrawals", "intent": ["withdrawals impacting T&R services", "which title registration services are blocked", "abandoned vehicle withdrawal", "lien affects title transfer out", "emissions required stop", "fraud alert notification services", "financial responsibility no insurance"], "page": "Driver/Event_Management/Withdrawals_Impacting_T&R_Services.htm", "what": "Reference table mapping each withdrawal type to the Title & Registration services it impacts (blocks) in MAX.", "steps": ["Identify the withdrawal type present on the customer or vehicle record.", "Look up that withdrawal type in the table to see which T&R services are impacted.", "For lien-type withdrawals (Child Support, DES, Divorce Decree, DOR, Forfeiture, Racketeering, Restitution), note they affect titles being transferred OUT of the customer's name and block Title Only, Title and Registration, and Recreate TRP.", "For broad stops like Abandoned vehicle, Fraud Alert Notifications, and returned payment collections, expect many services to be impacted (registration, title, permits, TRP, tab replacement, etc.).", "For interlock-related stops (failed to calibrate IID, failed to reinstall within 72 hours, failure to comply with interlock requirement), note only Renew Registration is impacted.", "Resolve the withdrawal before attempting the impacted T&R service."], "tips": ["Lien withdrawals only affect titles transferred OUT of the customer's name.", "Financial responsibility, emissions required, and NSF/returned payment withdrawals block many registration and title services."]}, {"id": "biometric-authentication-on-demand", "title": "Use Biometric Authentication Tools (On-Demand Authentication)", "cat": "Office & Admin", "intent": ["on-demand authentication ODA", "biometric authentication tools", "send facial recognition link to customer", "digital identity biometric results", "fraud prevention biometric", "resend authentication request"], "page": "Management/Biometrics.htm", "what": "Explains the On-Demand Authentication service in the Management menu: sending a facial recognition link to a customer's device (ODA) and viewing biometric authentication results for fraud prevention.", "steps": ["Open the On-Demand Authentication service from the Management menu (available only in authorized Business Units such as Call Center, Field OOF BUs, MVM, Level 2 Support, LECU, OIG Enforcement, Driver Improvement, and MVD Records).", "Review the Screen Overview to understand the layout.", "Use Viewing Authentication Results to review biometric authentication attempts (Digital Identity Biometric) for fraud prevention.", "Send a New Authentication Request to have the customer authenticate on their device with facial recognition.", "Re-Send an Authentication Request if needed.", "Explain the customer experience so the customer knows what to expect on their device."], "tips": ["Sources feeding this utility include Apple mDL, Google mDL, ETitle Transfer Kiosks, and Enhanced Authentication through AZ MVD Now and eAZ."]}, {"id": "create-work-task-medical-docs", "title": "Create a Work Task for Medical Documentation", "cat": "Office & Admin", "intent": ["create work task", "medical documentation to MRP", "Medical Review Program routing", "Class D medical review document", "CDL MEC MCSA-5876", "medical exam report MCSA-5875", "save document customer documents"], "page": "Management/Create_Work_Task.htm", "what": "Explains using the Create Work Task service to accept medical documentation from a customer that needs to reach the Medical Review Program (MRP), which also saves the document in the customer's documents.", "steps": ["Use the Create Work Task service when a customer brings in a Class D Medical Review Document, a CDL Medical Exam Certificate (MEC) (MCSA-5876), or a Medical Exam Report (MCSA-5875) that MRP has requested.", "Open the Create Work Task service.", "Accept the medical documentation from the customer and attach it to the work task.", "Submit the work task so it routes to the Medical Review Program (MRP) for review and appropriate action.", "Confirm the service automatically saved the document in the customer's documents."], "tips": ["MRP reviews the documentation and takes the appropriate action(s)."]}, {"id": "credential-print-status-queue", "title": "Use the Credential Print Status Queue", "cat": "Office & Admin", "intent": ["credential print status queue", "view print queues", "change print status", "cancel print folio", "filter print queue sections", "who can change which status"], "page": "Management/Credential_Print_Status_Queue.htm", "what": "Explains the function authorized individuals use to view print queues and change the print status on a credential when needed.", "steps": ["Open the Credential Print Status Queue function.", "Use the Filter Sections to narrow the print queues.", "Review the Print Statuses and confirm which statuses your role is allowed to change.", "View the print status for a specific credential.", "Change the print status for a specific credential when needed.", "Use Cancel Print (Folio) if a credential print must be canceled."], "tips": ["When a credential is processed with an error and a second credential is processed to correct it, MAX automatically deletes the first credential from the Print Status Queue."]}, {"id": "credential-print-status-search", "title": "Search Credential Print Status", "cat": "Office & Admin", "intent": ["credential print status search", "folio summary", "view ID credential image", "verify plastic vs paper credential", "print status meanings", "re-mailed destroyed credential", "delivery address verification"], "page": "Management/Credential_Print_Status_Search.htm", "what": "Explains using Credential Print Status Search to check the print status on a specific credential, view the Folio Summary, and View ID (the credential image to be mailed).", "steps": ["Open Credential Print Status Search and locate the print status for a specific credential.", "View the Folio Summary to verify the customer is receiving a plastic (not paper) credential and to verify the delivery address.", "Use View ID to see the actual credential image that will be mailed (not available if the customer has a Restricted Record or an OOP/IAH Characteristic).", "Interpret the print status: New, Pending, Requested, Submitted, Completed, Stopped, Canceled, Failed, Aborted, Re-Mailed, or Destroyed.", "Review any View ID Alert Messages that appear."], "tips": ["A Completed status means processing finished with no validation errors and the credential shipped; a copy of the front and back is saved here for credentials on/after March 1, 2023, or in OnBase for earlier ones.", "Stopped means the folio was held for OIG fraud review; Re-Mailed credentials update to Completed after 30 days.", "To cancel a print, a CSR must contact their lead, supervisor, or manager who changes the status to Canceled."]}, {"id": "fms-collections", "title": "Handle FMS Collections Payments", "cat": "Reference", "intent": ["FMS collections", "collections withdrawal action", "past due collection notice", "pay collections", "IFTA IRP audit collections", "ADOT collection unit", "delinquent payment", "collections notification"], "page": "Misc._Business_Topics/FMS_Collections.htm", "what": "Explains FMS 'Collections' withdrawal actions that do not stop service and how a customer can pay past due collection notices in office, online, or by mail.", "steps": ["{'text': \"Know that FMS may add a 'Collections' Withdrawal Action to a customer record that will NOT stop a service (e.g., IFTA/IRP/aircraft audit collections, cardlock, dealer violation civil penalty, ignition interlock return).\", 'reference': True}", "{'text': 'Understand Past Due Collection Notifications are mailed at 30, 60, and 90 calendar days of delinquency.', 'reference': True}", "{'text': 'If the customer pays at an office, use the Compliance Management service to collect the payment.', 'reference': True}", "{'text': \"If paying online via AZ MVD Now, direct them to the 'Services' menu, then 'Manage Compliance Issues' to make the payment.\", 'reference': True}", "{'text': 'If paying by mail, they may send a Money Order, Cashiers Check, Official Check, or Personal Check payable to ADOT with the account number from the Collections Notice written on it, mailed to ADOT Collection Unit, PO Box 2100, MD 529M, Phoenix, AZ 85001-2100.', 'reference': True}", "{'text': 'For delinquencies 90 days or more past due, advise payment goes to the Bankruptcy and Collection Enforcement Section at the Office of the Attorney General; questions to (602) 542-1719.', 'reference': True}", "{'text': 'For any other questions, contact the Collections Unit at (602) 712-7633 or ADOTCollections@azdot.gov.', 'reference': True}"], "tips": [], "reference": true}, {"id": "fraudulent-document-recognition-reference", "title": "Fraudulent Document Recognition (FDR) Quick Reference", "cat": "Reference", "intent": ["fraudulent document recognition", "FDR reference", "examine documents", "printing quality", "material quality", "security features", "document alterations", "detect fraud"], "page": "Misc._Business_Topics/Fraudulent_Document_Reference.htm", "what": "A quick reference for examining documents after completing the 16 online FDR modules, covering printing quality, material quality, and security features.", "steps": ["{'text': 'Use this guide only after completing the 16 Online FDR modules; it supports comparing print and material quality against authentic documents.', 'reference': True}", "{'text': 'Check printing quality using C.F.A.C.S.: Consistency, Fonts, Alignment, Clarity, and Styling.', 'reference': True}", "{'text': 'Check material quality using C.T.W.T.F.S.: Consistency, Texture, Weight, Thickness, Flexibility, and Size.', 'reference': True}", "{'text': 'Ask yourself: Are changes or alterations immediately visible by eye or light? Are there irregularities in font, punctuation, spelling, placement, or alignment? Are there irregularities in handwriting, ink, or pen type?', 'reference': True}", "{'text': 'Apply the Four Steps for Evaluating a Document when inspecting title/paper documents or credentials.', 'reference': True}", "{'text': 'Review security features for title/paper documents (e.g., intaglio printing, latent image, security thread, watermarks, thermochromic ink).', 'reference': True}", "{'text': 'Review security features for credentials (e.g., barcode, ghost images, hologram, laminate, MRZ, microprinting, OVI, UV fluorescent inks).', 'reference': True}", "{'text': 'Reference security features for U.S. Passport, Next Generation Passport, Passport Card, Permanent Resident Cards, and Employment Authorization Card when comparing documents.', 'reference': True}"], "tips": [], "reference": true}, {"id": "fraudulent-documents-or-identity", "title": "Handle Fraudulent Documents or Identity", "cat": "Reference", "intent": ["fraudulent documents", "fraudulent identity", "OIG referral", "facial recognition", "deceased status fraud", "incident report", "do not issue refer to OIG", "cancel print folio fraud"], "page": "Misc._Business_Topics/Fraudulent_Documents_or_Identity.htm", "what": "Explains how CSRs respond when a customer's identity or documents appear fraudulent, including gathering documentation, involving the Office of the Inspector General (OIG), and completing an Incident Report.", "steps": ["{'text': 'Do not process any DL or Title & Registration service when identity or documentation appears fraudulent; never attempt to physically detain the person.', 'reference': True}", "{'text': 'Excuse yourself and take ALL documentation the customer presented, then gather and scan all documents (colored if possible) to your email; keep any original Division form.', 'reference': True}", "{'text': 'Inform the applicant that before service can be completed, photocopies must be sent to another department for review and verification.', 'reference': True}", "{'text': 'For possible identity fraud on a credential, issue the credential but DO NOT print the temp credential; collect fees and Cancel Print (Folio) in the Credential Print Status Queue.', 'reference': True}", "{'text': 'Advise the customer they can contact OIG by phone after five business days to schedule an appointment.', 'reference': True}", "{'text': 'After the applicant leaves, complete
