g court data).", "Select the Occurrence Date and enter the Complaint Number.", "Select the Violation Code (auto-completes Incident Description and ACD Code).", "Select the Disposition Code and Disposition Date.", "If applicable, enter Approximate Speed/Lawful Speed and check Commercial Vehicle / Hazardous Materials / 16+ Passengers boxes.", "Save the incident."], "tips": ["A report cannot be transmitted if more than six months have passed since the citation was issued.", "NRVC does not apply to parking violations, highway weight-limit violations, or hazardous materials transportation violations."]}, {"id": "nrvc-satisfy-reinstate", "title": "NRVC — Satisfy an NRVC and Reinstate", "cat": "Driver — Records & Withdrawals", "intent": ["satisfy NRVC compliance", "upload court abstract letter", "$10 reinstatement fee", "compliance management NRVC", "clear indefinite eligibility"], "page": "Driver/Event_Management/NRVC_Processing.htm", "what": "Once an out-of-state court confirms the citation is resolved, the CSR satisfies the NRVC compliance and collects the reinstatement fee.", "steps": ["Select Compliance Management from the Management menu.", "Search for and click the Edit icon for the NRVC Violation.", "In the Compliance details pop-up, click Add Documents.", "Upload the court abstract or a letter from the out-of-state court confirming resolution.", "Select 'Satisfied' from the Status dropdown.", "Click Save, then click the Pay Now button.", "Collect the $10.00 reinstatement fee."], "tips": ["Acceptable documentation is a court abstract OR a letter from the out-of-state court stating the citation is resolved.", "After satisfying all compliance, verify the Withdrawal's Eligibility Date does not read 'Indefinite'."]}, {"id": "abandoned-vehicle-fee-waive", "title": "Waive an Abandoned Vehicle (ABV) Fee", "cat": "Driver — Records & Withdrawals", "intent": ["waive abandoned vehicle fee", "ABV waiver reason", "upload abandoned vehicle report", "proof predates tow", "upline approver only", "compliance management edit"], "page": "Driver/Event_Management/Abandoned_Vehicle_Fees.htm", "what": "Abandoned Vehicle (ABV) fees are assessed when a customer's vehicle is towed from abandoned property. This procedure waives the fee when the customer provides acceptable proof predating the tow. Only upline approvers may perform it.", "steps": ["From the MAX Dashboard, click the Menu icon and select Management, then Compliance Management.", "Search for the customer.", "Click Edit on the Abandoned Vehicle fee due line.", "Select 'Waived' for Status and 'Other' for Waiver Reason.", "In Waiver Reason Details, type the document type, documentation date, your name, and office name.", "Click Add Documents, then Upload Files.", "Select 'Abandoned Vehicle' as the Document Category and 'Abandoned Vehicle Report' as the Document Type.", "Click Save."], "tips": ["Do not accept payment if the customer intends to provide proof to waive the fee — it is non-refundable.", "Only upline approvers (Lead, Supervisor, Manager) may waive fees; the fee is not waived for hardship.", "Waiver proof must predate the tow date (e.g., proof of sale, stolen police report, divorce decree, repossession letter, total loss settlement, bankruptcy discharge, incarceration/military/hospitalization records)."]}, {"id": "abandoned-vehicle-fee-add-incident", "title": "Add a New Abandoned Vehicle Fee Incident", "cat": "Driver — Records & Withdrawals", "intent": ["add abandoned vehicle fee incident", "TnR administrative incidents", "abandoned vehicle fee due", "land type location VIN", "$500 $600 fee", "upline approver"], "page": "Driver/Event_Management/Abandoned_Vehicle_Fees.htm", "what": "Adds an Abandoned Vehicle fee due incident to a customer's record via Incident Management. Only upline approvers may add these incidents.", "steps": ["From the Management menu, select Incident Management.", "Select 'TnR Administrative Incidents' from the Work Group dropdown.", "Select 'Abandoned vehicle fee due' from the Incident Type dropdown.", "Search for the customer and click Add New Incident.", "Enter the Land Type Location, VIN, Occurrence Date, Received Date, and Case Number.", "Click Save."], "tips": ["Fee is $500 for private property, public land, or street/highway right-of-way; $600 for national forest, state park, BLM, or state trust land outside city/town boundaries.", "When multiple owners exist, only one Abandoned Vehicle fee needs to be paid.", "Only upline approvers (Lead, Supervisor, Manager) may add these incidents."]}, {"id": "hearings-summary-review", "title": "Accept a Hearing or Summary Review Request (EHO)", "cat": "Driver — Records & Withdrawals", "intent": ["executive hearing office", "accept hearing request", "petitioner forms", "email hearingoffice azdot", "do not upload to MAX", "filing deadlines"], "page": "Driver/Event_Management/Hearings_Overview.htm", "what": "The Executive Hearing Office (EHO) conducts hearings and summary reviews for customers challenging MVD actions. When a petitioner brings a request, the CSR helps complete the correct form and routes it to the EHO by email.", "steps": ["Determine the correct form the petitioner needs (Admin Per Se/Implied Consent Affidavit #40-5807, Hearing Request #40-5008, Lienholder Complaint Report #96-0330, or Restitution Lien Hearing Request #40-5009).", "Have the petitioner complete the form on-site or provide it for submission.", "Write on the request the date and time received, the CSR's RACF, and the office number.", "Scan the completed request and any supporting documents.", "Email the scanned request to hearingoffice@azdot.gov.", "Photocopy for data processing records.", "Return the originals to the petitioner."], "tips": ["Do NOT upload the request to the customer's documents in MAX — you MUST scan and email it to the EHO.", "The CSR does not verify timeliness; the EHO judge determines it. Petitioners are typically notified within 60 days.", "Questions: hearingoffice@azdot.gov or (602) 712-7737."]}, {"id": "interlock-ciid-overview", "title": "Certified Ignition Interlock Device (CIID) Overview & Deferment", "cat": "Driver — Records & Withdrawals", "intent": ["ignition interlock device", "CIID requirement DUI", "deferment eligible column", "6-month reduction", "installation confirmation auto-update", "calibration 90 days"], "page": "Driver/Event_Management/Interlock_Overview.htm", "what": "A Certified Ignition Interlock Device (CIID) is an in-car breath analyzer required after DUI convictions under A.R.S. §28-1381/§28-1382/§28-1383. This reference explains how MAX tracks installation and how to verify deferment eligibility.", "steps": ["Understand the requirement: the customer must pay all install/maintenance costs, provide proof of installation on all vehicles operated, and calibrate the device every 90 days.", "For installation tracking, know that the CIID manufacturer sends electronic installation confirmation to the Division, which automatically updates in MAX.", "To verify deferment, check the Driver Record for 'True' in the Deferment Eligible column.", "Confirm the Counselor Report tab shows Education completion.", "Confirm the IID Monitoring End Date reflects the 6-month reduction.", "For CIID requirement questions, contact the Technical Support Unit at 602-712-4900."], "tips": ["Deferment (reducing IID time to 6 months) requires a first DUI conviction under §28-1381 (violation on/after 1/1/2012), completion of a 16-hour alcohol education program, a functioning CIID with no extension-causing violations, no injury accident at offense time, and no prior DUI within 84 months.", "Non-compliance leads to indefinite suspension until proof of reinstallation is provided within 72 hours of device removal."], "reference": true}, {"id": "siirdl-issuance", "title": "Issue a Special Ignition Interlock Restricted Driver License (SIIRDL)", "cat": "Driver — Records & Withdrawals", "intent": ["issue SIIRDL", "restricted driver license DUI", "credential issuance not eligible", "confirm required documents", "SIIRDL agreement 96-0782", "SR22 CIID proof"], "page": "Driver/Event_Management/SIIRDL_Issuance.htm", "what": "A SIIRDL lets an individual with Arizona Class D or G privileges drive while suspended/restricted for specific DUI violations. This procedure issues it to eligible applicants who meet compliance requirements.", "steps": ["Access the Credential Issuance service (AZ Privilege Status may initially show 'NOT Eligible').", "In the Requirements tab, review and click 'Confirmed' for all required documents, then click Confirm.", "Address any Compliance Alerts by clicking Satisfy to open Compliance Management.", "Verify the SIIRDL restriction displays at the bottom of the Requirements tab.", "Review the Service Summary carefully and confirm the SIIRDL Requirement is present (expiration auto-calculates to the suspension/revocation end).", "Complete Payment Processing.", "To scan the SIIRDL Agreement (Form #96-0782): select 'Driver Compliance for SIIRDL Eligibility after 1/1/23' as Document Category, 'SIIRDL Agreement Document' as Document Type, and click Upload."], "tips": ["Eligibility requires proof of SR22 (not required for Admin Per Se violations), proof of CIID installation, completion of alcohol/drug screening or treatment, and all reinstatement/reapplication fees paid.", "The customer waives any rights to a hearing once a SIIRDL is issued.", "SIIRDL counts toward CIID time-served unless the device is removed prematurely or the customer is eligible for CIID Deferment. Valid only for Class D or G privileges.", "Form #96-0782 is required for Admin Per Se and Implied Consent violations occurring after January 1, 2023."]}, {"id": "credential-history", "title": "View and Add Credential History", "cat": "Driver — Records & Withdrawals", "intent": ["credential history icon", "out-of-state credentials", "add credential", "nationwide issuance history", "view prior credential details", "canceled prior credentials"], "page": "Driver/Event_Management/Credential_History.htm", "what": "Credential History tracks out-of-state and Arizona credentials issued to a customer, including when prior credentials were canceled upon new issuance. CSRs view it and can manually add out-of-state credentials.", "steps": ["Search for and open the Customer Record you'd like to see.", "Click the Credential History icon.", "Review all credentials issued in Arizona or manually added by CSRs.", "Click the dropdown icon to the left of a credential to view detailed information (license number, endorsements, restrictions, medical alerts, status dates, photo at issuance).", "To add an out-of-state credential, click Add Credential.", "Type the Credential Number and select the State that issued it.", "Add all other available information from the out-of-state credential and click Save."], "tips": ["Credential History is also available from the Driver Record (Credential History Tab) and works the same way.", "If out-of-state credential history was entered incorrectly, have an upline approver submit a Service Portal ticket to correct it."]}, {"id": "withdrawal-types-overview", "title": "Withdrawal Types & Descriptions (Overview)", "cat": "Driver — Records & Withdrawals", "intent": ["what are the withdrawal types", "types of license suspension in Arizona", "overview of driver withdrawals", "license suspended what does it mean", "list of suspension reasons", "corrective action notice", "void a suspension", "difference between suspension revocation cancellation"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Withdrawal_Types_&_Descriptions.htm", "what": "General framework page describing driving-privilege suspensions imposed by the MVD and listing the 13 withdrawal types. A suspension is triggered when the Division receives notice of a conviction or event that constitutes grounds for suspension under Arizona law.", "steps": ["A suspended person may not operate a motor vehicle in Arizona under any license, permit, or registration issued by another jurisdiction.", "Expiration of a license during the suspension period does not invalidate or terminate the suspension.", "A Corrective Action Notice (form #26-9611) is issued to notify the person of the action.", "The Division may issue temporary identification licenses to suspended drivers.", "Prior to voiding any suspension, the CSR must obtain approval from the Technical Support Unit.", "The 13 withdrawal types are: Admin Per Se; Child Support Arrearage; Discretionary License Suspension; Failure to Install CIID; False or Fraudulent Application; Financial Responsibility; Failure to Attend Traffic Survival School; Implied Consent; Medical Reasons; Minors and Juveniles; Traffic Violations; Underage Drinking; Vehicle Immobilization or Impoundment.", "Each type has its own trigger, compliance/reinstatement requirements, and duration — see the individual pages."], "tips": ["Always confirm there are no other active withdrawals before reinstating — one cleared action does not lift others.", "Never void a suspension without Technical Support Unit approval."], "reference": true}, {"id": "admin-per-se", "title": "Admin Per Se Suspension (DUI Arrest)", "cat": "Driver — Records & Withdrawals", "intent": ["admin per se suspension", "license suspended for DUI arrest", "DUI 30 day suspension", "alcohol screening for reinstatement", "restricted permit after DUI", "SIIRDL eligibility", "expunge DUI suspension", "form 40-5807"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Admin_Per_Se.htm", "what": "An administrative suspension (order served on form #40-5807, Admin Per Se / Implied Consent Affidavit) imposed when a law enforcement officer arrests a person for a DUI violation. It runs independently of any court outcome.", "steps": ["Trigger: officer arrests for DUI and serves the order of suspension / Admin Per Se affidavit (form #40-5807).", "Suspension length: 30 days for violations on/after Jan 1, 2023; 15 days for violations before Jan 1, 2023.", "Second/subsequent offense or serious-injury accident: 90 days with no restricted-permit eligibility.", "The customer must complete an alcohol/drug screening through an approved agency for each violation before a restricted permit or reinstatement.", "After the 30-day period and screening, the customer is eligible for a 60-day restricted driving privilege under A.R.S. 28-144.", "Alternatively, the customer may request a Special Ignition Interlock Restricted Driver License (SIIRDL) if eligible.", "Collect the $50 reinstatement fee if the record is expunged.", "Expungement (violations on/after Sept 24, 2022) requires: DUI dismissed or amended on record; 12 months passed since the violation; all compliance satisfied and reinstatement fees paid; no other suspensions/violations during the suspension period; submit form #96-2004.", "Expungement applies to non-CDL drivers only — CDL holders cannot expunge."], "tips": ["Admin Per Se and Implied Consent affidavits share form #40-5807 but are different actions.", "Statutory basis: A.R.S. 28-1385(a); expungement A.R.S. 28-3004(B)."]}, {"id": "child-support-arrearage", "title": "Child Support Arrearage Suspension", "cat": "Driver — Records & Withdrawals", "intent": ["child support suspension", "license suspended for unpaid child support", "certificate of compliance child support", "reinstate after child support", "court ordered suspension child support", "child support enforcement contact"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Child_Support_Arrearage.htm", "what": "An indefinite driving-privilege suspension the court directs the Division to impose when an obligor fails to pay child support and/or fails to comply with a child support subpoena.", "steps": ["Trigger: court directs the Division to suspend after failure to pay child support or comply with a subpoena.", "Suspension is indefinite and remains until the customer demonstrates compliance.", "The customer must submit a Certificate of Compliance showing name, date of birth, and date eligible to reinstate.", "The certificate must bear the Judge's or Deputy Court Clerk's signature and the court seal.", "CSR contacts the Technical Support Unit (602-712-4900); the certificate is scanned for eligibility determination and record update.", "If the eligibility date is before the current date and the suspension effective date is in the future, the suspension is voided.", "CSR may reinstate once eligible, provided no other withdrawal actions prohibit reinstatement, after all applicable fees are paid."], "tips": ["Division of Child Support Enforcement: (602) 252-4045, or (800) 882-4151 outside Maricopa County.", "Do not reinstate without a properly signed and sealed Certificate of Compliance."]}, {"id": "discretionary-license-suspension", "title": "Discretionary License Suspension", "cat": "Driver — Records & Withdrawals", "intent": ["discretionary suspension", "license suspended for too many points", "8 to 12 points suspension", "disrespect for traffic laws", "suspension for medical incapacity", "fraudulent license use suspension", "out of state conviction suspension"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Discretionary_License_Suspension.htm", "what": "A suspension the Division may impose at its discretion when it has sufficient evidence of specified conditions, such as a record of frequent violations or incapacity to drive safely.", "steps": ["May be imposed when a person is convicted or adjudged to have violated traffic regulations with such frequency that it indicates disrespect for traffic laws.", "May be imposed on accumulation of 8–12 points within 12 months (after completing Traffic Survival School within 24 months).", "May be imposed for medical, psychological, or physical incapacity to safely operate a vehicle.", "May be imposed for unlawful or fraudulent license use.", "May be imposed for offenses in other jurisdictions that would warrant suspension in Arizona.", "May be imposed for convictions under A.R.S. 28-1381 (DUI), 28-1382 (extreme DUI), or 28-1464 (ignition interlock violations).", "See policy 3.8.3 Suspensions for reinstatement procedures, fees, and duration (not detailed on this page)."], "tips": ["Because it is discretionary, escalate borderline point/medical cases to the appropriate unit rather than acting unilaterally."], "reference": true}, {"id": "failure-to-install-ciid", "title": "Failure to Install Certified Ignition Interlock Device (CIID)", "cat": "Driver — Records & Withdrawals", "intent": ["failure to install interlock suspension", "CIID not installed license suspended", "ignition interlock non-compliance", "registration renewal blocked interlock", "proof of interlock installation", "form 96-0413"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Failure_to_Install_CIID.htm", "what": "A suspension imposed when a person required to install a Certified Ignition Interlock Device (CIID) fails to comply with the order; the Division also prevents registration renewal.", "steps": ["Trigger: a person required to install a CIID fails to comply with the order.", "The Division suspends the driving privilege and prevents registration renewal.", "Only the Technical Support, Driver Improvement, and Ignition Interlock Units may place CIID requirements on a customer record.", "Reinstatement requires proof of installation or compliance.", "Form #96-0413 (Ignition Interlock Non-Compliance Suspension) documents the action.", "See policies 3.8.3 Suspensions and 3.8.9 CIID Requirements for detailed procedures (fees, duration, and ARS not stated on this page)."], "tips": ["CSRs cannot add or remove CIID requirements — refer to Ignition Interlock Unit."], "reference": true}, {"id": "false-or-fraudulent-application", "title": "False or Fraudulent Application", "cat": "Driver — Records & Withdrawals", "intent": ["fraudulent license application suspension", "license canceled for fraud", "false application for ID or permit", "suspended for lying on application", "fraud investigation MVD", "false voter registration"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/False_or_Fraudulent_Application.htm", "what": "Cancellation of a license/permit and suspension of the driving privilege when it is determined a person falsely or fraudulently applied for an original or duplicate driver license, identification license, or permit.", "steps": ["Trigger: determination that a person falsely or fraudulently applied for an original or duplicate DL, ID license, or permit.", "The license or permit is canceled and the driving privilege is suspended.", "First offense: suspension of six months from the cancellation date.", "Second or subsequent offense: suspension of one year.", "Submitting a false voter registration constitutes a felony.", "The Office of the Inspector General (established 2004) investigates fraud within ADOT programs.", "See policy 3.8.3 Suspensions for reinstatement specifics (fees and ARS not stated on this page)."], "tips": ["Refer suspected fraud cases to the Office of the Inspector General."], "reference": true}, {"id": "financial-responsibility", "title": "Financial Responsibility Withdrawals (Insurance/SR22/Judgment)", "cat": "Driver — Records & Withdrawals", "intent": ["no insurance suspension", "license suspended for no insurance", "SR22 requirement", "accident no insurance suspension", "judgment suspension reinstatement", "financial responsibility reinstatement fee", "failed to maintain SR22", "registration suspended no insurance"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Financial_Responsibility.htm", "what": "A family of withdrawals tied to insurance/financial-responsibility failures: Accident (no insurance), No Insurance at traffic stop, Failed to Maintain SR22, Judgment, and the mandatory-insurance requirement. Reinstatement generally requires proof of current Arizona liability insurance, applicable fees, and often an SR22.", "steps": ["Accident Withdrawal: triggered when a vehicle is in an accident with no insurance on the accident date; reinstate with proof of current AZ liability insurance + $50 motor vehicle fee. Void with an insurer letter showing coverage/claim paid or proof the vehicle was sold before the accident date.", "No Insurance (traffic stop): triggered by conviction under A.R.S. 28-4135 and/or 28-4141; 1st conviction up to 3 months, 2nd (within 36 mo.) up to 6 months, 3rd+ up to 1 year.", "No Insurance reinstatement: registration = current AZ liability insurance + $50 fee; driving privilege = $10 fee + SR22 (3 years from withdrawal start). Payment by certified funds only.", "Failed to Maintain SR22: triggered by early cancellation/default; requires a new SR22 + $10 reinstatement fee (fee only if the 3-year proof period has expired).", "SR22 reinstatement in MAX: add SR22 to the customer record; open driver record and verify the Failure-to-Maintain incident/withdrawal; click Manage Compliance; click Pay Now to access the Compliance Fees service.", "Judgment Withdrawal: triggered by an uninsured/under-insured motorist judgment; effective immediately upon MI Unit receipt; lasts until satisfied/unenforceable or an installment court order is approved.", "Judgment reinstatement documents (one of): Partial/Full Satisfaction of Judgment, Non-renewal, Set-Aside, Bankruptcy Petition/Court Order/Schedule F, or notarized bankruptcy stipulation.", "Judgment fees: $10 driver license + $25 motor vehicle; SR22 required for 2 years after satisfaction; email judgment documents to azivs@azdot.gov for MI Unit approval before reinstatement.", "Statutory basis: A.R.S. 28-4135, 28-4141; judgments filed after Aug 2, 2013 have a 10-year lifetime from the court filing date."], "tips": ["Payments for FR reinstatements must be certified funds (cash, money order, cashier's/traveler's check, or credit card at certain locations).", "Never reinstate a Judgment withdrawal until the MI Unit approves the submitted documents."]}, {"id": "failure-to-attend-tss", "title": "Failure to Attend Traffic Survival School (FTA TSS)", "cat": "Driver — Records & Withdrawals", "intent": ["failure to attend traffic survival school", "TSS suspension", "license suspended for not completing TSS", "traffic survival school 60 days", "mark TSS satisfied MAX", "reinstate after traffic school"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/FTA_TSS.htm", "what": "Traffic Survival School (TSS) is mandatory or discretionary driver education ordered for certain violations; failing to complete it within 60 days results in an indefinite suspension.", "steps": ["Mandatory TSS triggers: running a red light; conviction causing physical injury or death; wrong-way driving on a controlled-access highway; any DUI conviction; a moving criminal traffic offense while under 18.", "Discretionary TSS triggers: 8–12 points within 12 months; first-time teen/juvenile violation; accident causing death/injury/serious property damage; disrespect for traffic laws; medical/psychological incapacity; unlawful license use; reckless driving (A.R.S. 28-693).", "The customer must attend and complete TSS within 60 days or face indefinite suspension.", "The customer must be approved by the Division before completing the online course.", "MAX completion: search the customer via Compliance Management; filter for the TSS compliance type; Edit and select Satisfied status.", "Enter the Course Completion Date and document school name, license number, site number, and instructor name/license and process date.", "The system automatically voids the pending suspension upon certificate receipt.", "The customer is responsible for reinstatement fees and any other applicable fees.", "Mandatory TSS is ineligible for an executive hearing; discretionary TSS is eligible for a hearing."], "tips": ["Confirm Division approval before the customer takes the online TSS course, or the completion will not count.", "See policy 3.8.5 Traffic Survival School."]}, {"id": "implied-consent", "title": "Implied Consent Suspension (Test Refusal)", "cat": "Driver — Records & Withdrawals", "intent": ["implied consent suspension", "license suspended for refusing breath test", "refused blood test DUI", "one year suspension refusal", "SR22 after refusal", "SIIRDL after implied consent", "form 40-5807 affidavit"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Implied_Consent.htm", "what": "An administrative suspension resulting from refusal to submit to a test of blood, breath, urine, or other bodily substance for alcohol concentration or drug content; the officer forwards form #40-5807 to the Division.", "steps": ["Trigger: the person refuses testing and the officer forwards the Admin Per Se / Implied Consent Affidavit (form #40-5807).", "The affidavit must be received within 30 days of arrest or the suspension order is not entered (except death/serious-injury cases).", "First refusal: one-year suspension. Second or subsequent refusal within 84 months: two-year suspension.", "MVD action timing: 15 days after the violation (pre-2023) or 30 days (violations on/after Jan 1, 2023).", "Compliance: submit proof of future responsibility (SR22) and complete an alcohol screening through an approved agency (required as of Jan 1, 2009).", "Restricted license (SIIRDL) for violations before Jan 1, 2023: complete the mandatory 90-day suspension first, then apply if no prior Implied Consent suspensions within 84 months.", "SIIRDL for violations on/after Jan 1, 2023: may apply from the first day of suspension if no prior violations within 84 months.", "Meet all other applicable eligibility and fee requirements before reinstatement."], "tips": ["Implied Consent (refusal) and Admin Per Se (test result/arrest) can both stem from the same stop but are separate suspensions.", "Statutory basis: A.R.S. 28-1321 and 28-1385(a); policies 3.8.3, 3.8.6, 3.8.10, 3.8.12."]}, {"id": "medical-reasons", "title": "Medical Reasons Suspension / Revocation", "cat": "Driver — Records & Withdrawals", "intent": ["medical suspension", "license suspended for medical reasons", "failed vision exam", "seizure driving suspension", "medical re-examination MVD", "summary suspension medical", "vision examination report form 32-4001"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Medical_Reasons.htm", "what": "A Summary Suspension (immediate/temporary) and/or Revocation imposed when a person fails vision or medical standards, fails a re-examination, is court-ordered incapacitated, or reports a condition that may affect safe driving.", "steps": ["Triggers: failing vision/medical standards; failing a re-examination; court-ordered incapacitation; a 'Yes' to the first medical-questionnaire question (conditions affecting driving, seizures within 90 days, or uncontrolled narcotic use without one year recovery).", "Failed vision: the customer must present a completed Vision Examination Report (form #32-4001) meeting the Division's minimum vision standards.", "Medical re-exam: a Corrective Action Notice (CAN) requires completion within 45 days; test sequence is vision screening, knowledge test, Vehicle Control Skills test, then Non-Commercial Skills test.", "Attempts: unlimited for the first three tests; maximum three attempts for the skills test.", "MAX: Management menu > Incident Management > DL Administration Incidents > select the incident type (e.g., Failed Vision) > search customer > Add New Incident > enter occurrence and received dates > Save.", "Manually complete the Summary Suspension Order (form #26-5602) and Revocation Order (form #32-4102); the customer signs acknowledging the immediate suspension.", "Upload signed orders to Documents and create a work task uploading the Vision Exam Report for Medical Review Program (MRP) evaluation.", "Duration: Summary Suspension is immediate/temporary; a failed re-exam results in a one-year suspension and revocation; revocation by mail is effective 20 days from the mailing date.", "Fees: $10 suspension fee; $20 revocation fee (collected on successful completion after the one-year suspension period)."], "tips": ["A hearing request (form #40-5008 to the Executive Hearing Office) does not stay a summary suspension.", "Route Vision Exam Reports to the Medical Review Program for evaluation."]}, {"id": "traffic-violations", "title": "Traffic Violations / Complaint Suspension (FTA / FTP / FTC)", "cat": "Driver — Records & Withdrawals", "intent": ["traffic complaint suspension", "license suspended failure to appear", "failure to pay ticket suspension", "failure to comply citation", "disposition code 51 55", "reinstate after paying ticket", "$10 reinstatement fee tickets"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Traffic_Violations.htm", "what": "A Traffic Complaint Suspension imposed when a person fails to appear for a court date, or fails to pay and/or comply with a citation (criminal violations, and civil per disposition codes).", "steps": ["Trigger: failure to appear (criminal), or failure to pay/comply (criminal) with a citation.", "Disposition Code 51 (Criminal): Fail to Pay or Fail to Comply (e.g., community service, defensive driving class, or traffic survival school).", "Disposition Code 55 (Civil): same failure triggers as Code 51.", "Disposition Codes 56–57 (Criminal): warrant issued or no warrant issued for failure to appear.", "Reinstatement fee is $10.00 and covers all open tickets being reinstated.", "A final disposition date and final disposition code must be entered into the database to close the suspension.", "Final disposition is entered when the court closes the citation, the court sends an abstract to the citation unit, or the customer brings a court abstract and the CSR enters the final code and date.", "Both disposition codes must be entered one at a time to close the suspension."], "tips": ["The single $10 reinstatement fee covers all open tickets reinstated at once.", "Enter each disposition code separately — closing requires both the code and date."]}, {"id": "underage-drinking", "title": "Underage Drinking Suspension", "cat": "Driver — Records & Withdrawals", "intent": ["underage drinking suspension", "minor in consumption license suspended", "underage alcohol conviction MVD", "6 month suspension underage drinking", "reinstate after underage drinking", "ARS 4-241 suspension"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Underage_Drinking.htm", "what": "A suspension of the driving privilege and identification license following an underage drinking conviction or a court-ordered suspension for related alcohol offenses by minors.", "steps": ["Trigger: conviction under A.R.S. 4-241(L) or 4-241(N) (underage drinking); influencing sale/service to minors under 4-241(P); or first violation of 4-244(9) by persons under 18 when court-ordered per 4-246.", "Standard underage drinking (A.R.S. 4-241): first conviction 6 months; second or subsequent 1 year.", "Influencing/admission violations (A.R.S. 4-241(P)): first conviction up to 30 days; second or subsequent up to 6 months.", "First violation by minors under 18 (A.R.S. 4-244(9)): court-ordered suspension up to 180 days, with an optional court-ordered restriction up to 180 days.", "The suspension remains in effect until the person submits the applicable reinstatement fee.", "Any other applicable fees must also be paid before reinstatement."], "tips": ["Statutory basis: A.R.S. 4-241, 4-244, 4-246, and 28-3320(D)."]}, {"id": "vehicle-immobilization-impoundment", "title": "Vehicle Immobilization or Impoundment", "cat": "Driver — Records & Withdrawals", "intent": ["vehicle impound 30 days", "car immobilized MVD", "impound suspended license", "release impounded vehicle requirements", "towing storage fees impound", "post-storage hearing impound", "CIID before vehicle release"], "page": "Driver/Event_Management/Withdrawal Types and Descriptions/Vehicle_Immobilization_or_Impoundment.htm", "what": "Not a driving suspension — a peace officer's immobilization or impoundment of a vehicle (typically 30 days) when the driver is unlicensed/suspended/revoked, lacks proof of financial responsibility, or is involved in certain accidents.", "steps": ["Trigger: the driver's license is canceled, revoked, or the person is not licensed to operate a motor vehicle.", "Trigger: the driver cannot provide proof of financial responsibility, or is involved in an accident causing property damage or injury/death, or law enforcement has probable cause to search the vehicle.", "Standard duration: 30 days.", "To reclaim the vehicle, the owner must provide a current and valid DL and current registration.", "If the driver is required to install a CIID, the CIID must be installed prior to release of the vehicle; storage facilities cannot charge fees for CIID installation access.", "The owner is responsible for all towing, storage, and administrative charges, unless the vehicle was stolen and the theft was reported to law enforcement.", "Post-storage hearing: the vehicle owner, spouse, or persons on the Vehicle Information Page may request a hearing through the impounding agency."], "tips": ["This is informational only — refer all impound questions to the immobilizing/impounding agency.", "Confirm a valid license and current registration before advising on vehicle release."], "reference": true}, {"id": "process-title-and-registration", "title": "Process a Title & Registration (T&R)", "cat": "Title & Registration", "intent": ["title and registration", "T&R", "transfer ownership and register", "new vehicle title", "issue plate and registration", "record ownership", "buy a vehicle"], "page": "T_&_R/Title_&_Registration/Title_&_Registration.htm", "what": "Establishes vehicle ownership in the Arizona title record and issues registration (plate, registration document, tab) so the vehicle can be legally operated on public roads. Used when a customer proves ownership and needs both a title and registration.", "steps": ["From the Services menu, select Title & Reg, then search for the Customer and Vehicle and click Add (respond Yes/No to any alert that a title/registration already exists).", "On the Registration tab, enter Received Date, Ownership Date (drives penalty fees), Ownership Reason, Odometer Reading and Reading Type; check 'Titled in Another State' and complete the Use Tax section for out-of-state purchases.", "Select Registration Type and Use Type, choose the License Plate action (Issue New, Transfer, or Assign), and complete the Emissions and Insurance sections if required.", "On the Owners tab, verify name and mailing address, assign Role Type and Legal Status for multiple owners, and click the mail stars to designate who receives the title and registration.", "On the Vehicle tab, verify VIN, Make, Model, Year, body style and fuel type, and enter Factory List Price if required (Make/Model editable only for Motor Homes and Cab & Chassis).", "On the Documents tab, scan the Arizona Title Summary (for transfers) and upload all supporting documentation.", "Click Confirm to validate, review the Service Summary and click Continue, then select a registration cycle if eligible for multi-year.", "Review the Taxes and Fees screen and click Pay Now or Add to Cart, then process payment through Checkout.", "Download and print the Arizona Title Summary; have the customer review, check applicable boxes, and sign.", "Scan the signed summary and all supporting documents, then download and provide the service documents to the customer."], "tips": ["If the Customer Record is Restricted or Redacted, MAX will NOT stop the service, but artifacts print with redacted addresses — have the restriction removed first.", "Charge the $4 title fee for creating a record, changing ownership, brand changes, or adding/releasing liens; do NOT charge for a Dealer Reassignment Transfer (DRT).", "Titles are electronic and viewable in AZ MVD Now Title Viewer; the customer gets an Arizona Title Summary instead of printed paper unless Print Title is run.", "If processing T&R and Print Title the same day, the Arizona Title Summary is printed, signed, and scanned only once.", "If a temporary plate generates something derogatory or profane, run Update Registration with Issue New Plate at zero fees and have an upline approver submit a Service Portal refund ticket (same day, before 4pm)."]}, {"id": "classify-unique-vehicle", "title": "Classify a Unique or Specialty Vehicle", "cat": "Title & Registration", "intent": ["unique vehicle guide", "specialty vehicle classification", "moped vs motorcycle", "golf cart NEV ATV", "what can be titled", "mobility device", "off-highway vehicle type"], "page": "T_&_R/Title_&_Registration/Unique_Vehicle_Guide.htm", "what": "Reference for classifying distinctive vehicles (mobility devices, mopeds, golf carts, NEVs, ATVs, quadricycles) to determine Arizona title, registration, emissions, and insurance requirements. Guides which body style/vehicle type and forms apply.", "steps": ["Determine whether the device is eligible for title/registration at all — motorized skateboards, wheelchairs, gas bicycles/scooters under 49cc, and small electric miniature scooters are NOT titled or registered.", "For a moped (50cc or less), issue an ARO with no title per A.R.S. § 28-2513; insurance is required.", "For a motor driven cycle (49-50cc) equipped for highway use, issue title and registration and confirm the customer holds a Class M license.", "For a golf cart, issue Title Only for golf-course use, or title plus registration if modified for street operation.", "For a Neighborhood Electric Vehicle, issue a title (and registration if roadworthy) using form #96-0124; NEVs are limited to 35 mph roads.", "For an ATV/off-road vehicle, issue a title, require the OHV decal, and confirm the OHV Education Course is complete.", "For commercial quadricycles or neighborhood electric shuttles, collect the For Hire Certificate form #96-0148 and commercial insurance."], "tips": ["Tracked or tactical military-surplus vehicles with gun turrets are not eligible for title.", "Specially constructed vehicles may need a Level I inspection and an Arizona Serial Number (AZ SNO)."]}, {"id": "verify-title-documents", "title": "Verify Title Documents & Signatures for Transfer", "cat": "Title & Registration", "intent": ["title document overview", "verify title signatures", "acceptable title", "seller buyer signatures", "odometer on title", "title transfer documentation"], "page": "T_&_R/Title_&_Registration/Title_Document_Overview.htm", "what": "Guidance for validating Arizona and out-of-state title documents, signatures, odometer disclosures, and lien recordings when a vehicle changes ownership. Reference used during any title transfer.", "steps": ["Confirm the seller's signature(s) match the name(s) printed on the front of the title (a seller may sign less of their name but cannot add middle names/initials).", "Verify the sale date is present and has not been altered — it cannot be changed once written.", "Confirm the odometer reading is disclosed on the back of the title, or via a Secure Odometer Disclosure (dealer) or form #48-7104 (private sale).", "Check that any additional owner names written on the title are recorded when no lien is being added.", "Select 'Kilometers' in MAX if the kilometers box is marked (do not convert to miles).", "Scan the title and all supporting documentation into MAX per Document Management procedures."], "tips": ["A signature is acceptable if it is within the signature block or adjacent (above, below, left, right) with no conflicting signatures.", "Private parties cannot reassign titles to a new owner — only dealers can reassign.", "Charge the title fee for creating, modifying ownership, brand changes, and adding/releasing liens; not for a DRT reassignment."]}, {"id": "forms-required-for-tr", "title": "Identify Forms Required for Title & Registration", "cat": "Title & Registration", "intent": ["forms required for T&R", "which title form", "power of attorney requirements", "beneficiary designation form", "T&R application 96-0236", "notarization requirements"], "page": "T_&_R/Title_&_Registration/Forms_Required_for_T_&_R.htm", "what": "Reference to the forms needed for various T&R situations (name corrections, transfer on death, dealer reassignment, signature issues) and the documentation/notary rules governing them.", "steps": ["Determine the situation (buyer name correction, transfer on death, dealer reassignment, POA authority) and select the matching form.", "Confirm forms #38-1305, #48-2004, and #38-1306 are notarized IF the notary section appears on the form.", "For a Power of Attorney, verify it is notarized, unexpired, original or certified copy, and the grantor is living, with no alterations, white-outs, or cross-outs.", "For a Beneficiary Designation (form #96-0561), allow up to four beneficiaries; a death certificate is not required (charge $4 title fee if a paper title is requested for DRT records).", "For the T&R Application (Single) #96-0236, confirm it is typed/printed in blue or black ink, free of alterations, and signed by all owners per their legal status.", "Scan all authority documents (POA, trust, court documents) with the other supporting documentation."], "tips": ["Reject documents with fraud indicators, missing signatures, unmet notary/witness requirements, correction fluid/erasures, or illegible/covered information.", "T&R Application revision dates before 10/2024 were accepted only until December 15, 2024."]}, {"id": "tr-fees-overview", "title": "Apply Title & Registration Fees and Penalties", "cat": "Title & Registration", "intent": ["T&R fees overview", "title penalty fee", "late title transfer penalty", "vehicle use tax", "registration fees", "air quality fee", "PEN fee calculation"], "page": "T_&_R/Title_&_Registration/Fees_(T&R)_Overview.htm", "what": "Reference to titling and registration fees, and the procedure for manually charging a Late Title Transfer Penalty (PEN) or collecting Vehicle Use Tax (VUT) when not auto-calculated.", "steps": ["To charge a missed PEN fee, access the T&R Corrections service and click Confirm/Continue to the Taxes and Fees screen (matching the original Registration Cycle).", "Click Add Fee, select Title Penalty Fee from the Product dropdown, enter the correct PEN amount in Fee Amount, and click Add to finalize.", "During a Title service, check the 'I Need to Collect Use Tax' button to enable automatic VUT calculation.", "If VUT was forgotten, use the Miscellaneous Purchase service to collect it correctly."], "tips": ["Always click the 'Calculate Title Penalty Fee' box during the service or penalties won't calculate and a Corrections service is required.", "PEN is $8 for the first delinquent month, $4 each additional month, $100 maximum; grace is 15 days (new MCO/current AZ) or 30 days (dealer, operation of law, expired, bond).", "State DOR tax rate is 5.6% of total vehicle price; do NOT collect VUT for lease buyouts, casual/in-state sales, or Native Americans with Form 48-7701.", "Title (TTL) fee is $4 when ownership changes or brands are modified."]}, {"id": "ownership-priority-legal-status", "title": "Set Owner Priority, Role Types & Legal Status", "cat": "Title & Registration", "intent": ["ownership priority", "role types", "legal status AND OR", "multiple owners on title", "add additional owner", "mail stars", "trustee lessee lessor"], "page": "T_&_R/Title_&_Registration/Ownership_Priority_&_Legal_Status.htm", "what": "Manages how multiple owners appear on a title and who has legal authority to sign, by setting Role Type, Priority, and Legal Status on the Owners tab. Used whenever there is more than one owner or an ownership change.", "steps": ["On the Owners tab, click Add Customer and select the Role Type (owner, lessee, lessor, registrant, trustee, etc.).", "Set Priority to control the order names appear on title documents.", "Assign the Legal Status (AND, AND/OR, or OR) when multiple owners exist.", "Click the solid blue Registration and Title Mail Stars to designate who receives the documents.", "Add Notes for service-specific information and use Add an Exemption for owner-specific exemptions (e.g., Non-Resident Military, Tribal Member).", "Use Edit Customer to update address, AKA, characteristics, or contact info; use the Remove Ownership icon to delete an owner (instant and irreversible).", "Print the Title Summary, obtain customer signatures, and re-scan it into MAX."], "tips": ["Transferring into new owners' names with AND, AND/OR, or OR legal statuses requires ALL owners to sign.", "Legal Status applies only to Owner and Trustee roles; lessee/lessor situations need no legal status.", "A Legal Status change costs a $4 title fee and does not require the vehicle to be currently registered.", "Court-appointed roles (Administrator, Executor, Guardian, Conservator, Fiduciary) require certified court orders."]}, {"id": "odometer-disclosure-guidelines", "title": "Apply Odometer Disclosure Guidelines", "cat": "Title & Registration", "intent": ["odometer guidelines", "TIMA disclosure", "odometer reading type", "actual mileage", "exempt odometer", "mileage disclosure duration"], "page": "T_&_R/Title_&_Registration/Odometer_Guidelines.htm", "what": "Reference for odometer disclosure requirements under the Truth in Mileage Act (TIMA) when a vehicle transfers ownership, including which Reading Type to enter in MAX and which vehicles are exempt.", "steps": ["Confirm the Arizona title contains the conforming odometer certification language to qualify as secure.", "Determine the disclosure duration: 10 years for 2010 model year and older, 20 years for 2011 and newer.", "Enter the odometer reading and select the Reading Type in MAX: Actual, Exceeds Mechanical Limits, Not Actual, No Odometer, or Exempt/Blank (Unknown discontinued 06/05/2025).", "Confirm the same person does not represent both seller and buyer on the title, MCO, or disclosure form."], "tips": ["Exempt vehicles: 2010 model year and older once 10+ model years old; 2011+ once 20+ model years old; 16,000+ lb GVWR; non-self-propelled vehicles.", "Once a Reading Type is set to anything other than Actual, it cannot revert to Actual without odometer certification."]}, {"id": "register-commercial-vehicle", "title": "Register a Commercial, Farm, or Emergency Vehicle", "cat": "Title & Registration", "intent": ["commercial vehicle registration", "declared GVW", "farm vehicle", "seasonal agricultural registration SAR", "cab and chassis", "motor carrier fee", "Form 2290", "commercial use type"], "page": "T_&_R/Title_&_Registration/Commercial_Vehicles.htm", "what": "Registers commercial vehicle types (commercial, cab & chassis, farm, SAR, non-government emergency) with fees adjusted by declared gross weight and use type. Used when a customer needs commercial titling and registration.", "steps": ["In the Registration section, select the proper commercial Use Type from the dropdown (Commercial - For Hire, Limited Mileage, Reduced, Farm, Farm SAR, or Non-Government Emergency Service).", "Enter the Declared GVW in the Declared Weight field.", "During plate issuance, select the appropriate Commercial Vehicle plate.", "For reduced Motor Carrier Fees, complete form #96-0141 or form #96-0236 with the proper Service Option code.", "For vehicles 55,000+ lbs declared gross weight, scan the IRS Schedule 1, Form 2290 into MAX and return it to the customer.", "Print the Title Summary, have the customer review and sign, then re-scan it into MAX."], "tips": ["Cab & chassis inspection is waived if the customer provides the MCO/Certificate of Title plus conversion invoices; otherwise a physical/Level I inspection and new title are required upon conversion.", "Reduced MCF is 70% of full rate (one-way haul, route truck, agricultural); farm MCF reduction is 50% with form #96-0141.", "SAR runs 3-11 months (not less than 90 days), commercial fees prorate monthly and always expire end of month, and no late renewal penalty applies.", "Increased declared weight means the customer pays increased weight fees for remaining months; decreases are not refunded.", "Form 2290 is waived for SAR re-registered in the same calendar year."]}, {"id": "registration-only-aro-spi", "title": "Process Registration Only (ARO / SPI)", "cat": "Title & Registration", "intent": ["registration only", "ARO", "SPI", "special interstate registration", "register without title", "out of state lien", "concurrent resident"], "page": "T_&_R/Title_&_Registration/Registration_Only_(ARO).htm", "what": "Issues Arizona registration to a vehicle that cannot be Arizona-titled — an ARO when an out-of-state lien or title barrier exists, or an SPI for concurrent residents/out-of-state businesses maintaining dual registration. Both are processed the same way in MAX.", "steps": ["From the Services menu select Registration Only, search for the customer and vehicle, and click Add (respond to any already-titled alert).", "On the Registration tab, select 'Arizona Registration Only/SPI' as the Type, adjust the Received Date to when the vehicle moved to Arizona, indicate transfer from another state, choose Use Type, select Title Jurisdiction, and enter Declared Regular GVW if applicable.", "Complete the Emissions section if the vehicle registers in or commutes to a non-attainment area.", "In the License Plate section select Issue New Plate, choose Plate Type, personalize if requested, and click Confirm to validate the plate.", "Add Insurance information or De-Insurance if applicable.", "On the Owners tab verify name, address, role type, priority, and legal status, set the mail star, and enter the Vehicle Domicile Address (physical address, not a P.O. Box).", "On the Vehicle tab verify VIN, VIN Type, Vehicle Type, Make, Model, Year, body style, fuel type, and Factory List Price; add tonnage/weight/axles for commercial.", "Upload supporting documents on the Documents tab, then click Confirm to validate and check eligibility.", "Click Continue, select a Registration Cycle if eligible, review Taxes and Fees, and click Pay Now or Add to Cart; complete Checkout.", "Download and print the service documents (no Arizona Title Summary generates), have the customer sign, and scan the signed docs via Add Documents."], "tips": ["An ARO will NOT be issued to a vehicle that is eligible for an Arizona title; the vehicle must come from a title-holding state (verify via the Polk Book).", "A Temporary Registration Permit (TRP) or sales contract/invoice is not acceptable proof — the customer needs full out-of-state registration.", "Charge a $4 title fee when converting an ARO to an Arizona title after the out-of-state lien is paid.", "For a leased vehicle, provide form #40-0207 (Lessor Authorization) or a notarized POA (form #48-1001).", "When transferring the vehicle to another state, complete form #96-0467 to document it was never Arizona-titled."]}, {"id": "emissions-testing", "title": "Record Emissions Test Results", "cat": "Title & Registration", "intent": ["emissions", "smog test", "non-attainment area", "emissions certificate", "add emissions in MAX", "emissions waiver", "emissions exemption"], "page": "T_&_R/Title_&_Registration/Emissions.htm", "what": "Records emissions (smog) test results required for vehicles registered in or commuting to Arizona non-attainment areas (Metro Phoenix Area A, Metro Tucson Area B). Entered within a registration service or on the Vehicle Information Page.", "steps": ["Check the Commutes to Non-Attainment Area box if applicable, then select the location (or exempt status) from the Non-Attainment Area dropdown.", "Select the Test Type performed from the dropdown and check Initial Test if the vehicle passed on the first attempt.", "Select the Initial Test Date (may differ from the Passed Date if retested).", "Select the Test Result and the Certificate Type from their dropdowns.", "Enter or select the date the vehicle passed; the Expiration Date auto-populates.", "Click Refresh Emissions to reset the fields if needed before finalizing.", "To update from the Vehicle Information Page, go to the Emissions section, click Add Emissions (or Copy Emissions), complete the same steps, and click Save."], "tips": ["Requirement is based on the zip code of the owner's residential or the vehicle's domicile address; a test is valid only within 90 days before registration expiration.", "Validity periods: Basic/Idle/Load/Diesel = 1 year; IM147/OBD = 2 years; administrative certificates = registration period.", "Exemptions include model year 1966 and older, new vehicles before their sixth registration year, and solar/electric/hydrogen vehicles; use Code 52 Exemption in MAX for qualifying tribal members.", "A vehicle may receive only one repair waiver ($15) valid for the current registration cycle; a failed vehicle has 60 days to re-test at no charge."]}, {"id": "ohv-education-course", "title": "Verify OHV Education Course Completion", "cat": "Title & Registration", "intent": ["OHV education course", "off-highway vehicle decal requirement", "OHV safety course", "OHV education characteristic", "issue OHV decal"], "page": "T_&_R/Title_&_Registration/OHV_EducationCourse.htm", "what": "Confirms completion of the required OHV Safety Education course before issuing an OHV decal, mandated by Laws 2024, Chapter 240 between January 1, 2025 and June 1, 2027. MAX blocks decal issuance until the course is complete.", "steps": ["Confirm the customer completed the free 10-15 minute course 'Required for OHV Decal: Safe & Ethical Riding in Arizona.'", "Verify Arizona residents completed it on AZ MVD Now; nonresidents use the Arizona Game and Fish website.", "Confirm the completion characteristic is on the record ('OHV Education Individual' for the owner, 'OHV Education Organization' for organizations).", "Accept a printed certificate or a completion code submitted via AMN if the customer lacks physical documentation.", "Proceed to issue the OHV decal — MAX will not allow issuance until the course is recorded."], "tips": ["The course is required only once per customer regardless of how many vehicles they own.", "Only one owner (or one organization representative, or one trustee for a trust) needs to complete it."]}, {"id": "abandoned-vehicle-process", "title": "Process an Abandoned Vehicle (ABV) Title Transfer", "cat": "Title & Registration", "intent": ["abandoned vehicle", "ABV", "authorization for transfer of ownership", "form 46-8922", "towing company title", "abandoned vehicle inspection 46-4402"], "page": "T_&_R/Title_&_Registration/Abandoned_Vehicle_Overview.htm", "what": "Transfers ownership of a vehicle abandoned on public or private property (48 hours in a right-of-way, or 72 hours on other property). Used when a customer or towing company obtains authorization to title an abandoned vehicle.", "steps": ["Print the Authorization for Transfer of Ownership, form #46-8922, from the customer's Documents section in MAX.", "Have the customer sign and date the form, then upload the signed form during service processing.", "Change the Title and Registration Ownership Reason to match the documentation type received.", "Complete the title/registration application — no inspection is required since the ABV inspection was already completed.", "For towing companies filing electronically, access the Abandoned Vehicle Suite in AZ MVD Now and upload the inspection form (#46-4402) and Vehicle Removal Authorization within five days.", "After approval, process the eTitle transfer (collect the $4 title fee); on sale, the system generates an E-Title Bill of Sale for the purchaser."], "tips": ["The Authorization for Transfer is valid 30 days from the Authorization Date, requires no lien release, and supports Title Only, Title & Registration, or Salvage/Dismantle branding.", "Filing fees: $10 manual (individuals), $8 electronic (towing companies); waivable if transferred to a state agency or deemed junk for crushing.", "Ineligible: mobile homes 8'x40' or larger, vehicles under garage/parking contracts, historic vehicles on owner's property, and vehicles sold/gifted/inherited/donated/traded (use the Bond process).", "If a customer received a towed-vehicle notice but still has the vehicle, they disregard the notice — no filing or fees."]}, {"id": "request-registration-credit", "title": "Request Registration Credit", "cat": "Title & Registration", "intent": ["registration credit", "request credit when vehicle sold", "plate stays with owner", "credit to customer account", "cancel registration credit"], "page": "T_&_R/Title_&_Registration/Registration_Credit.htm", "what": "Issues a credit for unused registration fees when a customer sells a vehicle and retains the plate; the credit becomes funds in the customer account for future Division services or disbursement.", "steps": ["Select 'Request Registration Credit' from the Menu and search for the customer.", "If qualifying credit exists, click the Select icon next to the correct vehicle.", "Verify the Registration Details display correctly, then click Add.", "For multiple owners, select the owner receiving credit via the radio button (defaults by Legal Status).", "Click Apply Credit.", "Click Confirm.", "Optionally download the receipt using the Download icon."], "tips": ["The customer must be a Level 3 Customer to receive Registration Credit.", "A $12 Registration Credit fee is automatically deducted; if the balance is $12 or less, MAX shows 'No credit is available.'", "Once completed the registration is canceled — if the sale falls through the customer must re-register.", "Eligible fees include VLT, Weight Fees, Motor Carrier Fee, Commercial Registration Fee, Highway Use Fee, and Special Plate Fee; the balance decreases monthly if not moved into the Customer Account."]}, {"id": "recreational-vehicle-tr", "title": "Title & Register a Recreational Vehicle", "cat": "Title & Registration", "intent": ["recreational vehicles", "golf cart registration", "moped registration", "NEV registration", "motor driven cycle", "off-road vehicle title", "highway use certificate 96-0371"], "page": "T_&_R/Title_&_Registration/Recreational_Vehicles.htm", "what": "Titles and registers the six recreational vehicle types (golf carts, mopeds, motor driven cycles/scooters, NEVs, quadricycles, off-road vehicles), each with distinct service, forms, and equipment requirements.", "steps": ["For a golf cart used on the highway, use the Title and Registration service; check the OHV decal box only if modified for off-road terrain and complete Highway Use Certificate form #96-0371 for modifications.", "For a moped, use the Arizona Registration Only (ARO) service (no Certificate of Title), submit the MCO/bill of sale/out-of-state registration, and return ownership documents to the owner.", "For a motor driven cycle/scooter, complete Highway Use Certificate form #96-0371 and verify the 17-digit VIN and FMVSS compliance label.", "For an NEV, use Title and Registration, complete form #96-0124, and set fuel type to Electric (title required regardless of registration).", "For an off-road vehicle, use Title Only if no plate is requested or Title and Registration for plates, completing form #96-0371 for highway use and verifying OHV course completion before issuing the decal.", "Print the Title Summary, have the customer sign, and re-scan into MAX."], "tips": ["Golf carts are exempt from emissions but must meet financial responsibility requirements.", "NEVs cannot operate above 25 mph or on roads with posted limits over 35 mph; a Level I inspection is required for NEVs made before June 17, 1998.", "If the golf cart model is unknown, check OnBase; if unsuccessful use 'Golf Cart' as the model.", "Tracked vehicles cannot be registered until tracks are replaced with tires; quadskis need dual registration with Game and Fish for water use."]}, {"id": "titles-without-court-orders", "title": "Process a Title Transfer Without a Court Order", "cat": "Title & Registration", "intent": ["titles without court orders", "non-probate transfer", "repossession title", "sheriff's sale", "owner affidavit 46-4421", "IRS form 2435", "standard form 97"], "page": "T_&_R/Title_&_Registration/Titles_Without_Court_Orders.htm", "what": "Reference to six title transfer scenarios that do not require a court order: IRS Form 2435 seizure sales, non-probate estates, repossession, Owner Affidavit, Sheriff's Sale, and federal Standard Form 97. Processed through Title & Registration or Title Only.", "steps": ["For a non-probate estate (all owners deceased, estate value under $200,000, 30 days since death), collect the Non-Probate Affidavit form #32-6901, lien release, and odometer disclosure.", "For a repossession, collect the Repossession Affidavit form #48-0902 for Arizona-titled vehicles (sequential bills of sale are not accepted).", "For a Sheriff's Sale, collect the original Sheriff's Certificate with a full vehicle description matching the title.", "For an Owner Affidavit (form #46-4421), verify the vehicle is 12+ years old and purchase price is $1,200 or less; select Ownership Reason 'Bill of Sale' and brand the vehicle Non-Repairable ($4 title fee).", "For federal sales, collect Standard Form 97 (Level I inspection at discretion).", "Finish the T&R/Title Only service, print the Title Summary, have the customer sign, and re-scan into MAX."], "tips": ["A successor cannot process a registration renewal when the registered owner is deceased.", "The 30-day application window applies before late transfer penalties; the repossession penalty is waived when the lienholder applies for title-only in their name.", "Sheriff's Sale needs no lien release if a narcotics seizure or unpaid property taxes are noted; the original owner keeps the plate/credit."]}, {"id": "titles-with-court-orders", "title": "Process a Title Transfer With a Court Order", "cat": "Title & Registration", "intent": ["titles with court orders", "divorce decree title", "probate transfer", "bankruptcy title", "judgment title", "forfeiture", "certified court copies"], "page": "T_&_R/Title_&_Registration/Titles_With_Court_Orders.htm", "what": "Reference for court-ordered ownership transfers (bankruptcy, divorce, guardianship, judgment, forfeiture, probate). May be processed through Title & Registration or Title Only.", "steps": ["Obtain certified court copies — the first page, the appointee/awardee page, and the judge-signed page.", "For a divorce, confirm the decree describes the vehicle by make and model year or VIN.", "For probate, confirm the personal representative signs (a Decree of Distribution naming the representative is acceptable).", "For a judgment, confirm the debtor is the owner of record and obtain a lien release unless the court states otherwise.", "For forfeiture, note a title is not required if out-of-state, but a physical inspection is required when no database record exists.", "Apply within 30 days to avoid late transfer penalty fees; finish the service, print and sign the Title Summary, and re-scan into MAX."], "tips": ["The original owner typically keeps the plate/registration credit unless the order specifies otherwise.", "Title Transfer (Bill of Sale) form #38-1306 frequently substitutes for a missing title.", "Odometer disclosure requirements vary by case type."]}, {"id": "alternative-fuel-vehicle", "title": "Register an Alternative Fuel Vehicle (AFV)", "cat": "Title & Registration", "intent": ["alternative fuel vehicle", "AFV", "reduced VLT", "AFV sticker", "electric vehicle registration", "ADEQ certificate 48-1303", "fuel type in MAX"], "page": "T_&_R/Title_&_Registration/Alternative_Fuel_Vehicle.htm", "what": "Registers vehicles powered exclusively by EPA-certified alternative fuels, which qualify for AFV plates/stickers and reduced Vehicle License Tax. Also covers replacing an AFV sticker.", "steps": ["Confirm eligibility — an OEM vehicle powered exclusively by alternative fuel, an EPA-certified conversion, or an NEV/quadricycle/autocycle (hybrids and bi-fuel vehicles after 09/30/2009 are ineligible).", "Collect the required documentation: a dealer certificate, MCO statement, or Form #48-1303 (ADEQ Alternative Fuel Certificate) for initial registration; OEM electric vehicles are exempt from ADEQ inspection.", "Title and register the vehicle in MAX per the Title and Registration procedure, setting the correct fuel type.", "For a replacement AFV sticker, confirm the active AFV sticker on the record and verify the mailing address.", "Collect the $8 replacement fee via the Misc Service in MAX.", "Email the Special Plates Unit (specialplates2@azdot.gov) with the plate number/VIN and customer contact information."], "tips": ["Hybrid is a valid fuel type in MAX and should not be changed from Hybrid to Gas.", "VLT tiers are grandfathered by first-registration date; any ownership change (including a lease buy-out) loses the grandfathered rate.", "The AFV sticker affixes to the rear bumper to the right of the license plate; the Alternative Fuel plate is the default for AFV transfers when no plate is selected.", "Electric non-compliant golf carts get Alternative Fuel Motorcycle plates but are not eligible for AFV registration."]}, {"id": "process-title-only", "title": "Process a Title Only Service", "cat": "Title & Registration", "intent": ["title only", "transfer ownership without registration", "dealer title for resale", "nonresident buying AZ vehicle", "title without plate"], "page": "T_&_R/Title_&_Registration/Title_Only.htm", "what": "Transfers vehicle ownership without issuing registration, costing $4.00. Common for dealers titling for resale or nonresidents buying an Arizona vehicle for out-of-state registration; subject to Vehicle Use Tax and late title transfer penalties.", "steps": ["From the Services menu, select Title Only, search for the Customer and Vehicle (add if not found), and click Add.", "Review and update the four tabs: Title, Owners, Vehicle, and Documents.", "Click Confirm to validate eligibility.", "Review the Service Summary and click Continue.", "Review the Taxes and Fees screen and click Pay Now or Add to Cart.", "Process payment in Checkout and click Complete Checkout.", "Download and print the Arizona Title Summary; have the customer review, check applicable boxes, and sign.", "Scan the summary and supporting documentation via Add Documents, then download/print the service documents for the customer."], "tips": ["Titles are electronic (viewable in the AZ MVD Now Title Viewer) unless the Print Title service is run separately.", "Do not edit vehicle information generated by VINtelligence unless it is a motor home or cab/chassis; names on titles cannot be changed during data entry.", "An Arizona residency affidavit (form #40-5143) is NOT acceptable proof; never adjust Vehicle Use Tax from the Taxes/Fees screen.", "If T&R and Print Title are processed the same day, documents are signed only once."]}, {"id": "update-registration", "title": "Update an Existing Registration", "cat": "Title & Registration", "intent": ["update registration", "replace plate", "replace decal tab", "change vehicle use", "change declared weight", "add remove exemption", "personalized plate on existing registration"], "page": "T_&_R/Title_&_Registration/Update_Registration.htm", "what": "Modifies an existing current registration — replacing plates or decals, requesting special/personalized plates, changing use classification or declared gross weight, changing domicile, or adding/removing exemptions.", "steps": ["Select 'Update Registration' from the Services Menu, search for the Customer and Vehicle, and click Add.", "In the Update Registration tab, modify as needed: vehicle use, declared gross weight, or plate selection (Issue New Plate or Replace Plate).", "Click the Owners tab to verify customer information and use the Edit Customer icon for address/contact updates.", "Click 'Add an Exemption +' if applicable, then click Confirm to verify eligibility.", "In the Service Summary, click Continue.", "Review Taxes and Fees and click Pay Now or Add to Cart, then process payment at Checkout and click Complete Checkout.", "Download and print the service documents for the customer.", "In the Service Finalized screen, click Add Documents to scan the supporting documentation."], "tips": ["Cannot be used if registration has expired — use Renew Registration instead.", "Issue New Plate and Replace Plate automatically include tabs — do not process a separate no-fee duplicate tab.", "Standard replacement plate fee is $5.00 plus postage; waivable if the owner didn't move and reports non-delivery 10-45 days after issue.", "Cannot issue a new OHV decal if the current one is valid (replacement only)."]}, {"id": "tr-scenario-add-remove-owner", "title": "Add or Remove an Owner on Title & Registration", "cat": "Title & Registration", "intent": ["add owner to title", "remove owner from registration", "change owners", "sold notice registration credit", "transfer plate add owner"], "page": "T_&_R/Title_&_Registration/T_&_R_Scenarios.htm", "what": "Adds or removes an owner on a titled/registered vehicle by submitting a Sold Notice, taking Registration Credit, then reprocessing Title & Registration. The registration cycle restarts.", "steps": ["On the Vehicle Information Page, go to the Sold Notice section, click Add Sold Notice, complete it with Unknown Buyer and Unknown Address, and click Save.", "Start the Request Registration Credit service, select the registration to be credited, and click Add.", "Select the customer for the account credit and click Apply Credit.", "Start a new Title & Registration service (for a removal, begin with the remaining owner).", "Select Transfer Plate or Issue New Plate.", "In the Owners tab, add the additional owner (skip for a removal) and select the correct Legal Status.", "Use Account Funds for payment.", "Print the service artifacts for the customer."], "tips": ["The registration cycle restarts — the customer pays full fees for the new cycle but can request disbursement of the previous credit.", "New-cycle fees are often higher, so use Fund Customer Account to add money beyond the transferred credit."]}, {"id": "tr-scenario-salvage-to-restored-salvage", "title": "Change a Salvage Title to Restored Salvage", "cat": "Title & Registration", "intent": ["salvage to restored salvage", "add salvage brand", "restored salvage brand", "level III inspection salvage", "salvage title process"], "page": "T_&_R/Title_&_Registration/T_&_R_Scenarios.htm", "what": "Converts a Salvage-branded vehicle to Restored Salvage in three stages: add the Salvage brand (Title Only), take Registration Credit, then add the Restored Salvage brand (Title & Registration). Each stage must finalize separately.", "steps": ["Start a Title Only service (or Manage Liens and Brands if ownership is unchanged), search for the Customer and Vehicle, and click Add.", "In the Vehicle tab, click Add Brand under New/Carryover Brand, select Salvage, click Confirm, and collect the $4 title fee — finalize before proceeding (do not batch).", "Start Request Registration Credit, select the registration, click Add, select the customer, and click Apply Credit.", "Start a Title & Registration service, search and Add, and click No when prompted about adding registration.", "Update the Odometer Reading, Unit, and Reading Type per the Level III Inspection.", "Select Transfer Plate in the Plate Service section and type the plate to transfer.", "In the Vehicle tab, select Restored Salvage under New/Carryover Brand, click Confirm, and complete required information.", "Have the customer pay the registration fees and finalize — the Salvage brand is end-dated and only Restored Salvage displays."], "tips": ["Write down the existing plate number before starting so the transfer is accurate.", "Do not batch the salvage-brand service with others in the same cart or services may get stuck."]}, {"id": "tr-scenario-name-change", "title": "Process a Name Change on Registration and/or Title", "cat": "Title & Registration", "intent": ["name change on registration", "name change on title", "update owner name", "credential issuance name change", "tab replacement name change"], "page": "T_&_R/Title_&_Registration/T_&_R_Scenarios.htm", "what": "Updates an owner's name on the vehicle registration and/or title. Always begins with the Credential Issuance service for the name change, then updates the registration or reprints the title.", "steps": ["Complete the name change using the Credential Issuance service first.", "For the registration: select Update Registration, search and select the Customer and Vehicle, and check the Tab Replacement box.", "Click the Owners tab, click the Edit Customer (pencil) icon, then click Back to Transaction.", "Return to the Owners tab, verify the name updated, click Confirm, and continue the service normally.", "For a new printed title: select Print Title, search for the Customer and Vehicle, and scroll to Current Ownership.", "Click the Edit Customer (pencil) icon, click Back to Transaction, and verify the name updated in Current Ownership.", "Select a Print Title Reason, click Confirm, and continue the service normally."], "tips": ["A name change on a redacted LECU record does not require lifting the redaction if there is no address change.", "Use Tab Replacement (not a new plate) so the customer receives updated documents without new plate fees."]}, {"id": "tr-scenario-out-of-state-dealer-work", "title": "Handle Out-of-State Dealer Work (WIP)", "cat": "Title & Registration", "intent": ["out of state dealer work", "dealer check funding", "work in progress WIP", "dealer paperwork by mail", "underpayment dealer", "missing dealer documents"], "page": "T_&_R/Title_&_Registration/T_&_R_Scenarios.htm", "what": "Processes title/registration paperwork mailed in by out-of-state dealers, using WIP to hold the service while validating payment and documents. Four sub-scenarios depend on whether documents/payment are complete.", "steps": ["Validate the appropriate documentation received and begin the service to validate or generate the fees due.", "Place the service in WIP (Work In Progress).", "If documents and payment are complete, contact the customer to process by phone or set an appointment, then fund the customer account with the dealer check and note any remaining balance.", "If underpaid or no check, use the dealer check and have the customer pay the remaining balance.", "If documents are missing but the customer is reachable, contact them to obtain the missing document before processing.", "If documents are missing and the customer is unreachable, provide a detailed list of required documents, fees due, and contact info, and mail all paperwork back to the out-of-state dealer."], "tips": ["Always validate payment and documentation before taking the service out of WIP.", "Fund the customer account with the dealer check and notify the customer of any remaining balance."]}, {"id": "tr-scenario-personalized-special-plate", "title": "Add a Personalized or Special Plate to an Existing Vehicle", "cat": "Title & Registration", "intent": ["personalized plate", "special plate background", "change plate type", "plate not found assign plate", "disability symbol plate", "commercial vehicle special plate"], "page": "T_&_R/Title_&_Registration/T_&_R_Scenarios.htm", "what": "Adds or changes a personalized/special plate (including new backgrounds, disability symbols, and commercial-vehicle special plates) on a vehicle that already has title and registration, via the Update Registration service.", "steps": ["From the Services menu, select Update Registration, search for the Customer and Vehicle, and click Add.", "In the License Plate section, select Replace Plate, then choose 'Change Plate Type' from the Replacement Reason Type dropdown.", "Type the personalization in the Desired Plate Number field and select the desired Plate Type (check Disabled Plate if adding/removing a symbol).", "Click Confirm, then right-click and Print (or CTRL+P) the Service Summary page and have the customer review the personalization and sign the last page.", "Click Continue, review Taxes and Fees, and click Pay Now or Add to Cart.", "Process payment and click Complete Checkout.", "In the Service Finalized screen, click Add Documents to scan the signed Service Summary, then download/print the service documents.", "If the personalized plate is not found, use Advanced Search > Plates; if still missing, select Assign Plate with $0 fees and finalize, then repeat with Replace Plate > Change Plate Type and collect all fees."], "tips": ["A disability-symbol adjustment on the Taxes and Fees screen is a $5 MVD Authorized Adjustment for a standard plate or $25 for a special plate.", "For a commercial vehicle, set Use Type to Commercial but choose a Plate Type that is NOT Commercial to allow a personalized/special plate.", "Adding a disability symbol may shorten the allowed personalization length."]}, {"id": "print-title", "title": "Print a Physical Title", "cat": "Title & Registration", "intent": ["print title", "physical title", "duplicate title", "lost title replacement", "central issuance title", "secure paper title"], "page": "T_&_R/Title_&_Registration/Print_Title.htm", "what": "Triggers centralized printing and mailing of a physical vehicle title (via Central Issuance, not field offices) — to produce paper for an electronic title or to replace a lost, destroyed, mutilated, or illegible title.", "steps": ["From the Services menu, select Print Title.", "Search for and select the Customer and Vehicle, then click Add.", "Review vehicle information and select the Print Title Reason from the dropdown.", "Optionally add a one-time mailing address, then click Confirm.", "Click Continue.", "Review the Taxes and F
