as taken.", "Eyeglasses must be removed; no head/face coverings except a beard/mustache, or coverings worn daily for religious/medical reasons.", "A customer who must register as a sex offender takes a new photo every time a license is issued.", "Use 'Skip photo quality verification' or 'Bypass Validation' only after multiple attempts fail.", "Only one photo is taken; advise customers accordingly."]}, {"id": "12-year-photo-update", "title": "Process a 12-year photo update", "cat": "Driver — Credentials", "intent": ["12 year photo update", "photo update duplicate", "extended license photo", "in person photo update", "update both credentials", "photo notice"], "page": "Driver/Credential_Issuance/12_Year_Photo_Update.htm", "what": "Arizona extended Non-Travel licenses do not expire until age 65, but residents must update their photo every 12 years. When notified, the customer must visit an office (or Authorized Third Party) for a new photo and replacement license.", "steps": ["Use the Credential Issuance service and select Duplicate.", "If the credential is recently expired or expiring soon, use the Credential Renewal service instead.", "For customers holding both Non-Travel and Arizona Travel credentials, update both simultaneously.", "Take a new photo during the process.", "Complete the service in person (there is no online option for a 12-year photo update)."], "tips": ["Customers have until the first day of the month following their birth month to act on the notice.", "Failing to update may cause ineligibility for AZ MVD Now services and for driver license/permit issuance.", "When both credential types are held, the customer pays all applicable fees for both to keep issue dates and photos matching."]}, {"id": "az-privilege-status", "title": "Read the AZ Privilege Status indicator", "cat": "Driver — Credentials", "intent": ["AZ privilege status", "privilege status icons", "ELG LIC RST NOT RPD", "eligibility indicator", "earliest eligibility date", "credential eligibility symbols"], "page": "Driver/Credential_Issuance/AZ_Privilege_Status.htm", "what": "The AZ Privilege Status display appears on a Driver Record or during a Credential Service as a quick visual indicator of credential eligibility, helping staff set expectations before starting a transaction.", "steps": ["Identify the symbol: green check (no legal barriers), caution sign (may need compliance or withdrawal pending), or circle-with-line (ineligible due to withdrawal or deceased).", "Note the designation for each credential type: ELG (eligible), LIC (has credential), RST (restricted), NOT (ineligible), RPD (deceased).", "Cross-reference the symbol plus designation to determine eligibility.", "Check supplemental information: State of Record Pointer, Earliest Eligibility Date, DL Earliest Restricted Eligibility Date, and Required Hard Time."], "tips": ["Other restrictions may still apply (e.g., age): a customer under 15.5 may appear eligible, but the only option will be a Class I ID Card."]}, {"id": "identity-eligibility-verification-interfaces", "title": "Identity & eligibility verification interfaces (PDPS, USPVS, SAVE)", "cat": "Driver — Testing & Eligibility", "intent": ["PDPS inquiry", "USPVS passport verification", "SAVE alien verification", "SPEXS pointer", "no match potential match", "run eligibility check"], "page": "Driver/Credential_Issuance/Identity_and_Eligibility_Verification_Interfaces.htm", "what": "MAX automatically runs electronic checks against national databases to verify identity and eligibility during credential issuance. Covers the verification services CSRs handle, including PDPS, USPVS, and SAVE.", "steps": ["PDPS 'No Match': enter Credential Issuance, select the credential type, and click the Requirements tab (MAX sends the PDPS inquiry automatically); a 'No Match' satisfies the requirement, and you may click the Edit icon to review then Cancel.", "PDPS potential matches: click the Edit icon to review the PDPS Inquiry screen, ask the customer clarifying questions (e.g., 'Have you ever lived in Oklahoma?'), check 'Select' next to matching names or click 'No Matches', then click Save.", "USPVS (passport) failure: click the Edit icon, click the 'Send USPVS Inquiry' tab, confirm Passport Number and DOB, update Customer Tab > Authorized Presence > Identifications if wrong, then click 'Run USPVS Check'.", "SAVE: run SAVE as normal, scan the document to the service, waive the VLS requirement, select 'Document' and type 'SAVE' in Details, then click Save."], "tips": ["For PDPS potential matches, do NOT close the window without selecting the results.", "A PDPS hit from another state prevents Arizona DL/IP issuance until resolved; a 'DECEASED' response means do not provide customer information.", "Customers have 20 days from the notification status mail date to request an Administrative Hearing for PDPS actions.", "For non-domiciled CLP/CDL, if SAVE does not confirm I-94/I-94A category H-2A, H-2B, or E-2, do not issue.", "PDPS Help Desk: 602-712-4991."]}, {"id": "aamva-messages-and-codes", "title": "Interpret AAMVA messages and codes (reference)", "cat": "Driver — Testing & Eligibility", "intent": ["AAMVA codes", "PDPS SPEXS message codes", "show message", "sex eye color codes", "license status codes", "endorsement medical codes"], "page": "Driver/Credential_Issuance/AAMVA_Messages_and_Codes.htm", "what": "A reference for interpreting AAMVA response codes returned during PDPS or SPEXS inquiries, where driver details may be encoded rather than plain text.", "steps": ["Make a PDPS or SPEXS inquiry. (reference)", "Click 'Show Message' in the results. (reference)", "Open the dropdown icons (such as stateOfRecordDriverName). (reference)", "Cross-reference coded values against the AAMVA chart: Sex (1=Male, 2=Female, 0=Unknown, 9=Not specified); Eye Color (BLK, BLU, BRN, HAZ, etc.); License Status (LIC=Licensed, ELG=Eligible, NOT=Not Eligible, RPD=Reported Deceased); Commercial Endorsements (T=Doubles/Triples, P=Passenger, N=Tank, H=Hazmat); and Medical Certification codes. (reference)"], "tips": []}, {"id": "vision-screening", "title": "Enter vision screening or exam report results", "cat": "Driver — Testing & Eligibility", "intent": ["vision screening", "vision exam report", "corrective lens restriction", "daylight only restriction", "visual acuity standards", "vision screening waived"], "page": "Driver/Credential_Issuance/Vision_Screening.htm", "what": "Vision screening confirms an applicant meets minimum vision standards before a driver license or permit is issued. Required prior to any class DL/IP issuance and may be required during any transaction when staff deem it necessary.", "steps": ["For screening: select Vision Screening from the Source dropdown.", "Enter the Exam Date (defaults to current date) and select the result (Pass, Fail, No Result).", "Select Corrective Lenses or Limited to Daylight Only restrictions if needed, then click Save (results cannot be edited once added).", "For an exam report: select Vision Exam Report from the Source dropdown and select the exam completion date.", "Check the boxes confirming doctor/optometrist information is present, physician recommendations are present, and the driver passes standards.", "Click Add Condition if applicable, enter the examination details, and select restrictions if needed.", "Click Save, then create a Work Task and send it to MRP for verification."], "tips": ["Minimum standards: visual acuity 20/40 or better in at least one eye (uncorrected) and visual field 70/35 or better in at least one eye.", "Restrictions: 'B' = corrective lenses; 'G' = daylight only (20/50-20/60 acuity or impaired night vision); 'J' = special per MRP.", "A Vision Examination Report (form #32-4001) is valid only 90 days from the exam date.", "Out-of-state vision screening fee is $5.00."]}, {"id": "vision-only-test", "title": "Perform a Vision Only Test (in-state / out-of-state)", "cat": "Driver — Testing & Eligibility", "intent": ["vision only test", "out of state vision screening", "in state vision test", "medical review vision", "vision printout mail home", "vision test service"], "page": "Driver/Credential_Issuance/Vision_Only_Test.htm", "what": "The Vision Only Test service provides vision screening outside of a credential transaction, either for out-of-state residents needing documentation for their home state (fee applies) or for Arizona residents with Medical Review requirements.", "steps": ["Click Menu, select Services, and click Vision Only Test.", "Enter customer search criteria (Driver License, Customer ID, etc.) and click the Search icon.", "Click Add, then click the Vision Screening tab.", "Out of State: select the 'Out of State' radio button, enter the Exam Date, answer Corrective Lenses/Monocular/Binocular Vision, and enter Visual Acuity and Visual Field (Temporal and Nasal) results per eye.", "Screen print the results including the customer's name before proceeding, then click Confirm, review the Service Summary, click Continue, review Taxes/Fees, click Pay Now or Add to Cart, and Complete Checkout.", "In State: select the 'In State' radio button, select the Test Result (Pass, Fail, No Result), select Restrictions if applicable, click Confirm, review the Service Summary, click Continue, and download/print the service documents for the customer."], "tips": ["Prior to clicking Confirm on an out-of-state test, screen print the results (with the customer's name in the image) to give to the customer.", "The out-of-state result field stays blank because each state has different acuity requirements.", "In-state results automatically satisfy Medical Review requirements when completed."]}, {"id": "tsa-hazmat-sta", "title": "Verify TSA Hazmat (HME) security threat assessment", "cat": "Driver — CDL", "intent": ["TSA hazmat", "HME endorsement", "hazardous materials endorsement", "security threat assessment", "TSA/HME requirement", "hazmat background check"], "page": "Driver/Credential_Issuance/TSA_Hazmat.htm", "what": "Handles the TSA background check (Security Threat Assessment) required before issuing a Hazardous Materials Endorsement (HME) on a CDL. Applies to new HME applicants and renewals where the prior check has expired.", "steps": ["Begin a Credential Issuance service.", "On the Credential tab, select the 'Hazardous Material' checkbox.", "Go to the Requirements tab and review the 'TSA/HME' requirement.", "If marked 'Satisfied', an approved TSA response is on file; click the Action icon to view it if needed.", "If marked 'Unsatisfied', click Action to view details (no response, or a restricting response).", "If 'Not Approved' appears, deny the HME; if an Expiration Date shows, the customer may reapply after that date.", "If 'No Records Found' displays, the customer may need to apply for STA or submit a Service Portal ticket for helpdesk entry."], "tips": ["Eligibility: valid CDL (or applying), age 21+, completed CDL Entry Level Driver Training, and passed all CDL written and skills tests.", "The background check is valid for up to five years regardless of the CDL validity length.", "Applicants may receive a CDL without the HME while awaiting TSA approval.", "'No security threat' or 'OOS Transfer' responses are approvable."]}, {"id": "extension-temporary-restricted-credentials", "title": "Issue extension, temporary, or restricted credentials", "cat": "Driver — Credentials", "intent": ["credential extension", "temporary credential", "restricted credential", "out of state extension", "hardship license", "change expiration date reason"], "page": "Driver/Credential_Issuance/Extension_-_Temporary_-_Restricted_Credentials.htm", "what": "Covers extensions (for out-of-state or military customers whose license expires), temporary credentials (for customers with withdrawals who may still drive under conditions), and restricted credentials (limited privileges instead of full suspension).", "steps": ["Process the credential issuance normally through all requirements.", "Click Confirm to reach the Service Summary screen.", "Click the 'Expiration Date' link.", "In the pop-up, select the reason from the Reason dropdown menu.", "Let the expiration date auto-adjust per business rules (manually adjust only if you selected 'Other'), then click Save.", "Verify the updated date displays in the Credential Details section and click Continue to complete processing.", "For out-of-state extensions and hardship licenses, add a One Time Mailing Address and request/receive Override Escalation approval."], "tips": ["Extensions apply only to Class D or M (A, B, C ineligible); the customer must be out-of-state 30+ consecutive days beyond expiration; military members and spouses/children qualify.", "Fees: out-of-state extension $5.00, hardship temporary credential $10.00 (180-day max), temporary ID $12.00 (waived age 65+), motorcycle endorsement $7.00.", "Restricted credential fees are waived (only the $12 fee) and expiration auto-adjusts per withdrawal business rules.", "Registered sex offenders are not eligible and must apply in person.", "Lost Admin Per Se/Implied Consent temporary license replacements are free."]}, {"id": "cdl-eldt-verification", "title": "Verify CDL Entry-Level Driver Training (ELDT)", "cat": "Driver — CDL", "intent": ["ELDT", "entry level driver training", "CSTIMS", "ELDT met", "first-time CDL training", "hazmat training requirement", "ELDT exempt"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Entry_Level_Driver_Training.htm", "what": "ELDT verification confirms that entry-level commercial drivers completed required training before CDL skills testing or hazmat endorsement exams. It applies to first-time CDL applicants and certain upgrades/endorsements as of February 7, 2022.", "steps": ["Access CSTIMS and verify \"ELDT Met\" status for the applicant.", "Return to MAX and navigate to the Requirements tab.", "Click the Edit pencil icon next to the ELDT requirement.", "Enter the date ELDT was completed.", "Select the verifying user (who checked CSTIMS).", "Choose the Result option: \"Met,\" \"Military Waiver,\" or \"Exempt.\"", "Click Save."], "tips": ["Required ELDT applies to first-time Class A or B applicants, Class B to Class A upgrades, and first-time school bus, passenger, or hazmat endorsements.", "Exempt categories include existing out-of-state CDL holders, CDLs expired before 2/7/2022, and Mexican/Canadian CDL holders (same class).", "Military personnel may have a waiver, but endorsements still require ELDT.", "CSRs are not required to scan the ELDT or CSTIMS results into MAX as part of the service."]}, {"id": "cdl-add-endorsement", "title": "Add a CDL Endorsement", "cat": "Driver — CDL", "intent": ["add endorsement", "hazmat H", "tank N", "passenger P", "school bus S", "doubles triples T", "expand CDL privileges", "endorsement knowledge test"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Driver_Endorsements.htm", "what": "Adds one or more endorsements to an existing CDL so the driver can operate specific vehicle types or transport particular cargo. Used when a customer wants to expand their CDL privileges.", "steps": ["From the Services menu select \"Credential Issuance,\" search for the customer, and click \"Add.\"", "Review photos (a new photo is required unless taken the same day) and select the address for printing.", "Click the \"Credential\" tab and select the class and endorsement(s) to add, including all current endorsements.", "Click the \"Questionnaire\" tab, capture updates, and verify \"Non-excepted interstate/intrastate\" options.", "Print the application for the customer's signature.", "On the Requirements tab, click \"Yes\" for the airbrake confirmation and verify all requirements are satisfied.", "Click the waiver icon, select \"Document\" reason, type \"Non-TID Dup,\" and save.", "Click \"Collect Fees\" and adjust the $25 application fee as not required.", "Click \"Pay Now,\" process payment, and complete checkout.", "Click \"Send test(s) to MVDNow\" for the knowledge test, then pause the service (place in WIP).", "After testing, check in the customer and verify the Requirements tab.", "Click \"Request Transfer\" and inform the customer of the 15-minute completion window."], "tips": ["Hazmat requires passing the knowledge test, ELDT (if applicable), and STA Fingerprints.", "School Bus requires an existing Passenger endorsement and a mandatory skills test.", "When adding endorsements, restrictions may drop and need to be re-added; an alert shows if a current endorsement is not selected on the new credential.", "Knowledge test scores are valid 12 months only.", "CDL team communicates via Google Chat; never send photos or screenshots."]}, {"id": "cdl-remove-endorsement", "title": "Remove a CDL Endorsement (Duplicate)", "cat": "Driver — CDL", "intent": ["remove endorsement", "reduce CDL privileges", "commercial duplicate", "drop endorsement", "duplicate fee"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Driver_Endorsements.htm", "what": "Removes an endorsement from an existing CDL, reducing the driver's privileges and producing a duplicate credential.", "steps": ["From the Services menu select \"Credential Issuance,\" search for the customer, and click \"Add.\"", "Review photos and select the address for printing.", "Click the \"Credential\" tab and select only the class and endorsements the customer will keep (omit the endorsement being removed).", "Click the \"Questionnaire\" tab and capture updates.", "Print the application for the customer's signature and confirm the airbrake requirement.", "Collect the $12.00 duplicate fee and process payment.", "Complete the service and request transfer to the CDL business unit."], "tips": ["Duplicate fee for removals is $12.00.", "Doubles-Triples, Passenger, School Bus, and Tanker renewals are charged no fee."]}, {"id": "cdl-commercial-knowledge-test", "title": "Administer the Commercial Knowledge Test", "cat": "Driver — CDL", "intent": ["commercial knowledge test", "CDL written test", "CLP knowledge", "80 percent passing", "retest same day", "endorsement knowledge fees"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Knowledge_Test.htm", "what": "The Commercial Knowledge Test determines whether applicants know the state and federal traffic laws and driving practices needed to safely operate a Commercial Motor Vehicle. Required for initial CDL/CLP, upgrades, expired credentials, new endorsements, and HME renewals.", "steps": ["Before administering a retest, verify in MAX that the applicant has not already tested the same day. See the \"Knowledge Testing in MAX\" procedure for the in-MAX steps to send tests and record results."], "tips": ["80% or higher is needed to pass.", "Attempts are unlimited on one payment; multi-part tests count as one test.", "CLP fees: Class A/B $25, Class C $12.50; endorsements $10 each (School Bus has no fee).", "Applicants under 18 are ineligible for CDL/CLP; those under 21 cannot test for the Hazardous Materials endorsement.", "If cheating is observed, the test is immediately stopped, recorded as a fail, and a Safety/Security Incident Report is filed."]}, {"id": "cdl-commercial-skills-test-results", "title": "Enter Commercial Skills Test Results", "cat": "Driver — CDL", "intent": ["commercial skills test", "CDL road test results", "vehicle inspection", "basic controls", "CDL examiner", "record skills test"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Skill_Test.htm", "what": "Records the results of a CDL skills test, which verifies the applicant can safely operate a commercial motor vehicle. Tests are given by qualified CDL Examiners in English only after applicable knowledge tests are passed.", "steps": ["Navigate to the Requirements tab and select the edit icon next to the Skills Test requirement.", "Choose the Date the skills test was completed.", "Mark the Performance Evaluation checkbox if applicable.", "Select the Source as \"In Office\" from the dropdown.", "Choose the Representative Vehicle type.", "Select the CMV Vehicle Inspection results.", "Select the CMV Basic Controls results.", "Select the CMV Road Test results.", "Designate any applicable Restrictions.", "Identify the Examiner who conducted the test.", "Click Save."], "tips": ["Fields activate sequentially; failure at any stage prevents advancement.", "Applicant must hold a valid Arizona Class A, B, or C CLP and a valid Class D license/CDL from the same state.", "Any knowledge or skills test may be administered only once per day at field offices; ATP schools require a two-day wait between attempts.", "Passenger and School Bus endorsements require a $5 skills testing fee; Doubles/Triples, HME, and Tank do not require skills tests.", "All first-time CDL applicants (as of 2/7/2022) must complete ELDT before scheduling the skills test."]}, {"id": "cdl-commercial-medical-requirements", "title": "Verify and Submit Commercial Medical Documentation", "cat": "Driver — CDL", "intent": ["commercial medical", "medical exam certificate", "interstate electronic submission", "intrastate paper medical", "FMCSA medical", "medical review"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Commercial_Medical_Requirements.htm", "what": "Handles medical examination documentation that CDL/CLP applicants and holders must submit to prove they are physically qualified to operate commercial motor vehicles. Includes verifying documentation on file and submitting intrastate paperwork.", "steps": ["From the Services menu, select \"Credential Issuance.\"", "Search for and select the customer, then click \"Add.\"", "Click the \"Credential\" tab and select a \"Commercial Class Driver License.\"", "Click the \"Requirements\" tab.", "Click the down arrow to display the Medical Exam Certificate.", "Click the \"Edit\" icon to view expiration date details.", "Click \"Cancel\" and delete the service when complete.", "For INTRAstate documentation, use the \"Create Work Task\" service or email documentation to medicalreview@azdot.gov (allow 15-20 minutes for Create Work Task processing)."], "tips": ["As of June 23, 2025, MVD no longer accepts paper medical documentation for INTERstate applicants/holders; it must be submitted electronically through FMCSA within 24 hours.", "Medical exams are valid 24 months or sooner per examiner/regulation.", "Customer may carry a paper copy for 15 days while awaiting record update (10 calendar days max).", "Qualified examiners include an MD, DO, chiropractor, nurse practitioner, physician assistant, or (vision only) licensed optometrist."]}, {"id": "cdl-vision-standards", "title": "Apply CDL Vision Standards and Corrective Lens Restriction", "cat": "Driver — CDL", "intent": ["CDL vision standards", "20/40 acuity", "B restriction corrective lenses", "visual field", "color recognition", "vision waiver", "bioptic ineligible"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Vision_Standards.htm", "what": "Ensures CDL applicants meet federal/state vision requirements and applies the corrective-lens restriction when needed for interstate and intrastate CDL holders.", "steps": ["Confirm the applicant meets standards using each eye: visual acuity 20/40, visual field 70º or greater temporal and 35º or greater nasal, and color recognition of red, green, and amber signals.", "Have an FMCSA-qualified medical professional electronically submit current examination records for interstate/intrastate CLP or CDL applicants.", "For intrastate waivers, submit paper documentation to an MVD field office, ATP office, mail, or email.", "If corrective lenses are required to meet vision standards, place a \"B\" restriction on the CDL and re-add all applicable endorsements."], "tips": ["The over-the-counter MVD office vision test is not acceptable.", "Bioptic Telescopic Lens System users are ineligible for a CDL.", "A driver claiming no \"B\" restriction requirement must provide current medical examination documentation.", "Monocular vision or uncorrected acuity greater than 20/40 may qualify for a Federal or Intrastate Driver Waiver through the Medical Review Program."]}, {"id": "cdl-add-restriction", "title": "Add a CDL Restriction", "cat": "Driver — CDL", "intent": ["CDL restriction", "E no manual transmission", "L no air brakes", "B corrective lenses", "K intrastate only", "add restriction"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Restrictions.htm", "what": "Adds a restriction to a CDL during credential issuance. Restrictions limit driving privileges based on health issues, vehicle type, or test performance.", "steps": ["Select \"Credential Issuance\" from the Services menu, search for and select the customer, and click \"Add.\"", "Review photos (new photo required unless taken same day) and select the residential or mailing address for the credential.", "Click the \"Credential\" tab and select the current license class and endorsements.", "Click the \"Questionnaire\" tab and verify interstate/intrastate selections.", "Print the application and have the customer sign.", "Click \"Yes\" to the airbrake confirmation warning.", "Click \"Add Restriction\" and select the restriction type from the dropdown, then click \"Save.\"", "Confirm all requirements are satisfied.", "Click \"Collect Fees,\" adjust the application fee from $25 to $12, and add the $12 Commercial Duplicate Fee.", "Click \"Pay Now\" and complete checkout.", "Return to Credential Issuance and click \"Request Transfer.\"", "Inform the customer of the 15-minute processing window."], "tips": ["Key restrictions: E = No Manual Transmission, L = No Air Brakes Equipped CMV, B = Corrective Lenses Required, K = Intrastate Only.", "Do NOT check the \"Air Brakes\" box when adding the \"L\" restriction.", "Vision must be certified medical documentation, not the MVD office test.", "Medical variance restrictions (B, K, S, V) trigger the auto-notification system.", "There is a 60-day deadline for adding required restrictions before suspension/revocation."]}, {"id": "cdl-downgrade", "title": "Process a CDL Downgrade", "cat": "Driver — CDL", "intent": ["CDL downgrade", "voluntary downgrade", "DACH downgrade", "drug alcohol clearinghouse", "authorized presence downgrade", "downgrade to Class D"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/CDL_Downgrades.htm", "what": "Downgrades a CDL to a Class D or M license. May be voluntary (disqualified/suspended/revoked CDL privilege), a required DACH downgrade (FMCSA Drug and Alcohol Clearinghouse Prohibited status), or a required Authorized Presence downgrade.", "steps": ["Access the Credential Issuance service.", "On the Credential tab, select Class D.", "If the applicant has a motorcycle endorsement, select Class M under Non-Commercial.", "Verify corrective lens restrictions automatically transfer.", "Continue processing normally."], "tips": ["An age-appropriate application fee is charged; reinstatement fees are required if outstanding withdrawal actions exist.", "A motorcycle endorsement may be retained at no charge when downgrading a CDL to Class D.", "DACH withdrawal takes effect on the 30th day from receipt of Prohibited status; drivers have 12 months to complete Return to Duty.", "The Division immediately rescinds actions upon FMCSA notification of incorrect Prohibited status."]}, {"id": "cdl-issue-clp-no-endorsements", "title": "Issue a CLP with No Endorsements", "cat": "Driver — CDL", "intent": ["commercial learner permit", "CLP no endorsements", "Class A B C permit", "send test to MVDNow", "transfer to CDL BU", "temporary credential"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Credential_Issuance_CDL_Scenarios.htm", "what": "Issues a Class A/B/C Commercial Learner's Permit to an applicant who holds a current Arizona Class D license and needs no endorsements.", "steps": ["From the Services menu select Credential Issuance, then search and add the customer (create a record if needed).", "Review photos (new photo required unless taken same day) and verify eligibility via the AZ Privilege Status section (Class D current and ELG status).", "Select the address for printing and complete the Customer tab fully.", "Click the Credential tab, select the class and restrictions (e.g., Air Brakes), and Add/save the credential if proof of driving experience is needed.", "Click the Questionnaire tab, capture updates, and answer CDL-specific questions (Non-excepted INTERstate vs. INTRAstate).", "In the DLN Survey section click \"Yes\" if applicable, then click \"Add New\" and add each state from the past 10 years (save and repeat).", "Print the application; have the customer review and sign.", "Click the Requirements tab, click \"Yes\" to the Air Brake warning, and verify all requirements are satisfied except knowledge tests (NRII and Medical Exam Certificate may be satisfied or \"In Progress\").", "Click Collect Fees, click Pay Now, process payment, and complete checkout.", "Return to Credential Issuance, click the Requirements tab, and click \"Send test(s) to MVDNow\" next to the Knowledge Test; place the customer in WIP and direct them to the testing station.", "After the customer passes, check them in, re-verify requirements (photo taken that day, results transferred, restrictions re-added, fees paid, documents scanned), then click Request Transfer and Transfer to the CDL BU.", "Inform the customer the service may take up to 15 minutes; when the CDL team confirms issuance, print the temporary credential from Service History and provide the CDL Maintenance Card."], "tips": ["CLP eligibility requires holding a non-commercial Class D license for at least one year (excluding motorcycle).", "If the Air Brakes checkbox is NOT selected, the \"No Air Brakes Equipped CMV\" (L) restriction is applied automatically.", "AAMVA Pointer checks may lag; click another tab then back to Requirements to refresh status.", "Reply to CDL team Google Chat with specific transaction details; never send photos or screenshots."]}, {"id": "cdl-issue-clp-with-endorsements", "title": "Issue a CLP with Endorsements", "cat": "Driver — CDL", "intent": ["CLP with endorsements", "endorsement knowledge tests", "add requirement knowledge test", "endorsement fees", "passenger tanker school bus permit"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Credential_Issuance_CDL_Scenarios.htm", "what": "Issues a Class A/B/C CLP with requested endorsements (Passenger, School Bus, Tanker, etc.) to an applicant holding a current Arizona Class D license, including populating the correct endorsement knowledge tests.", "steps": ["Complete customer search/add, photo review, eligibility verification, address selection, and Customer tab as in a standard CLP issuance.", "Click the Credential tab and select the class, endorsements, and restrictions; Add/save the credential if proof of driving experience is needed.", "Complete the Questionnaire tab, DLN Survey, and 10-year state history; print the application and have the customer sign.", "Click the Requirements tab, click \"Yes\" to the Air Brake warning, and verify requirements are satisfied except knowledge tests.", "Verify the proper knowledge tests populated based on the endorsements selected.", "If additional tests are needed, click \"Add Requirement,\" select \"Knowledge Test\" from Category, select the test(s) from the Requirement dropdown, click Add, and repeat for each test.", "Close warnings by clicking \"Clear Warning.\"", "Click Collect Fees, click \"Add Fee\" for the endorsement fees (each test), click Pay Now, and complete checkout.", "Return to Credential Issuance, click the Requirements tab, and click \"Send test(s) to MVDNow\"; place the customer in WIP and direct them to the testing station.", "After passing, check the customer in, re-verify requirements, then click Request Transfer and Transfer to the CDL BU.", "Inform the customer of the up-to-15-minute window; when the CDL team confirms issuance, print the temporary credential from Service History."], "tips": ["Ask the customer which endorsements to add, the vehicle type, and whether endorsement knowledge tests must reflect on the CLP.", "If a current active credential has an endorsement not included in the new credential, an alert displays; return to the Credential tab to adjust.", "Never remove the service from the CDL queue or begin the service as an upline approver."]}, {"id": "cdl-issue-az-original-cdl", "title": "Issue a Class A/B/C CDL (Arizona Original)", "cat": "Driver — CDL", "intent": ["Arizona original CDL", "skills test results upload", "CSTIMS verification", "3rd party CDL school", "MVD CDL office", "CDL road test fee"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Credential_Issuance_CDL_Scenarios.htm", "what": "Issues an original Arizona Class A/B/C CDL to an applicant who completed the skills test through a 3rd-party CDL school or at an MVD CDL office.", "steps": ["Check MAX and CSTIMS for passing scores and have an upline approver verify the passing CDL scores in CSTIMS.", "Complete customer search/add, photo review, address selection, and Customer tab.", "Click the Credential tab and select the class, endorsements (new/existing), Air Brakes, and restrictions.", "Complete the Questionnaire tab, CDL-specific questions, DLN Survey, and 10-year state history; print the application and have the customer sign.", "Click the Requirements tab, click \"Yes\" to the Air Brake warning, and verify requirements satisfied except skills tests (NRII and Medical Exam Certificate may be \"In Progress\").", "Click the edit icon to add Skill Test results (in-state testing requires the application submitted with passed results marked by the examiner; out-of-state testing requires the application submitted, and only CDL Examiners have CSTIMS access).", "Click \"Upload\" to upload the application with test results.", "Click Collect Fees; for MVD testing collect only the CDL issuance/upgrade fee (road test fee already paid), and for 3rd-party do NOT collect CDL Road Test fees.", "Click \"Add Fee\" for any additional unpaid fees, click Pay Now, and complete checkout.", "Return to Credential Issuance, verify requirements (photo that day, results transferred, restrictions re-added, fees paid, documents scanned), then click Request Transfer and Transfer to the CDL BU.", "When the CDL team confirms issuance, print the temporary credential from Service History and provide the CDL Maintenance Card."], "tips": ["If out-of-state testing is claimed, the CDL BU agent will verify via CSTIMS.", "Contact CDL management/leads for out-of-state testing since only CDL Examiners have CSTIMS access.", "CDL processing is typically 15 minutes maximum; notify the upline approver if it exceeds 15 minutes."]}, {"id": "cdl-issue-out-of-state-transfer-hazmat", "title": "Issue an Out-of-State CDL Transfer with Hazmat", "cat": "Driver — CDL", "intent": ["out of state CDL transfer", "hazmat endorsement transfer", "STA security threat assessment", "TSA response", "hazmat knowledge test", "HME"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Credential_Issuance_CDL_Scenarios.htm", "what": "Transfers a current out-of-state CDL to Arizona for an applicant transferring a Hazmat endorsement, which requires a Hazmat knowledge test and a TSA Security Threat Assessment (STA) before issuance.", "steps": ["Complete customer search/add, photo review, address selection, and Customer tab.", "Click the Credential tab and select the class, \"Hazardous Material,\" and any additional endorsements/restrictions.", "Click \"Add Credential,\" enter the customer's out-of-state CDL details (endorsements, restrictions), and click \"Save.\"", "Complete the Questionnaire tab; click \"Yes\" on the DLN Survey (required to record out-of-state licenses) and add the 10-year state history.", "Print the application; have the customer review and sign.", "Click the Requirements tab, click \"Yes\" to the Air Brake warning, and verify requirements satisfied except knowledge tests.", "Click Collect Fees, click Pay Now, and complete checkout.", "Return to Credential Issuance, click the Requirements tab, and click \"Send test(s) to MVDNow\"; place the customer in WIP and direct them to the testing station.", "While the customer tests, have an upline approver submit a Service Portal ticket to Tech Support requesting the CDL Helpdesk update the HME Security Threat Assessment (STA) in MAX with the current TSA response.", "After the customer passes, check them in, re-verify requirements, then click Request Transfer and Transfer to the CDL BU.", "When the CDL team confirms issuance, print the temporary credential from Service History and provide the CDL Maintenance Card."], "tips": ["The applicant must take the Hazmat knowledge test and have a Hazmat STA from TSA before issuance.", "Applicants under 21 cannot test for the Hazardous Materials endorsement.", "Never send photos or screenshots in the CDL team Google Chat."]}, {"id": "cdl-issue-out-of-state-no-hazmat", "title": "Issue an Out-of-State CDL Transfer without Hazmat", "cat": "Driver — CDL", "intent": ["out of state CDL transfer", "no hazmat", "add credential out of state", "DLN survey", "10 year history", "transfer to CDL BU"], "page": "Driver/Credential_Issuance/Commercial_Driver_License/Credential_Issuance_CDL_Scenarios.htm", "what": "Transfers a current out-of-state CDL to Arizona for an applicant who is NOT transferring a Hazmat endorsement.", "steps": ["Complete customer search/add, photo review, address selection, and Customer tab.", "Click the Credential tab and select the class and requested endorsements (without Hazmat).", "Click \"Add Credential,\" enter the customer's out-of-state CDL details, and click \"Add.\"", "Complete the Questionnaire tab; click \"Yes\" on the DLN Survey and add the 10-year state history.", "Print the application; have the customer review and sign.", "Click the Requirements tab, click \"Yes\" to the Air Brake warning, and verify all requirements are satisfied.", "Click Collect Fees, click Pay Now, and complete checkout.", "Return to Credential Issuance, click the Requirements tab, and re-verify requirements (photo that day, results transferred, restrictions re-added, fees paid, documents scanned).", "Click Request Transfer and Transfer to the CDL BU; inform the customer of the up-to-15-minute window.", "When the CDL team confirms issuance, print the temporary credential from Service History and provide the CDL Maintenance Card."], "tips": ["Submit a Service Portal ticket if NRII or Medical Exam Certificate requirements are not satisfied after 15-20 minutes (common causes: AAMVA/FMCSA down or multiple records returned).", "Do not remove the service from the CDL queue as an upline approver."]}, {"id": "noncomm-knowledge-test", "title": "Administer the Non-Commercial Knowledge Test", "cat": "Driver — Testing & Eligibility", "intent": ["non-commercial knowledge test", "written test 30 questions", "Class G D permit", "first-time applicant", "knowledge test waiver", "reciprocity waiver"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Non_Commercial_Knowledge_Test.htm", "what": "The knowledge test evaluates whether applicants can read traffic control devices, understand safe driving practices, and know Arizona traffic laws. Required before issuing a Class G or D instruction permit and driver's license for first-time Arizona applicants and certain other situations.", "steps": ["Confirm the applicant must test (first-time Arizona applicant, out-of-state license expired over one year, or U.S. Military-issued credential).", "Follow the \"Knowledge Testing in MAX\" procedure to send the test to a station and record results."], "tips": ["Testing consists of 30 questions, of which 24 must be answered correctly (80% passing).", "The test is non-timed, offered in multiple languages, and must be completed without assistance; foreign language dictionaries are allowed if checked for notes.", "Waivers apply to valid German, Canadian, Taiwan, or South Korean licenses, NATO active-duty members with orders, qualifying high school driver-ed certificates, and valid out-of-state licenses not expired over one year.", "One attempt per day (exception: Permit Test @ Home allows unlimited daily attempts); test results do not expire."]}, {"id": "motorcycle-knowledge-test", "title": "Administer the Motorcycle Knowledge Test", "cat": "Driver — Testing & Eligibility", "intent": ["motorcycle knowledge test", "Class M instruction permit", "Class M license", "25 questions", "MSF completion card", "motorcycle test exemption"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Motorcycle_Knowledge_Test.htm", "what": "The motorcycle knowledge test assesses operator competency for Arizona motorcycle credentials. Required when applying for a Class M Instruction Permit or Class M Driver License unless exempted by prior licensing or training.", "steps": ["Confirm the applicant is not exempt (valid M license/endorsement from another state, valid German M license, NATO orders, law-enforcement motorcycle training certificate, or MSF/Total Control completion card).", "Follow the \"Knowledge Testing in MAX\" procedure to send the test to a station, choose the language, and manually update results."], "tips": ["The test has 25 questions, of which 20 must be answered correctly (80% passing).", "One attempt per day maximum; the applicant must wait until the next business day to retest.", "A Class M IP is valid for seven months (or shorter if authorized presence requires), with a maximum of two permits per person within 24 months.", "Fees paid are valid until the original credential is issued; Division test results do not expire."]}, {"id": "noncomm-skills-test-in-credential", "title": "Enter Non-Commercial Skills Test Results (During Credential Service)", "cat": "Driver — Testing & Eligibility", "intent": ["non-commercial skills test", "road test results", "parking test", "vehicle inspection", "record skills test in credential", "examiner"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Non_Commercial_Skill_Test.htm", "what": "Records Non-Commercial Skills Test results within an active credential service. The test determines whether a person can safely operate a motor vehicle and is required for first-time applicants and several other situations.", "steps": ["From the Requirements tab, click the edit icon for the Non-Commercial Skills Test.", "Select the test completion date.", "Select the source (In Office, PDS-Operator School, or PDS-High School).", "Select the Vehicle Inspection Results (Pass/Fail/No Result).", "Select the Parking Test Results (Pass/Fail/No Result).", "Select the Road Test Results (Pass/Fail/No Result).", "Select any restrictions from the dropdown.", "Select the examiner from the dropdown.", "Click Save."], "tips": ["There is no charge for this service.", "Division test results are valid for life and do not expire.", "The test is conducted by Road Test Contractors and certified CSRs only, and selected restrictions print on the back of the driver license.", "Dangerous actions during testing trigger Summary Suspension/Revocation proceedings."]}, {"id": "noncomm-skills-test-standalone", "title": "Process a Stand-Alone Non-Commercial Skills Test", "cat": "Driver — Testing & Eligibility", "intent": ["stand-alone skills test", "non commercial skill test service", "in state out of state", "zero dollar receipt", "road test service"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Non_Commercial_Skill_Test.htm", "what": "Records a Non-Commercial Skills Test as a stand-alone service (outside a credential issuance), finalizing with a zero-dollar receipt.", "steps": ["From the Menu select Non Commercial Skill Test.", "Search and click Add.", "Click the Non Commercial Skill Test tab.", "Select In State or Out of State.", "Enter test date, source, vehicle inspection, parking, and road test results, restrictions, and examiner (as in the credential-service process).", "Click Confirm, then Continue.", "The service finalizes with a zero-dollar receipt."], "tips": ["There is no charge for this service.", "Division test results are valid for life and do not expire."]}, {"id": "knowledge-testing-in-max-send", "title": "Send a Knowledge Test to a Test Station in MAX", "cat": "Driver — Testing & Eligibility", "intent": ["knowledge testing in MAX", "send test to station", "ASI invitation code PIN", "AZ MVD Now invitation", "pause service WIP", "test station"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Knowledge Testing in MAX - NEW.htm", "what": "All knowledge tests are now administered directly in MAX (instead of Idemia AutoTest). This sends a test to a test station after issuance fees are collected and the applicant reaches the testing stage.", "steps": ["From the Credential Issuance service, on the Requirements tab, click the Send Request icon next to the Knowledge Test.", "Confirm the success notification by clicking OK.", "Navigate to the Customer tab and click Edit Customer.", "Click the AZ MVD Now icon, then Add Invitation.", "Select Knowledge Test from the Service Type dropdown and click Save.", "Click the Print icon for the invitation.", "Print the ASI Invitation Code and PIN and give them to the customer.", "Click the Pause button to place the service in WIP.", "After the test is completed, check in the customer to open the service."], "tips": ["Customers can only test at MVD or ATP test computers; ASI will not work on other devices (exception: Permit Test at Home uses the new MAX format).", "The system auto-logs out after 10 minutes of inactivity.", "CSRs must monitor the testing area by periodically scanning it; if cheating is observed, terminate testing privately and advise the applicant they may retest the next business day.", "Non-Commercial languages: English, Arabic, French, German, Italian, Korean, Mandarin, Russian, Spanish, Tagalog, Vietnamese; CDL tests are English and Spanish only."]}, {"id": "knowledge-testing-in-max-update-results", "title": "Manually Update Knowledge Test Results in MAX", "cat": "Driver — Testing & Eligibility", "intent": ["update knowledge test results", "knowledge only test", "manual test entry", "paper exam grading", "test source result", "record pass fail"], "page": "Driver/Credential_Issuance/Non-Commercial Testing/Knowledge Testing in MAX - NEW.htm", "what": "Manually records knowledge test results in MAX, either as a stand-alone Knowledge Only Test service or within a credential issuance service.", "steps": ["Stand-alone: From the Menu, select Knowledge Only Test, then search and select the customer.", "Click the Knowledge Test tab and select In State/Out of State location.", "Check the Test Type boxes (Non Commercial, Motorcycle, or both).", "Select the test date and Source (e.g., In Office Automated Test, Third Party, Paper exam, At Home Automated Test, Verbal Exam, or a PDS variant).", "Select the Test Results (Pass, Fail, No Result).", "Select Restrictions and Examiner if applicable, then click Confirm.", "During credential issuance: click the edit icon next to the Knowledge Test requirement, select the test date and Source, select the Result (Pass/Fail/No Result), select the Examiner, and click Save."], "tips": ["80% or higher is required to pass; the test automatically stops when the passing threshold or failure limit is reached.", "Paper tests must be surrendered to the CSR upon completion and cannot leave the facility.", "After grading a paper test, generate an ASI for the customer to review answers at a test station."]}, {"id": "authorized-presence-view-history", "title": "View Authorized Presence History in MAX", "cat": "Driver — Testing & Eligibility", "intent": ["authorized presence", "prove lawful presence", "show history", "limited license renewal", "travel non-travel credential", "SAVE verification"], "page": "Driver/Credential_Issuance/Authorized Presence/Authorized_Presence.htm", "what": "Customers must prove eligibility to be in the U.S. under Federal Law when renewing a limited Arizona Driver License or applying for an original Arizona Travel or Non-Travel Driver License, ID, or Permit. This procedure views a customer's authorized presence history.", "steps": ["Begin a Credential Service and click the Customer tab.", "Click the Authorized Presence Edit icon.", "In the pop-up window, click Show History.", "Click the expand icon to the left of the history entry.", "Review the History Details that display.", "Click Cancel to return to the credential issuance service."], "tips": ["At least one Primary form of identification is required; all documents must be in English and either an original or a certified copy.", "USCIS classifications A-1, A-2, C-1, C-1D, C-2, C-3, D-1, D-2, and G-1 are ineligible for any Arizona credential (unless a Non-Eligibility Letter is provided for A/G classes).", "Names with accent marks (ñ) cannot be processed per AAMVA standards.", "SAVE verification is required for all foreign applicants seeking Travel DL/ID credentials.", "A foreign credential's expiration date must coincide with the customer's assigned authorized presence expiration date."]}, {"id": "authorized-presence-foreign", "title": "Record Foreign Authorized Presence in MAX", "cat": "Driver — Testing & Eligibility", "intent": ["foreign authorized presence", "INS category", "I-94", "permanent resident card", "employment authorization", "SAVE", "Canadian credential"], "page": "Driver/Credential_Issuance/Authorized Presence/Foreign.htm", "what": "Documents and verifies a customer's authorized presence in the U.S. when they present foreign immigration documents (permanent resident cards, employment authorization, visas, I-94s, etc.) during credential intake.", "steps": ["Begin a Credential Service for the applicant and navigate to the Customer tab.", "Click the Authorized Presence Edit icon.", "Select the appropriate Authorized Presence type from the dropdown (e.g., Resident/Permanent Alien, Temporary INS, Canada).", "Choose the INS Category from the dropdown based on the document presented.", "Select the Document Type matching the supporting documentation.", "Complete the Primary Proof Document Information section with details from the submitted documents.", "Click Add Identification and enter the Identification Type, ID Number, Effective Date, and End Date.", "Click Save to record the identification.", "Click Save again to finalize the Authorized Presence entry.", "Verify the expiration date calculates correctly in the Service Summary window."], "tips": ["When the primary identification document is an I-94, obtain the name from the customer's foreign passport, Visa, or Arizona Refugee Medical Assistance Card.", "Permanent Resident Cards with no expiration date are issued in ten-year increments.", "Employment Authorization Documents (EAC/EAD) require the applicant to provide a Social Security Number.", "Canadian citizens automatically receive a 6-month credential expiration in MAX.", "CDL/CLP applicants need an unexpired foreign passport with I-94 categories H-2A, H-2B, or E-2 only."]}, {"id": "authorized-presence-us-citizen", "title": "Record U.S. Citizen (Nonforeign) Authorized Presence in MAX", "cat": "Driver — Testing & Eligibility", "intent": ["US citizen authorized presence", "nonforeign", "naturalization certificate", "US passport USPVS", "SSOLV verification", "pre-96 characteristic", "USCIS number"], "page": "Driver/Credential_Issuance/Authorized Presence/U.S._Citizen-Nonforeign.htm", "what": "Documents a customer's U.S. citizenship status in MAX. Used when a customer provides proof of birth in the U.S. or District of Columbia, or citizenship through naturalization.", "steps": ["Click the Customer tab.", "Click the Authorized Presence Edit icon.", "Select the Authorized Presence type from the dropdown.", "Select the Document Type from the dropdown.", "Enter the Expiration Date and Issue Date (as applicable).", "Select the Customer Name as it appears on the document, or select \"Add a New Name\" if needed.", "Click Add Identification and select the Identification Type.", "Type the ID Number.", "For passports, select Country Code: United States.", "Select the Effective Date and End Date.", "Click Save, then click Save again to close the Customer Authorized Presence screen."], "tips": ["A customer with a Pre-96 Characteristic must provide an authorized presence document before issuing original credentials or renewals.", "An unexpired U.S. Passport or U.S. Passport Card entered as Document Type triggers automatic USPVS verification; expired passports do not require Identification entry.", "For a Naturalization Certificate without a name-change order, verify through the SSOLV system; same-day credentials may use the old name until SSOLV verifies the new name.", "The USCIS Number field must be exactly nine digits using leading zeroes, excluding the 'A' prefix."]}, {"id": "event-management-overview", "title": "Event Management Overview", "cat": "Driver — Records & Withdrawals", "intent": ["understand event management", "incidents withdrawals compliance", "active withdrawal during service", "satisfy compliance", "request supervisor override", "why alerts appear"], "page": "Driver/Event_Management/Event_Management_Overview.htm", "what": "Event Management is how MAX handles Incidents, Withdrawals, and Compliance — the consequences and resolution steps when a driver or vehicle experiences an issue affecting privileges or status. It orients CSRs to what happens when an active Withdrawal is encountered during a service.", "steps": ["Understand the three pieces: Incidents (citations, DUIs, bounced checks, criminal convictions, failed tests), Withdrawals (stops, cancellations, suspensions, revocations), and Compliance (fees, documentation, waiting periods, traffic school, interlock, SR22).", "When an active Withdrawal appears during a service, click Satisfy to open Compliance Management and work the compliance items with the customer.", "If the customer cannot satisfy compliance in-office, click Request Override to send the service to the supervisor escalation queue for approval.", "Note that an approved override applies only to that single transaction; MAX keeps the Withdrawal in place for additional services until all compliance is met."], "tips": ["Not all compliance can be satisfied in an MVD office — some requires contacting courts or waiting a set period.", "Withdrawals only trigger alerts for the impacted service type (e.g., forfeiture liens alert during Title services, not Credential services)."]}, {"id": "driver-record-navigate-view", "title": "View a Driver Record", "cat": "Driver — Records & Withdrawals", "intent": ["open driver record", "view driving history", "check privilege status", "points and incidents", "credential history tab", "research driver"], "page": "Driver/Event_Management/Driver_Record.htm", "what": "The Driver Record gives a comprehensive, interactive overview of a driver's Arizona privilege status, driving history (points, incidents, withdrawals), and credential history. CSRs use it to research a customer before or during a service.", "steps": ["Click the Menu icon.", "Select Management.", "Click Driver Record.", "Search for the customer.", "Review the Driving History tab for points, incidents, and withdrawals.", "Click the blue arrow to view credential details."], "tips": ["For violations on or after January 1, 2023, MAX assesses points only for the highest point value when multiple incidents are reported for the same offense.", "Qualifying DUI customers may obtain a SIIRDL restricted license on the earliest eligible date."]}, {"id": "driver-record-update-incident-withdrawal-status", "title": "Update Incident or Withdrawal Status from Driver Record", "cat": "Driver — Records & Withdrawals", "intent": ["change incident status", "update withdrawal status", "abstract shows dismissed", "void related withdrawals", "edit driving history"], "page": "Driver/Event_Management/Driver_Record.htm", "what": "From the Driver Record's Driving History tab, CSRs can update the status of an incident or withdrawal, for example when a court abstract shows a case was dismissed or voided.", "steps": ["Open the Driver Record and go to the Driving History tab.", "Click the Edit icon in the far right column for the incident or withdrawal.", "In the Manage Incident or Withdrawal Details pop-up, select the new status from the dropdown menu.", "Click the Save button."], "tips": ["If an abstract shows the Incident was Dismissed or Voided by the court, update the Incident Status accordingly — this automatically voids any related Withdrawals."]}, {"id": "driver-mvr-service", "title": "Process a Driver MVR (Motor Vehicle Record)", "cat": "Driver — Records & Withdrawals", "intent": ["print driving record", "MVR request", "select MVR type", "39 month 5-year record", "MVR fees", "permissible purpose"], "page": "Driver/Event_Management/Driver_MVR.htm", "what": "A Driver MVR is a printout of the driving record MVD maintains, showing personal info, license details, violations, points, and compliance. CSRs run this service when an authorized requester needs a record for a permissible purpose such as employment, legal proceedings, or personal records.", "steps": ["From the MAX dashboard, click the Menu icon.", "Select Services.", "Click Driver MVR.", "Search for the customer and click Add.", "Select the MVR Type from the dropdown menu.", "Click Confirm.", "Review the Service Summary for accuracy and click Continue.", "Review the Taxes and Fees screen and click Pay Now.", "Process payment and click Complete Checkout.", "Download and print the service documents and provide them to the customer."], "tips": ["Fees vary by type (e.g., 39-month $3.00, 5-Year/Extended $5.00). Court, federal/state government, and law enforcement are exempt.", "Verify the requester has sufficient ID; customers requesting their own record need only proof of identity.", "Misuse of MVR personal information for a non-permitted purpose carries civil and/or criminal penalties."]}, {"id": "driver-timeline", "title": "Use the Driver Timeline", "cat": "Driver — Records & Withdrawals", "intent": ["visualize driver record", "timeline of incidents", "withdrawal spans", "eligibility date", "compliance required report", "internal use only"], "page": "Driver/Event_Management/Driver_Timeline.htm", "what": "The Driver Timeline is a visual tool that displays a customer's Driver Record history, helping CSRs understand current record status and historical events. It is for MVD internal use only and must never be shared with customers.", "steps": ["Search for and view the customer's Driver Record.", "Click the Timeline button.", "Read orange alert icons as Incidents (original occurrence date) and blue bars as Withdrawals (spanning the active period).", "Use the directional arrows to scroll forward/backward and toggle Year, Month, or Quarter views for more or less detail.", "Use the Earliest Issue button to jump to the first recorded Incident/Withdrawal and Today to return to current status.", "Click an Incident icon or Withdrawal bar to view expanded details, including dates and incident information."], "tips": ["The Timeline is internal-only — never share it with customers.", "A status of 'Indefinite' typically means the customer must pay fees or provide documentation with no defined timeframe.", "Use the Compliance Required Report link to generate a report that CAN be provided to customers."]}, {"id": "incident-management-add-edit", "title": "Incident Management — Add or Edit an Incident", "cat": "Driver — Records & Withdrawals", "intent": ["incident management screen", "add an incident", "edit incident status", "check for duplicate incident", "work group and incident type", "reevaluate warning"], "page": "Driver/Event_Management/Incident_Management.htm", "what": "Incident Management handles entries that impact driver privileges or vehicle status (citations, DUIs, insurance failures, etc.). Most incidents arrive electronically, but MVD Central Services can add or edit them manually, after which MAX applies business rules and triggers withdrawals/compliance.", "steps": ["From the MAX Dashboard, click the Menu icon.", "Select Management.", "Click Incident Management.", "Select the Search Type (Customer, Vehicle, or Aircraft) and type the unique identifier (DL, ID, SSN, or Name).", "Review the Incident Results to confirm no duplicate exists.", "Select the Work Group from the dropdown, then select the Incident Type.", "Click Add New Incident.", "Enter the Occurrence Date, Received Date, and Case Number; select Lien Agency Name if applicable.", "Click Save. (To edit instead, click Edit, select a new Incident Status, adjust editable fields, and Save.)"], "tips": ["CSRs should NEVER click the Reevaluate Incident button — it can add Withdrawals back to a Driver Record. Manual reevaluation is for support teams only.", "When an unlicensed driver commits a suspendable offense, MVD will not accept a permit or license application until the suspension period ends.", "Operation of Law liens impact all of a customer's vehicles but never driving privileges."]}, {"id": "adding-an-incident-court-abstract", "title": "Add an Incident from a Court Paper Abstract", "cat": "Driver — Records & Withdrawals", "intent": ["manually add citation", "court paper abstract entry", "manage incidents button", "occurrence date chart", "complaint number", "no DUI entry"], "page": "Driver/Event_Management/Adding_an_Incident.htm", "what": "This procedure lets authorized staff manually add an incident (from a court paper abstract) to a customer's Driver Record. CSRs must NEVER add DUI incidents — those require contacting technical support per office standard work.", "steps": ["Open MAX, click the Menu, and open the Driver Record.", "Search by the customer's first name, middle initial (if applicable), last name, and year of birth, then click Search.", "Check 'Display Full History (includes Voided, etc.)' and type the complaint number in the filter to verify the citation isn't already recorded.", "Click the Manage Incidents button.", "Select 'Court Paper Abstracts' from the Work Group dropdown and enter the violation code in Incident Type.", "Click Add New Incident.", "Enter the Occurrence Date (varies by incident type — see occurrence date chart), Received Date, and Court Docket Number.", "Input Vehicle Plate Number, Jurisdiction, and Make, and select/search the Court Number to auto-populate Court Information.", "Select Citing Agency, enter Speed Details if applicable, and mark the Accident Indicator.", "Enter Complaint Number (add an 'A' suffix for multiple charges), Complaint Sequence, Disposition Date, and Court Disposition Code.", "Select Drugs Involved status, check applicable Violation Circumstances boxes, and complete Court Ordered Information if applicable.", "Click Save and return to the Driver Record to review the entered citation."], "tips": ["CSRs should NEVER add DUI incidents — contact technical support instead.", "Search by full name to catch duplicate records that would require a Combine Records Request.", "The meaning of the Occurrence Date depends on the incident type (citation date vs. ADOT action date)."]}, {"id": "withdrawal-management-add-edit", "title": "Withdrawal Management — Add or Edit a Withdrawal", "cat": "Driver — Records & Withdrawals", "intent": ["add manual withdrawal", "edit withdrawal status", "out-of-state withdrawal", "eligibility date blank", "status reason", "withdrawal types"], "page": "Driver/Event_Management/Withdrawal_Management.htm", "what": "Withdrawal Management handles stops, cancellations, suspensions, revocations, or disqualifications on driver privileges or vehicle status. MAX usually adds withdrawals automatically; manual withdrawals are rare (e.g., out-of-state withdrawals or linking existing incidents).", "steps": ["Click the Menu icon, select Management, and click Withdrawal Management.", "Search for the vehicle or customer.", "To add: click Add New Withdrawal and select the Withdrawal Type from the dropdown (auto-populates related fields).", "Enter the Start Date.", "Enter the Eligibility Date or leave blank, and enter the Release Date or leave blank.", "Click Save.", "To edit instead: click the Edit icon, select the new Status, select a Status Reason, and click Save."], "tips": ["Changing a Withdrawal's status here only affects the Withdrawal — the original Incident and any related Compliance stay in place. To properly clear it, satisfy compliance (auto-updates the withdrawal) or change the incident status.", "Blank Eligibility Date = withdrawal stays until compliance is met; a specific date = the customer must wait until that date."]}, {"id": "withdrawal-occurring-during-service", "title": "Handle a Withdrawal Triggered During a Service", "cat": "Driver — Records & Withdrawals", "intent": ["withdrawal triggered mid-service", "failed vision screening", "failed knowledge or skills test", "military question yes", "medical vision conditions", "med review withdrawal"], "page": "Driver/Event_Management/Withdrawal_Occurring_During_a_Service.htm", "what": "During a credential service, answers or test results can cause MAX's business rules to trigger a withdrawal or compliance requirement in real time. This reference explains the common scenarios so CSRs know why a service cannot finalize.", "steps": ["Recognize that a withdrawal/requirement can be triggered mid-service by test results or questionnaire answers.", "If the customer fails the vision screening, note it cannot be satisfied in-office — the customer must obtain an optometrist exam.", "If the customer fails a knowledge or skills test, the requirement stays unsatisfied and the service cannot finalize until they pass.", "If the customer answers 'Yes' to the Military question, expect a proof-of-veteran-status requirement.", "For reported vision conditions (monocular vision, glaucoma, cataracts, etc.), expect a Vision Exam Certificate requirement.", "For reported medical conditions (epilepsy, cardiac issues, narcolepsy, etc.), expect a Medical Exam Report or Medical Professional Statement requirement; some trigger an MVD Med Review withdrawal handled in a separate queue."], "tips": [], "reference": true}, {"id": "compliance-management-satisfy-and-pay", "title": "Compliance Management — Review and Satisfy Compliance", "cat": "Driver — Records & Withdrawals", "intent": ["open compliance management", "manage compliance from driver record", "pay compliance fees", "earliest eligibility date", "remove withdrawal", "reinstatement eligibility"], "page": "Driver/Event_Management/Compliance_Management.htm", "what": "Compliance Management shows the customer actions needed to remove withdrawals and lists requirements and fees. CSRs use it whenever a customer needs to satisfy requirements for reinstatement or to conduct an MVD service.", "steps": ["Click the Menu icon, select Management, and click Compliance Management (or open the Driver Record and click Manage Compliance).", "Search for the vehicle or customer to display compliance results.", "Review each requirement and the Earliest Eligibility Date.", "To collect fees, check the box(es) for the fees the customer wants to pay.", "Click Confirm.", "Click Pay Now and process payment as normal."], "tips": ["Once all Compliance is satisfied, MAX automatically updates the Withdrawal status and makes the customer eligible for reinstatement or removes any stops.", "An 'Indefinite' Earliest Eligibility Date means there is no required waiting time.", "Some items (e.g., IID installation) may not be eligible for immediate satisfaction — for example, requiring a 6-month wait after suspension."]}, {"id": "compliance-within-a-service", "title": "Satisfy Compliance Within a Service (Fees or Documentation)", "cat": "Driver — Records & Withdrawals", "intent": ["satisfy stops during service", "collect compliance fees mid-service", "upload compliance document", "edit compliance status satisfied", "view compliance history", "finish blocked service"], "page": "Driver/Event_Management/Compliance_Within_a_Service.htm", "what": "When stops appear during a service, MAX lets the CSR satisfy compliance inline — either by collecting fees or by receiving and validating required documents — so the service can be completed.", "steps": ["Begin the service normally and click Confirm.", "When stops appear on the service screen, click Satisfy to open Compliance Management.", "For fees: click Pay Now, check the boxes for the fees being paid, and click Confirm; click Pay Now on the Taxes and Fees screen, collect payment, enter payment information, and click Complete Checkout.", "For documentation: review and verify the document's validity, click the Edit icon for the compliance requirement, click Add Document, and scan/upload the document.", "Select 'Satisfied' from the Status dropdown and click Save.", "Click View Compliance History to confirm the requirement is satisfied.", "Complete the service as normal."], "tips": ["In many cases the compliance is out of your control; MAX automatically removes withdrawals once external compliance is received or waiting periods expire.", "Carefully verify documentation validity before marking compliance as satisfied."]}, {"id": "compliance-fees-service", "title": "Collect Compliance Fees (Standalone Service)", "cat": "Driver — Records & Withdrawals", "intent": ["compliance fees service", "collect outstanding fees quickly", "no compliance fee found", "check eligibility", "add to cart", "receipt access"], "page": "Driver/Event_Management/Compliance_Fees.htm", "what": "The Compliance Fees service lets a CSR quickly identify and collect outstanding compliance payments due for a customer without first reviewing the Driver Record or Compliance Management.", "steps": ["From the Services menu, select Compliance Fees.", "Search for and select the customer, then click Add.", "Select all fees the customer will pay today.", "Click Confirm to verify information and check eligibility against business rules.", "Review the Taxes and Fees screen and click Pay Now (or Add to Cart if completing additional services).", "In Checkout, process payment and click Complete Checkout.", "Download, print, and provide the service documents to the customer."], "tips": ["Always review the Driver Record first to ensure all compliance requirements are met, beyond just the fees due.", "If no payments are due, MAX shows 'No Compliance Fee Requirement Found' — delete the service.", "Receipts and documents can be retrieved later in MAX or via AZ MVD Now."]}, {"id": "reinstatement-lapse-of-insurance", "title": "Reinstatement — Lapse of Mandatory Insurance", "cat": "Driver — Records & Withdrawals", "intent": ["reinstate registration insurance lapse", "MI withdrawal", "$50 reinstatement fee", "financial responsibility withdrawal", "begin service vehicle record", "15-day notice"], "page": "Driver/Event_Management/Reinstatement_Scenarios.htm", "what": "When a registration is suspended for a mandatory insurance (MI) lapse, reinstating the registration satisfies the MI Withdrawal compliance and removes it. Applies after the customer has active insurance confirmed on the vehicle record.", "steps": ["After confirming insurance on the vehicle record, click Begin Service in the vehicle record.", "View Reinstate Registration for the steps to complete.", "Collect the $50.00 reinstatement fee from the customer.", "Complete the reinstatement — this automatically satisfies the MI Withdrawal compliance.", "Confirm the withdrawal has been removed from the vehicle record."], "tips": ["MAX runs scheduled sweeps of vehicle info; customers get a 15-day notice before a withdrawal is created, and if insurance isn't added a Financial Responsibility Withdrawal is created and registration is suspended.", "If the insurance company electronically submits dates covering the lapse, the withdrawal auto-voids and registration reactivates; the customer is then eligible for Mandatory Insurance Suspension Clearance form #96-0229.", "A De-Insure Certificate with dates prior to the MI Withdrawal will cause MAX to automatically void the withdrawal."]}, {"id": "reinstatement-admin-per-se-dui", "title": "Reinstatement — Admin Per Se (DUI Restricted Credential)", "cat": "Driver — Records & Withdrawals", "intent": ["admin per se reinstatement", "DUI restricted credential", "manage compliance fees", "alcohol drug treatment documents", "earliest eligibility date", "credential issuance restrictions"], "page": "Driver/Event_Management/Reinstatement_Scenarios.htm", "what": "This scenario reinstates a DUI-restricted credential after an Admin Per Se withdrawal, once fees are paid, treatment documents are submitted, and the earliest eligibility date is reached.", "steps": ["Select Driver Record from the Management menu and search for the customer.", "Click Manage Compliance.", "If other withdrawals exist, click Pay Now to collect fees via the Compliance Fees service, then return to the driver record.", "Confirm the counselor has electronically submitted alcohol/drug treatment documents (this automatically satisfies that compliance).", "Once compliance is satisfied and the current date meets the Earliest Eligibility Date, start the Credential Issuance service.", "Take the photo, select the license class, and satisfy the requirements.", "On the Requirements tab, acknowledge the restricted credential issuance restrictions.", "Click Confirm and complete the service normally."], "tips": ["CSRs may NOT manually satisfy the Alcohol Education Compliance Requirement if the customer has the Acceptance Report but it's not in the Counselor Reports tab — upload the report and submit a Service Portal ticket instead.", "The Earliest Restricted Eligibility Date will not display until that date has arrived."]}, {"id": "reinstatement-case-dismissed", "title": "Reinstatement — Case Dismissed by Court", "cat": "Driver — Records & Withdrawals", "intent": ["case dismissed reinstatement", "update court disposition code", "dismissal code", "auto void withdrawals", "edit incident received date"], "page": "Driver/Event_Management/Reinstatement_Scenarios.htm", "what": "When a court dismisses a case, updating the incident's disposition on the Driver Record automatically sets it to Dismissed and voids the associated withdrawals.", "steps": ["Select Driver Record from the Management menu and search for the customer.", "Click the Edit icon for the relevant incident.", "Update the Received Date to the current date.", "Update the Court Disposition Code to the dismissal code from the court.", "Update the Disposition Date to the court document date.", "Click Save.", "Confirm the incident status automatically updates to Dismissed and all associated withdrawals are automatically voided."], "tips": []}, {"id": "reinstatement-nsf-chargeback", "title": "Reinstatement — NSF / Chargeback (Returned Payment)", "cat": "Driver — Records & Withdrawals", "intent": ["NSF reinstatement", "chargeback returned payment", "reinstate registration", "fee collections stop", "payment returned fee checkbox", "manually update vehicle withdrawal"], "page": "Driver/Event_Management/Reinstatement_Scenarios.htm", "what": "This scenario reinstates a registration suspended due to a returned (NSF/chargeback) payment. The customer pays the returned-payment fee and the CSR must manually update the vehicle withdrawal to Satisfied.", "steps": ["Search the vehicle and click Begin Service.", "Type 'Reinstate Registration' in the service search box and click Add.", "Click Begin Service; when two alerts appear, click Add to continue.", "Click Satisfy for the Fee Collections Stop alert, then click Pay Now.", "Check the 'Payment returned Fee' checkbox and click Confirm, then click Pay Now again.", "Process payment at checkout, click Complete Checkout, and download/print the receipt.", "Click Reinstate Registration and click Confirm.", "Click Satisfy for the return payment suspension alert.", "Click Edit and update the Status from Active to Satisfied, then close the compliance window and click Back.", "Click Confirm to finalize the service and verify the Vehicle Information page shows 'Active' registration status."], "tips": ["The NSF withdrawal on the vehicle does NOT update automatically when compliance fees are collected — the CSR must manually update the vehicle withdrawal to Satisfied."]}, {"id": "reinstatement-title-documentation-incomplete", "title": "Reinstatement — Incomplete Title Documentation Withdrawal", "cat": "Driver — Records & Withdrawals", "intent": ["title documentation incomplete withdrawal", "compliance management vehicle", "add documents", "upload title docs", "satisfy compliance status"], "page": "Driver/Event_Management/Reinstatement_Scenarios.htm", "what": "Clears a withdrawal placed for incomplete title documentation by uploading the required documents in Compliance Management and marking the requirement Satisfied.", "steps": ["From the Management menu, select Compliance Management.", "Search the vehicle to display Compliance Results.", "Click the Edit icon for the compliance type.", "Click Add Documents and scan/upload the required documents with file descriptions.", "Select 'Satisfied' from the Status dropdown.", "Click Save."], "tips": []}, {"id": "disposition-codes-statuses", "title": "Update Court Disposition Codes on an Incident", "cat": "Driver — Records & Withdrawals", "intent": ["court disposition code", "update conviction dismissal", "display full history filter", "disposition code 58", "no DUI disposition changes", "abstract date"], "page": "Driver/Event_Management/Disposition_Codes_&_Statuses.htm", "what": "Disposition codes are the status indicators courts send with convictions or dismissals. CSRs/processors update the incident record when a court transmits new disposition information via a court paper abstract.", "steps": ["Open the customer's Driver Record.", "Click 'Display Full History' at the bottom of the screen.", "In the Driving History tab, type the complaint number in the filter field and locate the underlying violation incident.", "Click the Edit icon for each related incident.", "Update the Received Date to match the court abstract date.", "Scroll to the Charge Information section and type the Disposition Date from the abstract.", "Select the Court Disposition Code from the dropdown matching the abstract.", "Scroll to the bottom and click Save."], "tips": ["CSRs/processors should NEVER change disposition codes for a DUI violation.", "For Disposition Code 58 (starting 01/01/2019), do not update unless the court is voiding (code 00) or setting aside (code 59) the violation.", "If the disposition date is more than one year old, contact Technical Support per office standard work."]}, {"id": "nrvc-add-incident", "title": "NRVC — Add a New Non-Resident Violator Compact Incident", "cat": "Driver — Records & Withdrawals", "intent": ["add NRVC incident", "non-resident violator compact", "defendant information", "violation code ACD", "out-of-state citation non-compliance", "six month transmission rule"], "page": "Driver/Event_Management/NRVC_Processing.htm", "what": "NRVC Processing lets MVD central services record a non-resident's non-compliance with a traffic citation and share it across states so the home state can suspend the license until the person complies. This procedure adds the incident.", "steps": ["Select NRVC Processing from the Management menu's Event Management section.", "Click Add New NRVC Incident.", "Complete the Defendant Information fields (red asterisks are required) and Registration Information if available.", "Select the Court Number from the dropdown (auto-populates remainin
