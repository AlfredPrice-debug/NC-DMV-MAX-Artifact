ees screen and select Pay Now or Add to Cart.", "Download and print the Arizona Title Summary (if applicable); have the customer review, check the page 2 boxes, and sign.", "Click Add Documents to scan the signed summary and supporting documentation, then download/print the service documents."], "tips": ["The $4 title fee applies unless completed the same day as another title service; waivable within 30 days if the customer returns later for the physical title.", "Only one owner signature is required regardless of the number of owners.", "If a lien exists, the title mails to the lienholder; a mutilated/illegible title must be surrendered at application.", "A new Print Date generates a new Title Number in MAX."]}, {"id": "vehicle-domicile-address", "title": "Add or Remove a Vehicle Domicile Address", "cat": "Title & Registration", "intent": ["vehicle domicile address", "where vehicle is stored", "domicile for emissions", "add domicile address", "remove domicile address"], "page": "T_&_R/Title_&_Registration/Vehicle_Domicile.htm", "what": "Records where a vehicle is housed or stored when different from the customer's residential address, which affects emissions requirements. Added during a registration service or on the Vehicle Information Page.", "steps": ["Begin any Registration service (except T&R Corrections) and click the Owners tab.", "Click Add Domicile Address, enter Address, City, State, ZIP, and Country in the popup, and click Save.", "Complete the registration service for the change to take effect, then view it on the Vehicle Information Page.", "To add via the Vehicle Information Page, click the Plus icon next to Domicile address in the Registration section, enter the address, and click Save.", "If unverified by address software, select the Emission Area Type and click Continue.", "To remove, begin a Registration service (except T&R Corrections), click the Owners tab, click Delete, and complete the service."], "tips": ["Acceptable addresses include Rural, State, Star routes, and Highway Contract Routes; unacceptable: drawers, P.O. Boxes, general delivery, and out-of-state addresses.", "Customers cannot change the domicile address in AZ MVD Now — it requires an MVD office visit.", "If the customer has a restricted record, OIG must authorize the change."]}, {"id": "dba-doing-business-as", "title": "Add a DBA (Doing Business As) Name to a Title", "cat": "Title & Registration", "intent": ["DBA", "doing business as", "operating name on title", "organization customer record", "sole proprietor business vehicle", "add DBA name"], "page": "T_&_R/Title_&_Registration/DBA.htm", "what": "Titles a vehicle under a company's operating (DBA) name rather than its legal name by adding a DBA Name to an Organization Customer Record, then using it as the owner in a Title & Registration service.", "steps": ["Navigate to the Organization Customer Record (not the Individual record).", "Click Add Name to create a DBA entry.", "Type the DBA Name exactly as it should appear on documents and click Save.", "Begin a Title & Reg service using the Organization as Customer.", "On the Owners tab, select the DBA Name from the Customer Name dropdown.", "Select the appropriate Role Type (Owner, Lessee, or DBA) and add other parties as needed.", "Complete the service."], "tips": ["An Individual cannot do business as an Organization in separate records — create an Organization record and add DBA Names to it.", "The DBA Role Type is always first Priority and cannot be moved; legal status between DBA and owners must be OR, AND, or AND/OR.", "Type DBA names exactly as they need to appear on service artifacts."]}, {"id": "dealer-title-transfers", "title": "Process Dealer Title Transfers (DRT)", "cat": "Title & Registration", "intent": ["dealer title transfers", "DRT record", "dealer to public sale", "electronic reassignment", "title shell ATP", "dealer retail bill of sale 38-1305"], "page": "T_&_R/Title_&_Registration/Dealer_Title_Transfers.htm", "what": "Handles ownership transfers between licensed dealers and purchasers (or dealer to dealer) for Arizona and out-of-state vehicles, including electronic DRT reassignment and DRT-to-title conversion.", "steps": ["For a dealer-to-public sale, complete the Arizona Dealer Retail Bill of Sale (form #38-1305) and prepare the T&R Application (Single) form #96-0236.", "Gather supporting documentation and submit within 30 days to avoid late penalties.", "For an electronic DRT on an Arizona title, complete the electronic reassignment through the DRT system (no paper title is printed).", "To print a title (ATP only), use the Title Only service to convert the DRT record to a title record.", "Access the Title Shell for over-the-counter printing, keeping the same MAX Customer Number associated with the Dealer Number.", "Select the correct AKA/DBA name from the dropdown."], "tips": ["Notarization is required for forms #38-1305, #48-2004, and #38-1306 if the notary section appears on the form.", "A dealer cannot possess or offer a vehicle for sale without a properly assigned title, DRT, or reasonable signs of ownership.", "Separate reassignment documents are not accepted with Arizona paper titles.", "Only licensed Arizona dealers (excluding Brokers, Manufacturers, Distributors) may complete electronic DRT; wholesale auction dealers are exempt from title assignment if they don't take possession."]}, {"id": "grey-market-vehicles", "title": "Title & Register a Grey Market Vehicle", "cat": "Title & Registration", "intent": ["grey market vehicle", "imported vehicle title", "FMVSS EPA compliance", "level II III inspection import", "NATO personnel vehicle", "non-US vehicle registration"], "page": "T_&_R/Title_&_Registration/Grey_Market_Vehicles.htm", "what": "Determines whether an imported vehicle is a grey market vehicle (not built to U.S. FMVSS/EPA standards) and what documentation and inspections are needed for Arizona title and registration.", "steps": ["Determine grey market status by assessing whether the vehicle was built to conform with U.S. FMVSS and EPA standards.", "Conduct a Level I Inspection (for vehicles 25+ years old or NATO personnel) to verify a manufacturer certification label indicating U.S. compliance.", "If a conformity label is present, process the vehicle normally using standard T&R scenarios.", "If the conformity label is absent, proceed with a Level II or III Inspection.", "Collect ownership documentation, ensuring all documents are in English with certified translations where needed.", "Verify the VIN meets the 17-character U.S. DOT format and check that the EPA sticker is original (not converter-applied).", "Review glass/lens components for DOT approval, then submit the required documentation to MVD for processing."], "tips": ["A vehicle is grey market if it lacks a manufacturer/Registered Importer label, has a non-conforming VIN, is missing/converter-applied EPA sticker, has a foreign title, or lacks DOT-approved glass.", "NATO personnel need import documents with Box 12 marked and receive an ARO (no title); military orders are required to transfer to another qualifying owner.", "Import documentation is not required but helps support ownership claims."]}, {"id": "export-only-vehicles", "title": "Process an Export Only Vehicle Title", "cat": "Title & Registration", "intent": ["export only", "export only title stamp", "foreign dealer vehicle", "incident report 46-4411", "OIG dealers investigation", "remove export only comment"], "page": "T_&_R/Title_&_Registration/Export_Only.htm", "what": "Handles Arizona titles stamped 'Export Only' — typically inoperable or emissions-failing vehicles sold to foreign dealers at wholesale auction. Foreign dealers are not eligible for an Arizona title or registration.", "steps": ["For a title stamped 'Export Only' WITH comments, inform the customer a Level II/III Inspection is required and advise that state/city vehicle use tax will be collected.", "Complete Incident Report form #46-4411 with details (buyer, seller, purchase location/date) and forward it to the OIG Dealers Investigation Unit.", "OIG places a Withdrawal on the Vehicle Information Page.", "For a title stamped 'Export Only' WITHOUT comments, update the Vehicle Information Page with a Sold Notice.", "To remove the Export Only comments, verify the Level II/III Inspection was submitted, confirm the state/city vehicle use tax was paid (or proof provided), and verify the Incident Report was completed and forwarded to OIG.", "Process the title transaction."], "tips": ["Foreign motor vehicle dealers cannot sell vehicles in Arizona without state licensing and cannot receive an Arizona title/registration.", "If the customer presents the title at a different office, verify the Incident Report status across locations.", "If no Withdrawal appears on the Vehicle Information Page, contact the OIG Dealers Investigation Unit."]}, {"id": "factory-list-price", "title": "Determine Factory List Price (FLP) for VLT", "cat": "Title & Registration", "intent": ["factory list price", "FLP", "MBRP", "manufacturer base retail price", "VLT calculation", "FLP sources commercial vehicle"], "page": "T_&_R/Title_&_Registration/Factory_List_Price.htm", "what": "Establishes the Factory List Price (also called Manufacturer Base Retail Price/MBRP) used to calculate Vehicle License Tax — the price of the vehicle without buyer-requested add-ons.", "steps": ["For non-commercial vehicles/trailers, establish FLP from NADAGuides.com, factory invoices, NADA guides, the manufacturer website, a dealership contact, or the T&R Application; use MSRP if MBRP cannot be determined.", "For commercial vehicles 18,000+ lbs GVWR with an MCO, use the sales price (excluding taxes, fees, warranties, add-ons).", "For commercial vehicles with an out-of-state or Arizona title, use the manufacturer base retail price or Price Digest.", "For a cab/chassis, add the FLP of the cab and chassis to the FLP of the new equipment.", "As a last resort (MCOs only), use the sales invoice purchase price; consult an upline approver if FLP remains unobtainable.", "Scan the documentation used to establish the FLP into MAX as supporting documents."], "tips": ["FLP represents the price of the vehicle without any add-ons requested by the buyer.", "Copies of the documentation used to establish the FLP must be scanned into MAX during the service."]}, {"id": "apply-fee-exemption", "title": "Apply a Fee Exemption", "cat": "Title & Registration", "intent": ["fee exemption", "VLT exemption", "waive registration fee", "disabled veteran exemption", "military exemption", "reduced VLT", "non-profit exemption", "alternative fuel"], "page": "T_&_R/Title_&_Registration/Fee_Exemptions.htm", "what": "Applies a qualifying fee exemption that releases the owner from Vehicle License Tax (VLT), registration, or commercial fees during a title and/or registration service.", "steps": ["Begin the Title and/or Registration service.", "Click the Owners tab.", "Click the Add an Exemption + icon (or edit an existing exemption).", "Select the Exemption Type from the drop-down list.", "If Assessor VLT Exemption, type the Exemption Amount from the County Assessor form.", "Click the + icon(s) to confirm you have the required document(s); checkmarks appear.", "Click Add.", "Click the Documents tab, then Add Documents and upload per document management procedures.", "Select Fee Exemption as the Document Category and choose the appropriate Document Type.", "Click Confirm and check out as normal."], "tips": ["All reduced VLT rates must be applied at the time of initial registration or renewal.", "Refunds are not given unless VLT was overpaid due to error.", "Approval from the upline approver is not required.", "Re-certification requirements vary by exemption type (some annual, some none)."]}, {"id": "add-remove-vehicle-brand", "title": "Add or Remove a Vehicle Brand", "cat": "Title & Registration", "intent": ["add brand", "remove brand", "salvage brand", "flood damage", "reconstructed title", "non-repairable", "view brand", "title brand"], "page": "T_&_R/Title_&_Registration/Brand_Management.htm", "what": "Adds or removes a descriptive title brand (salvage, flood damage, reconstructed, etc.) on a vehicle during a title service.", "steps": ["To view a brand: search for the vehicle, then click the Brands quick link or scroll to the Brands section on the Vehicle Information page.", "To add: click the Vehicle tab in the service.", "Click Add Brand in the New/Carryover Brand section.", "Select the correct Brand from the dropdown.", "Click Confirm and process the title service as normal.", "To remove: on the Vehicle tab, in the Active Brands section click Remove Brand(s).", "In the New/Carryover Brand section click Undo Add Brand.", "Click Confirm, acknowledge the warning message, and complete checkout."], "tips": ["Only one brand (the most recent) displays on the title and Vehicle Information Page at a time.", "Most brands carry a $4.00 fee.", "Liens must be released before adding Salvage, Flood Damage, or Non-Repairable brands.", "MAX auto-checks NMVTIS at title start and converts out-of-state brands to AZ-recognized brands."]}, {"id": "order-personalized-special-plate", "title": "Order a Personalized or Special Plate", "cat": "Title & Registration", "intent": ["personalized plate", "special plate", "specialty plate", "custom plate", "vanity plate", "veteran plate", "no-no list", "plate approval"], "page": "T_&_R/Title_&_Registration/Special_Plates.htm", "what": "Orders a personalized or specialty license plate, entering the requested characters and submitting them for Special Plates Unit approval.", "steps": ["Choose Issue New Plate from the Plate Services dropdown.", "Pick the desired plate type (Veteran, Environmental, etc.).", "If available, mark the Personalized Plate checkbox.", "Type the requested characters using spacing rules (one space = full space; '/' = half space).", "Type the reason/meaning in the Description field and check Disabled Plate if applicable.", "Click Confirm; MAX validates length, validity, no-no list status, and availability.", "Right-click and print all Service Summary pages for customer review.", "Have the customer review and sign the last page, then click Continue to reach taxes/fees.", "Select Pay Now or Add to Cart and process payment.", "Download and print the service documents for the customer.", "Give the verbal temporary-plate/approval disclaimer.", "On the Service Finalized screen, scan the signed Service Summary and supporting documents."], "tips": ["Personalized plates allow 1-7 alphanumeric characters (usually one fewer on disability versions); symbols are not allowed except the disability symbol.", "The no-no list blocks offensive, drug/intoxication, or contempt combinations, including phonetic masking.", "Customer must affix the temporary plate over the current plate until the approved plate arrives.", "If the Special Plates Unit denies the request, the customer's account is refunded.", "Most plates cost $12 to transfer; military and historic plates are exempt."]}, {"id": "transfer-plate-same-owner", "title": "Transfer a Plate (Same Owner)", "cat": "Title & Registration", "intent": ["transfer plate", "move plate to another vehicle", "same owner plate", "keep my plate", "plate to transfer"], "page": "T_&_R/Title_&_Registration/Transfer_Plate.htm", "what": "Moves an existing plate from one of the customer's vehicles to another during a registration service.", "steps": ["Select the applicable Registration service from the Services menu.", "Search for the Customer and Vehicle, then click Add.", "In the Plate Service section, select Transfer Plate from the dropdown.", "Search for and select the desired plate in the Plate to Transfer field.", "Complete the remaining required fields and finalize the service."], "tips": ["Plates that are current or expired less than one year are eligible.", "If the plate is transferred from a vehicle that is actively registered, that registration is automatically canceled.", "For personalized/special plates that exist as multiple types, choose the type carefully during transfer."]}, {"id": "transfer-plate-different-owner", "title": "Transfer a Plate (Different Owners)", "cat": "Title & Registration", "intent": ["transfer plate different owner", "plate relinquishment", "plate notice form", "transfer plate between customers"], "page": "T_&_R/Title_&_Registration/Transfer_Plate.htm", "what": "Transfers a plate from another customer's vehicle, which requires the Plate Notice/relinquishment form and an eligibility check.", "steps": ["Select the applicable Registration service.", "Search for the Customer and Vehicle, then click Add.", "Select Transfer Plate from the Plate Service dropdown.", "Search for and select the desired plate.", "Click Confirm to verify information and check eligibility.", "Click Yes to acknowledge the Plate Relinquishment form requirement alert.", "Collect the required form, complete the fields, and finalize the service."], "tips": ["Plate Notice, form #48-3302, is required for transfers between different owners.", "A $12 Plate Transfer fee applies to personalized/special plates when the owner is added to title."]}, {"id": "tr-corrections", "title": "Correct a Title or Registration Error (TnR Corrections)", "cat": "Title & Registration", "intent": ["T&R correction", "fix title error", "odometer correction", "ownership correction", "make model correction", "conversion error", "no-fee correction"], "page": "T_&_R/Title_&_Registration/T_&_R_Corrections.htm", "what": "Fixes title and registration errors caused by data conversion or CSR mistakes; this is an audited, no-fee service.", "steps": ["From the Services menu, select TnR Corrections.", "Search for and select the Customer (must be an owner) and Vehicle, then click Add.", "Review and correct information across the Title, Owners, Registration, and Documents tabs.", "Click Confirm to validate eligibility, then proceed to Service Summary.", "In Service Summary, click Continue to calculate taxes/fees.", "Click Pay Now to finalize (no fee is charged).", "Click Add Documents to scan all original and supporting documentation as 'T and R Correction Service'.", "Download and print the service documents for the customer."], "tips": ["The selected customer must be listed on the vehicle's ownership.", "All changes are audited; ownership changes and lowering Factory List Price require an override.", "Changes to the Title tab create a new title (new title number) sent to AAMVA.", "Do NOT print the Vehicle Title Shell for the customer."]}, {"id": "registration-cycles", "title": "Understand Registration Cycles", "cat": "Title & Registration", "intent": ["registration cycle", "expiration date", "ownership date", "first registered year", "when does registration expire"], "page": "T_&_R/Title_&_Registration/Registration_Cycles.htm", "what": "Reference on how MAX automatically determines a vehicle's registration cycle and expiration from the ownership date and vehicle data.", "steps": ["MAX determines the cycle automatically from the Ownership Date, any permit issuance dates, and vehicle info (model year, type).", "For out-of-state titles, enter today's date as the Ownership Date; for AZ titles/MCOs, enter the date of sale.", "First registered year: new vehicles = current year (or next year if bought in December); vehicles over 2 years old or out-of-state = model year.", "Expiration day: purchase dates 1st-15th expire on the 15th; 16th-end of month expire on the last day of the month.", "Always verify First Registered information on the Vehicle Information Page before processing."], "tips": ["An incorrect Ownership Date causes the cycle, fees, and expiration dates to be assessed to the wrong month/day."], "reference": true}, {"id": "manage-liens-add-lien", "title": "Add a Lien via Manage Liens and Brands", "cat": "Vehicles, Liens & Inspections", "intent": ["manage liens and brands", "add lien no ownership change", "add lienholder", "assign lienholder", "lien effective date"], "page": "T_&_R/Title_&_Registration/Manage_Liens_and_Brands.htm", "what": "Adds a lien to a vehicle when ownership is unchanged, using the standalone Manage Liens and Brands service.", "steps": ["From the Services menu, select Manage Liens and Brands.", "Search for the customer and vehicle, then click Add.", "Click the Ownership tab and click Add a Lien.", "Select the lien effective date; for an organization, select Organization from the Customer Type dropdown.", "Search for the lienholder and click Find, then verify the name and role type.", "To add more, click Assign Another Lienholder or + Add Another Active Lien, then click Save Lien(s).", "Click Confirm for the eligibility check, then click Continue in Service Summary.", "Review Taxes/Fees, click Pay Now or Add to Cart, process payment, and click Complete Checkout.", "Download and print the Arizona Title Summary; have the customer review, sign, and check applicable boxes.", "Click Add Documents to scan the summary and supporting documentation, then print docs for the customer."], "tips": ["You can update the customer's address, AKAs, characteristics, or contact info via the box next to the customer's name.", "Do NOT print the Vehicle Title Shell for the customer."]}, {"id": "manage-liens-remove-lien", "title": "Remove a Lien via Manage Liens and Brands", "cat": "Vehicles, Liens & Inspections", "intent": ["remove lien", "release lien manage service", "clear lienholder", "lien removal"], "page": "T_&_R/Title_&_Registration/Manage_Liens_and_Brands.htm", "what": "Removes an active lien from a vehicle using the Manage Liens and Brands service, generally only for individual lienholders.", "steps": ["From the Services menu, select Manage Liens and Brands and add the customer and vehicle.", "Click the Ownership tab.", "Click Remove next to the active lien.", "Click Confirm for the eligibility check, then click Continue in Service Summary.", "Review Taxes/Fees, click Pay Now or Add to Cart, process payment, and click Complete Checkout.", "Download and print the Arizona Title Summary; have the customer review, sign, and check boxes.", "Click Add Documents to scan the summary and supporting documentation, then print docs for the customer."], "tips": ["Generally only remove a lien when the lienholder is an individual.", "For organizational (ELT) lienholders, you need lien release documentation showing every reasonable action was taken to get an electronic release.", "You cannot remove unverified lienholders without appropriate documentation."]}, {"id": "manage-liens-add-brand", "title": "Add a Brand via Manage Liens and Brands", "cat": "Vehicles, Liens & Inspections", "intent": ["add brand outside title", "salvage brand manage service", "dismantled brand", "flood damaged brand"], "page": "T_&_R/Title_&_Registration/Manage_Liens_and_Brands.htm", "what": "Adds a brand (salvage, flood damaged, dismantled) outside a title service so a restored/reconstructed title can later be issued.", "steps": ["From the Services menu, select Manage Liens and Brands and add the customer and vehicle.", "Click the Vehicle tab and click Add Brand.", "Select the brand from the dropdown (or click Undo Add Brand to clear).", "Click Confirm, then click Continue in Service Summary.", "Review Taxes/Fees, click Pay Now or Add to Cart, process payment, and click Complete Checkout.", "Download and print the Arizona Title Summary; have the customer review, sign, and check boxes.", "Click Add Documents to scan the summary and supporting documentation, then print docs for the customer."], "tips": ["When some brands (e.g., Salvage) are added and the vehicle has a lien, the lien must be released first.", "Any change to brands produces a new title number and notifies NMVTIS electronically."]}, {"id": "manage-liens-remove-brand", "title": "Remove a Brand via Manage Liens and Brands", "cat": "Vehicles, Liens & Inspections", "intent": ["remove brand", "undo add brand", "brand entered in error", "delete brand"], "page": "T_&_R/Title_&_Registration/Manage_Liens_and_Brands.htm", "what": "Removes a brand entered in error (or with proper documentation) using the Manage Liens and Brands service.", "steps": ["From the Services menu, select Manage Liens and Brands and add the customer and vehicle.", "Click the Vehicle tab, and in the Active Brands section click Remove Brand(s).", "If a brand shows in the New/Carryover Brand field, click Undo Add Brand.", "Click Confirm; if a warning appears, click Yes (with proper documentation), then Confirm again.", "Click Continue in Service Summary, review Taxes/Fees, and click Pay Now or Add to Cart.", "Process payment and click Complete Checkout.", "Download/print the Arizona Title Summary for signature, then Add Documents to scan and print docs."], "tips": ["Only remove a brand if it was entered in error or proper documentation is provided, ideally before finalizing the service."]}, {"id": "registration-renewal", "title": "Renew a Vehicle Registration", "cat": "Title & Registration", "intent": ["renew registration", "registration renewal", "renew tags", "emissions requirement", "late fee waiver", "renew before expiration"], "page": "T_&_R/Title_&_Registration/Registration_Renewal.htm", "what": "Renews an existing vehicle registration before its expiration date, including emissions handling and cycle selection.", "steps": ["From the Services menu, select Renew Registration.", "Search for the Customer and Vehicle related to this service.", "Once located and selected, click Add.", "Allow the current registration info to default; update as needed.", "Address emissions requirements based on the customer's residence/domicile.", "Click Confirm to verify eligibility.", "Review the Service Summary and click Continue.", "Review and select registration cycle options, then click Continue.", "Review the Taxes and Fees screen and click Pay Now or Add to Cart.", "Process payment in Checkout, then download and print service documents for the customer."], "tips": ["Renewal is allowed by the registered owner, a same-last-name/same-address family member, or a POA holder.", "Non-use penalties can be waived with the Registration Penalty Fee Waiver, Non-Use, form #48-9402.", "Renew up to 6 months in advance if no emissions test is required, or 90 days if a test is required.", "CIID and TTEAP withdrawals block renewal until resolved."]}, {"id": "bonded-title", "title": "Process a Bonded Title", "cat": "Title & Registration", "intent": ["bonded title", "surety bond", "cannot prove ownership", "no title", "out-of-state repossession", "bond amount"], "page": "T_&_R/Title_&_Registration/Bonded_Title.htm", "what": "Issues a title backed by a surety bond when the applicant cannot prove ownership or the Division is not satisfied liens are clear.", "steps": ["Step 1 - Vehicle Inspection: a certified inspector completes a Level I inspection on the application (refer higher levels to an ECD officer).", "Step 2 - Applicant Affidavit: the applicant states how the vehicle was acquired; CSR verifies stolen status via AAMVA Helpdesk NM14 inquiry. The customer must wait 24 hours before Step 5 but may continue Steps 3 and 4.", "Step 3 - Notifications: purchase an MVR ($3) to identify owners/lienholders; applicant sends certified letters and checks the appropriate boxes.", "Step 4 - Surety Bond: CSR sets the bond at 1.5x average retail value using Blue Book or similar; customer purchases the bond.", "Step 5 - Submit Bond for Title: verify all documents are signed (including the bond with correct vehicle info), perform a second AAMVA verification 24+ hours after Step 2, and process the title transaction."], "tips": ["Enter 'BOND' in the Ownership Reason / title number field when no title exists.", "Cannot be processed with pending legal acts, lien sales, or vehicles sold by licensed AZ dealers.", "Penalties are assessed starting 30 days from the surety bond purchase date.", "Bonds are not required for liens 12+ years old on qualifying vehicles."]}, {"id": "duplicate-plate", "title": "Order a Duplicate Plate", "cat": "Title & Registration", "intent": ["duplicate plate", "additional plate", "second plate", "extra plate order", "not a replacement plate"], "page": "T_&_R/Title_&_Registration/Duplicate_Plate.htm", "what": "Orders an additional (duplicate) plate for a customer; this is not the same as replacing a lost, stolen, or damaged plate.", "steps": ["From the Services menu, select Duplicate Plate.", "Search for the customer wanting a duplicate plate.", "Search for the vehicle, then click Add.", "Click Confirm to verify required information and check eligibility.", "In Service Summary, review the information and click Continue.", "Review the Taxes and Fees screen, then click Pay Now (or Add to Cart for additional services).", "Process payment and click Complete Checkout."], "tips": ["The fee for the duplicate plate is $10.00 plus postage.", "Central Issuance mails the duplicate plate within 7-10 business days.", "For replacements (lost/stolen/damaged), use Update Registration instead.", "For duplicate special/personalized plates, review the Personalized and Special Plates topic."]}, {"id": "renew-ohv-decal", "title": "Renew an OHV Decal", "cat": "Title & Registration", "intent": ["OHV decal", "off-highway vehicle", "renew OHV", "off-road decal", "decal renewal offset"], "page": "T_&_R/Title_&_Registration/Off-Highway_Vehicle_Decal_(OHV).htm", "what": "Renews an Off-Highway Vehicle decal when the decal's expiration is offset from the registration expiration.", "steps": ["From the Services menu, select Renew OHV Decal.", "Search for the Customer and Vehicle related to this service.", "Once located and selected, click Add.", "In Service Summary, review for accuracy and click Continue to calculate fees.", "On the Taxes and Fees screen, review and click Pay Now (or Add to Cart for multiple services).", "In Checkout, process the payment and click Complete Checkout.", "Once the Arizona Title Summary is signed, click Add Documents to scan the summary and all supporting documentation."], "tips": ["Initial or renewal decal (12 months) is $25.00.", "The customer receives the decal in 7-10 business days; the service receipt serves as proof meanwhile.", "If the decal expiration matches the registration expiration, use Registration Renewal instead."]}, {"id": "tab-replacement", "title": "Replace a Registration Tab (Decal)", "cat": "Title & Registration", "intent": ["tab replacement", "replace decal", "lost tab", "stolen tab", "damaged tab", "sticker replacement"], "page": "T_&_R/Title_&_Registration/Tab_Replacement.htm", "what": "Replaces a lost, stolen, or damaged registration decal (tab) via the Tab Replacement service.", "steps": ["From the Services menu, select Tab Replacement.", "Search for and select the Customer and Vehicle, then click Add.", "Verify the correct vehicle is selected on the Tab Replacement tab.", "Click the Owners tab and optionally add a one-time mailing address.", "Click Confirm to check eligibility.", "On the Service Summary screen, click Continue.", "Review the Taxes and Fees screen and click Pay Now (or Add to Cart).", "Process payment and click Complete Checkout.", "Download, print, and provide service documents to the customer."], "tips": ["The vehicle registration must be current.", "Standard fee is $5.00; the registration and decal mail within 5-10 business days.", "Fee may be waived for non-delivery claimed 10 days after issue date but within 45 days, if the mailing address is unchanged.", "Pickup limited to registered owner, same-last-name/same-address family member, or POA holder."]}, {"id": "sold-notice", "title": "Record a Sold Notice", "cat": "Title & Registration", "intent": ["sold notice", "notice of sale", "sold my vehicle", "seller liability protection", "registration credit"], "page": "T_&_R/Title_&_Registration/Sold_Notice.htm", "what": "Records that a vehicle or mobile home was sold to protect the seller from post-sale liability; it does not transfer ownership.", "steps": ["Search for the vehicle in MAX.", "From the Vehicle Information Page, navigate to the Sold Notice section.", "Click Add Sold Notice.", "Select the Sale Date.", "Enter the Buyer's First and Last Name (or check Unknown Buyer).", "Enter the Buyer's Address (or check Unknown Address).", "Click Save.", "If Registration Credit is available, click Start Registration Credit, then Apply Credit and Confirm."], "tips": ["The owner should submit the Sold Notice within 10 calendar days of the sale.", "A Sold Notice may NOT be removed once Registration Credit was processed; only CSRs can remove one.", "IRP Apportioned Registration owners seeking refunds should be referred to the Motor Carrier Unit, not Sold Notice."]}, {"id": "set-up-elt-provider", "title": "Set Up an ELT Provider (AADA Only)", "cat": "Vehicles, Liens & Inspections", "intent": ["electronic lien and title", "ELT setup", "ELT number", "lienholder identification", "add ELT identification", "AADA"], "page": "T_&_R/Title_&_Registration/Liens/Electronic_Lien_and_Title_(ELT).htm", "what": "Registers a lienholder organization as an Electronic Lien and Title (ELT) provider by adding an ELT identification to its record; this setup is restricted to AADA.", "steps": ["Search for and view the organization's customer record.", "Click View Full Record.", "Scroll down to the Identifications section.", "Click Add Identification.", "Select ELT from the Identification Type drop-down menu.", "Type the ELT Number in the ID Number field.", "Type the Effective Date (and End Date if applicable).", "Click Save."], "tips": ["ONLY AADA can complete these steps; Arizona requires lenders to participate in the ELT program.", "Trusts, Estates, Government entities, and mobile home lienholders are not required to be ELT.", "After approval, address changes must be made by the AADA ELT Help Desk.", "Direct lienholders to AADA at helpdesk@edealersvcs.com or 602-468-0888 x112."]}, {"id": "lien-release", "title": "Release a Lien in a Title Service", "cat": "Vehicles, Liens & Inspections", "intent": ["lien release", "loan paid off", "release lienholder", "clear lien on title", "previous liens release"], "page": "T_&_R/Title_&_Registration/Liens/Lien_Release.htm", "what": "Removes a lienholder's interest from a title within a Title & Registration or Title Only service when the loan is paid off.", "steps": ["From the Services menu, select Title & Reg or Title Only.", "In the Service Prequal popup, search for the Customer and Vehicle, then click Add.", "Update the required information on the appropriate tab.", "Click the Documents tab and upload the required lien release documents.", "Click the Owners tab.", "Check the Release Lien checkbox in the Previous Liens section.", "Click Confirm.", "On the Service Summary screen, click Continue and check out normally.", "The customer's updated title becomes available in AZ MVD Now."], "tips": ["For electronic (ELT) liens, the institution must submit the release electronically and MAX clears it automatically; do not remove an ELT provider's lien.", "Paper releases need full vehicle description, payment notation, and the lienholder's printed name and signature.", "Liens on record 12+ years may be removed without clearance (except travel trailers, motor homes, mobile homes, commercial vehicles).", "Use Manage Liens and Brands when only releasing a lien or correcting an error."]}, {"id": "add-a-lien", "title": "Add a Lien in a Title Service", "cat": "Vehicles, Liens & Inspections", "intent": ["add lien", "record lienholder", "new loan lien", "individual lienholder", "organization lienholder", "assign lienholder"], "page": "T_&_R/Title_&_Registration/Liens/Add_a_Lien.htm", "what": "Records a lienholder's security interest on an Arizona title during a title service, for individual or organization lienholders.", "steps": ["Click the Ownership tab.", "Click Add a Lien.", "Select Individual (or Organization) from the Customer Type dropdown.", "Type search criteria for the lienholder and click Find.", "Select the Lien Effective Date.", "Optionally add more lienholders by clicking Assign Another Lienholder.", "Click Save Lien(s) to add the lien to the service.", "Review the new lien on the Owners tab; use Remove or Edit if needed.", "Click Confirm to continue processing."], "tips": ["The system allows up to three lienholders per vehicle; the earliest lien date becomes primary.", "An organization lienholder must have an active ELT Identification or it cannot be added.", "Charge the title fee when adding a lien after the initial title with no ownership change.", "Required docs include the paper title, T&R Application, Lien Filing form, or Title Transfer form."]}, {"id": "title-register-travel-tent-trailer", "title": "Title and Register a Travel or Tent Trailer", "cat": "Title & Registration", "intent": ["travel trailer", "tent trailer", "recreational trailer", "camper trailer", "trailer length width", "non-powered trailer"], "page": "T_&_R/Title_&_Registration/Trailers/Travel_&_Tent_Trailers.htm", "what": "Titles and registers a non-powered travel or tent trailer used as temporary recreational living quarters on public highways.", "steps": ["Start a Title and Registration service (see the Homemade Trailers topic > Starting a Title and Registration Service for detailed steps).", "Confirm the trailer is non-powered and used as temporary living quarters for recreation, camping, or travel.", "Enter the Length and Width, which are required for these trailer types.", "Have the customer verbally declare the travel trailer use at the time of application.", "Offer 1, 2, or 5-year registration terms and finalize the service."], "tips": ["Weight is NOT declared for travel or tent trailers, so no commercial fees are collected.", "An $8.00 registration fee applies for trailers 40'+ in length OR 8'+ in width.", "Removable items like awnings are not counted toward the trailer length."]}, {"id": "noncommercial-commercial-trailers", "title": "Title and Register Non-Commercial and Commercial Trailers", "cat": "Title & Registration", "intent": ["commercial trailer", "non-commercial trailer", "permanent trailer registration", "declared weight trailer", "trailer VLT"], "page": "T_&_R/Title_&_Registration/Trailers/Noncommercial_and_Commercial_Trailers.htm", "what": "Reference for titling and registering non-commercial and commercial trailers, where registration type depends on declared gross weight and use.", "steps": ["For homemade trailers, follow the Homemade Trailers topic > Starting a Title and Registration Service.", "For registration updates, follow the Update Registration topic > Updating Registration service.", "Non-commercial permanent (1-10,000 lbs, personal): initial $105 VLT, $20 registration, $4 title; fees paid once and become fully permanent after 24 months.", "Commercial permanent (10,001+ lbs, business): initial $555 VLT, $245 registration, $4 title; trailer weight plus load must be declared on the power unit.", "Commercial non-permanent (1-10,000 lbs, business): annual registration with VLT set by Factory List Price and year.", "Print the Title Summary, have the customer review and sign, and re-scan it into MAX."], "tips": ["Permanent registration means fees are paid only once as long as use and ownership remain the same."], "reference": true}, {"id": "trailer-identification", "title": "Identify Trailer Types", "cat": "Title & Registration", "intent": ["trailer identification", "trailer types", "which trailer category", "trailer classification", "trailer plate size"], "page": "T_&_R/Title_&_Registration/Trailers/Trailer_Identification.htm", "what": "Reference for identifying trailer categories to determine title and registration eligibility and requirements.", "steps": ["Travel/Tent Trailer: non-powered recreational vehicle used as temporary living quarters; annual registration (1, 2, or 5 years).", "Non-Commercial Permanent: personal use, 1-10,000 lbs, permanent registration.", "Commercial Permanent: business use, exceeds 10,001 lbs; weight must be declared on the power unit registration.", "Commercial Non-Permanent: business use, 1-10,000 lbs, annual registration with weight fees.", "Homemade Trailer: configured, constructed, and made at home by a private individual.", "For MAX processing, see the 'Adding a Vehicle Type = Trailer' topic."], "tips": ["All trailers use the same plate format with size options (6x12 or 4x7); permanently registered trailers show a PERM tab, non-permanent show month/year tabs.", "Weight violations can result in law enforcement citations and civil penalties."], "reference": true}, {"id": "title-register-homemade-trailer", "title": "Title and Register a Homemade Trailer", "cat": "Title & Registration", "intent": ["homemade trailer", "home built trailer", "declared GVW", "state assigned VIN trailer", "homemade inspection", "AZ serial number"], "page": "T_&_R/Title_&_Registration/Trailers/Homemade_Trailers.htm", "what": "Titles and registers a privately constructed homemade trailer, including inspection and assignment of an Arizona serial number.", "steps": ["From the Services menu, select Title & Reg.", "In the Service Prequal popup, search for the Customer and Vehicle, then click Add.", "On the Title and Registration tab, select Homemade as the Ownership Reason.", "Select the Use Type.", "Enter the Declared Regular GVW (gross weight).", "In the License Plate section, select the Plate Service.", "Select the Plate Type (typically Trailer).", "Review the Owners, Vehicle, and Documents tabs and update as needed.", "Click Confirm.", "Print the Title Summary artifact for customer signature, then re-scan it into MAX.", "Finalize the service and provide receipts.", "Collect the $5.00 fee using the Miscellaneous Purchase service, selecting 'State Assigned VIN Fee'."], "tips": ["A mandatory inspection is required; the inspection year becomes the trailer's year.", "The customer declares weight and use, not the CSR.", "If declared value is $1,000 or more, ownership documents are required; under $1,000, none are needed.", "The $5.00 State Assigned VIN fee applies to homemade vehicles only."]}, {"id": "vehicle-inspection-level-1", "title": "Process a Level I Vehicle Inspection", "cat": "Vehicles, Liens & Inspections", "intent": ["level I inspection", "VIN verification", "vehicle inspection form", "verify VIN matches", "no title inspection"], "page": "T_&_R/Vehicle_Inspections/Vehicle_Inspections.htm", "what": "Verifies that a vehicle's VIN matches the vehicle in the applicant's possession via a no-cost Level I inspection completed on an approved form.", "steps": ["Have the customer complete the inspection on an approved form: Level I Vehicle Inspection (#48-4503), Title Only Certification (#48-0107), Bond Title Application - Vehicle (#40-1001), Bond Title Application - Mobile Home (#40-1003), or Abandoned Vehicle Report (#46-4402).", "The completed inspection form is hand-carried by the customer to the Division to complete titling or registration.", "The CSR processes the completed form to finalize titling or registration."], "tips": ["Level I inspections are no cost.", "Level I may be conducted by a trained CSR, Certified Authorized Third Party Inspector, U.S. Military Police, a designated Peace Officer, or AZPOST-certified law enforcement.", "If the form is altered, destroyed, or lost, the vehicle must undergo another inspection."]}, {"id": "vehicle-inspection-level-2-3", "title": "Arrange a Level II or III Vehicle Inspection", "cat": "Vehicles, Liens & Inspections", "intent": ["level II inspection", "level III inspection", "ECD officer inspection", "schedule inspection appointment", "higher level inspection"], "page": "T_&_R/Vehicle_Inspections/Vehicle_Inspections.htm", "what": "Arranges a higher-level (Level II/III) vehicle inspection conducted by an ECD enforcement officer by appointment.", "steps": ["Customer schedules an appointment through Servicearizona.com (or emails InspectionProgram@azdot.gov for mobile homes).", "An ECD enforcement officer conducts the inspection at an MVD office by appointment only.", "The inspection is completed on Level II/III Inspection form #96-0100."], "tips": ["Level II costs $20.00; Level III costs $50.00.", "A VIN check digit mismatch warrants a Level II/III inspection as a possible stolen vehicle."]}, {"id": "level-1-inspection-reference", "title": "Level I Inspection Reference Manual", "cat": "Vehicles, Liens & Inspections", "intent": ["VIN validation", "check digit", "VIN location", "body style classification", "inspection reference", "VIN decode"], "page": "T_&_R/Vehicle_Inspections/Level_I_Inspection_Reference_Manual.htm", "what": "Comprehensive reference for inspectors performing Level I inspections, covering VIN identification/validation, VIN locations, body styles, and equipment requirements.", "steps": ["VIN validation: multiply each character's Assigned Value by its Weight Factor across the 17-row matrix.", "Divide the total sum by 11 using long division (not calculator decimals).", "Compare the remainder to the 9th-position check digit; a mismatch warrants a Level II/III inspection as a possible stolen vehicle.", "Use manufacturer-specific charts to locate VINs by make/type (e.g., Chevrolet VINs on the top-left instrument panel, 1965-present).", "For Ford VINs with a star and/or script 'F' before and after, do NOT record those symbols.", "Recreational vans (RVVN) require carpeting/customized flooring plus at least one of: sofa, bed, refrigerator, or stove."], "tips": [], "reference": true}, {"id": "add-a-vehicle", "title": "Add a Vehicle to MAX", "cat": "Vehicles, Liens & Inspections", "intent": ["add vehicle", "new vehicle record", "VINtelligence", "vehicle not found", "create vehicle information page", "add make model"], "page": "T_&_R/Vehicle_Management/Add_a_Vehicle.htm", "what": "Creates a new vehicle record in MAX after confirming the vehicle does not already exist, before starting any title or registration service.", "steps": ["Search for the vehicle using its VIN, partial VIN (last 6 digits), or plate number.", "If 'Record not found' appears, click Add New Vehicle.", "MAX automatically populates fields using VINtelligence data.", "Complete any remaining required fields manually if VINtelligence does not populate them.", "Click Save.", "Review and verify the new Vehicle Information Page, editing as needed."], "tips": ["Do not edit VINtelligence-populated data except for Motor Homes and Cab & Chassis vehicles.", "Type 2-3 characters to search Make/Model and select from the dropdown rather than free-typing.", "Do NOT click the + sign next to Make or Model unless the item is not found; adding new Makes/Models requires Level 3 Support.", "When Vehicle Type = Trailer, the Model must also = Trailer."]}, {"id": "assign-state-vin", "title": "Assign a State VIN (AZ Serial Number)", "cat": "Vehicles, Liens & Inspections", "intent": ["assign state VIN", "AZ serial number", "AZ SNO", "no VIN", "altered VIN", "special serial number", "homemade VIN"], "page": "T_&_R/Vehicle_Management/Assign_State_VIN.htm", "what": "Assigns an Arizona Serial Number to a homemade trailer or specially constructed/reconstructed vehicle that has no VIN or whose numbers are altered, removed, or missing.", "steps": ["Complete the Special Serial Number Application form #48-5108 (filled by customer, signed by inspector or CSR).", "Ensure the vehicle or trailer is still at the office PRIOR to processing the service.", "A certified CSR (Level I) affixes the decal for homemade vehicles; an ECD Officer (Level II/III) affixes it for manufactured vehicles with altered/missing serial numbers.", "The customer never attaches the decal to the vehicle or trailer.", "Add the vehicle to MAX during the subsequent Title & Registration service.", "Collect the $5.00 fee (homemade vehicles only) via the Miscellaneous Purchase service, selecting 'State Assigned VIN' Fee."], "tips": ["The format is 'AZ' followed by six numerals and a control number.", "The AZ Number becomes the VIN for the vehicle/trailer on all paperwork for future services."]}, {"id": "de-insure-add", "title": "Add De-Insurance to a Vehicle", "cat": "Insurance & Permits", "intent": ["de-insure", "de-insured certificate", "remove insurance requirement", "vehicle in storage", "snowbird", "inoperable vehicle", "not driven"], "page": "T_&_R/Mandatory_Insurance/De-Insure.htm", "what": "Records a de-insured status for a vehicle that will not be operated on Arizona highways, removing the mandatory insurance requirement.", "steps": ["From the Vehicle Information page, navigate to the De-Insurance section.", "Click Add De-Insurance.", "Select the Effective Date.", "If the date insurance will be added back is known, select the End Date.", "Select the De-Insurance Reason (In Storage, Other, Snowbird, Stolen, or Vehicle Is Inoperable).", "Add relevant documents, if necessary.", "Click Add."], "tips": ["The De-Insured Certificate is valid only until the vehicle's expiration date or one year, whichever is less.", "Registration credit is not given when a vehicle is de-insured.", "Owners convicted of financial responsibility violations cannot de-insure for one year after conviction."]}, {"id": "de-insure-remove", "title": "Remove De-Insurance from a Vehicle", "cat": "Insurance & Permits", "intent": ["remove de-insurance", "reinstate insurance", "end de-insured status", "add insurance back"], "page": "T_&_R/Mandatory_Insurance/De-Insure.htm", "what": "Ends a vehicle's de-insured status so the mandatory insurance requirement resumes.", "steps": ["From the Vehicle Information page, navigate to the De-Insurance section.", "Click the edit icon in the Actions column.", "Select the date the De-Insure should end from the End Date field.", "Click Update."], "tips": ["Proof of insurance must be submitted directly from the insurance company electronically before the de-insured status is removed."]}, {"id": "noncommercial-insurance-requirements", "title": "Non-Commercial Vehicle Insurance Requirements", "cat": "Insurance & Permits", "intent": ["insurance requirements", "proof of financial responsibility", "acceptable proof of insurance", "mandatory insurance", "EZ Insurance Verification", "liability policy"], "page": "T_&_R/Mandatory_Insurance/Non-Commercial_Vehicle_Insurance_Requirements.htm", "what": "Reference for proof of financial responsibility (insurance) on registered non-commercial vehicles and what proof the Division accepts.", "steps": ["The owner must provide the Division with proof of liability insurance within 30 days of the initial registration.", "Acceptable documentation must be submitted electronically (insurance companies submit policies/binders).", "Add the insurance information to the Vehicle Information Page when the customer submits proof.", "Use EZ Insurance Verification to electronically verify coverage status.", "Acceptable proof: a Motor Vehicle Liability Policy or Binder, Certificate of Self-Insurance or Deposit, or state/political subdivision ownership documentation.", "Proof must show VIN, effective date, policy number, and ADOT/company name."], "tips": ["Out-of-state insurance is not accepted or recorded, even from a company authorized in Arizona.", "Exception: military personnel on temporary assignment may use out-of-state coverage with approval and military documentation.", "Insurance ID cards are accepted by law enforcement only, not by the Division.", "Collectible/classic car insurance exempts vehicles from emissions testing."], "reference": true}, {"id": "fleet-expiration-reset", "title": "Reset a Fleet's Expiration Date", "cat": "Office & Admin", "intent": ["reset fleet expiration date", "restart a fleet renewal", "fleet renewal did not complete", "roll back fleet expiration one year", "fleet renewal failed overnight", "fix incomplete fleet renewal"], "page": "Admin_Features/FleetExpireReset.htm", "what": "Resets a Fleet's Expiration Date to one year prior so a Fleet Renewal can be restarted. Use when a large fleet renewal did not complete (for example, a renewal started after hours overlapped the midnight Cash Drawer reset).", "steps": ["Confirm the Fleet Renewal did not complete and needs to be restarted.", "Verify you are an authorized user permitted to perform this function.", "Open the Fleet Expiration Reset function.", "Reset the Fleet's Expiration Date to one year prior.", "Restart the Fleet Renewal for the customer."], "tips": ["Large fleet renewals can take several hours; avoid starting one that will overlap the midnight Cash Drawer reset.", "Only authorized users can perform the Fleet Expiration Reset."]}, {"id": "nmvtis-brand-codes", "title": "View NMVTIS Brand Codes", "cat": "Office & Admin", "intent": ["NMVTIS brand codes", "vehicle brand code list", "look up title brand codes", "national motor vehicle title brands", "brand code reference"], "page": "Admin_Features/NMVTIS_Brand_Codes.htm", "what": "Reference page linking to the list of NMVTIS Brand Codes used for vehicle title brands.", "steps": ["Open the NMVTIS Brand Codes page.", "Click the provided link to view the NMVTIS Brand Codes.", "Reference the code list as needed for title brand work."], "tips": [], "reference": true}, {"id": "receipt-search-download", "title": "Download a Payment Receipt by Receipt ID", "cat": "Payments & Cash", "intent": ["download a payment receipt", "receipt search", "find receipt by receipt number", "research a payment on a report", "get a copy of a receipt", "look up receipt ID"], "page": "Admin_Features/Receipt_Search.htm", "what": "Downloads a specific payment receipt when you already have the Receipt Number (Receipt ID), for example to research a payment you saw on a report.", "steps": ["From the Admin menu, click Receipt Search.", "Type or paste the Receipt ID.", "Click Download.", "Find the downloaded receipt in the Downloads folder on your local machine."], "tips": ["You must already have the Receipt Number (Receipt ID) to use this function.", "Get the Receipt ID from the report where the payment appears."]}, {"id": "service-history-lookup", "title": "Look Up a Service by Business Transaction Number", "cat": "Office & Admin", "intent": ["service history lookup", "find service by business transaction number", "look up service ID", "view completed service artifacts", "search a transaction by service ID", "find a service without customer record"], "page": "Admin_Features/Service_History_Lookup.htm", "what": "Looks up a completed service by its Business Transaction Number (Service ID) rather than through the customer's Service History, so you can view and download that service's artifacts and documents.", "steps": ["From the Admin menu, select Service History Lookup.", "Type the Business Transaction Number (Service ID) for the service you want to view.", "Click Find.", "Review the Service Artifacts that display.", "Download and view the artifacts and documents added during the service."], "tips": ["The Business Transaction Number is also called the Service ID."]}, {"id": "atp-self-qc-daily", "title": "Run the Daily ATP Self QC Process", "cat": "Authorized Third Party (ATP)", "intent": ["ATP self QC", "daily quality assurance process", "3rd party self QC spreadsheet", "quality check ATP work daily", "correct QC findings", "notated item correction"], "page": "ATP_Audits/ATP_Self_QC.htm", "what": "The daily quality assurance process ATPs follow to review their own work using the MAX report and the 3rd Party Self QC Google spreadsheet, and to correct any findings.", "steps": ["Ensure the correct POC (Point of Contact) has QC folder access; POCs may disperse access to branch managers as needed.", "If a POC changes, notify the Certification Desk at certificationdesk@azdot.gov so folder access is not lost.", "Monitor the 3rd Party Self QC Google spreadsheet daily as the MAX report is added.", "Quality check your work each day against the report.", "If a finding (notated item) is found, correct it within seven days.", "Confirm QC is complete once no findings remain or corrections are made."], "tips": ["Uncorrected findings are added to the Compliance Inspection Report as a notated finding at pre-inspection.", "The Google Shared Drive contents are confidential; do not disseminate, distribute, or copy them.", "See MVD One Source > ATP Content Only > ATP Audit Processes and Google Classroom > TPA Training Academy for references."]}, {"id": "audit-credential-application", "title": "Audit a Credential (DL/ID) Application", "cat": "Authorized Third Party (ATP)", "intent": ["audit a credential application", "audit DL/ID application", "QA credential documents", "verify travel credential requirements", "authorized presence audit", "minor credential audit"], "page": "ATP_Audits/Auditing_a_Credential_Application.htm", "what": "How the Compliance - Quality Assurance Unit audits a DL/ID credential application, including travel credential and authorized presence documentation requirements and the front/back of the application.", "steps": ["Gather applicable items: procedures, policies, charts, and forms (e.g., form #40-5122, form #40-5144).", "For travel credentials, verify documents meet federal requirements using Arizona DL/ID Requirements form #40-5144.", "Verify the customer meets Arizona DL/ID requirements per policy 3.5.8 Arizona Travel DL/ID.", "Ensure vision requirements are met per policy 3.2.1, if applicable.", "For authorized presence, verify SAVE was used to confirm authorized presence per policy 3.3.4.", "Audit the front of the DL/ID application section by section (Sections 1-7).", "For a minor receiving a DL or IP, verify a Legal Guardian Certificate box was initialed properly.", "Verify documentation was submitted/scanned for Options #4 and #5, the Driving Practice Certificate was initialed, and the parent/guardian signed and was properly notarized or witnessed."], "tips n Off-Highway Vehicle (OHV) Decal application against the vehicle record in MAX and any title work.", "steps": ["Verify the VIN on the decal application matches the vehicle's record in MAX (if title work was completed).", "Verify title information and any supporting documentation against the vehicle's record in MAX (if title work was completed).", "Verify the owner's names and address(es) match the decal application and title work, and confirm the proper ownership chain was followed.", "Verify lienholder(s) and lien date(s) match supporting documentation and the MAX record, if applicable.", "Verify the OHV Decal application information matches the vehicle's record and how the vehicle was registered.", "Verify all documents were properly scanned (see the Document Management topic)."], "tips": ["Reference policy 8.13.4 Off-Highway Vehicle, the OHV Registration Chart, and form #96-0572.", "All listed items may not be needed but are available if applicable."]}, {"id": "audit-bond-title-application", "title": "Audit a Bond Title Application", "cat": "Authorized Third Party (ATP)", "intent": ["audit bond title application", "bonded title audit", "QA surety bond title", "verify bond title steps", "bond title vehicle form 40-1001", "submit bond for title audit"], "page": "ATP_Audits/Auditing_Bond_Title_Application.htm", "what": "How the Compliance - Quality Assurance Unit audits a Bonded Title application through its five steps, from vehicle inspection to submitting the bond for title.", "steps": ["Gather items: Bonded Title procedure, policy 8.7.1, and forms #40-1001, #46-4420, and #48-0107 (if applicable).", "Audit Step 1 - Vehicle Inspection.", "Audit Step 2 - Applicant Affidavit.", "Audit Step 3 - Owners and Lienholders Notifications.", "Audit Step 4 - Surety Bond, including that the bond amount was set before the customer sent any applicable letters.", "Audit Step 5 - Submit Bond for Title."], "tips": ["Steps 1-4 on the Bond Title Application - Vehicle (form #40-1001) s at the ATP location (all branch employees show at the main location) and lets you view details, certifications, employment info, and add employees.", "steps": ["In the Employees tab, click the employee's Name (in blue) to display Employee Details below.", "Review the employee's name/address, and click the arrow box to view the full Customer Record.", "Review Employee Details (Employee Number, RACF, MAX Username, ADOT Email, Employee Role, credential info, AZ Privilege Status).", "Review Contacts, Certifications (Case ID, Type, Certification Number, dates, Status), and Employment Information.", "Use the Edit Employment Information section to update Start Date, Service Ticket #, Termination Date, and CARF details.", "To add an employee, click Add Employee (see Create New Employee Application)."], "tips": ["If a CSR is being terminated, the CARF Status reads Generated.", "The Owner flag is marked when the employee is the owner."]}, {"id": "atp-bonds-insurance-tab", "title": "Manage ATP Bonds and Insurance", "cat": "Authorized Third Party (ATP)", "intent": ["ATP bonds and insurance tab", "required ATP insurance types", "add insurance ATP", "ATP bond requirements", "exempt bond ATP", "crime fidelity coverage"], "page": "ATP_Content_ONLY/ATP_Mgmt/5_Bonds-InsTab.htm", "what": "The Bonds/Insurance tab covers the insurance types and bonds every ATP must carry, the required documentation for each, and how to add insurance and bonds.", "steps": ["Confirm the ATP carries one of each required Insurance Type with the required documentation.", "Verify Commercial General Liability (with declarations page and endorsement forms) and Auto coverage.", "Verify Auto Liability, Umbrella (optional), Workers Compensation, Cyber Liability, and Crime/Fidelity documentation.", "Access and read Insurance Details, then use Add Insurance to add a policy.", "Verify the required bonds based on services provided (T&R $100,000 per location; DL $300,000 per company; Inspection Only).", "Access and read Bond Details, then use Add Bond to add a bond.", "If exempt, provide Third Party Bond Requirement Exemption form #96-0517."], "tips": ["Bonds are valid for one year and can be purchased through any insurance company that issues bonds.", "The length of time an insurance policy is valid depends on the insurance type.", "Some ATPs may choose to insure themselves above the required minimum."]}, {"id": "atp-agreements-tab", "title": "Acknowledge ATP Agreements", "cat": "Authorized Third Party (ATP)", "intent": ["ATP agreements tab", "acknowledge agreement", "joint letter of renewal JLOR", "agreement amendment addendum", "agreement exhibits", "renew ATP agreement"], "page": "ATP_Content_ONLY/ATP_Mgmt/6_AgreementsTab.htm", "what": "The Agreements tab is where ATPs review and acknowledge agreements (and amendments, addendums, exhibits) between ADOT and the ATP that authorize the ATP to perform its services.", "steps": ["Understand that agreements run up to 12 months and must be amended and/or renewed.", "Review agreements, amendments, or addendums sent by TPA through DocuSign for approval and signature.", "After TPA adds the agreement to MAX, open the Agreements tab.", "Review the agreement type (Agreement and Exhibits, JLOR, Amendment, Addendum, Exhibit Amendments/Addendums) and exhibits (A-E).", "Access and read the Agreement Details.", "Use Edit Agreement to Acknowledge the agreement(s)."], "tips": ["A Joint Letter of Renewal (JLOR) extends an agreement one year, up to a total of four JLORs; after five years the full agreement cycle starts over.", "Exhibit A = T&R activities; B = branch companies; C = insurance/bonding; D = performance measures; E = non-discrimination."]}, {"id": "atp-inspections-tab", "title": "Read the ATP Inspections Tab", "cat": "Authorized Third Party (ATP)", "intent": ["ATP inspections tab", "compliance inspection results", "inspection type and status", "critical finding non-critical finding", "read inspection report", "engagement letter DocuSign"], "page": "ATP_Content_ONLY/ATP_Mgmt/7_InspectionsTab.htm", "what": "The Inspections tab displays Third Party Compliance Program inspection details and results. Use it to review inspection type, auditor, date, results, and status.", "steps": ["Complete the DocuSign Engagement Letter (sent with a PDF version and the Bill of Rights) before the inspection.", "After the DocuSign is complete, the auditor adds the inspection to the Inspections tab.", "Review the Inspection Type (Announced, Follow-Up, Management Requested, Office Closure).", "Review the Services, Auditor, and Inspection Date.", "Review the Inspection Results (Critical Finding(s), Non-Critical Finding(s), or Compliant).", "Review the Status (Scheduled, Pending, Onsite Conducted, Report Generated/Complete, Completed)."], "tips": ["The auditor communicates non-compliance findings to the owner/management at the end of the inspection.", "A finalized compliance report is completed within 30 days of the inspection."]}, {"id": "atp-documents-tab", "title": "Filter and View ATP Documents", "cat": "Authorized Third Party (ATP)", "intent": ["ATP documents tab", "view uploaded case documents", "filter documents ATP", "download ATP documents", "closed case documents"], "page": "ATP_Content_ONLY/ATP_Mgmt/8_DocumentsTab.htm", "what": "The Documents tab displays documents uploaded to a Case application after the case has been closed. Use it to filter, view, or download those documents.", "steps": ["Open the Documents tab to see documents uploaded to a Case after it was closed.", "Use the filter options to narrow the document list.", "Select a document to view or download it.", "For scanning or uploading, see the Document Management topic > Adding Documents section."], "tips": ["Documents uploaded in other tabs (e.g., Bonds/Insurance, Agreements) display only on those tabs, not here."]}, {"id": "atp-notes-tab", "title": "Add and Manage ATP Notes", "cat": "Authorized Third Party (ATP)", "intent": ["ATP notes tab", "add the Questionnaire tab."]}, {"id": "az-wallet-app", "title": "AZ Wallet App Overview", "cat": "AZ MVD Now (Online)", "intent": ["AZ Wallet app", "store digital documents", "add driver license ID", "add title registration", "present documents", "manage settings activity", "iOS Android support"], "page": "AZ_Wallet/AZ_Wallet.htm", "what": "The AZ Wallet app securely stores digital versions of state-issued documents, allowing a customer to add an Arizona driver license or ID and, later, vehicle titles and registrations.", "steps": ["Explain that AZ Wallet stores digital versions of state-issued documents and is available on Google Play and the Apple App Store.", "Guide the customer through logging in and reviewing the home screen and settings.", "Help the customer add documents (driver license or ID first, then titles and registrations after adding a mobile driver license).", "Explain pending and review items, and how to remove documents.", "Explain expired, rejected, and disabled documents.", "Show how to present documents and view card information by selecting the card.", "Address the common error message for driver licenses or IDs across all phone types.", "Reference page → AZ Wallet iOS and Android Information and FAQ links based on phone type."], "tips": ["Usage steps are similar across Apple (iOS), Google, and Samsung (Android) devices.", "Vehicle titles and registrations can be added only after a mobile driver license is added."]}, {"id": "az-wallet-android-faq", "title": "AZ Wallet - Android (Google and Samsung) Information and FAQ", "cat": "AZ MVD Now (Online)", "intent": ["AZ Wallet Android", "Google Samsung wallet", "notifications", "update default wallet", "Google account required", "logging in settings"], "page": "AZ_Wallet/AZWallet_Android_FAQs.htm", "what": "Android-specific information for AZ Wallet on Google and Samsung devices, covering logging in, settings, adding documents, notifications, and updating the default wallet.", "steps": ["Confirm the customer has a Google account created prior to logging in.", "Guide the customer through logging in and updating settings on their Android device.", "Help the customer add their various documents.", "Explain how notifications work in AZ Wallet on Android.", "Show the customer how to update their default wallet.", "Reference page → AZ Wallet topic for additional information on adding and managing documents."], "tips": ["A Google account is required before logging in on Android."]}, {"id": "az-wallet-ios-faq", "title": "AZ Wallet - iOS (Apple) Information and FAQ", "cat": "AZ MVD Now (Online)", "intent": ["AZ Wallet iOS", "Apple wallet info", "no iOS specific info", "refer to AZ Wallet topic"], "page": "AZ_Wallet/AZWallet_iOS_FAQ.htm", "what": "There is currently no iOS-specific information for AZ Wallet; refer to the general AZ Wallet topic.", "steps": ["Note that there is currently no specific information for iOS in this topic.", "Reference page → AZ Wallet topic for additional information on using the app.", "Help the customer with adding and managing documents using the general AZ Wallet guidance."], "tips": ["No iOS-specific content exists yet; use the general AZ Wallet topic."]}, {"id": "az-wallet-overview", "title": "Arizona Wallet Application Overview", "cat": "AZ MVD Now (Online)", "intent": ["Arizona Wallet application", "voluntary secure app", "digital DL ID", "add title registration future", "proof of identity ownership", "proofing provisioning", "download before login"], "page": "AZ_Wallet/Wallet_Overview.htm", "what": "The AZ Wallet is a voluntary, secure smartphone app for uploading a digital version of an MVD-issued DL or ID (and, in the future, other state documents) that carries the same legal weight as the physical credential.", "steps": ["Explain that AZ Wallet is a voluntary, secure app where a customer uploads a digital version of their MVD-issued DL or ID.", "Note that uploaded IDs carry the same legal weight as physical licenses and can be used as proof of identity in person.", "Tell the customer to download the application prior to logging in with their existing account.", "Advise that AZ Wallet does not display 'limited term' wording and expired credentials will not display.", "List items that can be added: AZ Driver License, AZ ID, and Vehicle Title and/or Registration.", "Advise the customer to still carry a physical ID and documentation until acceptance grows.", "Reference page → AZ Wallet Adding Driver License and Identification and AZ Wallet Adding Documents topics (all phone types).", "Reference page → the iOS and Android Information and FAQ links, and the Proofing and Provisioning Process."], "tips": ["AZ Wallet differs from Mobile ID/Mobile Wallets because it is a separate app that will support other state documents in the future.", "Users must download the app before logging in with their existing account."]}, {"id": "accounting-process", "title": "Accounting Process Overview", "cat": "Payments & Cash", "intent": ["accounting process", "Section 18 policies", "daily accounting flow", "cash drawer", "bank deposit", "overages shortages", "working cash funds", "accounting forms"], "page": "Cash Management/Accounting_Process.htm", "what": "Consolidates the applicable pre-MAX Section 18 accounting policies and Accounting Procedures manual content, covering daily accounting activities in MAX.", "steps": ["Reference page → Acceptable Methods of Payment for payment information formerly in Section 18 policies.", "Review the Daily Accounting Flow and Temporary Vault Balance Workaround PDFs for accounting issues in MAX.", "Follow procedures for credit cards, refunds, and audits.", "Manage the cash drawer, including handling overages and shortages.", "Complete bank deposit procedures and coordinate with the bank and armored courier, tracking banking supplies.", "Manage working cash funds, keys, and combinations.", "Use the required forms: #70-0103 Bank Courier Log, #96-0372 Cash Count Form, #96-0378 Facility Inspection Checklist, and ADOT Working Cash Confirmation.", "Consult other Cash Management topics where a section directs you for more information."], "tips": ["This topic pulls together pre-MAX Section 18 accounting policies and the Accounting Procedures manual.", "Some sections point to other Cash Management topics for detail."]}, {"id": "balance-vault", "title": "Balance the Vault", "cat": "Payments & Cash", "intent": ["balance vault", "accountant cash coins", "configured vault balance", "vault screen overview", "balancing steps"], "page": "Cash Management/Balance_Vault.htm", "what": "The Accountant balances the vault to ensure the cash and coins on hand equal the configured vault balance, using information from activities already completed in the system.", "steps": ["As the Accountant, open the Vault screen in MAX.", "Review the Vault Screen Overview to understand the displayed balances.", "Confirm that much of the information comes from activities previously completed in the system.", "Count the cash and coins remaining on hand.", "Balance the vault so the cash and coins on hand equal the configured vault balance.", "Complete the balancing process to finalize the vault."], "tips": ["The goal is for on-hand cash and coins to match the configured vault balance."]}, {"id": "cash-balancing-scenarios", "title": "Cash Balancing Scenarios", "cat": "Payments & Cash", "intent": ["fix payment method error", "wrong payment type entered", "cash should have been credit card", "credit card overcharge", "prepaid voucher mistake", "customer owes money", "change payment after finalized"], "page": "Cash Management/Cash_Balancing_Scenarios.htm", "what": "Reference collection of scenarios for correcting payment method and balancing errors in MAX, with important limits on what can and cannot be changed after a payment completes.", "steps": ["Remember: it is NOT possible to change a payment type from or to Customer Account, so get it right the first time. (reference)", "For integrated Point of Sale (Credit Card) balancing, you cannot update the Point of Sale Card Amount after the payment completes; depending on the scenario you may add an additional POS payment, but once processed it cannot be changed. (reference)", "Choose the scenario that matches your situation: cash entered but should have been credit card or check (or vice versa). (reference)", "Credit card or check entered but should have been Customer Account. (reference)", "Cash entered in MAX but should have been Customer Account. (reference)", "Credit card entered but should have been PrePaid Voucher, or PrePaid Voucher entered but should have been another method. (reference)", "Credit card charged too much so totals don't match MAX, or charged too little and the customer owes money. (reference)", "Customer wants to change from cash to another form of payment after service has been finalized. (reference)"], "tips": ["Get the payment type right the first time, especially anything involving Customer Account, which cannot be changed."]}, {"id": "daily-accounting-flow", "title": "Daily Accounting Flow", "cat": "Payments & Cash", "intent": ["daily accounting flow", "accounting flow chart", "cash management overview", "end of day process reference"], "page": "Cash Management/Daily_Accounting_Flow.htm", "what": "Reference page linking to the Daily Accounting Flow chart for finance and cash management.", "steps": ["Open the Daily Accounting Flow topic in MAX. (reference)", "Click the link provided to view the Daily Accounting Flow chart. (reference)", "Review the chart to understand the daily accounting sequence. (reference)", "Follow your office procedures for each step shown in the flow. (reference)"], "tips": []}, {"id": "end-of-day-closing", "title": "End of Day Closing", "cat": "Payments & Cash", "intent": ["end of day closing", "balance cash drawers", "accept drawers", "balance vault", "deposit slip rollup", "cash adjustment unbalanced drawer", "receipt management correction"], "page": "Cash Management/End_of_Day_Closing.htm", "what": "The Accountant uses the consolidated End of Day Closing view to ensure all cash drawers are balanced and accepted; subsequent Deposit Slip, Rollup, and Balance Vault steps flow automatically from this screen.", "steps": ["Open the consolidated (all CSR) End of Day Closing view in MAX. (reference)", "Collect all cash drawers and confirm each shows a status of Accepted - Balanced. (reference)", "Accept balanced cash drawers, and handle non-balanced drawers using the cash adjustment process for an unbalanced drawer. (reference)", "If a CSR is unavailable to balance their drawer, follow the CSR Unavailable to Balance Cash Drawer process. (reference)", "Return any cash drawers that were issued in MAX but had no payment activity, using the Issue Cash Drawer area, then return to End of Day Closing. (reference)", "When all drawers are Accepted - Balanced, the Balance Vault option becomes available; complete Deposit Slip, Rollup, and Balance Vault, which flow automatically. (reference)", "Print the Balance Receipt as needed. (reference)", "Use Receipt Management to let a Supervisor or Accountant correct payment method errors on a specific receipt so the drawer can be balanced and rolled up; review receipts before making an adjustment. (reference)"], "tips": ["Best Practice: return any issued-but-unused cash drawers before completing End of Day.", "Correcting a payment method via Receipt Management may create a non-cash over/short situation."]}, {"id": "refund-eligibility-scenarios", "title": "Refund Eligibility Scenarios", "cat": "Payments & Cash", "intent": ["refund eligibility", "check refund status", "money matters", "disbursement check status", "registration credits", "service portal ticket refund"], "page": "Cash Management/Refund_Eligibility_Scenarios.htm", "what": "Reference page for determining refund eligibility and checking refund/disbursement status in MAX.", "steps": ["Check the status of a refund request in Money Matters. (reference)", "Check the status of a disbursement check processed by FMS. (reference)", "Review the Refund Eligibility Scenarios to confirm the customer qualifies. (reference)", "For Registration Credits, complete the required steps before submitting a Service Portal ticket. (reference)"], "tips": []}, {"id": "temp-vault-balance-workaround", "title": "Temp Vault Balance Workaround", "cat": "Payments & Cash", "intent": ["temp vault balance", "vault balance workaround", "cash management workaround chart"], "page": "Cash Management/Temp_Vault_Balance_Workaround.htm", "what": "Reference page linking to the Temp Vault Balance Workaround chart.", "steps": ["Open the Temp Vault Balance Workaround topic in MAX. (reference)", "Click the link provided to view the Temp Vault Balance Workaround chart. (reference)", "Follow the chart steps to complete the workaround. (reference)", "Confirm the vault balances as expected after following the workaround. (reference)"], "tips": []}, {"id": "asl-interpreter-request", "title": "American Sign Language (ASL) Interpreter Request", "cat": "Reference", "intent": ["ASL interpreter request", "sign language road test", "hearing impaired road test", "interpreter for written test", "deaf customer testing"], "page": "Communicating_with_Customers/American_Sign_Language_Interpreter_Request.htm", "what": "Explains how customers request an ASL interpreter for a written or road test and the limits on interpreter participation during the road test.", "steps": ["Understand that an ASL interpreter may assist an applicant only at the beginning of the road test, outside of the car. (reference)", "The ASL interpreter cannot be in the car during the road test. (reference)", "Offer the option of conducting the entire road test without an interpreter; see the Hearing Impaired Road Test topic for how to conduct it. (reference)", "As CSR, route the request through the Supervisor or Manager for handling. (reference)", "Purchasing and the Examiner steps
